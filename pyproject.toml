[project]
name = "projection-amendements"
version = "0.1.0"
description = "Projection des amendements sur le texte de loi et son évaluation"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.162.5",
    "lark>=1.3.1",
    "openai>=3.50.0",
    "requests>=2.34.2",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["engine/tests", "server/tests"]
