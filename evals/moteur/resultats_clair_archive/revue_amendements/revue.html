ements scolaires menant des programmes spécifiques d'éducation à l'alimentation, incluant notamment des ateliers pédagogiques, des sorties scolaires, la fourniture de produits alimentaires ou de matériel pédagogique.\nIII.-Ce fonds peut également être mobilisé pour financer, dans les établissements scolaires ou à l'initiative des collectivités territoriales compétentes, des actions de rénovation des cantines scolaires ainsi que des actions de formation des personnels de droit public chargés de la préparation et de la distribution des repas. Ces financements sont subordonnés au respect d'engagements relatifs à la qualité nutritionnelle et environnementale des repas servis aux élèves, en cohérence avec la loi n° 2018-938 du 30 octobre 2018 pour l'équilibre des relations commerciales dans le secteur agricole et alimentaire et une alimentation saine, durable et accessible à tous.\nIV.-Les projets bénéficiant de subventions de ce fonds, dont la liste est rendue publique chaque année, sont sélectionnés par un comité", "amdt": false}, {"t": "-", "s": " interne", "amdt": false}, {"t": "+", "s": " national placé auprès", "amdt": false}, {"t": "=", "s": " du ministère de l'", "amdt": true}, {"t": "-", "s": "Éducation", "amdt": false}, {"t": "+", "s": " Education", "amdt": false}, {"t": "=", "s": " nationale", "amdt": true}, {"t": "-", "s": ".", "amdt": false}, {"t": "+", "s": ", associant les collectivités territoriales compétentes et des représentants de parents d'élèves et des enseignants", "amdt": false}, {"t": "=", "s": "\nV.-Un décret en Conseil d'État définit les conditions d'application du présent article.", "amdt": false}]}, {"numero": 63, "vise": "ART. 9", "dispositif": "I. – Après l’alinéa 3, insérer l’alinéa suivant :\n\n« Lorsque la personne en état de mort cérébrale, de coma ou d’état végétatif irréversibles n’est pas en mesure d’exprimer sa volonté, cette dernière peut être manifestée par l’intermédiaire de directives anticipées mentionnées à l’article L. 1111‑11 ou de sa personne de confiance désignée dans les conditions prévues à l’article L. 1111‑6, et ce, même si les directives anticipées ont été rédigées de moins de 3 ans auparavant. »\n\nII. – En conséquence, compléter cet article par l’alinéa suivant :\n\n« II. – L’article 18 de la présente loi n’est pas applicable lorsque la personne fait sa demande par l’intermédiaire de directives anticipées mentionnées à l’article L. 1111‑11 du code de la santé publique ou par sa personne de confiance désignée dans les conditions prévues à l’article L. 1111‑6 du même code, même si ces directives ont été rédigées de moins de 3 ans auparavant. »", "article": "9", "effet": [{"t": "=", "s": "La sous-section 3 de la section 2 bis du chapitre Ier du titre Ier du livre Ier de la première partie du code de la santé publique, telle qu'elle résulte des articles 5 à 8 de la présente loi, est complétée par un article L. 1111-12-7 ainsi rédigé :\n« Art. L. 1111-12-7.-I.-Le jour de l'administration de la substance létale, le médecin ou l'infirmier chargé d'accompagner la personne :\n« 1° Vérifie que la personne confirme qu'elle veut procéder ou faire procéder à l'administration ;", "amdt": false}, {"t": "+", "s": "\n« Lorsque la personne en état de mort cérébrale, de coma ou d'état végétatif irréversibles n'est pas en mesure d'exprimer sa volonté, cette dernière peut être manifestée par l'intermédiaire de directives anticipées mentionnées à l'article L. 1111-11 ou de sa personne de confiance désignée dans les conditions prévues à l'article L. 1111-6, et ce, même si les directives anticipées ont été rédigées de moins de 3 ans auparavant.", "amdt": false}, {"t": "=", "s": "\n« 2° Prépare, le cas échéant, l'administration de la substance létale ;\n« 3° Assure la surveillance de l'administration de la substance létale par la personne ou l'administre.\n« II.-Si la personne qui a confirmé sa volonté demande un report de l'administration de la substance létale, le professionnel de santé suspend la procédure et convient d'une nouvelle date dans les conditions prévues à l'article L. 1111-12-5.\n« III.-Une fois la substance létale administrée, la présence du professionnel de santé aux côtés de la personne n'est pas obligatoire. Il doit toutefois se trouver à une proximité suffisante pour pouvoir intervenir en cas de difficulté, conformément aux recommandations prévues au 23° de l'article L. 161-37 du code de la sécurité sociale.\n« IV.-Le certificat attestant le décès est établi dans les conditions prévues à l'article L. 2223-42 du code général des collectivités territoriales. Est réputée décédée de mort naturelle la personne dont la mort résulte d'une aide à mourir en application des articles L. 1111-12-1 à L. 1111-12-14 du présent code.\n« V.-Le médecin ou l'infirmier chargé d'accompagner la personne rapporte à la pharmacie d'officine mentionnée à l'article L. 1111-12-6 la préparation magistrale létale qui n'a pas été utilisée ou ne l'a été que partiellement.\n« Les produits ainsi collectés par l'officine sont détruits dans des conditions sécurisées conformément à l'article L. 4211-2.\n« Le professionnel de santé mentionné au premier alinéa du I du présent article dresse un compte rendu de la mise en œuvre des actes prévus aux I à III. »", "amdt": false}, {"t": "+", "s": "\nII.-L'article 18 de la présente loi n'est pas applicable lorsque la personne fait sa demande par l'intermédiaire de directives anticipées mentionnées à l'article L. 1111-11 du code de la santé publique ou par sa personne de confiance désignée dans les conditions prévues à l'article L. 1111-6 du même code, même si ces directives ont été rédigées de moins de 3 ans auparavant.", "amdt": false}]}, {"numero": 64, "vise": "ART. 11", "dispositif": "À l’alinéa 3, substituer aux mots :\n\n« au sein de »\n\nle mot :\n\n« dans ».", "article": "11", "effet": [{"t": "=", "s": "Après l'article L. 311-8 du code de l'action sociale et des familles, il est inséré un article L. 311-8-1 ainsi rédigé :\n« Art. L. 311-8-1.-Pour les établissements mentionnés au 6° du I de l'article L. 312-1, le projet d'établissement mentionné à l'article L. 311-8 comporte un volet relatif aux soins mentionnés à l'article L. 1110-10 du code de la santé publique.\n« Ce volet énonce les principes de l'accompagnement de la fin de vie", "amdt": false}, {"t": "-", "s": " au sein de", "amdt": false}, {"t": "+", "s": " dans", "amdt": false}, {"t": "=", "s": " l'établissement et définit l'organisation interne et le rôle des intervenants extérieurs, y compris les professionnels de santé, les structures de prise en charge et d'appui en soins palliatifs et les bénévoles mentionnés à l'article L. 1110-11 du même code. »", "amdt": false}]}, {"numero": 65, "vise": "ART. 2", "dispositif": "À l’alinéa 7, substituer aux mots :\n\n« prend en compte les »\n\nles mots :\n\n« est adapté aux »", "article": "2", "effet": [{"t": "=", "s": "Après l'article L. 5132-2-1 du code du travail, il est inséré un article L. 5132-2-2 ainsi rédigé :\n« Art. L. 5132-2-2.-I.-Il est institué un fonds d'activation des territoires zéro chômeur de longue durée chargé de veiller au respect par les territoires mentionnés au I de l'article L. 5132-2-1, de la mise en place des comités locaux pour le droit à l'emploi et des orientations des entreprises conventionnées prévues au même article. Il apporte à ces territoires et à ces entreprises l'appui et l'accompagnement nécessaires.\n« Le fonds d'activation des territoires zéro chômeur de longue durée assure le financement d'une fraction du montant de la rémunération des emplois nécessaires à l'installation et à l'animation du comité local pour l'emploi.\n« Le fonds d'activation des territoires zéro chômeur de longue durée assure également le financement d'une fraction du montant de la rémunération des emplois supplémentaires créés par les entreprises mentionnées au III de l'article L. 5132-2-1 ainsi qu'une fraction du montant de l'indemnité légale ou conventionnelle de licenciement lorsque celui-ci intervient dans les conditions prévues au V de l'article L. 5132-2-3. Ce fonds peut financer le démarrage et le développement des entreprises conventionnées mentionnées au même article L. 5132-2-3.\n« II.-Sous réserve de satisfaire aux conditions d'habilitation définies dans un cahier des charges fixé par arrêté du ministre chargé de l'emploi et d'avoir recueilli l'accord du président du département, les collectivités territoriales, les établissements publics de coopération intercommunale ou les groupes de collectivités territoriales volontaires peuvent se porter candidats à la mise en place d'un territoire zéro chômeur de longue durée prévu à l'article L. 5132-2-1. Le concours départemental visé au VI de l'article L. 5132-2-3 peut être co-financé par le département, ainsi que par les autres collectivités territoriales auxquelles appartient le territoire zéro chômeur de longue durée ; en l'absence de ce cofinancement, c'est le département qui assure le concours départemental.\n« Cette candidature détermine notamment l'objectif de création d'emplois supplémentaires en équivalents temps plein nécessaires pour répondre à l'exhaustivité des demandes des personnes dont l'éligibilité est prévue au 6° du II de L. 5132-2-1. Sur proposition du fonds d'activation des territoires zéro chômeur de longue durée, un arrêté du ministre chargé de l'emploi procède à l'habilitation du territoire et approuve la candidature retenue pour conduire la mise en place du territoire zéro chômeur de longue durée et répondre au volontariat des personnes durablement privées d'emploi.\n« Le cahier des charges", "amdt": false}, {"t": "-", "s": " prend en compte les", "amdt": false}, {"t": "+", "s": " est adapté aux", "amdt": false}, {"t": "=", "s": " spécificités des outre-mers et de la Corse.\n« Le fonds d'activation des territoires zéro chômeur de longue durée propose au Ministre chargé de l'emploi le retrait de l'habilitation pour les territoires qui ne respecteraient plus les conditions fixées par le cahier des charges.\n« Par dérogation au premier alinéa du présent I, les 83 territoires habilités dans le cadre de la loi n° 2020-1577 du 14 décembre 2020 relative au renforcement de l'inclusion dans l'emploi par l'activité économique et à l'expérimentation territoire zéro chômeur de longue durée dans sa rédaction antérieure à la présente loi, sont habilités de droit à poursuivre le territoire zéro chômeur de longue durée qu'ils ont amorcé sous l'empire de cette loi. Ils veillent à prendre les mesures éventuellement nécessaires à leur conformité au cahier des charges mentionné au premier alinéa du présent II.\n« III.-La gestion du fonds d'activation des territoires zéro chômeur de longue durée est confiée à l'association chargée des mêmes fonctions par la loi n° 2020-1577 du 14 décembre 2020 relative au renforcement de l'inclusion dans l'emploi par l'activité économique et à l'expérimentation territoire zéro chômeur de longue durée. Celle-ci est administrée par un conseil d'administration dont la composition est définie par un décret en Conseil d'État.\n« Les membres du conseil d'administration siègent à titre bénévole. Le conseil d'administration peut déléguer certaines de ses compétences à son président et à un bureau constitué en son sein.\n« Le ministre chargé de l'emploi désigne un commissaire du Gouvernement auprès de cette association. Le commissaire du Gouvernement assiste de droit aux séances de toutes les instances de délibération et d'administration de l'association. Il est destinataire de toutes les délibérations du conseil d'administration et a communication de tous les documents relatifs à la gestion du fonds, de même que les maires et les présidents des collectivités territoriales engagés dans la mise en place d'un territoire zéro chômeur de longue durée.\n« Lorsque le commissaire du Gouvernement estime qu'une délibération du conseil d'administration ou qu'une décision prise par une autre instance de l'association gestionnaire du fonds est contraire aux dispositions régissant les missions et la gestion du fonds, il peut s'opposer, par décision motivée, à sa mise en œuvre.\n« Le fonds publie annuellement un rapport moral et financier retraçant notamment l'ensemble des financements perçus par les territoires et les entreprises mentionnées au V de l'article L. 5132-2-1 de la présente loi ainsi que les sommes ayant concouru à son financement ainsi qu'à celui des comités locaux. Ce rapport présente le nombre de personnes embauchées par ces entreprises ainsi que le montant des prestations diverses dont elles ont bénéficié l'année précédant leur embauche. »", "amdt": false}]}, {"numero": 66, "vise": "ART. 27", "dispositif": "À l’alinéa 35, substituer aux mots :\n\n« sa consommation d’énergie annuelle »,\n\nle mot :\n\n« celle-ci ».", "article": "27", "effet": [{"t": "=", "s": "I.-Le code de l'environnement est ainsi modifié :\n1° Au 3° du III de l'article L. 122-1, les mots : « et le climat » sont remplacés par les mots : «, la consommation énergétique et le climat » ;\n2° Au premier alinéa de l'article L. 122-6, après les mots : « peut entraîner sur l'environnement », sont ajoutés les mots : «, notamment sur la consommation énergétique, » ;\n3° Le 2° du II de l'article L. 229-26 est ainsi modifié :\na) Au premier alinéa, les mots : « et de chaleur » sont remplacés par les mots : « ainsi que de chaleur et de froid » ;\nb) Après le premier alinéa, il est inséré un nouvel alinéa ainsi rédigé :\n« Pour la métropole de Lyon et les établissements publics de coopération intercommunale à fiscalité propre de plus de 45 000 habitants, le contenu et les modalités d'élaboration du programme d'actions en matière de chaleur et de froid sont définis par voie réglementaire. » ;\nc) Au sixième alinéa du 2° du II de l'article L. 229-26, il est ajouté la phrase : « L'organisation et le contenu de ce programme d'actions sont précisés par voie règlementaire. »\nII.-Le code de l'énergie est ainsi modifié :\n1° Le chapitre unique du titre Ier du livre II est complété par un article ainsi rédigé :\n« Art. L. 211-10.-Chaque projet représentant un montant d'investissement supérieur à un seuil défini par voie réglementaire est soumis à une évaluation de leur bonne prise en compte de l'efficacité et de la sobriété énergétiques. Cette évaluation est proportionnée.\n« L'évaluation de la bonne prise en compte de l'efficacité et de la sobriété énergétiques des projets relevant par ailleurs de l'article L. 122-1 du code de l'environnement est effectuée dans le cadre de l'évaluation environnementale prévue à cet article.\n« Un décret en Conseil d'État précise les modalités d'application du présent article. » ;\n2° L'article L. 221-7-1 est remplacé par les dispositions suivantes :\n« Art. L. 221-7-1.-Les opérations d'économies d'énergie qui conduisent à une hausse des émissions de gaz à effet de serre ne donnent pas lieu à la délivrance de certificats d'économies d'énergie.\n« Pour le secteur résidentiel et le secteur tertiaire, les opérations d'économies d'énergie incluant l'installation d'un équipement de chauffage des locaux ou de production d'eau chaude sanitaire utilisant un combustible fossile ne donnent pas lieu à la délivrance de certificats d'économies d'énergie, sauf lorsqu'il s'agit d'une énergie d'appoint.\n« Pour les autres secteurs, les opérations d'économies d'énergie incluant l'installation d'un équipement utilisant un combustible fossile peuvent donner lieu à la délivrance de certificats d'économies d'énergie selon des conditions et modalités définies par décret. » ;\n3° L'article L. 233-1 est remplacé par les dispositions suivantes :\n« Art. L. 233-1.-I.-Les personnes morales immatriculées au registre du commerce et des sociétés ainsi que les personnes morales de droit privé mentionnées à l'article L. 612-1 du code de commerce sont tenues de :\n« 1° Mettre en œuvre un système de management de l'énergie, lorsque leur consommation annuelle moyenne d'énergie finale est supérieure ou égale à 23, 6 GWh ;\n« 2° Réaliser, tous les quatre ans, un audit énergétique des activités exercées par elles en France, lorsque leur consommation annuelle moyenne d'énergie finale est supérieure ou égale à 2, 75 GWh et qu'elles n'ont pas mis en œuvre de système de management de l'énergie.\n« Le système de management de l'énergie est certifié par un organisme de certification accrédité par un organisme d'accréditation signataire de l'accord de reconnaissance multilatéral établi par la coordination européenne des organismes d'accréditation.\n« L'audit énergétique satisfait des critères définis par voie réglementaire et est établi de manière indépendante par des auditeurs dont la compétence a fait l'objet d'une reconnaissance.\n« II.-Toute personne morale soumises aux obligations prévues au I du présent article élabore un plan d'action sur la base des recommandations découlant de l'audit énergétique ou du système de management de l'énergie.\n« Ce plan d'action recense les mesures à mettre en œuvre pour se conformer à chaque recommandation de l'audit, lorsque cela est techniquement ou économiquement faisable. L'absence de mise en œuvre d'une mesure dont le temps de retour sur investissement est inférieur à cinq ans est justifiée dans le plan d'action.\n« Le plan d'action validé est publié dans le rapport annuel de l'entreprise, qui précise le taux d'exécution des mesures du plan. Ces informations sont mises à disposition du public dans le respect du secret des affaires.\n« III.-Les personnes morales soumises au 1° ou au 2° du I du présent article soit disposent d'un système de management de l'énergie certifié au plus tard le 11 octobre 2027, soit réalisent leur premier audit énergétique au plus tard le 11 octobre 2026.\n« Les audits ultérieurs sont réalisés tous les quatre ans.\n« Lorsqu'elles étaient déjà soumises, sur le fondement de l'article L. 233-1 dans sa rédaction antérieure à celle issue de la loi n° du, à l'obligation de réaliser un audit énergétique, elles continuent de le faire tous les quatre ans.\n« Les personnes morales qui entrent dans le champ de l'obligation prévue au I postérieurement aux dates mentionnées au premier alinéa du présent III la mettent en œuvre dans un délai d'un an suivant les trois dernières années civiles pour lesquelles la moyenne de leur consommation d'énergie finale a été supérieure à l'un des seuils mentionnés à ce même I.\n« IV.-Les personnes morales mentionnées au I transmettent, par voie électronique, à l'autorité administrative les informations relatives à la mise en œuvre de leurs obligations dans un délai de deux mois suivant soit la certification de leur système de management de l'énergie, soit la réalisation de l'audit.\n« Les données transmises par ces personnes restent leur propriété et sont couvertes par le secret des affaires. Elles sont exploitées par l'autorité administrative à des fins d'études statistiques.\n« Un arrêté du ministre chargé de l'énergie détermine les données à renseigner sur la plateforme informatique mise en place pour assurer cette transmission et, en fonction des catégories d'utilisateurs, les restrictions d'accès nécessaires à la protection de la confidentialité des données. » ;\n4° L'article L. 233-2 est remplacé par les dispositions suivantes :\n« Art. L. 233-2.-Toute personne morale soumise aux obligations prévues à l'article L. 233-1 déclare sa consommation annuelle d'énergie finale lorsque", "amdt": false}, {"t": "-", "s": " sa consommation d'énergie annuelle", "amdt": false}, {"t": "+", "s": " celle-ci", "amdt": false}, {"t": "=", "s": " dépasse 2, 75 GWh » ;\n5° À l'article L. 233-3, les mots : « en particulier les modalités de reconnaissance des compétences et de l'indépendance des auditeurs mentionnés au premier alinéa de l'article L. 233-1 » sont remplacés par les mots : « en particulier les modalités de dérogation aux obligations mentionnées au I de l'article L. 233-1, de reconnaissance des compétences et de l'indépendance des auditeurs mentionnés au I de l'article L. 233-1 » ;\n6° À la première phrase de l'article L. 233-4, les mots : « à l'article L. 233-1 » sont remplacés par les mots : « aux articles L. 233-1 ou L. 233-2 » ;\n7° Le chapitre III du titre III du livre II est complété par une section 3 ainsi rédigée :\n« Section 3\n« Évaluation coûts-avantage\n« Art. L. 233-5.-Afin d'évaluer la faisabilité économique de l'amélioration de l'efficacité énergétique de l'approvisionnement en chaleur et en froid d'un projet de création d'une nouvelle installation de production d'électricité thermique, d'une nouvelle installation industrielle ou de service ou d'un nouveau centre de données, ou de modification substantielle d'une telle installation existante, son exploitant réalise préalablement une analyse coûts-avantages.\n« Un décret en Conseil d'État détermine les conditions d'application de ces dispositions, notamment les caractéristiques des installations concernées et le contenu, le format ainsi que les modalités de transmission de l'analyse susmentionnée. » ;\n8° Le titre III du livre II est complété par deux chapitres V et VI ainsi rédigés :\n« Chapitre V\n« La performance énergétique pour les organismes publics\n« Art. L. 235-1.-I.-Les organismes publics soumis aux dispositions du présent chapitre sont :\n« 1° L'État et les opérateurs de l'État, les collectivités territoriales et leurs groupements ;\n« 2° Les entités, publiques ou privées, répondant aux critères cumulatifs suivants :\n«-elles ont été ou sont créées pour satisfaire spécifiquement des besoins d'intérêt général n'ayant pas de caractère industriel ou commercial ;\n«-elles sont majoritairement et directement financées par l'État, les collectivités territoriales ou leurs groupements ;\n«-leur organe d'administration, de direction ou de surveillance est composé de membres dont plus de la moitié sont désignés par au moins une entité mentionnée au 1°, à l'exclusion des opérateurs de l'État.\n« Art. L. 235-2.-I.-Chaque année, la consommation d'énergie finale cumulée des organismes publics diminue d'un volume représentant au moins 1, 9 % de la consommation d'énergie finale cumulée de l'année 2021.\n« Cette réduction s'applique à l'énergie finale directement consommée par les organismes publics énumérés à l'article L. 235-1, à l'exception :\n«-jusqu'au 31 décembre 2026, de celle consommée par les collectivités territoriales et leurs groupements mentionnés à l'article L. 5111-1 du code général des collectivités territoriales de moins de 50 000 habitants, et par leurs établissements publics ;\n«-jusqu'au 31 décembre 2029, de celle consommée par les collectivités territoriales et leurs groupements mentionnés à l'article L. 5111-1 du même code de moins de 5 000 habitants, et par leurs établissements publics.\n« II.-Pour l'application du I, la consommation d'énergie des transports publics et des forces armées est exclue.\n« III.-Chaque organisme public transmet, chaque année, les données relatives à ses consommations d'énergie annuelles.\n« IV.-Un décret en Conseil d'État précise les modalités de mise en œuvre du présent article, notamment :\n«-le service de l'État ou l'organisme désigné pour recevoir les données définies au III ;\n«-les modalités de calcul de l'objectif de réduction fixé au I ;\n«-le contenu et les modalités de transmission de données relatives à la consommation énergétique finale des organismes publics ;\n«-les modalités selon lesquelles l'évaluation et le constat du respect de l'objectif de réduction des consommations d'énergie finale sont établis chaque année.\n« Art. L. 235-3.-I.-Chaque année, au moins 3 % de la surface cumulée des bâtiments appartenant aux organismes publics énumérés à l'article L. 235-1 est rénovée, afin de réduire leur consommation d'énergie et leurs émissions de gaz à effet de serre.\n« À l'issue de cette rénovation, les bâtiments concernés doivent atteindre un haut niveau de performance énergétique défini par arrêté des ministres chargés de la construction et de l'énergie.\n« De manière alternative, l'objectif mentionné au premier alinéa peut être réputé atteint si les organismes publics réduisent chaque année leur consommation d'énergie finale, planifient les rénovations de leurs bâtiments et les réalisent.\n« II.-Les dispositions du présent article ne s'appliquent pas aux logements locatifs sociaux appartenant aux organismes d'habitation à loyer modéré définis à l'article L. 411-2 du code de la construction et de l'habitation, ni aux logements appartenant aux bailleurs autres que les organismes d'habitation à loyer modéré et qui font l'objet d'une convention conclue en application de l'article L. 831-1 de ce même code.\n« III.-Chaque organisme public transmet, tous les deux ans, les données relatives aux rénovations annuelles de ses bâtiments.\n« IV.-Un décret en Conseil d'État précise les modalités de mise en œuvre du présent article, notamment :\n«-le service de l'État ou l'organisme désigné pour recevoir les données définies au III ;\n«-les modalités de calcul de la surface de bâtiments devant faire l'objet de la rénovation prévue au I ;\n«-les conditions alternatives mentionnées au I permettant de réputer atteint l'objectif de rénovation des bâtiments publics ;\n«-les conditions dans lesquelles un bâtiment peut faire l'objet d'une dérogation en ce qui concerne le niveau de performance énergétique mentionné au deuxième alinéa du I. Les exigences minimales à respecter dans ce cas sont précisées par arrêté des ministres chargés de la construction et de l'énergie ;\n«-les modalités selon lesquelles l'évaluation et le constat du respect de l'objectif de rénovation de bâtiments sont établis ;\n«-le contenu et les modalités de transmission des données mentionnées au II.\n« Art. L. 235-4.-Afin de constituer un inventaire national des bâtiments publics, les organismes publics relevant de l'article L. 235-1 transmettent, tous les deux ans, à l'État ou à un organisme désigné par lui les données relatives à la performance énergétique de leurs bâtiments. Cette transmission peut être mutualisée avec les transmissions prévues aux articles L. 235-2 et L. 235-3.\n« Les forces armées et les administrations de l'État servant à des fins de défense nationale ne sont pas soumises à cette obligation de transmission.\n« Un décret en Conseil d'État précise les conditions d'application du présent article, notamment la nature des bâtiments concernés, les modalités de collecte et de transmission des données devant être saisies ou actualisées pour la mise en place de l'inventaire national ainsi que les modalités de la mise à disposition du public de cet inventaire.\n« Chapitre VI\n« La performance énergétique des centres de données\n« Art. L. 236-1.-I.-Le présent chapitre s'applique à tous les centres de données, notamment à ceux hébergés par les entreprises, les banques ou les centres de recherche, à l'exception des centres de données :\n« 1° Des opérateurs mentionnés aux articles L. 1332-1 ou L. 1332-2 du code de la défense ;\n« 2° Utilisés par les forces armées ou par la protection civile ou qui fournissent leurs services exclusivement à des fins relevant de la défense ou de la protection civile.\n« II.-Les informations administratives, environnementales et énergétiques relatives à l'exploitation des salles de serveurs et des centres d'exploitation informatique, dénommés au sens et pour l'application du présent chapitre “ centres de données ”, dont la puissance installée est supérieure ou égale à 500 kW, font l'objet d'une transmission sur une plateforme numérique mise à disposition par la Commission européenne.\n« Ces centres de données mettent également à la disposition du public les données administratives, environnementales et énergétiques relatives à leur activité.\n« Les modalités d'application de cet article sont fixées par voie réglementaire, notamment celles relatives à la transmission des données sur la plateforme et aux données mises à disposition du public.\n« III.-Les ministres chargés de l'énergie et de l'environnement peuvent fixer par arrêté les règles générales, prescriptions techniques et modalités d'implantation applicables à la construction et l'exploitation des centres de données visés par le présent chapitre. Ces dispositions permettent notamment d'améliorer l'efficacité énergétique, la disponibilité du réseau électrique, l'utilisation de l'eau à des fins de refroidissement et la transition vers la neutralité carbone du secteur.\n« Art. L. 236-2.-Sans préjudice des dispositions de l'article L. 236-1, les centres de données dont la puissance installée est supérieure ou égale à 1 MW valorisent la chaleur fatale qu'ils génèrent.\n« Les modalités d'application du présent article, notamment la définition des exigences de valorisation de la chaleur fatale produites par les centres de données ainsi que les conditions et les modalités de dérogation à cette obligation, sont définies par décret en Conseil d'État. »\n« Art. L. 236-3.-I.-En cas de non-respect d'une des dispositions de ce chapitre, l'autorité administrative peut :\n« 1° Mettre le centre de données en demeure de se conformer à ses obligations dans un délai qu'elle détermine, et qui ne peut excéder une durée d'un an. Elle peut rendre publique cette mise en demeure ;\n« 2° Lorsque le centre de données ne se conforme pas, dans le délai fixé, à la mise en demeure, infliger une amende administrative dont le montant est proportionné à la gravité du manquement et aux avantages qui en sont tirés. L'amende ne peut excéder 50 000 euros par centre de données concerné.\n« II.-Un décret en Conseil d'État détermine les modalités d'application du présent article.\n« III.-L'autorité administrative compétente peut procéder à la publication de l'acte arrêtant ces sanctions, sur le site internet des services de l'État, pendant une durée comprise entre deux mois et cinq ans. »\nIII.-Dans les conditions prévues à l'article 38 de la Constitution, le Gouvernement est autorisé à prendre par ordonnances, dans un délai de douze mois à compter de la publication de la présente loi, toute mesure relevant du domaine de la loi nécessaire à la transposition de dispositions de la directive (EU) 2023 / 1791 du Parlement européen et du Conseil du 13 septembre 2023 relative à l'efficacité énergétique et modifiant le règlement (UE) 2023 / 955 (refonte), n'ayant pas fait l'objet d'une transposition par la présente loi.\nUn projet de loi de ratification est déposé devant le Parlement dans un délai de trois mois à compter de la publication de chacune des ordonnances prévues à l'alinéa précédent.\nIV.-Le présent article entre en vigueur le 1er octobre 2025. Toutefois :\n-l'article L. 221-7-1 du code de l'énergie, dans sa rédaction issue de la présente loi, entre en vigueur le 1er janvier 2025 ;\n-le III du présent article ainsi que l'article L. 236-1 du même code entrent en vigueur le jour suivant la publication de la présente loi au Journal officiel de la République française.", "amdt": false}]}, {"numero": 67, "vise": "ART. UNIQUE", "dispositif": "À l’alinéa 15, après le mot :\n\n« année »,\n\ninsérer le mot :\n\n« d’imposition ».", "article": "UNIQUE", "effet": [{"t": "=", "s": "I.-Le chapitre I bis du titre IV de la première partie du livre premier du code général des impôts est ainsi rétabli :\n« CHAPITRE I BIS\n« IMPÔT PLANCHER SUR LA FORTUNE\n« Art. 885 A.-Sont soumis à l'impôt plancher sur la fortune, lorsque la valeur de leurs actifs, tels que mentionnés aux articles 885 B à 885 H, est supérieur à 100 000 000 € :\n« 1° Les personnes physiques ayant leur domicile fiscal en France, à raison de leurs biens situés en France ou hors de France.\n« Toutefois, les personnes physiques mentionnées au premier alinéa qui n'ont pas été fiscalement domiciliées en France au cours des cinq années civiles précédant celle au cours de laquelle elles ont leur domicile fiscal en France ne sont imposables qu'à raison de leurs biens situés en France.\n« Cette disposition s'applique au titre de chaque année au cours de laquelle le redevable conserve son domicile fiscal en France, et ce jusqu'au 31 décembre de la cinquième année qui suit celle au cours de laquelle le domicile fiscal a été établi en France ;\n« 2° Les personnes physiques n'ayant pas leur domicile fiscal en France, à raison de leurs biens situés en France.\n« Sauf dans les cas prévus aux a et b du 4 de l'article 6, les couples mariés font l'objet d'une imposition commune.\n« Les partenaires liés par un pacte civil de solidarité défini par l'article 515-1 du code civil font l'objet d'une imposition commune.\n« Les conditions d'assujettissement sont appréciées au 1er janvier de chaque année.\n« Art. 885 B.-L'impôt plancher sur la fortune est assis et les bases d'imposition déclarées selon les mêmes règles et sous les mêmes sanctions que les droits de mutation par décès sous réserve des dispositions particulières du présent chapitre.\n« Les exonérations prévues en matière de droits de mutation par décès ne s'appliquent pas à l'impôt plancher sur la fortune.\n« Art. 885 C.-L'assiette de l'impôt plancher sur la fortune est constituée par la valeur nette, au 1er janvier de l'année, de l'ensemble des biens, droits et valeurs imposables appartenant aux personnes visées à l'article 885 A, ainsi qu'à leurs enfants mineurs lorsqu'elles ont l'administration légale des biens de ceux-ci.\n« Dans le cas de concubinage notoire, l'assiette de l'impôt est constituée par la valeur nette, au 1er janvier de l'année", "amdt": false}, {"t": "+", "s": " d'imposition", "amdt": false}, {"t": "=", "s": ", de l'ensemble des biens, droits et valeurs imposables appartenant à l'un et l'autre concubins et aux enfants mineurs mentionnés au premier alinéa.\n« Art. 885 D.-Les primes versées après l'âge de soixante-dix ans au titre des contrats d'assurance non rachetables souscrits à compter du 20 novembre 1991 et la valeur de rachat des contrats d'assurance rachetables sont ajoutées au patrimoine du souscripteur.\n« Toutefois, la créance que le souscripteur détient sur l'assureur au titre de contrats, autres que ceux mentionnés à l'article L. 132-23 du code des assurances, qui ne comportent pas de possibilité de rachat pendant une période fixée par ces contrats doit être ajoutée au patrimoine du souscripteur.\n« Art. 885 E.-Les biens ou droits grevés d'un usufruit, d'un droit d'habitation ou d'un droit d'usage accordé à titre personnel sont compris dans le patrimoine de l'usufruitier ou du titulaire du droit pour leur valeur en pleine propriété. Toutefois, les biens grevés de l'usufruit ou du droit d'usage ou d'habitation sont compris respectivement dans les patrimoines de l'usufruitier ou du nu-propriétaire suivant les proportions fixées par l'article 669 dans les cas énumérés ci-après, et à condition, pour l'usufruit, que le droit constitué ne soit ni vendu, ni cédé à titre gratuit par son titulaire :\n« a. Lorsque la constitution de l'usufruit résulte de l'application des articles 767, 1094 ou 1098 du code civil. Les biens dont la propriété est démembrée en application d'autres dispositions, et notamment de l'article 1094-1 du code civil, ne peuvent faire l'objet de cette imposition répartie.\n« b. Lorsque le démembrement de propriété résulte de la vente d'un bien dont le vendeur s'est réservé l'usufruit, le droit d'usage ou d'habitation et que l'acquéreur n'est pas l'une des personnes visées à l'article 751 ;\n« c. Lorsque l'usufruit ou le droit d'usage ou d'habitation a été réservé par le donateur d'un bien ayant fait l'objet d'un don ou legs à l'État, aux départements, aux communes ou syndicats de communes et à leurs établissements publics, aux établissements publics nationaux à caractère administratif et aux associations reconnues d'utilité publique.\n« Art. 885 F.-Les biens ou droits transférés dans un patrimoine fiduciaire ou ceux éventuellement acquis en remploi, ainsi que les fruits tirés de l'exploitation de ces biens ou droits, sont compris dans le patrimoine du constituant pour leur valeur vénale nette.\n« Art. 885 G.-Les biens ou droits placés dans un trust défini à l'article 792-0 bis ainsi que les produits qui y sont capitalisés sont compris, pour leur valeur vénale nette au 1er janvier de l'année d'imposition, selon le cas, dans le patrimoine du constituant ou dans celui du bénéficiaire qui est réputé être un constituant en application du II du même article 792-0 bis.\n« Le premier alinéa du présent article ne s'applique pas aux trusts irrévocables dont les bénéficiaires exclusifs relèvent de l'article 795 ou sont des organismes de même nature relevant de l'article 795-0 A et dont l'administrateur est soumis à la loi d'un État ou territoire ayant conclu avec la France une convention d'assistance administrative en vue de lutter contre la fraude et l'évasion fiscales.\n« Art. 885 H.-Les dispositions de l'article 754 B sont applicables à l'impôt plancher sur la fortune.\n« Art. 885 I.-La valeur des biens est déterminée suivant les règles en vigueur en matière de droits de mutation par décès.\n« Par dérogation aux dispositions du deuxième alinéa de l'article 761, un abattement de 1 000 000 euros est effectué sur la valeur vénale réelle de l'immeuble lorsque celui-ci est occupé à titre de résidence principale par son propriétaire. En cas d'imposition commune, un seul immeuble est susceptible de bénéficier de l'abattement précité.\n« Art. 885 J.-Les valeurs mobilières cotées sur un marché sont évaluées selon le dernier cours connu ou selon la moyenne des trente derniers cours qui précèdent la date d'imposition.\n« Art. 885 K.-Les créances détenues, directement ou par l'intermédiaire d'une ou plusieurs sociétés interposées, par des personnes n'ayant pas leur domicile fiscal en France, sur une société à prépondérance immobilière mentionnée au 2° du I de l'article 726, ne sont pas déduites pour la détermination de la valeur des parts que ces personnes détiennent dans la société.\n« Art. 885 L.-Le tarif de l'impôt plancher sur la fortune dû est égal à la différence, si elle est positive, entre :\n« a) Le montant résultant de l'application d'un taux de 2 % à la valeur nette taxable du patrimoine du redevable.\n« b) Et le montant résultant de la somme des montants acquittés, pour l'année en cours, par le redevable au titre de l'impôt sur le revenu, de l'impôt sur la fortune immobilière, de la contribution prévue à l'article L. 136-1 du code de la sécurité sociale, des contributions au remboursement de la dette sociale définis au chapitre II de l'ordonnance n° 96-50 du 24 janvier 1996 relative au remboursement de la dette sociale, et de la contribution prévue à l'article 223 sexies du code général des impôts.\n« Art. 885 M.-I.-Les redevables doivent souscrire au plus tard le 23 septembre de chaque année une déclaration de leur fortune, précisant la valeur brute et la valeur nette taxable de leur patrimoine, déposée au service des impôts de leur domicile au 1er janvier et accompagnée du paiement de l'impôt.\n« La valeur brute et la valeur nette taxable du patrimoine des concubins notoires et de celui des enfants mineurs lorsque les concubins ont l'administration légale de leurs biens sont portées sur la déclaration de l'un ou l'autre des concubins.\n« II.-Les époux et les partenaires liés par un pacte civil de solidarité défini par l'article 515-1 du code civil doivent conjointement signer la déclaration prévue au I.\n« III.-En cas de décès du redevable, les dispositions du 2 de l'article 204 sont applicables. La déclaration mentionnée au I est produite par les ayants droit du défunt dans les six mois de la date du décès. Le cas échéant, le notaire chargé de la succession peut produire cette déclaration à la demande des ayants droit si la succession n'est pas liquidée à la date de production de la déclaration.\n« Art. 885 N.-Les personnes possédant des biens en France sans y avoir leur domicile fiscal ainsi que les personnes mentionnées au 2 de l'article 4 B peuvent être invitées par le service des impôts à désigner un représentant en France dans les conditions prévues à l'article 164 D.\n« Toutefois, l'obligation de désigner un représentant fiscal ne s'applique ni aux personnes qui ont leur domicile fiscal dans un autre État membre de l'Union européenne ou dans un autre État partie à l'accord sur l'Espace économique européen ayant conclu avec la France une convention d'assistance administrative en vue de lutter contre la fraude et l'évasion fiscales ainsi qu'une convention d'assistance mutuelle en matière de recouvrement de l'impôt, ni aux personnes mentionnées au 2 du même article 4 B qui exercent leurs fonctions ou sont chargées de mission dans l'un de ces États.\n« Art. 885 O.-Lors du dépôt de la déclaration de l'impôt plancher sur la fortune mentionnée au I de l'article 885 M, les redevables doivent joindre à leur déclaration les éléments justifiant de l'existence, de l'objet et du montant des dettes dont la déduction est opérée. »\nII.-L'article 1723 ter-00 A est ainsi rétabli :\n« Art. 1723 ter-00 A.-I.-L'impôt plancher sur la fortune est recouvré et acquitté selon les mêmes règles et sous les mêmes garanties et sanctions que les droits de mutation par décès.\n« II.-Ne sont pas applicables aux redevables mentionnés au I de l'article 885 M :\n« 1° les dispositions des articles 1715 à 1716 A relatives au paiement en valeur du Trésor ou en créances sur l'État ;\n« 2° les dispositions des articles 1717, 1722 bis et 1722 quater relatives au paiement fractionné ou différé des droits ;\n« Néanmoins, lorsque le redevable se trouve dans l'impossibilité de payer l'impôt plancher sur la fortune par suite de gêne, le paiement de l'impôt peut être échelonné à la demande du redevable et, avec l'accord de l'administration fiscale, dans un délai ne pouvant excéder 5 ans à compter de l'expiration du délai de souscription de la déclaration de l'impôt plancher sur la fortune prévue au I de l'article 885 M. Le redevable doit joindre à sa déclaration mentionnée au I de l'article 885 M les éléments justifiant de l'impossibilité de payer l'impôt plancher sur la fortune par suite de gêne.\n« Un décret prévoit les modalités d'application du précédent alinéa.\n« 3° les dispositions du III de l'article L. 269 du livre des procédures fiscales relatives à l'inscription de l'hypothèque légale du Trésor. »\nIII.-L'article 1723 ter-00 B est complété par un alinéa ainsi rédigé :\n« Les époux et les partenaires liés par un pacte civil de solidarité défini par l'article 515-1 du code civil sont solidaires pour le paiement de l'impôt plancher sur la fortune. ».\nIV.-Cette proposition de loi entre en vigueur au 1er janvier 2026.", "amdt": false}]}, {"numero": 68, "vise": "ART. 10", "dispositif": "Compléter cet article par l’alinéa suivant :\n\n« III. – Les maisons d’accompagnement font l’objet d’une évaluation annuelle rendue publique, dans des conditions déterminées par le ministre chargé de la santé, après avis de la Haute Autorité de santé. Cette évaluation rend notamment compte du déploiement de ces maisons sur l’ensemble du territoire et de leur adéquation aux besoins recensés. L’évaluation porte également sur la nature des accompagnements dispensés, le profil des personnes accompagnées et les moyens humains et financiers mobilisés. »", "article": "10", "effet": [{"t": "=", "s": "I.-Le livre III du code de l'action sociale et des familles est ainsi modifié :\n1° À la première phrase du premier alinéa de l'article L. 311-5-2, les mots : « et 7° » sont remplacés par les mots : «, 7° et 18° » ;\n2° L'article L. 312-1 est ainsi modifié :\na) Après le 17° du I, il est inséré un 18° ainsi rédigé :\n« 18° Les maisons d'accompagnement de soins palliatifs qui ont pour objet d'accueillir et d'accompagner des personnes en fin de vie et leurs proches. Elles sont gérées par des établissements de droit public ou de droit privé à but non lucratif. Elles peuvent être rattachées à un établissement public de santé ou à un établissement de santé privé à but non lucratif. » ;\nb) Le II est ainsi modifié :\n-au deuxième alinéa, les mots : « et 7° » sont remplacés par les mots : «, 7° et 18° » ;\n-à la première phrase de l'avant-dernier alinéa, les mots : « et au 17° » sont remplacés par les mots : «, 17° et 18° » et sont ajoutés les mots : « et formées aux enjeux liés à l'accompagnement des personnes en situation de handicap » ;\n3° Au b de l'article L. 313-3, les mots : « et 12° » sont remplacés par les mots : «, 12° et 18° » ;\n4° Au premier alinéa de l'article L. 314-3-3, les mots : « au 9° » sont remplacés par les mots : « aux 9° et 18° » ;\n5° Le titre IV est complété par un chapitre X ainsi rédigé :\n« Chapitre X\n« Maisons d'accompagnement et de soins palliatifs\n« Art. L. 34-10-1.-Les personnes suivies dans les établissements et services mentionnés au 18° de l'article L. 312-1 ont accès à l'ensemble des soins mentionnés à l'article L. 1110-10 du code de la santé publique, notamment au moyen de conventions passées avec les unités et les équipes chargées de ces soins sur le territoire. Au sein de ces établissements, les bénévoles mentionnés à l'article L. 1110-11 du même code ont vocation à intervenir.\n« Les établissements ou les services mentionnés à l'article L. 312-1 du présent code concluent des conventions pluriannuelles avec des équipes mobiles de soins palliatifs présentes sur le territoire.\n« Les proches qui accompagnent les personnes suivies dans les établissements mentionnés au 18° du même article L. 312-1 bénéficient d'une information sur les droits des proches aidants, notamment sur le congé de solidarité familiale. »\nII.-L'État met à l'étude les conditions dans lesquelles la création de cent une maisons d'accompagnement permet d'assurer leur déploiement dans chaque département à l'horizon de l'année 2034.", "amdt": false}, {"t": "+", "s": "\nIII.-Les maisons d'accompagnement font l'objet d'une évaluation annuelle rendue publique, dans des conditions déterminées par le ministre chargé de la santé, après avis de la Haute Autorité de santé. Cette évaluation rend notamment compte du déploiement de ces maisons sur l'ensemble du territoire et de leur adéquation aux besoins recensés. L'évaluation porte également sur la nature des accompagnements dispensés, le profil des personnes accompagnées et les moyens humains et financiers mobilisés.", "amdt": false}]}, {"numero": 69, "vise": "ART. 18", "dispositif": "Au début de la première phrase de l’alinéa 34, substituer à la première occurrence du mot :\n\n« Au »\n\nles mots :\n\n« Avant le ».", "article": "18", "effet": [{"t": "=", "s": "I. ‒ L'article L. 851-3 du code de la sécurité intérieure est remplacé par les dispositions suivantes :\n« Art. L. 851-3.-I.-Dans les conditions prévues au chapitre Ier du titre II du présent livre et pour les seules finalités prévues aux 1°, 2°, 4° et 6° de l'article L. 811-3, à la demande des services spécialisés de renseignement mentionnés à l'article L. 811-2, peuvent être autorisés, sur les données transitant par les réseaux des opérateurs et des personnes mentionnés à l'article L. 851-1, des traitements automatisés destinés, en fonction de paramètres précisés dans l'autorisation, à détecter des connexions susceptibles de révéler des ingérences étrangères, des menaces pour la défense nationale, des menaces terroristes ou des menaces relatives à la criminalité organisée et à la délinquance organisée portant sur des délits punis de dix ans d'emprisonnement en tant qu'elles concernent le trafic de stupéfiants, le trafic d'armes et de produits explosifs, l'importation et l'exportation de ces marchandises prohibées ainsi que le blanchiment et le recel du produit, des revenus et des choses provenant de ces infractions.\n« II.-Ces traitements automatisés utilisent exclusivement les informations ou documents mentionnés à l'article L. 851-1 ainsi que, lorsqu'elles sont nécessaires pour détecter les connexions susceptibles de révéler une ingérence ou une menace mentionnées au I, les adresses complètes de ressources utilisées sur internet, dans les conditions précisées au III.\n« III.-L'autorisation du Premier ministre précise les paramètres de conception du traitement automatisé, qui sont pertinents et définis en adéquation avec la finalité poursuivie.\n« Ces paramètres ne peuvent inclure des adresses complètes de ressources utilisées sur internet que lorsque ces adresses :\n«-soit dirigent vers des ressources dont l'objet est en rapport avec les ingérences ou menaces mentionnées au I ;\n«-soit dirigent vers des ressources dont il existe des raisons sérieuses de penser qu'elles sont utilisées à des fins d'ingérence ou de menace mentionnées au I ;\n«-soit présentent des caractéristiques techniques de nature à révéler des ingérences ou menaces mentionnées au I.\n« IV.-Par dérogation à l'article L. 821-3, la première demande d'autorisation relative à un traitement automatisé et aux paramètres de conception retenus est examinée par la formation plénière de la Commission nationale de contrôle des techniques de renseignement, qui rend un avis au Premier ministre dans un délai de trente jours.\n« Lorsque les paramètres de conception retenus incluent des adresses complètes de ressources utilisées sur internet, ce délai est porté à quarante-cinq jours. Si l'avis de la commission n'est pas transmis au Premier ministre dans ce délai, celui-ci peut délivrer l'autorisation, qui ne peut toutefois être exécutée avant que le Conseil d'État, immédiatement saisi dans les conditions prévues au deuxième alinéa de l'article L. 821-1, ait statué dans les conditions prévues aux deuxième et troisième alinéas du même article.\n« La commission rend son avis sur la demande de renouvellement de l'autorisation relative à un traitement automatisé dans un délai de soixante-douze heures.\n« V.-Un service du Premier ministre est seul habilité à exécuter les traitements mis en œuvre sur le fondement du I.\n« L'exécution des traitements automatisés ne permet ni de recueillir d'autres données que celles correspondant à leurs paramètres de conception ni, en dehors de la procédure prévue au VI, l'identification des personnes auxquelles ces données se rapportent. Les données non détectées par les traitements comme susceptibles de révéler une ingérence ou une menace mentionnée au I sont détruites immédiatement.\n« En dehors de la procédure prévue au VI, aucun service spécialisé de renseignement ne peut accéder aux données utilisées par les traitements automatisés.\n« La Commission nationale de contrôle des techniques de renseignement dispose d'un accès permanent, complet et direct à ces traitements ainsi qu'aux données utilisées. Elle est informée de toute modification apportée aux traitements et paramètres et peut émettre des recommandations.\n« VI.-Lorsque les traitements automatisés détectent des données susceptibles de révéler l'existence d'une ingérence ou d'une menace mentionnée au I, le Premier ministre ou l'une des personnes déléguées par lui peut autoriser, après un avis de la Commission nationale de contrôle des techniques de renseignement donné dans les conditions prévues au chapitre Ier du titre II du présent livre, l'identification de la ou des personnes concernées et le recueil des données y afférentes. Ces données sont exploitées dans un délai de soixante jours à compter de ce recueil et sont détruites à l'expiration de ce délai.\n« Un service du Premier ministre est seul habilité à exécuter les opérations prévues au premier alinéa.\n« La Commission nationale de contrôle des techniques de renseignement dispose d'un accès permanent, complet, direct et immédiat aux données recueillies, susceptibles de révéler l'existence d'une ingérence ou d'une menace mentionnée au I.\n« VII.-La première autorisation de mise en œuvre des traitements automatisés prévue au I du présent article est délivrée pour une durée de deux mois. L'autorisation est renouvelable dans les conditions de durée prévues au chapitre Ier du titre II du présent livre. La demande de renouvellement comporte un relevé du nombre de détections par le traitement automatisé, une analyse de la pertinence de ces détections ainsi que, lorsque le traitement automatisé utilise des adresses complètes de ressources utilisées sur internet, une actualisation de la nécessité et de la proportionnalité du recours à ces adresses.\n« VIII.-Les conditions prévues à l'article L. 871-6 sont applicables aux opérations matérielles effectuées par les opérateurs et les personnes mentionnés à l'article L. 851-1.\n« IX.-Le caractère d'urgence mentionné à la dernière phrase du deuxième alinéa de l'article L. 821-1 ne peut être invoqué pour les autorisations prévues au III et VII du présent article. »\nII.-À compter du 1er juillet 2029, l'article L. 851-3 du code de la sécurité intérieure est ainsi modifié :\n1° Au I :\na) Les mots : « seules finalités prévues aux 1°, 2°, 4° et 6° de l'article L. 811-3 » sont remplacés par les mots : « seuls besoins de la prévention du terrorisme » ;\nb) Les mots : « des ingérences étrangères, des menaces pour la défense nationale, des menaces terroristes ou des menaces relatives à la criminalité organisée et à la délinquance organisée portant sur des délits punis de dix ans d'emprisonnement en tant qu'elles concernent le trafic de stupéfiants, le trafic d'armes et de produits explosifs, l'importation et l'exportation de ces marchandises prohibées ainsi que le blanchiment et le recel du produit, des revenus et des choses provenant de ces infractions » sont remplacés par les mots : « une menace à caractère terroriste » ;\n2° Au II, les mots : « une ingérence ou une menace mentionnées au I » sont remplacés par les mots : « une menace à caractère terroriste » ;\n3° Au III :\na) Au troisième alinéa, les mots : « les ingérences ou menaces mentionnées au I » sont remplacés par les mots : « une menace à caractère terroriste » ;\nb) Au quatrième alinéa, les mots : « d'ingérence ou de menace mentionnées au I » sont remplacés par les mots : « de menace à caractère terroriste » ;\nc) Au dernier alinéa, les mots : « des ingérences ou menaces mentionnées au I » sont remplacés par les mots : « une menace à caractère terroriste » ;\n4° Au deuxième alinéa du V, les mots : « ingérence ou une menace mentionnée au I » sont remplacés par les mots : « menace à caractère terroriste » ;\n5° À la première phrase du premier alinéa et au dernier alinéa du VI, les mots : « ingérence ou d'une menace mentionnée au I » sont remplacés par les mots : « menace à caractère terroriste ».\nIII.-Le II et le III de l'article 6 et le III de l'article 9 de la loi n° 2024-850 du 25 juillet 2024 visant à prévenir les ingérences étrangères en France sont abrogés.\nIV.-", "amdt": false}, {"t": "-", "s": "Au", "amdt": false}, {"t": "+", "s": " Avant le", "amdt": false}, {"t": "=", "s": " 1er juillet 2026, le Gouvernement remet au Parlement un rapport sur l'application du présent article s'agissant des finalités de prévention des ingérences étrangères et des menaces pour la défense nationale. Au plus tard six mois avant la date mentionnée au II, le Gouvernement remet au Parlement un rapport sur l'application du présent article s'agissant des finalités de prévention des ingérences étrangères et des menaces pour la défense nationale et des menaces relatives à la criminalité organisée et à la délinquance organisée portant sur des délits punis de dix ans d'emprisonnement en tant qu'elles concernent le trafic de stupéfiants, le trafic d'armes et de produits explosifs, l'importation et l'exportation de ces marchandises prohibées ainsi que le blanchiment et le recel du produit, des revenus et des choses provenant de ces infractions.", "amdt": false}]}, {"numero": 70, "vise": "ART. PREMIER", "dispositif": "I. – Après l’alinéa 88, insérer les douze alinéas suivants :\n\n« 5° bis À la seconde phrase du premier alinéa de l’article L. 518‑15‑1, dans sa rédaction issue de l’article 32 de l’ordonnance n° 2024‑936 du 15 octobre 2024 précitée, après le mot : « crypto  dérives des influenceurs sur les réseaux sociaux, les mots : « enregistré dans les conditions prévues à l’article L. 54‑10‑3 du même code ou agréé dans les conditions prévues à l’article L. 54‑10‑5 de ce code, ou » sont supprimés.", "article": "PREMIER", "effet": [{"t": "=", "s": "I.-Le code monétaire et financier est ainsi modifié :\n1° L'article L. 533-12-4 est complété par un alinéa ainsi rédigé :\n« Sans préjudice des trois premiers alinéas, il est interdit aux prestataires de services, en application du V de l'article L. 533-18, de percevoir un paiement pour flux d'ordres. » ;\n2° Le V de l'article L. 533-18 est ainsi rédigé :\n« V.-Dans les limites fixées à l'article 39 bis du règlement (UE) n° 600 / 2014 du Parlement européen et du Conseil du 15 mai 2014 concernant les marchés d'instruments financiers et modifiant le règlement (UE) n° 648 / 2012, les prestataires de services d'investissement autres que les sociétés de gestion de portefeuille ne peuvent pas percevoir une redevance, une commission ou un avantage non monétaire de la part de tiers pour l'exécution des ordres de leurs clients sur un lieu d'exécution donné ou pour la transmission des ordres de leurs clients à un tiers en vue de leur exécution sur un lieu d'exécution donné. » ;\n3° À l'article L. 549-2, la référence : « 27 » est remplacée par la référence : « 27 bis » ;\n4° Le premier alinéa de l'article L. 632-11 est remplacé par cinq alinéas ainsi rédigés :\n« Lorsque l'Autorité des marchés financiers reçoit des informations selon les modalités prévues à l'article 26 du règlement (UE) n° 600 / 2014 du Parlement européen et du Conseil du 15 mai 2014 concernant les marchés d'instruments financiers et modifiant le règlement (UE) n° 648 / 2012 ou à l'article L. 533-9 du présent code, elle les transmet :\n« 1° À l'autorité compétente du marché le plus pertinent en termes de liquidité pour l'instrument financier considéré, lorsque ce marché est situé dans un autre État membre de l'Union européenne ou d ptième ligne du tableau du second alinéa du I des articles L. 783-2, L. 784-2 et L. 785-2 est ainsi rédigée :\nla loi n° du\n", "amdt": false}, {"t": "=", "s": "» ;\n10° Avant la dernière ligne du tableau du second alinéa de l'article L. 785-9, est insérée une ligne ainsi rédigée :\n«\nL. 621-20-11\nla loi n° du\n»\nB.-Le A du présent III entre en vigueur le 1er mars 2025.\nIV.-A.-Le code monétaire et financier est ainsi modifié :", "amdt": false}, {"t": "+", "s": "\nC.-Les 5° bis et 5° quinquies du A du présent IV entrent en vigueur le 1er juillet 2026.", "amdt": false}, {"t": "=", "s": "\n1° L'article L. 211-7 est complété par un alinéa ainsi rédigé :\n« Les conditions et les effets patrimoniaux des opérations sur des titres financiers inscrits au moyen d'une technologie des registres distribués dans les conditions fixées par le règlement (UE) 2022 / 858 du Parlement européen et du Conseil du 30 mai 2022 précité sont déterminés par la loi de l'État où est située l'entité autorisée pour opérer le système de règlement DLT ou, le cas échéant, le système de négociation et de règlement DLT. » ;\n2° L'article L. 211-38 est ainsi modifié :\na) Au premier alinéa du I, après le mot : « contrats », sont insérés les mots : «, actifs numériques » ;\nb) La seconde phrase du 1° du II est complétée par les mots : « ou, s'agissant d'actifs numériques, par tout procédé informatique les désignant comme étant l'objet d'une garantie financière en application du présent article » ;\n3° Le titre II bis du livre II, dans sa rédaction résultant de l'ordonnance n° 2024-936 du 15 octobre 2024 précitée, est complété par un article L. 226-5 ainsi rédigé :\n« Art. L. 226-5.-I.-Le nantissement d'actifs numériques est constitué, tant entre les parties qu'à l'égard des tiers, par une déclaration signée par le propriétaire des actifs numériques. Cette déclaration comporte les énonciations dont le contenu est déterminé par le décret en Conseil d'État prévu au VI. Elle peut être signée au moyen d'un automate exécuteur de clauses dans des conditions définies par ce même décret.\n« Les actifs numériques recensés dans cette déclaration, ceux qui leur sont substitués ou ceux qui les complètent en garantie de la créance initiale du créancier nanti, de quelque manière que ce soit, ainsi que, sauf convention contraire des parties, leurs fruits et produits composés d'actifs numériques ou, le cas échéant, de sommes en toute monnaie, y compris les fruits et produits découlant de l'immobilisation des actifs numériques nantis dans un système de négociation et de règlement DLT, sont compris dans l'assiette du nantissement. Les actifs numériques et leurs fruits et produits venant compléter le nantissement par voie de déclaration complémentaire, en garantie de la créance initiale du créancier nanti, sont soumis aux mêmes conditions que ceux mentionnés dans la déclaration initiale et sont considérés comme ayant été remis à la date de la déclaration initiale du nantissement.\n« Lorsqu'un prestataire du service mentionné au 1° de l'article L. 54-10-2 ou un prestataire de services sur crypto-actifs autorisé dans les conditions prévues à l'article 59 du règlement (UE) 2023 / 1114 du Parlement européen et du Conseil du 31 mai 2023 sur les marchés de crypto-actifs, et modifiant les règlements (UE) n° 1093 / 2010 et (UE) n° 1095 / 2010 et les directives 2013 / 26 / UE et (UE) 2019 / 1937 assure la conservation des actifs numériques, le créancier nanti peut obtenir, sur simple demande auprès de celui-ci, une attestation de nantissement comportant l'inventaire des actifs numériques nantis à la date de délivrance de cette attestation.\n« II.-Lorsque les actifs numériques initialement nantis font l'objet de plusieurs nantissements successifs, le rang des créanciers est réglé, en lien avec chaque actif numérique, par l'ordre de leur déclaration initiale. Dans ce cas, le constituant ou le créancier nanti notifie successivement chacun des nantissements à tout prestataire du service mentionné au 1° de l'article L. 54-10-2 du présent code ou au prestataire de services sur crypto-actifs autorisé dans les conditions prévues à l'article 59 du règlement (UE) 2023 / 1114 du Parlement européen et du Conseil du 31 mai 2023 précité qui assure la conservation des actifs numériques nantis.\n« III.-Les fruits et produits mentionnés au I du présent article composés de sommes en toute monnaie sont, lorsqu'ils n'ont pas été exclus de l'assiette du nantissement par convention des parties, inscrits au crédit d'un compte de fruits et produits ouvert au nom du titulaire des actifs numériques nantis dans les livres d'un établissement de crédit. Cette inscription peut avoir lieu à tout moment. Les fruits et produits sont réputés faire partie intégrante de l'assiette du nantissement à la date de la signature de la déclaration initiale de nantissement, quelle que soit la date d'ouverture du compte de fruits et produits. Le créancier nanti peut obtenir, sur simple demande au teneur du compte de fruits et produits, une attestation comportant l'inventaire des sommes inscrites au crédit de ce compte à la date de la délivrance de cette attestation.\n« À défaut d'inscription au crédit d'un compte de fruits et produits à la date à laquelle la sûreté peut être réalisée, les fruits et produits sont exclus de l'assiette du nantissement.\n« IV.-Le créancier nanti définit avec le constituant les conditions dans lesquelles ce dernier peut disposer des actifs numériques et des sommes en toute monnaie compris dans l'assiette du nantissement. Le créancier nanti bénéficie en toute hypothèse, selon des modalités convenues par les parties, d'un droit de rétention sur ces actifs numériques et sur ces sommes.\n« V.-À défaut d'un autre délai préalablement convenu avec le constituant, le créancier nanti titulaire d'une créance certaine, liquide et exigible peut réaliser le nantissement huit jours après la mise en demeure du débiteur, du constituant s'il n'est pas le débiteur et, le cas échéant, de tout prestataire de services mentionné au 1° de l'article L. 54-10-2 ou de tout prestataire de services sur crypto-actifs autorisé dans les conditions prévues à l'article 59 du règlement (UE) 2023 / 1114 du Parlement européen et du Conseil du 31 mai 2023 précité assurant la conservation des actifs numériques nantis ainsi que du teneur du compte des fruits et produits. La mise en demeure est réalisée par remise en mains propres, par courrier recommandé ou par toute autre modalité fixée par le décret en Conseil d'État prévu au VI du présent article.\n« Dans la limite du montant de la créance garantie et, le cas échéant, dans le respect de l'ordre indiqué par le constituant du nantissement, la réalisation du nantissement intervient :\n« 1° Pour les sommes en toute monnaie, directement par transfert en pleine propriété au créancier nanti ;\n« 2° Pour les actifs numériques, selon les modalités convenues entre le constituant et le créancier nanti. À défaut d'accord, les modalités de réalisation sont fixées par le décret en Conseil d'État mentionné au VI.\n« Le constituant du nantissement supporte tous les frais résultant de la réalisation du nantissement. Ces frais sont imputés sur le montant résultant de cette réalisation.\n« VI.-Un décret en Conseil d'État précise les modalités d'application du présent article. » ;\n4° Au premier alinéa du I de l'article L. 211-38, dans sa rédaction résultant du a du 2° du présent IV, les mots : « actifs numériques » sont remplacés par le mot : « crypto-actifs » ;\n5° L'article L. 226-5, dans sa rédaction résultant du 3° du présent IV, est ainsi modifié :\na) Le I est ainsi modifié :\n-à la première phrase du premier alinéa, les mots : « d'actifs numériques » sont remplacés par les mots : « de crypto-actifs » et, à la fin, la seconde occurrence des mots : « actifs numériques » est remplacée par le mot : « crypto-actifs » ;\n-à la première phrase du deuxième alinéa, les première et dernière occurrences des mots : « actifs numériques » sont remplacées par le mot : « crypto-actifs » et les mots : « d'actifs numériques » sont remplacés par les mots : « de crypto-actifs » ;\n-à la seconde phrase du même deuxième alinéa et, deux fois, au dernier alinéa, les mots : « actifs numériques » sont remplacés par le mot : « crypto-actifs » ;\n-au dernier alinéa, les mots : « prestataire du service mentionné au 1° de l'article L. 54-10-2 du présent code ou un » sont supprimés ;\nb) Le II est ainsi modifié :\n-aux première et seconde phrases, les mots : « actifs numériques » sont remplacés par le mot : « crypto-actifs » ;\n-à la seconde phrase, les mots : « mentionné au 1° de l'article L. 54-10-2 ou au prestataire de services » sont supprimés ;\nc) À la première phrase du premier alinéa du III, les mots : « actifs numériques » sont remplacés par le mot : « crypto-actifs » ;\nd) Aux première et seconde phrases du IV, les mots : « actifs numériques » sont remplacés par le mot : « crypto-actifs » ;\ne) Le V est ainsi modifié :\n-à la première phrase du premier alinéa, les mots : « mentionné au 1° de l'article L. 54-10-2 ou de tout prestataire de services » sont supprimés ;\n-à la même première phrase et à la première phrase du 2°, les mots : « actifs numériques » sont remplacés par le mot : « crypto-actifs » ;\n6° Le tableau du second alinéa du I des articles L. 742-1, L. 743-1 et L. 744-1, dans leur rédaction résultant de l'ordonnance n° 2024-936 du 15 octobre 2024 précitée, est ainsi modifié :\na) La septième ligne est ainsi rédigée :\n«\nL. 211-7\nla loi n° du\n» ;\nb) La vingt-neuvième ligne est ainsi rédigée :\n«\nL. 211-38\nla loi n° du\n» ;\n7° Le tableau du second alinéa des articles L. 742-13-1, L. 743-13-1 et L. 744-12-1, dans leur rédaction résultant de l'ordonnance n° 2024-936 du 15 octobre 2024 précitée, est complété par une ligne ainsi rédigée :\n«\nL. 226-5\nla loi n° du\n»\nB.-Les 4° et 5° du A du présent IV entrent en vigueur le 1er juillet 2026.", "amdt": false}, {"t": "+", "s": "\nV.-Au 4° du V de l'article 4 de la loi n° 2023-451 du 9 juin 2023 visant à encadrer l'influence commerciale et à lutter contre les dérives des influenceurs sur les réseaux sociaux, les mots : « enregistré dans les conditions prévues à l'article L. 54-10-3 du même code ou agréé dans les conditions prévues à l'article L. 54-10-5 de ce code, ou » sont supprimés.", "amdt": false}]}, {"numero": 71, "vise": "ART. 2", "dispositif": "Après l’alinéa 12, insérer les sept alinéas suivants :\n\n« V bis. – Dans le périmètre de développement du logement, lorsqu’une opération bénéficiant d’une dérogation mentionnée au III implique le départ temporaire ou définitif des occupants, le maître d’ouvrage assure, avant leur départ :\n\n« 1° Une information individuelle sur la nature et le calendrier de l’opération et sur leurs droits ;\n\n« 2° Une offre de relogement adaptée à leurs besoins et à leurs ressources, située prioritairement dans la même commune ou, à défaut, dans le même établissement public de coopération intercommunale ;\n\n« 3° Le maintien d’un niveau de loyer et de charges compatible avec leurs ressources et n’excédant pas celui du logement quitté ;\n\n« 4° La prise en charge des frais directement liés au relogement ;\n\n« 5° En cas de relogement temporaire, la possibilité de réintégrer le logement après travaux lorsque sa destination d’habitation est conservée\n\nUn décret en Conseil d’État précise les modalités d’application du présent V bis. »", "article": "2", "effet": [{"t": "=", "s": "I.-Après l'article L. 152-6-9 du code de l'urbanisme, il est inséré un article L. 152-6-9-1 ainsi rédigé :\n« Art. L. 152-6-9-1.-I.-Lorsque des évolutions démographiques ou des développements économiques tels que l'implantation d'activités nouvelles et la réalisation de projets d'intérêt national, et plus particulièrement l'implantation, l'extension ou la réalisation de projets industriels, énergétiques ou d'intérêt national créant un afflux durable de salariés et de leurs familles, font apparaître ou envisager une insuffisance caractérisée de l'offre de logements dans un territoire, l'autorité compétente en matière de plan local d'urbanisme peut, par une délibération qui en justifie la nécessité, le périmètre et la cohérence au regard des besoins actuels et prévisionnels de logements, délimiter et instaurer pour une durée de cinq ans, après avis du représentant de l'État dans le département, un périmètre de développement du logement dans lequel des dérogations au plan local d'urbanisme peuvent être accordées, dans les conditions définies aux III à V, au profit de projets permettant d'accroître le nombre de bâtiments à destination d'habitation et de réaliser les équipements qui leur sont nécessaires afin de remédier à cette insuffisance ou de la prévenir.\n« Lorsque l'autorité compétente est un établissement public de coopération intercommunale, la délimitation et l'instauration du périmètre de développement du logement sont soumises à l'avis conforme des communes dont le territoire est, pour une ou plusieurs de ses parties, inclus dans le périmètre concerné. L'avis intervient dans un délai de deux mois à compter de la saisine. À l'expiration de ce délai, le silence gardé par la commune vaut avis conforme.\n« Lorsque l'insuffisance de l'offre de logements demeure caractérisée dans le territoire, le périmètre de développement du logement peut, avant l'expiration du délai mentionné au premier alinéa du présent I, être renouvelé pour une durée de cinq ans par délibération de l'autorité compétente en matière de plan local d'urbanisme. Il peut être renouvelé une fois supplémentaire dans les mêmes conditions.\n« II.-Le périmètre de développement du logement peut être constitué de plusieurs espaces discontinus. Il ne peut couvrir l'intégralité du territoire d'une commune.\n« Les espaces retenus dans ce périmètre sont situés au sein des seules zones urbaines ou à urbaniser du plan local d'urbanisme.\n« III.-À l'intérieur du périmètre de développement du logement, 1'autorité compétente pour délivrer les autorisations d'urbanisme peut accorder aux projets soumis à de telles autorisations des dérogations au règlement du plan local d'urbanisme ainsi que, s'il y a lieu, à ses orientations d'aménagement et de programmation, y compris celles qui précisent les actions et les opérations en matière d'habitat lorsque le plan local d'urbanisme tient lieu de programme local de l'habitat, sous réserve que ces dérogations ne compromettent pas la bonne insertion des constructions dans le tissu urbain existant.\n« Lorsque les projets bénéficient des dérogations mentionnées au premier alinéa du présent III, le maître d'ouvrage, lorsqu'il est tenu de recourir à un architecte en application de l'article L. 431-1, charge ce dernier d'une mission complète de maîtrise d'œuvre, comprenant au moins les missions relatives à la conception, à la direction de l'exécution des travaux et à l'assistance aux opérations de réception.\n« IV.-Les logements créés dans le périmètre de développement du logement et ayant bénéficié d'une ou de plusieurs dérogations mentionnées au III sont à usage exclusif de résidence principale, au sens de l'article 2 de la loi n° 89-462 du 6 juillet 1989 tendant à améliorer les rapports locatifs et portant modification de la loi n° 86-1290 du 23 décembre 1986.\n« Les quatrième et avant-dernier alinéas de l'article L. 151-14-1 et l'article L. 481-4 du présent code sont applicables à ces logements.\n« À l'issue d'un délai de dix ans à compter de la publication de la délibération mentionnée au premier alinéa du I du présent article ou, lorsque le périmètre de développement du logement a été renouvelé, à compter de la publication de la délibération ayant procédé au renouvellement du périmètre, l'autorité compétente mentionnée au deuxième alinéa du même I peut, par une délibération motivée justifiant la disparition de l'insuffisance de l'offre de logements ayant justifié la création du périmètre de développement du logement, décider que les deux premiers alinéas du présent IV ne sont plus applicables dans tout ou partie du périmètre de développement du logement.\n« V.-Par dérogation aux dispositions du code du patrimoine prévoyant l'accord de l'architecte des Bâtiments de France, les autorisations délivrées le sont sur avis simple de l'architecte des Bâtiments de France.\n", "amdt": false}, {"t": "=", "s": "«", "amdt": true}, {"t": "+", "s": " V bis.-Dans le périmètre de développement du logement, lorsqu'une opération bénéficiant d'une dérogation mentionnée au III implique le départ temporaire ou définitif des occupants, le maître d'ouvrage assure, avant leur départ :\n« 1° Une information individuelle sur la nature et le calendrier de l'opération et sur leurs droits ;\n« 2° Une offre de relogement adaptée à leurs besoins et à leurs ressources, située prioritairement dans la même commune ou, à défaut, dans le même établissement public de coopération intercommunale ;\n« 3° Le maintien d'un niveau de loyer et de charges compatible avec leurs ressources et n'excédant pas celui du logement quitté ;\n« 4° La prise en charge des frais directement liés au relogement ;\n« 5° En cas de relogement temporaire, la possibilité de réintégrer le logement après travaux lorsque sa destination d'habitation est conservée\n« Un décret en Conseil d'État précise les modalités d'application du présent V bis.\n«", "amdt": false}, {"t": "=", "s": " VI.-Les III à V sont applicables aux demandes d'autorisation d'urbanisme déposées à compter de la publication et de la transmission à l'autorité administrative compétente de l'État de la délibération mentionnée au premier alinéa du I ou, le cas échéant, de la délibération ayant procédé au renouvellement du périmètre. »\nII.-La loi n° 89-462 du 6 juillet 1989 tendant à améliorer les rapports locatifs et portant modification de la loi n° 86-1290 du 23 décembre 1986 est ainsi modifiée :\n1° Le g de l'article 4 est ainsi modifié :\na) À la première phrase, après le mot : « urbanisme », sont insérés les mots : « ou à celle prévue au IV de l'article L. 152-6-9-1 du même code » ;\nb) À la seconde phrase, les mots : « ce dernier » sont remplacés par les mots : « ces deux derniers » et les mots : « du même » sont remplacés par le mot : « dudit » ;\n2° Au h de l'article 7, après le mot : « urbanisme », sont insérés les mots : « ou à celle prévue au IV de l'article L. 152-6-9-1 du même code ».\nIII-Après le 3° de l'article L. 632-2-1 du code du patrimoine, il est inséré un 4° ainsi rédigé :\n« 4° Les travaux ou aménagements effectués au sein d'un périmètre de développement du logement mentionné à l'article L. 152-6-9-1 du code de l'urbanisme. »", "amdt": false}]}, {"numero": 72, "vise": "ART. PREMIER", "dispositif": "Compléter l’alinéa 16 par la phrase suivante :\n\n« La publication et l’actualisation de cet arrêté donne lieu à une négociation sur la rémunération des infirmiers afin de tenir compte, en fonction des différents lieux d’exercice, des évolutions de compétences envisagées. »", "article": "PREMIER", "effet": [{"t": "=", "s": "La quatrième partie du code de la santé publique est ainsi modifiée :\n1° Le dernier alinéa de l'article L. 4161-1 est ainsi modifié :\na) Les mots : « ou aux infirmiers » sont supprimés ;\nb) Après le mot : « vaccinations », sont insérés les mots : «, ni aux infirmiers qui prescrivent les produits de santé et les examens ou qui effectuent les actes professionnels et les soins figurant sur les listes prévues à l'article L. 4311-1 » ;\n2° L'article L. 4311-1 est ainsi rédigé :\n« Art. L. 4311-1.-L'infirmier exerce son activité, dans le respect du code de déontologie, en application du rôle propre qui lui est dévolu ou sur prescription et en complémentarité avec les autres professionnels de santé.\n« Dans son exercice professionnel, l'infirmier initie, réalise, organise et évalue les soins infirmiers. Il effectue des consultations infirmières et pose un diagnostic infirmier. Il prescrit les produits de santé et les examens complémentaires nécessaires à l'exercice de sa profession. La liste de ces produits de santé et de ces examens complémentaires est fixée par un arrêté des ministres chargés de la santé et de la sécurité sociale pris après avis de l'Académie nationale de médecine et de la Haute Autorité de santé. Elle est mise à jour au moins tous les trois ans.\n« Les missions de l'infirmier sont les suivantes :\n« 1° Dispenser des soins infirmiers préventifs, curatifs, palliatifs, relationnels ou destinés à la surveillance clinique ainsi qu'à leur évaluation ;\n« 2° Contribuer à l'orientation de la personne ainsi qu'à la coordination et à la mise en œuvre du parcours de santé de la personne ;\n« 3° Participer à la prévention, aux actions de dépistage, aux soins éducatifs à la santé, à la santé au travail, à la promotion de la santé et à l'éducation thérapeutique de la personne et, le cas échéant, de son entourage ;\n« 4° Concourir à la formation initiale et continue des étudiants, de ses pairs et des professionnels de santé placés sous sa responsabilité ;\n« 5° Mobiliser les données probantes dans la pratique professionnelle et concourir à la recherche infirmière.\n« L'infirmier participe à la mission de service public de permanence des soins, dans les conditions fixées à l'article L. 6314-1.\n« Un décret en Conseil d'État précise les domaines d'activités et de compétences de l'infirmier.\n« Un arrêté du ministre chargé de la santé fixe, pour chacun de ces domaines d'activités, la liste des actes et soins réalisés par les infirmières et infirmiers.", "amdt": false}, {"t": "+", "s": " La publication et l'actualisation de cet arrêté donne lieu à une négociation sur la rémunération des infirmiers afin de tenir compte, en fonction des différents lieux d'exercice, des évolutions de compétences envisagées.", "amdt": false}, {"t": "=", "s": " »", "amdt": false}]}, {"numero": 73, "vise": "ART. 12", "dispositif": "I. – À l’alinéa 50, après la première occurrence du mot :\n\n« disposition
