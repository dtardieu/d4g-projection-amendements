nt mentionné à l'article L. 321-1 sans autorisation préalable du président du conseil départemental ; »\nb) Au 2°, les mots : «, sans avoir effectué la déclaration préalable auprès du président du conseil départemental » sont supprimés et les mots : « malgré l'opposition » sont remplacés par les mots : « sans autorisation préalable » ;\nc) Le 3° est abrogé ;\n9° À l'article L. 331-7, les mots : « de l'article L. 312-1 ou déclaré en vertu de l'article » sont remplacés par les mots : « des articles L. 312-1 et » ;\n10° À l'article L. 331-8-1, les mots : « l'autorisation prévue à l'article L. 313-1 ou pour recevoir leur déclaration en application des articles L. 321-1 et » sont remplacés par les mots : « les autorisations prévues aux articles L. 313-1 et L. 321-1 ou pour recevoir leur déclaration en application de l'article ».\nII.-Les personnes qui ont effectué une déclaration sur le fondement de l'article L. 321-1 du code de l'action sociale et des familles dans sa rédaction antérieure à la présente loi et dont l'activité est soumise à un régime d'autorisation en application du 7° du I du même article L. 321-1 dans sa rédaction résultant de la présente loi peuvent continuer à exercer leur activité jusqu'à l'intervention de la décision administrative statuant sur leur demande d'autorisation et, en l'absence d'une telle demande, au plus tard jusqu'au premier jour du douzième mois suivant la publication de la présente loi.", "amdt": false}]}, {"numero": 130, "vise": "ART. 14", "dispositif": "À l’alinéa 6, substituer au taux :\n\n« 25 % »\n\nle taux :\n\n« 100 % ».", "article": "14", "effet": [{"t": "=", "s": "I.-Le code de la sécurité sociale est ainsi modifié :\n1° La section 2 du chapitre IV ter du titre Ier du livre Ier est complétée par un article L. 114-22-2-1 ainsi rédigé :\n« Art. L. 114-22-2-1.-Pour le calcul de l'ensemble des aides, des prestations ou des allocations attribuées sous condition de ressources ou réduites en fonction des revenus en application du présent code, du code de l'action sociale et des familles, du code rural et de la pêche maritime ou du code de la construction et de l'habitation, les sommes soumises à l'impôt sur le revenu en application de l'article 1649 quater-0 B bis du code général des impôts sont prises en compte. Ces sommes sont communiquées à l'organisme concerné par l'administration fiscale.\n« Les modalités d'application du présent article sont déterminées par décret en Conseil d'État. » ;\n2° Le IV de l'article L. 136-8 est ainsi rétabli :\n« IV.-Par dérogation au I, sont assujetties à la contribution sociale au taux de", "amdt": false}, {"t": "-", "s": " 25", "amdt": false}, {"t": "+", "s": " 100", "amdt": false}, {"t": "=", "s": " %", "amdt": true}, {"t": "=", "s": " les sommes mentionnées au a du II de l'article L. 136-6 qui sont soumises à l'impôt sur le revenu en application de l'article 1649 quater-0 B bis du code général des impôts. »\nII.-Le II de l'article 154 quinquies du code général des impôts est complété par un alinéa ainsi rédigé :\n« Par dérogation au premier alinéa du présent II, la contribution afférente aux sommes mentionnées au a du II de l'article L. 136-6 du code de la sécurité sociale qui sont soumises à l'impôt sur le revenu en application de l'article 1649 quater-0 B bis du présent code n'est pas admise en déduction du revenu imposable. »\nIII.-Le I s'applique à compter du 1er janvier 2026. Le II s'applique à l'impôt sur le revenu dû au titre de l'année 2026 et des années suivantes.\nIV.-Après l'article L. 5425-1 du code du travail, il est inséré un article L. 5425-1-1 ainsi rédigé :\n« Art. L. 5425-1-1.-Les allocations prévues au présent titre ne peuvent être cumulées, au titre d'une même période, avec des sommes soumises à l'impôt sur le revenu en application de l'article 1649 quater-0 B bis du code général des impôts. Ces sommes sont communiquées à l'organisme débiteur du revenu de remplacement par l'administration fiscale.\n« Les modalités d'application du présent article sont déterminées :\n« 1° Pour l'allocation d'assurance et l'allocation des travailleurs indépendants, par l'accord prévu à l'article L. 5422-20 du présent code ;\n« 2° Pour les allocations de solidarité, par décret en Conseil d'État.\n« Il peut être procédé au réexamen de la situation du bénéficiaire lorsqu'interviennent des éléments nouveaux, dans un délai raisonnable à compter de leur découverte, tels qu'un jugement pénal définitif ou l'annulation de la décision initiale des services fiscaux, y compris après le recouvrement du trop-perçu par l'organisme concerné.\n« Le montant des allocations prévues au présent titre ne peut être réduit qu'à hauteur des revenus illicites effectivement constatés. »", "amdt": false}]}, {"numero": 131, "vise": "ART. PREMIER", "dispositif": "Compléter la première phrase de l'alinéa 4 par les mots :\n\n« , et s’assurent de leur mise en œuvre dans les meilleurs délais. »", "article": "PREMIER", "effet": [{"t": "=", "s": "I.-L'article L. 611-1-1 du code rural et de la pêche maritime est ainsi modifié :\n1° Au début du premier alinéa, est ajoutée la numérotation : « I.-» ;\n2° L'article est complété par un II ainsi rédigé :\n« II.-Pour mettre en œuvre les conclusions des conférences de la souveraineté alimentaire, des comités de pilotage régionaux, présidés par le représentant de l'État dans la région et le président du conseil régional, reconnaissent des projets d'avenir agricole, initiés et portés par les acteurs économiques du territoire, qui respectent les priorités fixées par le livre préliminaire du présent code", "amdt": false}, {"t": "+", "s": ", et s'assurent de leur mise en œuvre dans les meilleurs délais", "amdt": false}, {"t": "=", "s": ". Des engagements réciproques entre ces différents acteurs économiques peuvent être pris par voie contractuelle. Les projets d'avenir agricole peuvent concerner une ou plusieurs régions. Ils bénéficient d'une priorité dans l'accompagnement, notamment financier, par l'État et les collectivités territoriales. »\nII.-Après l'article L. 691-2 du même code, sont insérés trois articles ainsi rédigés :\n« Art. L. 691-2-1.-Pour l'application de l'article L. 611-1-1 en Guyane, la référence au conseil régional est remplacée par la référence à l'assemblée de Guyane.\n« Art. L. 691-2-2.-Pour l'application de l'article L. 611-1-1 en Martinique, la référence au conseil régional est remplacée par la référence à l'assemblée de Martinique.\n« Art. L. 691-2-3.-Pour l'application de l'article L. 611-1-1 à Mayotte, la référence au conseil régional est remplacée par la référence à l'assemblée de Mayotte. »\nIII.-Après l'article L. 692-3 du même code, il est inséré un article L. 692-4 ainsi rédigé :\n« Art. L. 692-4.-Pour l'application de l'article L. 611-1-1 à Saint-Barthélemy, la référence au conseil régional est remplacée par la référence au conseil territorial de Saint-Barthélemy. »\nIV.-Après l'article L. 693-3 du même code, il est inséré un article L. 693-4 ainsi rédigé :\n« Art. L. 693-4.-Pour l'application de l'article L. 611-1-1 à Saint-Martin, la référence au conseil régional est remplacée par la référence au conseil territorial de Saint-Martin. »\nV.-Après l'article L. 694-5 du même code, il est inséré un article L. 694-6 ainsi rédigé :\n« Art. L. 694-6.-Pour l'application de l'article L. 611-1-1 à Saint-Pierre-et-Miquelon, la référence au conseil régional est remplacée par la référence au conseil territorial de Saint-Pierre-et-Miquelon. »", "amdt": false}]}, {"numero": 132, "vise": "APRÈS ART. 62", "dispositif": "À compter de 2026 et tous les ans, le Gouvernement remet au Parlement, avant le 30 septembre des années concernées, un rapport sur la mise en œuvre de la stratégie nationale en matière de cybersécurité, qui précise les moyens humains, techniques et financiers mis à sa disposition pour l’exercice de ses missions de contrôle et d’audit. Il évalue également les besoins à venir au regard de l’élargissement du périmètre des entités concernées par la présente loi.", "article": "62 BIS", "effet": [{"t": "+", "s": "À compter de 2026 et tous les ans, le Gouvernement remet au Parlement, avant le 30 septembre des années concernées, un rapport sur la mise en œuvre de la stratégie nationale en matière de cybersécurité, qui précise les moyens humains, techniques et financiers mis à sa disposition pour l'exercice de ses missions de contrôle et d'audit. Il évalue également les besoins à venir au regard de l'élargissement du périmètre des entités concernées par la présente loi.", "amdt": false}]}, {"numero": 133, "vise": "ART. 2", "dispositif": "Après l’alinéa 1, insérer l’alinéa suivant :\n\n« 1°A Après le mot : « exporté », sont insérés les mots : « ou obtenus après cession ou libéralité obtenues par contrainte ou violence ou d’une personne qui ne pouvait en disposer » » ;", "article": "2", "effet": [{"t": "=", "s": "Le premier alinéa de l'article L. 124-1 du code du patrimoine est ainsi modifié :", "amdt": false}, {"t": "+", "s": "\n1° A Après le mot : « exporté », sont insérés les mots : « ou obtenus après cession ou libéralité obtenues par contrainte ou violence ou d'une personne qui ne pouvait en disposer »", "amdt": false}, {"t": "=", "s": "\n1° Les mots : « l'entrée en vigueur, à l'égard de l'État d'origine et de la France » sont remplacés par les mots : « le 23 avril 1972, quelle que soit la date de ratification par l'État d'origine » ;\n2° À la fin, la date : « 17 novembre 1970 » est remplacée par la date : « 14 novembre 1970 ».", "amdt": false}]}, {"numero": 134, "vise": "ART. 14", "dispositif": "Supprimer la dernière phrase de l’alinéa 9.", "article": "14", "effet": [{"t": "=", "s": "I.-Le code de l'environnement est ainsi modifié :\n1° L'article L. 411-1 est ainsi modifié :\na) Après le I, il est inséré un I bis ainsi rédigé :\n« I bis.-Afin de prévenir les dommages à l'élevage dus au loup tout en assurant le maintien de l'espèce dans un état de conservation favorable, un arrêté conjoint des ministres chargés de la protection de la nature et de l'agriculture définit les conditions dans lesquelles cette espèce fait l'objet de mesures de gestion, notamment en termes de prélèvements. Ces mesures de gestion sont déterminées sur le fondement de données scientifiques actualisées annuellement.\n« L'arrêté précise les mesures de gestion, notamment en matière d'effarouchement et de destruction, destinées à lutter contre la prédation des troupeaux ainsi que leurs modalités de mise en œuvre, en particulier les régimes de déclaration ou d'autorisation. Il prévoit que ces mesures, adaptées à l'évolution de la pression de prédation, peuvent, selon les territoires et afin de garantir le maintien de l'espèce dans un état de conservation favorable, être suspendues par l'autorité administrative. S'agissant des bovins et des équins, compte tenu de l'absence de moyens de prévention efficaces disponibles, des démarches en matière de réduction de la vulnérabilité de ces troupeaux peuvent être demandées aux éleveurs.\n« Les attaques et les dommages causés par le loup sont constatés sur place par un agent habilité ou par voie électronique. L'arrêté précise les conditions dans lesquelles le constat peut être réalisé par l'éleveur.\n« L'arrêté précise les conditions dans lesquelles l'autorité administrative émet le récépissé de la déclaration de demande de tir de défense. À compter de la réception d'un dossier complet, ce délai ne peut excéder un jour ouvré.\n« Un arrêté des ministres chargés de l'agriculture et de la protection de la nature précise les conditions de mise en cohérence et de valorisation des données issues des registres existants de suivi des tirs liés à la prédation.\n« Un arrêté du ministre chargé de l'agriculture fixe, chaque année, le nombre de spécimens pouvant être prélevés à l'échelle nationale. Ce nombre de prélèvements peut être fixé en tenant compte du nombre minimal de spécimens compatible avec un état favorable de conservation", "amdt": false}, {"t": "-", "s": ". Dans ce cas, il correspond à la différence entre la population lupine observée et ce nombre minimal de spécimens", "amdt": false}, {"t": "=", "s": ".\n« L'arrêté précise les conditions dans lesquelles, lorsque le nombre maximal de loups pouvant être détruits est atteint avant la fin de l'année civile, et à la suite de dommages dus à la prédation constatés par le représentant de l'État dans le département, le préfet coordonnateur du plan national d'actions sur le loup peut autoriser l'abattage de spécimens à titre dérogatoire, à l'échelle du département dans lequel ont été constatés les dommages et dans la limite d'un seuil assurant le maintien de l'espèce dans un état de conservation favorable.\n« L'évaluation de l'incidence des mesures de gestion sur l'état de conservation du loup s'apprécie en principe au niveau national. Il n'est tenu compte de la population au niveau local que s'il est démontré que ces mesures ont, dans les circonstances particulières, une incidence sur l'état de conservation de l'espèce. » ;\nb) Au II, après la référence : « I », sont insérés les mots : « et du I bis » ;\n2° Le I de l'article L. 411-2 est ainsi modifié :\na) Au 2°, les mots : « du I » sont remplacés par les mots : « des I et I bis » ;\nb) Au premier alinéa du 4°, après la référence : « 3° », sont insérés les mots : « du I et au I bis » ;\nc) Au 6°, après la référence : « I », sont insérés les mots : « ou au I bis » ;\n2° bis L'article L. 427-1 est ainsi rédigé :\n« Art. L. 427-1.-L'activité de lieutenant de louveterie repose sur le bénévolat. Elle n'est pas exercée à titre professionnel mais dans les conditions déterminées au présent article et aux articles L. 427-1-1 à L. 427-7 et par les décrets et les arrêtés qui en précisent les modalités d'application.\n« Les lieutenants de louveterie sont nommés par l'autorité administrative et concourent, sous son contrôle, à la destruction des animaux mentionnés aux articles L. 427-6 et L. 427-8 ou, ponctuellement, aux opérations de régulation des animaux qu'elle a ordonnées. Les lieutenants de louveterie sont assermentés au titre de la police de la chasse et sont des agents dépositaires d'une mission de service public de police. Ils sont consultés par l'autorité compétente, en tant que de besoin, sur les problèmes posés par la gestion de la faune sauvage. » ;\n2° ter Après le même article L. 427-1, il est inséré un article L. 427-1-1 ainsi rédigé :\n« Art. L. 427-1-1.-Par dérogation à l'article L. 123-19-1, les actes administratifs pris par le représentant de l'État dans le département sont dispensés de consultation préalable du public lorsqu'ils visent à autoriser une intervention des lieutenants de louveterie qui vise à répondre à une situation d'urgence ou à prévenir des dommages graves causés aux activités agricoles ou forestières.\n« En application du premier alinéa du présent article, un arrêté du représentant de l'État dans le département peut définir, pour une durée ne pouvant excéder une année civile, les conditions, les communes et les modalités d'intervention des lieutenants de louveterie.\n« Les autorisations délivrées par le représentant de l'État dans le département sur le fondement du présent article sont publiées sur le site internet de la préfecture. » ;\n2° quater Après l'article L. 427-2, sont insérés des articles L. 427-2-1 à L. 427-2-4 ainsi rédigés :\n« Art. L. 427-2-1.-Toute personne, qu'elle soit ou non en activité et quelle que soit son activité professionnelle, peut devenir lieutenant de louveterie, sous réserve de remplir les conditions d'engagement fixées par voie réglementaire.\n« Art. L. 427-2-2.-Les missions ordonnées par l'autorité administrative compétente ouvrent droit à une autorisation d'absence du lieutenant de louveterie pendant son temps de travail. Cette autorisation ne peut être refusée que si les nécessités du fonctionnement de l'entreprise ou du service public s'y opposent. Le refus est motivé, notifié à l'intéressé et transmis à l'autorité administrative compétente.\n« Art. L. 427-2-3.-Les lieutenants de louveterie peuvent conclure avec leur employeur une convention définissant les modalités de leur disponibilité pour les missions ordonnées par l'autorité administrative compétente. Cette convention veille à assurer la compatibilité de cette disponibilité avec les nécessités du fonctionnement de l'entreprise ou du service public.\n« Art. L. 427-2-4.-Par dérogation à l'article L. 312-2-1 du code de la sécurité intérieure, l'association nationale des lieutenants de louveterie et les associations régionales et départementales des lieutenants de louveterie sont autorisées à acquérir et à détenir des armes à feu, des munitions et de leurs éléments relevant de la catégorie C en vue de leur remise aux lieutenants de louveterie pour l'exercice de leurs fonctions et de leurs missions de gestion ou de régulation de la faune sauvage ordonnées par le représentant de l'État dans le département.\n« Les modalités d'application du présent article sont déterminées par arrêté conjoint du ministre de l'intérieur et du ministre chargé de la chasse. » ;\n3° L'article L. 427-6 est ainsi modifié :\na) À la première phrase de l'avant-dernier alinéa, le mot : « à » est remplacé par les mots : « au I de » ;\nb) Le dernier alinéa est supprimé.\nI bis.-Les tirs d'effarouchement et de défense ne peuvent être interdits dans les espaces protégés mentionnés aux articles L. 331-1, L. 332-1 et L. 341-1 du code de l'environnement, à l'exception des cœurs de parcs nationaux définis à l'article L. 331-2 du même code.\nII.-Le IV de l'article 47 de la loi n° 2025-268 du 24 mars 2025 d'orientation pour la souveraineté alimentaire et le renouvellement des générations en agriculture est abrogé.", "amdt": false}]}, {"numero": 135, "vise": "ART. 14", "dispositif": "À l’alinéa 5, substituer aux mots :\n\n« sans délai la personne »\n\nles mots :\n\n« la personne, dans un délai ne pouvant excéder vingt-quatre heures, ».", "article": "14", "effet": [{"t": "=", "s": "La section 2 bis du chapitre Ier du titre Ier du livre Ier de la première partie du code de la santé publique, telle qu'elle résulte de l'article 2 de la présente loi, est complétée par une sous-section 4 ainsi rédigée :\n« Sous-section 4\n« Clause de conscience\n« Art. L. 1111-12-12.-I.-Les professionnels de santé mentionnés à l'article L. 1111-12-3 ainsi qu'aux I à V et au premier alinéa du VI de l'article L. 1111-12-4 ne sont pas tenus de concourir à la mise en œuvre des dispositions prévues aux sous-sections 2 et 3 de la présente section.\n« Le professionnel de santé qui ne souhaite pas participer à la mise en œuvre de ces dispositions doit informer", "amdt": false}, {"t": "-", "s": " sans délai", "amdt": false}, {"t": "=", "s": " la personne", "amdt": true}, {"t": "+", "s": ", dans un délai ne pouvant excéder vingt-quatre heures,", "amdt": false}, {"t": "=", "s": " de son refus et lui communiquer le nom de professionnels de santé disposés à participer à cette mise en œuvre.\n« II.-Lorsqu'une personne est admise dans un établissement de santé ou hébergée dans un établissement ou service mentionné à l'article L. 312-1 du code de l'action sociale et des familles, le responsable de l'établissement ou du service est tenu d'y permettre :\n« 1° L'intervention des professionnels de santé mentionnés aux articles L. 1111-12-3 et L. 1111-12-4 du présent code ;\n« 2° L'accès des personnes mentionnées au II de l'article L. 1111-12-5.\n« III.-Les professionnels de santé qui sont disposés à participer à la mise en œuvre de la procédure prévue à la sous-section 3 de la présente section se déclarent auprès de la commission mentionnée à l'article L. 1111-12-13. »", "amdt": false}]}, {"numero": 136, "vise": "ART. PREMIER", "dispositif": "À l’alinéa 3, substituer aux mots :\n\n« entreprises d’investissement »,\n\nles mots :\n\n« prestataires de services ».", "article": "PREMIER", "effet": [{"t": "=", "s": "I.-Le code monétaire et financier est ainsi modifié :\n1° À l'article L. 533-12-4, il est ajouté un alinéa ainsi rédigé :\n« Sans préjudice des dispositions qui précèdent, il est interdit aux", "amdt": false}, {"t": "-", "s": " entreprises d'investissement", "amdt": false}, {"t": "+", "s": " prestataires de services", "amdt": false}, {"t": "=", "s": ", en application du V de l'article L. 533-18, de percevoir un paiement pour flux d'ordres. » ;\n2° Le V de l'article L. 533-18 est remplacé par les dispositions suivantes :\n« V.-Dans les limites fixées à l'article 39 bis du règlement (UE) n° 600 / 2014 du Parlement européen et du Conseil du 15 mai 2014, les prestataires de services d'investissement autres que les sociétés de gestion de portefeuille ne peuvent percevoir une redevance, une commission ou un avantage non monétaire de la part de tiers pour l'exécution des ordres de leurs clients sur un lieu d'exécution donné ou pour la transmission des ordres de leurs clients à un tiers en vue de leur exécution sur un lieu d'exécution donné. » ;\n3° À l'article L. 549-2, après les mots : « l'article 27 », il est inséré le mot : « bis » ;\n4° Le premier alinéa de l'article L. 632-11 est remplacé par les dispositions suivantes :\n« Lorsque l'Autorité des marchés financiers reçoit des informations conformément à l'article 26 du règlement (UE) n° 600 / 2014 du Parlement européen et du Conseil du 15 mai 2014 ou à l'article L. 533-9, elle les transmet :\n« a) À l'autorité compétente du marché le plus pertinent en termes de liquidité pour l'instrument financier considéré, lorsque ce marché est situé dans un autre État membre de l'Union européenne ou dans un autre État partie à l'accord sur l'Espace économique européen ;\n« b) Aux autorités compétentes chargées de la surveillance des entreprises d'investissement émettrices ;\n« c) Aux autorités compétentes chargées de la surveillance des succursales qui ont participé à la transaction ;\n« d) À l'autorité compétente chargée de la surveillance des plates-formes de négociation utilisées » ;\n5° Dans le tableau du I des articles L. 773-30, L. 774-30 et L. 775-24 :\na) La ligne :\n«\nL. 533-12-1 à L. 533-12-4\nl'ordonnance n° 2017-1107 du 22 juin 2017\n»\nest remplacée par les deux lignes suivantes :\n«\nL. 533-12-1 à L. 533-12-3\nl'ordonnance n° 2017-1107 du 22 juin 2017\nL. 533-12-4\nla loi n° du\n» ;\nb) La ligne :\n«\nL. 533-16 à L. 533-18-1\nl'ordonnance n° 2017-1107 du 22 juin 2017\n»\nest remplacée par les trois lignes suivantes :\n«\nL. 533-16 et L. 533-17\nl'ordonnance n° 2017-1107 du 22 juin 2017\nL. 533-18\nla loi n° du\nL. 533-18-1\nl'ordonnance n° 2017-1107 du 22 juin 2017\n» ;\n6° Le tableau des articles L. 773-39 et L. 775-33 :\n«\nL. 549-1 et L. 549-2\nla loi n° 2021-1308 du 8 octobre 2021\n»\nest remplacé par le tableau suivant :\n«\nL. 549-1\nla loi n° 2021-1308 du 8 octobre 2021\nL. 549-2\nla loi n° du\n» ;\n7° Dans le tableau de l'article L. 774-39, les lignes :\n«\nL. 549-1\nl'ordonnance n° 2016-827 du 23 juin 2016\nL. 549-2\nl'ordonnance n° 2017-1107 du 22 juin 2017\nL. 549-3 à L. 549-10\nl'ordonnance n° 2016-827 du 23 juin 2016\nL. 549-11\nl'ordonnance n° 2017-1107 du 22 juin 2017\nL. 549-12 à L. 549-14\nl'ordonnance n° 2016-827 du 23 juin 2016\nL. 549-15 à l'exception de son III\nl'ordonnance n° 2017-1107 du 22 juin 2017\nL. 549-16\nl'ordonnance n° 2016-827 du 23 juin 2016\nL. 549-17\nl'ordonnance n° 2017-1107 du 22 juin 2017\nL. 549-18 à L. 549-23\nl'ordonnance n° 2016-827 du 23 juin 2016\n»\nsont remplacées par les deux lignes suivantes :\n«\nL. 549-1\nla loi n° 2021-1308 du 8 octobre 2021\nL. 549-2\nla loi n° du\n».\nII.-Dans les conditions prévues à l'article 38 de la Constitution, le Gouvernement est habilité à prendre par voie d'ordonnance, dans un délai de neuf mois à compter de la promulgation de la présente loi, toute mesure relevant du domaine de la loi pour :\n1° Modifier les dispositions du code de commerce, du code monétaire et financier, du code des assurances et, le cas échéant, d'autres codes ou lois afin d'assurer la transposition de la directive (UE) 2023 / 2864 du 13 décembre 2023 du Parlement européen et du Conseil modifiant certaines directives en ce qui concerne l'établissement et le fonctionnement du point d'accès unique européen ;\n2° Adapter les dispositions du code de commerce, du code monétaire et financier, du code des assurances et, le cas échéant, d'autres codes ou lois pour assurer leur cohérence avec le règlement (UE) 2023 / 2859 du Parlement européen et du Conseil du 13 décembre 2023 établissant un point d'accès unique européen fournissant un accès centralisé aux informations publiées utiles pour les services financiers, les marchés de capitaux et la durabilité et avec le règlement (UE) 2023 / 2869 du Parlement européen et du Conseil du 13 décembre 2023 modifiant certains règlements en ce qui concerne l'établissement et le fonctionnement du point d'accès unique européen ;\n3° Étendre à la Nouvelle-Calédonie, à la Polynésie française et aux îles Wallis et Futuna, avec les adaptations nécessaires, les dispositions prises sur le fondement du 1° et 2° du II du présent article, pour celles qui relèvent de la compétence de l'État, et prévoir, le cas échéant, les adaptations nécessaires en ce qui concerne Saint-Barthélemy, Saint-Martin et Saint-Pierre-et-Miquelon.\nUn projet de loi de ratification est déposé devant le Parlement dans un délai de trois mois à compter de la publication de l'ordonnance mentionnée au premier alinéa du II du présent article.\nIII.-Le chapitre unique du titre II du livre VI du code monétaire et financier est ainsi modifié :\n1° Le deuxième alinéa de l'article L. 621-8-4 est remplacé par les dispositions suivantes :\n« Afin de mener à bien ses missions au titre de ces textes, l'Autorité des marchés financiers est dotée :\n« a) Des pouvoirs de surveillance et d'enquête mentionnés à l'article 32 du règlement (UE) 2017 / 1129 du 14 juin 2017 ;\n« b) Des pouvoirs de surveillance et d'enquête mentionnés à l'article 45 du règlement (UE) 2023 / 2631 du 22 novembre 2023. » ;\n2° À la fin de l'article L. 621-13-9, il est ajouté l'alinéa suivant :\n« En cas de manquement au règlement (UE) 2023 / 2631 du 22 novembre 2023, l'Autorité des marchés financiers peut en outre exiger d'un émetteur, au sens de ce règlement, qu'il publie cette déclaration sur son site internet, conformément à l'article 45 dudit règlement. » ;\n3° L'article L. 621-14 est complété par un IV ainsi rédigé :\n« IV.-Lorsqu'un émetteur a fait l'objet d'une sanction pour avoir enfreint de manière grave et répétée le chapitre 2 du titre II ou les articles 18 ou 19 du règlement (UE) 2023 / 2631 du 22 novembre 2023, le collège peut, dès l'ouverture d'une nouvelle procédure de sanction, lui interdire d'émettre des obligations vertes européennes pour une période n'excédant pas un an. » ;\n4° Il est inséré après le d du III de l'article L. 621-15 du code monétaire et financier un e ainsi rédigé :\n« e) Pour les personnes physiques ou morales ayant enfreint les obligations qui leur incombent en vertu du titre II, chapitre 2 ou des articles 18 ou 19 du règlement (UE) 2023 / 2631 du 22 novembre 2023, l'interdiction d'émettre des obligations vertes européennes pour une période n'excédant pas un an. » ;\n5° La sous-section 7 est complétée par un article L. 621-20-11 ainsi rédigé :\n« Art. L. 621-20-11.-L'Autorité des marchés financiers est l'autorité compétente au sens de l'article 44 du règlement (UE) 2023 / 2631 du 22 novembre 2023 sur les obligations vertes européennes et la publication facultative d'informations pour les obligations commercialisées en tant qu'obligations durables sur le plan environnemental et pour les obligations liées à la durabilité. » ;\n6° Le I de l'article L. 712-7 est complété par un 7° bis ainsi rédigé :\n« 7° bis Le règlement (UE) 2023 / 2631 du 22 novembre 2023 sur les obligations vertes européennes et la publication facultative d'informations pour les obligations commercialisées en tant qu'obligations durables sur le plan environnemental et pour les obligations liées à la durabilité ; »\n7° Au tableau du I des articles L. 783-8, L. 784-8 et L. 785-7 :\na) La ligne :\n«\nL. 621-8 à L. 621-8-2, L. 621-8-4\nl'ordonnance n° 2019-1067 du 21 octobre 2019\n»\nest remplacée par les deux lignes suivantes :\n«\nL. 621-8 à L. 621-8-2\nl'ordonnance n° 2019-1067 du 21 octobre 2019\nL. 621-8-4\nla loi n° du\n» ;\nb) Les lignes :\n«\nL. 621-13-6, à l'exception de son III à L. 621-13-9\nl'ordonnance n° 2017-1107 du 22 juin 2017\nL. 621-14\nl'ordonnance n° 2019-738 du 17 juillet 2019\n»\nsont remplacées par les lignes suivantes :\n«\nL. 621-13-6, à l'exception de son III à L. 621-13-8\nl'ordonnance n° 2017-1107 du 22 juin 2017\nL. 621-13-9 et L. 621-14\nla loi n° du\n» ;\n8° Dans le tableau du I des articles L. 783-9, L. 784-9 et L. 785-8, la ligne :\n«\nL. 621-15 à l'exception du 9e alinéa du c, des 9e et 10e alinéas du d et du h de son II, du d de son III et du 3° de son III bis\nl'ordonnance n° 2019-738 du 17 juillet 2019\n»\nest remplacée par la ligne suivante :\n«\nL. 621-15 à l'exception du 9e alinéa du c, des 9e et 10e alinéas du d et du h de son II, du d de son III et du 3° de son III bis\nla loi n° du\n» ;\n9° Dans le tableau du I des articles L. 783-10, L. 784-10 et L. 785-9, après la ligne :\n«\nL. 621-20-6\nla loi n° 2017-1775 du 28 décembre 2017\n» ;\nest ajoutée la ligne suivante :\n«\nL. 621-20-11\nla loi n° du\n» ;\n10° Les dispositions du présent III entrent en vigueur le 21 décembre 2024.\nIV.-Le code monétaire et financier est ainsi modifié :\n1° L'article L. 211-7 est complété par l'alinéa suivant :\n« Les conditions et effets patrimoniaux des opérations sur des titres financiers inscrits au moyen d'une technologie des registres distribués dans les conditions fixées par le règlement (UE) 2022 / 858 mentionné à l'alinéa ci-dessus sont déterminés par la loi de l'État où est située l'entité autorisée pour opérer le système de règlement DLT ou, le cas échéant, le système de négociation et de règlement DLT. » ;\n2° L'article L. 211-38 est ainsi modifié :\na) Au premier alinéa du I, après les mots : « effets, créances, contrats », sont insérés les mots : «, actifs numériques » ;\nb) Le 1° du II est complété par les mots : « ou, s'agissant d'actifs numériques, par tout procédé informatique les identifiant comme étant l'objet d'une garantie financière en application du présent article » ;\n3° Après l'article L. 226-4, il est ajouté un article L. 226-5 ainsi rédigé :\n« Art. L. 226-5.-I.-Le nantissement d'actifs numériques est constitué, tant entre les parties qu'à l'égard des tiers, par une déclaration signée par le propriétaire des actifs numériques. Cette déclaration comporte les énonciations dont le contenu est fixé par le décret en Conseil d'État prévu au VI. Elle peut être signée au moyen d'un automate exécuteur de clauses dans des conditions fixées par ce même décret.\n« Les actifs numériques identifiés dans cette déclaration, ceux qui leur sont substitués ou les complètent en garantie de la créance initiale du créancier nanti, de quelque manière que ce soit, ainsi que, sauf convention contraire des parties, leurs fruits et produits composés d'actifs numériques ou, le cas échéant, de sommes en toute monnaie, y compris les fruits et produits découlant de l'immobilisation des actifs numériques nantis dans un système de négociation et de règlement DLT, sont compris dans l'assiette du nantissement. Les actifs numériques et leurs fruits et produits venant compléter le nantissement par voie de déclaration complémentaire, en garantie de la créance initiale du créancier nanti, sont soumis aux mêmes conditions que ceux mentionnés dans la déclaration initiale et sont considérés comme ayant été remis à la date de la déclaration initiale du nantissement.\n« Lorsqu'un prestataire du service mentionné au 1° de l'article L. 54-10-2 ou un prestataire de services sur crypto-actifs autorisé conformément à l'article 59 du règlement (UE) 2023 / 1114 du 31 mai 2023 sur les marchés de crypto-actifs assure la conservation des actifs numériques, le créancier nanti peut obtenir, sur simple demande auprès de celui-ci, une attestation de nantissement, comportant l'inventaire des actifs numériques nantis à la date de délivrance de cette attestation.\n« II.-Lorsque les actifs numériques initialement nantis font l'objet de plusieurs nantissements successifs, le rang des créanciers est réglé, en lien avec chaque actif numérique, par l'ordre de leur déclaration initiale. Dans ce cas, le constituant ou le créancier nanti notifie successivement chacun des nantissements à tout prestataire du service mentionné au 1° de l'article L. 54-10-2 du code monétaire et financier ou au prestataire de services sur crypto-actifs autorisé conformément à l'article 59 du règlement (UE) 2023 / 1114 sur les marchés de crypto-actifs qui assure la conservation des actifs numériques nantis.\n« III.-Les fruits et produits mentionnés au I composés de somme en toute monnaie sont, lorsqu'ils n'ont pas été exclus de l'assiette du nantissement par convention des parties, inscrits au crédit d'un compte de fruits et produits ouvert au nom du titulaire des actifs numériques nantis dans les livres d'un établissement de crédit. Cette inscription peut avoir lieu à tout moment. Les fruits et produits sont réputés faire partie intégrante de l'assiette du nantissement à la date de signature de la déclaration initiale de nantissement quelle que soit la date d'ouverture du compte de fruits et produits. Le créancier nanti peut obtenir, sur simple demande au teneur du compte de fruits et produits, une attestation comportant l'inventaire des sommes inscrites au crédit de ce compte à la date de la délivrance de cette attestation.\n« À défaut d'inscription au crédit d'un compte de fruits et produits à la date à laquelle la sûreté peut être réalisée, les fruits et produits sont exclus de l'assiette du nantissement.\n« IV.-Le créancier nanti définit avec le constituant les conditions dans lesquelles ce dernier peut disposer des actifs numériques et des sommes en toute monnaie compris dans l'assiette du nantissement. Le créancier nanti bénéficie en toute hypothèse, selon des modalités convenues par les parties, d'un droit de rétention sur ces actifs numériques et sur ces sommes.\n« V.-À défaut d'un autre délai préalablement convenu avec le constituant, le créancier nanti titulaire d'une créance certaine, liquide et exigible peut réaliser le nantissement huit jours après mise en demeure du débiteur, du constituant s'il n'est pas le débiteur et, le cas échéant, de tout prestataire de services mentionné aux 1° de l'article L. 54-10-2 du code monétaire et financier ou de tout prestataire de services sur crypto-actifs autorisé conformément à l'article 59 du règlement (UE) 2023 / 1114 sur les marchés de crypto-actifs assurant la conservation des actifs numériques nantis, ainsi que du teneur de compte de fruits et produits. La mise en demeure est réalisée par remise en mains propres, par courrier recommandé ou par toute autre modalité fixée par le décret en Conseil d'État prévu au VI.\n« Dans la limite du montant de la créance garantie et, le cas échéant, dans le respect de l'ordre indiqué par le constituant du nantissement, la réalisation du nantissement intervient :\n« 1° Pour les sommes en toute monnaie, directement par transfert en pleine propriété au créancier nanti ;\n« 2° Pour les actifs numériques, selon les modalités convenues entre le constituant et le créancier nanti. À défaut d'accord, les modalités de réalisation sont fixées par le décret en Conseil d'État mentionné au VI.\n« Le constituant du nantissement supporte tous les frais résultants de la réalisation du nantissement. Ces frais sont imputés sur le montant résultant de cette réalisation.\n« VI.-Un décret en Conseil d'État précise les modalités d'application du présent article. » ;\n4° À l'article L. 211-38, les mots : « actifs numériques » sont remplacés par les mots : « crypto-actifs » ;\n5° À l'article L. 226-5 :\na) Les mots : « actifs numériques » sont remplacés par le mot : « crypto-actifs » ;\nb) Les mots : « d'actifs numériques » sont remplacés par les mots : « de crypto-actifs » ;\nc) Au troisième alinéa, les mots : « prestataire du service mentionné au 1° de l'article L. 54-10-2 du code monétaire et financier ou un » sont supprimés ;\nd) Au quatrième alinéa, les mots : « mentionné au 1° de l'article L. 54-10-2 du code monétaire et financier ou un prestataire de services » sont supprimés ;\ne) Au huitième alinéa, les mots : « mentionné au 1° de l'article L. 54-10-2 du code monétaire et financier ou un prestataire de services » sont supprimés.\n6° Au tableau du I des articles L. 742-1, L. 743-1 et L. 744-1 :\na) La ligne :\n«\nL. 211-7\nla loi n° 2023-171 du 9 mars 2023 portant diverses dispositions d'adaptation au droit de l'Union européenne dans les domaines de l'économie, de la santé, du travail, des transports et de l'agriculture\n»\nest remplacée par la ligne suivante :\n«\nL. 211-7\nla loi n° du\n» ;\nb) La ligne :\n«\nL. 211-38\nla loi n° 2019-486 du 22 mai 2019\n»\nest remplacée par la ligne suivante :\n«\nL. 211-38\nla loi n° du\n» ;\n7° Au tableau du I des articles L. 742-13-1, L. 743-13-1 et L. 744-12-1, il est ajouté la ligne suivante :\n«\nL. 226-5\nla loi n° du\n» ;\n8° Les dispositions des 4° et 5° entrent en vigueur le 1er juillet 2026.", "amdt": false}]}, {"numero": 137, "vise": "ART. PREMIER", "dispositif": "I. – A l’alinéa 14, substituer au mot :\n\n« fixe »\n\nles mots :\n\n« détermine ».\n\nII. – En conséquence, au même alinéa 14, supprimer les mots :\n\n« et des collectivités territoriales ».\n\nIII. – En conséquence, audit alinéa 14, substituer aux mots :\n\n« pour participer à »\n\nles mots :\n\n« dans les académies volontaires, ainsi que les modalités de suivi et d’évaluation de ».\n\nIV. – En conséquence, à la fin du même alinéa 14, supprimer les mots :\n\n« ainsi que les modalités de suivi et d’évaluation de celle‑ci. »", "article": "PREMIER", "effet": [{"t": "=", "s": "I.-À titre expérimental, pour une durée de trois ans à compter de la promulgation de la présente loi, les établissements scolaires volontaires, identifiés conjointement par l'État et les collectivités territoriales compétentes, mettent en œuvre une éducation à l'alimentation adaptée au niveau d'enseignement.\nII.-À l'école primaire, cette éducation prend la forme d'un enseignement structuré obligatoire, intégré aux programmes existants.\nCette éducation à l'alimentation comprend au moins trois séances par an réalisées sur le temps scolaire pour l'ensemble des élèves. Pour les élèves demi-pensionnaires, ces séances peuvent être complétées par des actions articulées avec la restauration scolaire.\nElle mobilise des démarches pratiques telles que l'éducation sensorielle, les ateliers culinaires, la découverte de la saisonnalité et des caractéristiques des produits, la visite de producteurs locaux, la mise en place d'animations pédagogiques et participe aussi à la valorisation des métiers de l'alimentation et des métiers agricoles.\nIII.-Au collège, l'éducation à l'alimentation est incluse dans le parcours éducatif de santé prévu à l'article L. 541-1 du code de l'éducation.\nDans ce cadre, chaque établissement met en œuvre un projet annuel d'éducation à l'alimentation obligatoire, conçu en cohérence avec les trois axes du parcours éducatif de santé.\nCe projet est inscrit dans le projet d'établissement. Il est élaboré en concertation avec les comités d'éducation à la santé, à la citoyenneté et à l'environnement, les départements ainsi que, le cas échéant, les associations, les professionnels de santé et les professionnels du secteur de l'alimentation intéressés.\nIV.-Au lycée, l'éducation à l'alimentation prend la forme d'un module expérimental facultatif.\nCe module associe les régions et prend en compte l'offre de formations supérieures des filières concernées. Il mobilise, le cas échéant, les associations, les professionnels de santé et les professionnels du secteur de l'alimentation intéressés.\nIl peut donner lieu à des conventions avec les établissements d'enseignement supérieur, les organismes de formation professionnelle et les acteurs locaux de l'alimentation.\nV.-Dans l'ensemble des niveaux d'enseignement, cette éducation à l'alimentation vise à atteindre les objectifs mentionnés à l'article L. 121-6-1 du code de l'éducation et porte sur le contenu mentionné au deuxième alinéa de l'article L. 312-17-3 du même code.\nVI.-Les engagements respectifs de l'État, des collectivités territoriales compétentes en matière de restauration scolaire et des autres parties prenantes à l'expérimentation sont définis, dans chaque académie, par voie de convention.\nVII.-L'expérimentation prévue au présent article fait l'objet d'une première évaluation dix-huit mois après sa mise en œuvre. Une seconde évaluation est réalisée au terme de la période de trois ans mentionnée au I du présent article. Ces évaluations associent les élèves, les enseignants, les collectivités territoriales et les acteurs locaux et portent sur les impacts éducatifs, sanitaires, sociaux, environnementaux et territoriaux de l'expérimentation. Elles donnent chacune lieu à la publication d'un rapport détaillé transmis au Parlement.\nVIII.-Un décret", "amdt": false}, {"t": "-", "s": " fixe", "amdt": false}, {"t": "+", "s": " détermine", "amdt": false}, {"t": "=", "s": " les modalités d'application du présent article, notamment les conditions d'identification des établissements scolaires", "amdt": false}, {"t": "-", "s": " et des collectivités territoriales", "amdt": false}, {"t": "=", "s": " volontaires", "amdt": false}, {"t": "-", "s": " pour participer à l'expérimentation", "amdt": false}, {"t": "+", "s": " dans les académies volontaires,", "amdt": false}, {"t": "=", "s": " ainsi que les modalités de suivi et d'évaluation de", "amdt": true}, {"t": "-", "s": " celle-ci.", "amdt": false}, {"t": "+", "s": " l'expérimentation", "amdt": false}]}, {"numero": 138, "vise": "ART. 2", "dispositif": "Rédiger ainsi l’alinéa 3 :\n\n« Fin de vie provoquée ».", "article": "2", "effet": [{"t": "=", "s": "Après la section 2 du chapitre Ier du titre Ier du livre Ier de la première partie du code de la santé publique, est insérée une section 2 bis ainsi rédigée :\n« Section 2 bis\n", "amdt": false}, {"t": "=", "s": "«", "amdt": true}, {"t": "-", "s": " Droit à l'aide à mourir", "amdt": false}, {"t": "+", "s": " Fin de vie provoquée", "amdt": false}, {"t": "=", "s": "\n« Sous-section 1\n« Définition\n« Art. L. 1111-12-1.-I.-Le droit à l'aide à mourir consiste à autoriser et à accompagner une personne qui en a exprimé la demande à recourir à une substance létale, dans les conditions et selon les modalités prévues aux articles L. 1111-12-2 à L. 1111-12-7, afin qu'elle se l'administre ou se la fasse administrer par un médecin ou par un infirmier.\n« II.-Le droit à l'aide à mourir est un acte autorisé par la loi au sens de l'article 122-4 du code pénal. »", "amdt": false}]}, {"numero": 139, "vise": "APRÈS ART. 18", "dispositif": "Après l’article L. 247 du livre des procédures fiscales, il est inséré un article L. 247‑00 A ainsi rédigé :\n\n« Art. L. 247‑00 A. — À titre exceptionnel, l’administration peut accorder, à la demande du contribuable, des remises partielles portant tant sur le montant notifié à l’occasion du contrôle que sur les pénalités afférentes, de manière conjointe et à l’occasion d’une procédure unique prenant la forme d’un règlement d’ensemble et au moyen d’un imprimé dédié et obligatoire. La remise partielle consentie par l’administration ne peut excéder 35 % des droits appelés.\n\n« Le contribuable doit motiver sa demande de règlement d’ensemble et apporter des éléments concrets justifiant sa demande. L’administration fiscale doit motiver sa décision d’accorder un règlement d’ensemble.\n\n« L’administration ne peut avoir recours qu’en dernier ressort à cette procédure, lorsqu’il existe un doute raisonnable des difficultés à établir avec exactitude le quantum des rectifications ou un aléa juridique avéré particulièrement important.\n\n« Avant leur conclusion, les règlements d’ensemble doivent systématiquement faire l’objet d’un avis de la commission de conciliation du comité du contentieux fiscal, douanier et des changes défini à l’article 460 du code des douanes. »", "article": "18 BIS", "effet": [{"t": "+", "s": "Après l'article L. 247 du livre des procédures fiscales, il est inséré un article L. 247-00 A ainsi rédigé :\n« Art. L. 247-00 A.-À titre exceptionnel, l'administration peut accorder, à la demande du contribuable, des remises partielles portant tant sur le montant notifié à l'occasion du contrôle que sur les pénalités afférentes, de manière conjointe et à l'occasion d'une procédure unique prenant la forme d'un règlement d'ensemble et au moyen d'un imprimé dédié et obligatoire. La remise partielle consentie par l'administration ne peut excéder 35 % des droits appelés.\n« Le contribuable doit motiver sa demande de règlement d'ensemble et apporter des éléments concrets justifiant sa demande. L'administration fiscale doit motiver sa décision d'accorder un règlement d'ensemble.\n« L'administration ne peut avoir recours qu'en dernier ressort à cette procédure, lorsqu'il existe un doute raisonnable des difficultés à établir avec exactitude le quantum des rectifications ou un aléa juridique avéré particulièrement important.\n« Avant leur conclusion, les règlements d'ensemble doivent systématiquement faire l'objet d'un avis de la commission de conciliation du comité du contentieux fiscal, douanier et des changes défini à l'article 460 du code des douanes. »", "amdt": false}]}, {"numero": 140, "vise": "ART. 30", "dispositif": "Substituer à l’alinéa 41 les quinze alinéas suivants :\n\n« 28° L’article L. 4433‑17 est ainsi modifié :\n\n« a) Le premier alinéa est ainsi modifié :\n\n« – à la première phrase, les mots : « , de Mayotte et de la Réunion » sont mot : « ils » ;\n28° ter Le premier alinéa de l'article L. 4433-20 est ainsi modifié :\na) Les mots : «, de Mayotte et de la Réunion » sont remplacés par les mots : « et de la Réunion et le Département-Région de Mayotte » ;\nb) Le mot : « consultées » est remplacé par le mot : « consultés » ;\n28° quater Aux articles L. 4433-21 et L. 4433-23, les mots : «, de Mayotte et de la Réunion » sont remplacés par les mots : « et de la Réunion et le Département-Région de Mayotte » ;\n28° quinquies L'article L. 4433-22 est ainsi modifié :\na) Les mots : «, de Mayotte et de la Réunion » sont remplacés par les mots : « et de la Réunion et le Département-Région de Mayotte » ;\nb) Le mot : « elles » est remplacé par le mot : « ils", "amdt": false}, {"t": "=", "s": " » ;", "amdt": true}, {"t": "=", "s": "\n29° L'article L. 4433-24 est ainsi modifié :\na) Les mots : «, de Mayotte » sont supprimés ;\nb) Il est ajouté un alinéa ainsi rédigé :\n« Dans le Département-Région de Mayotte, la répartition des aides de l'État en faveur de l'habitat est arrêtée, après avis du conseil territorial de l'habitat, par le représentant de l'État. » ;\n30° Au premier alinéa de l'article L. 4433-27, les mots : « Mayotte et de la Réunion » sont remplacés par les mots : « La Réunion et le Département-Région de Mayotte » et le mot : « elles » est remplacé par le mot : « ils » ;\n31° L'article L. 4433-28 est ainsi modifié :\na) Au premier alinéa, les mots : «, de Mayotte et de la Réunion est tenu informé » sont remplacés par les mots : « et de La Réunion et l'assemblée de Mayotte sont tenus informés » ;\nb) Au deuxième alinéa, les mots : « au conseil régional » sont remplacés par les mots : « aux conseils régionaux de Guadeloupe et de La Réunion et à l'assemblée de Mayotte, » ;\n32° À l'article L. 4433-31, les mots : « Mayotte et de la Réunion » sont remplacés par les mots : « La Réunion et le Département-Région de Mayotte » et le mot : « elles » est remplacé par le mot : « ils » ;\n33° À la première phrase du premier alinéa du D de l'article L. 4434-3 et à la première phrase du dernier alinéa de l'article L. 4434-4, les mots : « Mayotte et de La Réunion » sont remplacés par les mots : « La Réunion et dans le Département-Région de Mayotte » ;\n34° L'article L. 5831-2 est ainsi modifié :\na) Au 1°, le mot : « Département » est remplacé par le mot : « Département-Région » ;\nb) À la fin du 2°, les mots : « au conseil général » sont remplacés par les mots : « à l'assemblée de Mayotte » ;\n35° Après le livre II de la septième partie, dans sa rédaction résultant de la loi organique n° du relative au Département-Région de Mayotte, le livre III est ainsi rétabli :\n« LIVRE III\n« DÉPARTEMENT-RÉGION DE MAYOTTE\n« TITRE IER\n« DISPOSITIONS GÉNÉRALES\n« CHAPITRE UNIQUE\n« Art. L. 7311-1.-Le Département-Région de Mayotte constitue une collectivité territoriale de la République régie par l'article 73 de la Constitution qui exerce les compétences dévolues aux départements et régions d'outre-mer.\n« Sous réserve des dispositions du présent livre, le Département-Région de Mayotte exerce les compétences que les lois attribuent aux régions ainsi que celles que définit le titre III du livre IV de la quatrième partie pour tenir compte des mesures d'adaptation rendues nécessaires par la situation particulière des régions d'outre-mer.\n« Sous réserve des dispositions du présent livre, le Département-Région de Mayotte exerce les compétences que les lois attribuent aux départements ainsi que celles que le titre IV du livre IV de la troisième partie attribue aux départements d'outre-mer.\n« Art. L. 7311-2.-Le Département-Région de Mayotte comprend la Grande-Terre, la Petite-Terre ainsi que les autres îles et îlots situés dans le récif les entourant.\n« Il fait partie de la République et ne peut cesser d'y appartenir sans le consentement de sa population.\n« Art. L. 7311-3.-Sous réserve des adaptations prévues au présent livre, le Département-Région de Mayotte est régi par les première, troisième et quatrième parties du présent code à l'exception des dispositions suivantes :\n« 1° Dans la troisième partie : les titres Ier et IV du livre III, les articles L. 3334-16, L. 3334-16-1, L. 3334-16-2, L. 3441-2 à L. 3441-7 et L. 3443-2 ;\n« 2° Dans la quatrième partie :\n« a) Le livre Ier ;\n« b) Au livre II : l'article L. 4221-2 et le titre III ;\n« c) Au livre III : les chapitres Ier et II du titre Ier, l'article L. 4313-1 et la seconde phrase du 9° de l'article L. 4313-2, le titre II, les chapitres Ier et III du titre III, la section 2 du chapitre II du même titre III ainsi que le 2° de l'article L. 4332-1 et le titre IV ;\n« d) Au livre IV : le chapitre Ier et les sections 1 et 2 du chapitre II du titre III, les articles L. 4433-4 à L. 4433-4-10, L. 4433-24-1, L. 4434-8 et L. 4434-9.\n« Art. L. 7311-4.-Pour l'application du présent code à Mayotte :\n« 1° La référence au département, au département d'outre-mer, à la région ou à la région d'outre-mer est remplacée par la référence au Département-Région de Mayotte ;\n« 2° La référence au conseil régional ou au conseil départemental est remplacée par la référence à l'assemblée de Mayotte ;\n« 3° La référence au président du conseil régional ou au président du conseil départemental est remplacée par la référence au président de l'assemblée de Mayotte ;\n« 4° La référence aux conseillers régionaux ou aux conseillers départementaux est remplacée par la référence aux conseillers à l'assemblée de Mayotte ;\n« 5° La référence au conseil économique, social et environnemental régional est remplacée par la référence au conseil économique, social, environnemental, de la culture et de l'éducation de Mayotte.\n« Art. L. 7311-5.-Le plan d'aménagement et de développement durable, élaboré sur le fondement des articles L. O. 6161-42 et L. O. 6161-43 dans leur rédaction en vigueur avant la publication de la loi organique n° 2010-1486 du 7 décembre 2010 relative au Département de Mayotte, et entré en vigueur le 22 juin 2009, est assimilé au schéma d'aménagement régional prévu aux articles L. 4433-7 à L. 4433-11.\n« Il est révisé dans les conditions prévues à l'article L. 4433-10.\n« TITRE II\n« ORGANISATION DU DÉPARTEMENT-RÉGION DE MAYOTTE\n« CHAPITRE Ier\n« ORGANES DU DÉPARTEMENT-RÉGION DE MAYOTTE\n« Section 1\n« Dispositions générales\n« Art. L. 7321-1.-Les organes du Département-Région de Mayotte comprennent l'assemblée de Mayotte et son président, assistés du conseil économique, social, environnemental, de la culture et de l'éducation de Mayotte.\n« Section 2\n« L'assemblée de Mayotte\n« Art. L. 7321-2.-La composition de l'assemblée de Mayotte et la durée du mandat des conseillers à l'assemblée de Mayotte sont déterminées par le chapitre Ier du titre II bis du livre VI bis du code électoral.\n« Section 3\n« Le conseil économique, social, environnemental, de la culture et de l'éducation de Mayotte\n« Sous-section 1\n« Dispositions générales\n« Art. L. 7321-3.-L'assemblée de Mayotte est assistée d'un conseil économique, social, environnemental, de la culture et de l'éducation de Mayotte.\n« Sous-section 2\n« Organisation et composition\n« Art. L. 7321-4.-Le conseil peut comprendre des sections dans des conditions fixées par décret en Conseil d'État.\n« Les sections peuvent émettre des avis. Le conseil se prononce sur les avis et rapports établis par les sections avant leur transmission à l'autorité compétente.\n« Art. L. 7321-5.-La composition du conseil, les conditions de nomination de ses membres ainsi que la date de son installation sont fixées par décret en Conseil d'État.\n« Lorsqu'un organisme est appelé à désigner plus d'un membre du conseil, il procède à ces désignations de telle sorte que l'écart entre le nombre des hommes désignés, d'une part, et des femmes désignées, d'autre part, ne soit pas supérieur à un. La même règle s'applique à la désignation des personnalités qualifiées.\n« Les conseillers à l'assemblée de Mayotte ne peuvent être membres du conseil.\n« Sous-section 3\n« Fonctionnement\n« Art. L. 7321-6.-Le conseil économique, social, environnemental, de la culture et de l'éducation de Mayotte établit son règlement intérieur.\n« Art. L. 7321-7.-Le conseil économique, social, environnemental, de la culture et de l'éducation de Mayotte élit en son sein au scrutin secret, dans les conditions prévues par son règlement intérieur, son président et les membres de sa commission permanente.\n« Art. L. 7321-8.-L'assemblée de Mayotte met à la disposition du conseil économique, social, environnemental, de la culture et de l'éducation de Mayotte les moyens nécessaires à son fonctionnement. Ces moyens permettent notamment d'assurer le secrétariat des séances du conseil et de ses sections et commissions. L'assemblée de Mayotte met également les services de la collectivité territoriale ou une partie de ceux-ci à la disposition du conseil économique, social, environnemental, de la culture et de l'éducation de Mayotte à titre permanent ou temporaire, notamment pour lui permettre de réaliser des études sur tout projet à caractère économique, social, environnemental, culturel, éducatif ou sportif de sa compétence.\n« Les crédits nécessaires au fonctionnement de chacun de ces conseils consultatifs et, le cas échéant, à la réalisation de leurs études font l'objet d'une inscription distincte au budget du Département-Région de Mayotte.\n« Ils sont notifiés chaque année, après le vote du budget, au président de ce conseil par le président de l'Assemblée de Mayotte.\n« Le président du conseil économique, social, environnemental, de la culture et de l'éducation de Mayotte organise et dirige les personnels et les services mis à la disposition du conseil.\n« Sous-section 4\n« Garanties et indemnités accordées aux membres du conseil\n« Art. L. 7321-9.-L'article L. 3123-1, les premier et dernier alinéas de l'article L. 3123-19 et l'article L. 3123-26 sont applicables au président, aux vice-présidents et aux membres du conseil économique, social, environnemental, de la culture et de l'éducation de Mayotte.\n« Art. L. 7321-10.-Les membres du conseil perçoivent, pour l'exercice effectif de leurs fonctions, une indemnité fixée par l'assemblée de Mayotte dans la limite d'un plafond mensuel déterminé par référence aux indemnités maximales prévues pour les conseillers à l'assemblée de Mayotte aux articles L. 3123-16 et L. 3123-17. Cette indemnité varie en fonction de la présence des membres aux réunions du conseil ou de ses formations et de leur participation à ses travaux.\n« Ils ont en outre droit au remboursement des frais supplémentaires pouvant résulter de l'exercice des mandats spéciaux dont ils sont chargés par leur conseil, dans les conditions prévues aux troisième et quatrième alinéas de l'article L. 3123-19.\n« Un décret en Conseil d'État définit les modalités d'application du premier alinéa du présent article.\n« Art. L. 7321-11.-Indépendamment des autorisations d'absence dont ils bénéficient en application de l'article L. 7321-9, le président, les vice-présidents et les membres du conseil ont droit à un crédit d'heures leur permettant de disposer du temps nécessaire à la préparation des réunions du conseil et des commissions dont ils font partie.\n« Ce crédit d'heures, forfaitaire et trimestriel, est fixé par référence à la durée hebdomadaire légale du travail.\n« Il est égal :\n« 1° À l'équivalent de deux fois cette durée pour le président et les vice-présidents ;\n« 2° À l'équivalent de 60 % de cette durée pour les membres du conseil.\n« En cas de travail à temps partiel, le crédit d'heures est réduit à due proportion.\n« Les heures non utilisées pendant un trimestre ne sont pas reportables.\n« L'employeur est tenu d'accorder aux membres du conseil, sur leur demande, l'autorisation d'utiliser le crédit d'heures prévu au présent article. Ce temps d'absence n'est pas payé par l'employeur.\n« Le temps d'absence utilisé en application de l'article L. 7321-9 et du présent article ne peut dépasser la moitié de la durée légale du travail pour une année civile. Il est assimilé à une durée de travail effective pour la détermination de la durée des congés payés et du droit aux prestations sociales ainsi qu'au regard de tous les droits découlant de l'ancienneté.\n« Art. L. 7321-12.-Le président, les vice-présidents et les membres du conseil ont droit à une formation adaptée à leurs fonctions. L'assemblée de Mayotte met à la disposition du conseil les moyens nécessaires à la prise en charge de leurs frais de déplacement, de séjour et d'enseignement, au titre des moyens de fonctionnement prévus à l'article L. 7321-8.\n« Les modalités d'application du présent article sont fixées par décret.\n« Section 4\n« Le conseil territorial de l'habitat\n« Art. L. 7321-13.-Dans le Département-Région de Mayotte, il est institué un conseil territorial de l'habitat composé, pour moitié au moins, de conseillers à l'assemblée de Mayotte.\n« Sa composition, ses modalités de fonctionnement et ses attributions sont précisées par décret en Conseil d'État.\n« CHAPITRE II\n« RÉGIME JURIDIQUE DES ACTES PRIS PAR LES AUTORITÉS DE LA COLLECTIVITÉ\n« Art. L. 7322-1.-Les décisions prises par le Département-Région de Mayotte en application de l'article L. 4433-15-1 du présent code et des articles L. 611-18 et L. 611-19 du code minier sont soumises à l'article L. 3131-1 du présent code.\n« TITRE III\n« ADMINISTRATION ET SERVICES DU DÉPARTEMENT-RÉGION DE MAYOTTE\n« CHAPITRE IER\n« COMPÉTENCES DU PRÉSIDENT DE L'ASSEMBLÉE DE MAYOTTE\n« Art. L. 7331-1.-Pour l'application à Mayotte de l'article L. 3221-3, les mots : “ des articles L. 2122-4 ou L. 4133-3 ” sont remplacés par les mots : “ de l'article L. 2122-4 ”.\n« CHAPITRE II\n« COMPÉTENCES DE L'ASSEMBLÉE DE MAYOTTE\n« Art. L. 7332-1.-L'assemblée de Mayotte peut créer des établissements publics dénommés agences, chargés d'assurer la réalisation des projets intéressant la collectivité ainsi que le fonctionnement des services publics territoriaux.\n« Art. L. 7332-2.-L'assemblée de Mayotte peut, de sa propre initiative ou saisie par le Premier ministre ou par le ministre chargé des outre-mer, adresser à celui-ci des propositions de modification ou d'adaptation des dispositions législatives ou réglementaires en vigueur ou en cours d'élaboration ainsi que toutes propositions relatives aux conditions du développement économique, social et culturel de la collectivité.\n« Elle peut également faire au Premier ministre toutes remarques ou suggestions concernant le fonctionnement des services publics de l'État dans la collectivité.\n« Le Premier ministre accuse réception dans les quinze jours et fixe le délai dans lequel il apportera une réponse au fond.\n« CHAPITRE III\n« COMPÉTENCES DU CONSEIL ÉCONOMIQUE, SOCIAL, ENVIRONNEMENTAL, DE LA CULTURE ET DE L'ÉDUCATION DE MAYOTTE\n« Art. L. 7333-1.-Le conseil économique, social, environnemental, de la culture et de l'éducation de Mayotte exerce ses compétences dans les conditions fixées au titre IV du livre II de la quatrième partie et à la section 2 du chapitre III du titre III du livre IV de la même quatrième partie, dans la mesure où elles ne sont pas contraires aux dispositions de la présente partie.\n« Il peut émettre un avis sur toute action ou tout projet du Département-Région, en matière économique ou sociale, dont il est saisi par le président de l'assemblée de Mayotte ou dont il décide de se saisir lui-même.\n« CHAPITRE IV\n« ATTRIBUTIONS DU DÉPARTEMENT-RÉGION DE MAYOTTE EN MATIÈRE DE COOPÉRATION RÉGIONALE\n« Art. L. 7334-1.-L'assemblée de Mayotte peut adresser au Gouvernement des propositions en vue de la conclusion d'engagements internationaux concernant la coopération régionale entre la République française et les États ou territoires de l'océan Indien ou les États ou territoires des continents voisins de l'océan Indien ou en vue de la conclusion d'accords avec des organismes régionaux des aires correspondantes, y compris des organismes régionaux dépendant des institutions des Nations unies.\n« Art. L. 7334-2.-L'assemblée de Mayotte est consultée sur les propositions d'actes de l'Union européenne qui concernent la collectivité par les soins du ministre chargé de l'outre-mer. Le second alinéa de l'article L. 4433-3-1 est applicable.\n« Elle peut adresser au Gouvernement des propositions pour l'application des traités sur l'Union européenne et sur le fonctionnement de l'Union européenne.\n« Art. L. 7334-3.-L'assemblée de Mayotte est saisie pour avis de tous projets d'accords concernant la coopération régionale en matière économique, sociale, technique, scientifique, culturelle, de sécurité civile ou d'environnement entre la République française et les États de l'océan Indien.\n« Elle se prononce à la première réunion qui suit sa saisine.\n« Art. L. 7334-4.-Dans les domaines de compétence de l'État, les autorités de la République peuvent délivrer pouvoir au président de l'assemblée de Mayotte pour négocier et signer des accords avec un ou plusieurs États ou territoires situés dans la zone de l'océan Indien ou sur les continents voisins de l'océan Indien, ou avec des organismes régionaux des aires correspondantes, y compris des organismes régionaux dépendant des institutions des Nations unies.\n« Dans le cas où il n'est pas fait application du premier alinéa, le président de l'assemblée de Mayotte peut être associé ou participer, au sein de la délégation française, aux négociations d'accords de même nature.\n« Le président de l'assemblée de Mayotte peut être chargé par les autorités de la République de les représenter au sein des organismes régionaux relevant des catégories mentionnées au premier alinéa. Les autorités de la République le munissent des instructions et pouvoirs nécessaires.\n« Art. L. 7334-5.-Dans les domaines de compétence de la collectivité, l'assemblée de Mayotte peut, par délibération, demander aux autorités de la République d'autoriser son président à négocier, dans le respect des engagements internationaux de la République, des accords avec un ou plusieurs États, territoires ou organismes régionaux définis à l'article L. 7334-4.\n« Lorsque cette autorisation est accordée, les autorités de la République sont, à leur demande, représentées à la négociation.\n« À l'issue de la négociation, le projet d'accord est soumis à la délibération de l'assemblée de Mayotte pour acceptation. Les autorités de la République peuvent ensuite donner, sous réserve du respect des engagements internationaux de celle-ci, pouvoir au président de l'assemblée de Mayotte aux fins de signature de l'accord.\n« Art. L. 7334-6.-Le Département-Région de Mayotte peut adhérer, en qualité de membre ou de membre associé, à une banque régionale de développement ou à une institution de financement dont la France est membre régional, membre associé ou participante au capital. Sur proposition de son président, l'assemblée de Mayotte peut demander aux autorités de la République d'autoriser son président à négocier et à signer tout instrument tendant à cette adhésion et à la participation au capital de cette banque ou institution de financement, dans les conditions prévues à l'article L. 7334-5.\n« Art. L. 7334-7.-Dans les domaines de compétence du Département-Région de Mayotte, le président de l'assemblée peut, pour la durée de l'exercice de ses fonctions, élaborer un programme cadre de coopération régionale précisant la nature, l'objet et la portée des engagements internationaux qu'il se propose de négocier, dans le respect des engagements internationaux de la République, avec un ou plusieurs États, territoires ou organismes régionaux mentionnés à l'article L. 7334-4.\n« Le président de l'assemblée soumet ce programme-cadre à la délibération de l'assemblée de Mayotte qui peut alors demander, dans la même délibération, aux autorités de la République d'autoriser son président à négocier les accords prévus dans ce programme-cadre.\n« Lorsque cette autorisation est expressément accordée, le président de l'assemblée peut engager les négociations prévues dans le programme-cadre. Il en informe les autorités de la République qui, à leur demande, sont représentées à la négociation.\n« Le président de l'assemblée soumet toute modification de son programme-cadre à la délibération de l'assemblée. Ces modifications sont approuvées par les autorités de la République, dans les mêmes conditions que la procédure initiale.\n« À l'issue de la négociation, le projet d'accord est soumis à la délibération de l'assemblée pour acceptation. Les autorités de la République peuvent ensuite donner, sous réserve du respect des engagements internationaux de celle-ci, pouvoir au président de l'assemblée aux fins de signature de l'accord.\n« Art. L. 7334-8.-Les accords internationaux portant à la fois sur des domaines de compétence de l'État et sur des domaines de compétence du Département-Région de Mayotte sont, dans les cas où il n'est pas fait application du premier alinéa des articles L. 7334-4 et L. 7334-7, négociés et signés par les autorités de la République. À sa demande, le président de l'assemblée de Mayotte ou son représentant participe, au sein de la délégation française, à la négociation de ces accords.\n« Le président de l'assemblée de Mayotte, ou son représentant, participe, au sein de la délégation française, à sa demande, aux négociations avec l'Union européenne intéressant la collectivité.\n« Le président de l'assemblée de Mayotte peut demander à l'État de prendre l'initiative de négociations avec l'Union européenne en vue d'obtenir des mesures spécifiques utiles au développement de son territoire.\n« Art. L. 7334-9.-Le Département-Région de Mayotte peut, avec l'accord des autorités de la République, être membre associé des organismes régionaux, mentionnés au premier alinéa de l'article L. 3441-3, ou observateurs auprès de ceux-ci. L'assemblée de Mayotte peut saisir le Gouvernement de toutes propositions tendant à l'adhésion de la France à de tels organismes.\n« Art. L. 7334-10.-Le Département-Région de Mayotte peut, dans les conditions déterminées par une convention avec l'État, désigner des agents publics chargés de le représenter au sein des missions diplomatiques de la France.\n« Il offre aux agents publics mentionnés au premier alinéa un régime indemnitaire, des facilités de résidence et des remboursements de frais qui tiennent compte des conditions d'exercice de leurs fonctions. Les conditions d'application du présent alinéa sont précisées par décret en Conseil d'État.\n« Il peut instituer une représentation, à caractère non diplomatique, auprès des institutions de l'Union européenne. Il en informe le Gouvernement.\n« Art. L. 7334-11.-Le fonds de coopération régionale institué pour Mayotte est alimenté par des crédits de l'État et peut recevoir des dotations du Département-Région de Mayotte, de toute autre collectivité publique et de tout organisme public.\n« Le comité de gestion du fonds de coopération régionale, placé auprès du représentant de l'État et composé paritairement de représentants de l'État et de représentants de l'assemblée de Mayotte, arrête la liste des opérations éligibles au fonds de coopération régionale ainsi que le taux de subvention applicable à chacune d'elles.\n« Un décret en Conseil d'État fixe les modalités d'application du présent article.\n« Art. L. 7334-12.-Des représentants de l'assemblée de Mayotte participent aux travaux de l'instance de concertation des politiques de coopération régionale dans la zone de l'océan Indien prévue au II de l'article L. 4433-4-7.\n« Art. L. 7334-13.-L'assemblée de Mayotte peut recourir aux sociétés d'économie mixte locales et aux sociétés d'économie mixte régies par la loi n° 46-860 du 30 avril 1946 tendant à l'établissement, au financement et à l'exécution de plans d'équipement et de développement des territoires relevant du ministère de la France d'outre-mer, pour la mise en œuvre des actions engagées dans le cadre des compétences qui lui sont dévolues en matière de coopération régionale.\n« Art. L. 7334-14.-Dans le Département-Région de Mayotte, il est créé une commission de suivi de l'utilisation des fonds européens.\n« Coprésidée par le représentant de l'État et le président de l'assemblée de Mayotte, cette commission est en outre composée des parlementaires de la collectivité, d'un représentant du conseil économique, social, environnemental, de la culture et de l'éducation de Mayotte, d'un représentant de l'association des maires, de représentants des chambres consulaires et de représentants des services techniques de l'État.\n« Cette commission établit un rapport semestriel sur la consommation des crédits.\n« TITRE IV\n« SERVICES PUBLICS LOCAUX\n« CHAPITRE UNIQUE\n« SERVICES D'INCENDIE ET DE SECOURS\n« Art. L. 7341-1.-Les articles L. 1424-1 à L. 1424-13, L. 1424-17 à L. 1424-19, L. 1424-22, L. 1424-24 à L. 1424-44, L. 1424-46 et L. 1424-48 à L. 1424-50 sont applicables à Mayotte, sous réserve des adaptations suivantes :\n« 1° La seconde phrase du dernier alinéa de l'article L. 1424-12 est supprimée ;\n« 2° L'article L. 1424-13 est ainsi rédigé :\n« “ Art. L. 1424-13.-À la date de la première réunion du conseil d'administration du service départemental d'incendie et de secours, les agents du Département de Mayotte qui relèvent des cadres d'emplois de sapeurs-pompiers professionnels, les sapeurs-pompiers volontaires ainsi que les personnels administratifs, techniques et spécialisés de la fonction publique territoriale, qui exercent leurs fonctions au service d'incendie et de secours du conseil général de Mayotte, sont réputés relever du service départemental d'incendie et de secours, dans les conditions de statut et d'emploi qui sont les leurs.\n« “ À la date de la première réunion du conseil d'administration du service départemental d'incendie et de secours, il est mis fin de plein droit aux fonctions des agents occupant les emplois de directeur et de directeur adjoint du service d'incendie et de secours du conseil général de Mayotte. ” ;\n« 3° Les trois premiers alinéas de l'article L. 1424-17 sont ainsi rédigés :\n« “ Les biens affectés par l'assemblée de Mayotte au fonctionnement du service d'incendie et de secours de Mayotte et nécessaires au fonctionnement du service départemental d'incendie et de secours sont mis à la disposition de celui-ci, à titre gratuit, à compter de la date fixée par une convention, sous réserve de l'article L. 1424-19.\n« “ Cette convention conclue entre, d'une part, l'assemblée de Mayotte et, d'autre part, le service départemental d'incendie et de secours règle les modalités de la mise à disposition, qui doit intervenir dans le délai d'un an à compter de la première réunion du conseil d'administration du service départemental d'incendie et de secours.\n« “ À la date de la première réunion de son conseil d'administration, le service départemental d'incendie et de secours succède à l'assemblée de Mayotte dans ses droits et obligations en matière d'incendie et de secours. À ce titre, il lui est substitué dans les contrats de toute nature conclus pour l'aménagement, le fonctionnement, l'entretien ou la conservation des biens mis à sa disposition, ainsi que pour le fonctionnement des services. Cette substitution est notifiée par l'assemblée de Mayotte à ses cocontractants. ” ;\n« 4° L'article L. 1424-18 est ainsi modifié :\n« a) À la première phrase, les mots : “ la commune ou l'établissement public de coopération intercommunale ou ” sont supprimés ;\n« b) À la seconde phrase, les mots : “ de la commune, de l'établissement public de coopération intercommunale ou ” sont supprimés ;\n« 5° L'article L. 1424-22 est ainsi rédigé :\n« “ Art. L. 1424-22.-À défaut de signature de la convention prévue à l'article L. 1424-17 dans le délai fixé à ce même article, le représentant de l'État dans le département règle, dans un délai de six mois, la situation des biens mis à la disposition du service départemental d'incendie et de secours, après consultation du comité local mentionné à l'article L. 1711-3.\n« “ Sa décision est notifiée au président du conseil général et au président du conseil d'administration du service départemental d'incendie et de secours dans un délai d'un mois. ” ;\n« 6° Les cinquième à avant-dernier alinéas de l'article L. 1424-35 sont ainsi rédigés :\n« “ À compter de 2015, le montant prévisionnel des contributions mentionnées au quatrième alinéa, arrêté par le conseil d'administration du service départemental d'incendie et de secours, est notifié aux maires et aux présidents des établissements publics de coopération intercommunale avant le 1er janvier de l'année en cause.\n« “ À compter de 2015, le montant global des contributions des communes et des établissements publics de coopération intercommunale tient compte des charges respectives de l'assemblée de Mayotte, des communes et des établissements publics de coopération intercommunale.\n« “ Pour l'exercice 2015, si aucune délibération n'est prise dans les conditions prévues au troisième alinéa, la contribution de chaque commune et de chaque établissement public de coopération intercommunale est calculée, dans des conditions fixées par décret, en fonction de l'importance de sa population, de son potentiel fiscal par habitant et de ses charges. ” ;\n« 7° L'article L. 1424-36 est ainsi rédigé :\n« “ Art. L. 1424-36.-Jusqu'à l'entrée en vigueur de la convention prévue à l'article L. 1424-17, le montant minimal des dépenses directes et indirectes relatives aux biens mentionnés à ce même article, à l'exclusion des contributions mentionnées à l'article L. 1424-35, réalisées chaque année par le Département-Région de Mayotte est fixé par une convention passée entre le service départemental d'incendie et de secours, d'une part, et le conseil général de Mayotte, d'autre part.\n« “ À défaut de convention et jusqu'à l'entrée en vigueur de celle prévue à l'article L. 1424-17, le montant minimal des dépenses mentionnées au premier alinéa du présent article est fixé par le conseil d'administration du service départemental d'incendie et de secours en tenant compte des charges respectives du Département-Région de Mayotte et des communes. ” ;\n« 8° Au premier alinéa de l'article L. 1424-41, les mots : “ au 1er janvier 1996 ” sont remplacés par les mots : “ à la date de la première réunion du conseil d'administration du service départemental d'incendie et de secours ” ;\n« 9° À la fin du premier alinéa de l'article L. 1424-44, les mots : “ dans un délai de cinq ans à compter de la promulgation de la loi n° 96-369 du 3 mai 1996 relative aux services d'incendie et de secours ” sont supprimés ;\n« 10° L'article L. 1424-46 est ainsi rédigé :\n« “ Art. L. 1424-46.-Il est créé une commission de préfiguration comprenant :\n« “ 1° Le représentant de l'État à Mayotte ou son représentant ;\n« “ 2° Le directeur régional des finances publiques de Mayotte ou son représentant ;\n« “ 3° Le directeur du service d'incendie et de secours de Mayotte ou son représentant ;\n« “ 4° Le président du conseil général ou son représentant ;\n« “ 5° Neuf conseillers généraux ou leurs représentants, désignés par le président du conseil général ;\n« “ 6° Six maires ou leurs représentants, désignés par une association représentative de l'ensemble des maires de Mayotte ;\n« “ 7° Un sapeur-pompier représentant les sapeurs-pompiers professionnels ;\n« “ 8° Un sapeur-pompier représentant les sapeurs-pompiers volontaires.\n« “ Cette commission est présidée par le représentant de l'État à Mayotte ou son représentant ; il fixe, par arrêté, ses modalités d'organisation et de fonctionnement.\n« “ La commission est chargée de :\n« “ a) Préparer la convention de mise à disposition des biens mentionnée à l'article L. 1424-17 ;\n« “ b) Délibérer, dans le respect des conditions prévues à l'article L. 1424-24-1, sur le nombre et la répartition des sièges au sein du conseil d'administration du service départemental d'incendie et de secours entre le département, les communes et les établissements publics de coopération intercommunale, le cas échéant.\n« “ Le président de la commission fixe, par arrêté, la répartition des sièges, au vu de la délibération mentionnée au b.\n« “ La commission exerce ses missions jusqu'à l'élection des membres du conseil d'administration du service départemental d'incendie et de secours.\n« “ Par dérogation à l'article L. 1424-24-2, l'élection des membres du conseil d'administration du service départemental d'incendie et de secours se déroule dans les quatre mois suivant le premier renouvellement général des conseils municipaux à compter de la promulgation de la loi n° 2013-1029 du 15 novembre 2013 portant diverses dispositions relatives aux outre-mer. La première réunion du conseil d'administration intervient dans le même délai.\n« “ Jusqu'à la première réunion du conseil d'administration du service départemental d'incendie et de secours, élu dans les conditions prévues au présent article, le fonctionnement du service d'incendie et de secours demeure régi par les articles L. O. 6161-27 à L. 6161-41. ” ;\n« 11° L'article L. 1424-48 est ainsi rédigé :\n« “ Art. L. 1424-48.-À la date de la première réunion de son conseil d'administration, le service départemental d'incendie et de secours est substitué de plein droit au service d'incendie et de secours du conseil général de Mayotte, mentionné à l'article L. O. 6161-27. ”\n« TITRE V\n« FINANCES DE LA COLLECTIVITÉ\n« Art. L. 7350-1.-Le livre VI de la première partie est applicable au Département-Région de Mayotte, dans la mesure où il n'est pas contraire au présent titre.\n« Art. L. 7350-2.-Préalablement aux débats sur le projet de budget, le président de l'assemblée de Mayotte présente un rapport sur la situation en matière de développement durable intéressant le fonctionnement du Département-Région de Mayotte, les politiques qu'il mène sur son territoire et les orientations et programmes de nature à améliorer cette situation et à contribuer à l'atteinte des objectifs de développement durable inscrits au pro
