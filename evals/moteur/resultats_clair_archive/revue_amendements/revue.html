 Art. L. 5312-16.-Pour l'accomplissement de leur mission de lutte contre la fraude, les agents chargés de la prévention des fraudes agréés et assermentés mentionnés à l'article L. 5312-13-1 peuvent interroger les services du ministre chargé des affaires étrangères tenant le registre mentionné à l'article L. 12 du code électoral, aux seules fins de contrôler le respect de la condition de résidence en France, dès lors que les allocations mentionnées à l'article L. 5421-2 du présent code sont soumises à une telle condition.\n« Art. L. 5312-17.-Pour l'accomplissement de leur mission de lutte contre la fraude, les agents chargés de la prévention des fraudes agréés et assermentés mentionnés à l'article L. 5312-13-1 sont autorisés à traiter, en application de l'article 49 du règlement (UE) 2016 / 679 du Parlement européen et du Conseil du 27 avril 2016, relatif à la protection des personnes physiques à l'égard du traitement des données à caractère personnel et à la libre circulation de ces données, et abrogeant la directive 95 / 46 / CE (règlement général sur la protection des données), et dans le respect de la loi n° 78-17 du 6 janvier 1978 relative à l'informatique, aux fichiers et aux libertés, les données de connexion des bénéficiaires dont ils disposent, aux seules fins de contrôler le respect de la condition de résidence en France, dès lors que les allocations mentionnées à l'article L. 5421-2 du présent code sont soumises à une telle condition.\n« Art. L. 5312-18.-Les modalités d'application des articles L. 5312-15 à L. 5312-17 sont", "amdt": false}, {"t": "-", "s": " fixées", "amdt": false}, {"t": "+", "s": " définies", "amdt": false}, {"t": "=", "s": " par décret en Conseil d'État, pris après avis de la Commission nationale de l'informatique et des libertés.\n« Art. L. 5312-19.-Lorsque les agents chargés de la prévention des fraudes agréés et assermentés mentionnés à l'article L. 5312-13-1 réunissent plusieurs indices sérieux de manœuvres frauduleuses, de manquement délibéré à ses obligations ou de commission d'infractions de la part d'un bénéficiaire d'une des allocations mentionnées à l'article L. 5421-2, le directeur général de France Travail peut procéder à la suspension conservatoire de tous paiements au titre de ladite allocation.\n« Cette décision motivée est immédiatement notifiée à l'intéressé. Elle précise les voies et délais de recours, ainsi que la possibilité pour l'intéressé de présenter, lors d'un débat contradictoire tenu à sa demande, dans un délai de deux semaines à compter de ladite notification, des éléments de nature à rétablir le versement de l'allocation.\n« La durée de la mesure de suspension ne peut excéder trois mois à compter de sa notification.\n« Un décret en Conseil d'État détermine les modalités d'application du présent article, et notamment les garanties de respect du contradictoire dont dispose le bénéficiaire dont le paiement de l'allocation est suspendu. »", "amdt": false}]}, {"numero": 7, "vise": "ART. 7", "dispositif": "I. – Au début de l’alinéa 2, supprimer les mots :\n\n« Avec le médecin ou l’infirmier chargé de l’accompagner en application du second alinéa du V de l’article L. 1111‑12‑4, ».\n\nII. – En conséquence, au même alinéa 2, substituer aux mots :\n\n« convient de »\n\nle mot :\n\n« choisit ».", "article": "7", "effet": [{"t": "=", "s": "La sous-section 3 de la section 2 bis du chapitre Ier du titre Ier du livre Ier de la première partie du code de la santé publique, telle qu'elle résulte des articles 5 et 6 de la présente loi, est complétée par un article L. 1111-12-5 ainsi rédigé :\n« Art. L. 1111-12-5.-I.-", "amdt": false}, {"t": "-", "s": "Avec le médecin ou l'infirmier chargé de l'accompagner en application du second alinéa du V de l'article L. 1111-12-4,", "amdt": false}, {"t": "=", "s": " la personne", "amdt": false}, {"t": "-", "s": " convient de", "amdt": false}, {"t": "+", "s": " choisit", "amdt": false}, {"t": "=", "s": " la date à laquelle elle souhaite procéder à l'administration de la substance létale.\n« Si la date retenue est postérieure de plus d'un an à la notification de la décision mentionnée au III du même article L. 1111-12-4, le médecin mentionné à l'article L. 1111-12-3 évalue à nouveau, à l'approche de cette date, le caractère libre et éclairé de la manifestation de la volonté de la personne selon les modalités prévues au second alinéa du IV de l'article L. 1111-12-4.\n« II.-Dans des conditions convenues avec le médecin ou l'infirmier chargé de l'accompagner, l'administration de la substance létale peut être effectuée, à la demande de la personne, en dehors de son domicile.\n« La personne peut être entourée par les personnes de son choix pendant l'administration de la substance létale. »", "amdt": false}]}, {"numero": 8, "vise": "APRÈS ART. 3", "dispositif": "Le troisième alinéa de l’article 371-1 du code civil est complété par une phrase ainsi rédigée : « Lorsque les titulaires de l’autorité parentale ne respectent pas leurs obligations de façon répétée, le juge pour enfant peut les enjoindre à suivre un stage de responsabilité parentale. »", "article": "3 BIS", "effet": [{"t": "+", "s": "Le troisième alinéa de l'article 371-1 du code civil est complété par une phrase ainsi rédigée : « Lorsque les titulaires de l'autorité parentale ne respectent pas leurs obligations de façon répétée, le juge pour enfant peut les enjoindre à suivre un stage de responsabilité parentale. »", "amdt": false}]}, {"numero": 9, "vise": "ART. UNIQUE", "dispositif": "À l’alinéa 2, substituer aux mots :\n\n« déclaration auprès »\n\nle mot :\n\n« arrêté ».", "article": "UNIQUE", "effet": [{"t": "=", "s": "L'article L. 3332-2 du code de la santé publique est complété par un alinéa ainsi rédigé :\n« Par dérogation au premier alinéa, l'ouverture d'un nouvel établissement de 4e catégorie est autorisée, dans les conditions prévues à l'article L. 3332-3, par", "amdt": false}, {"t": "-", "s": " déclaration auprès", "amdt": false}, {"t": "+", "s": " arrêté", "amdt": false}, {"t": "=", "s": " du maire dans les communes de moins de 3 500 habitants ne disposant pas d'établissement de 4e catégorie. »", "amdt": false}]}, {"numero": 10, "vise": "ART. 10", "dispositif": "Après l’alinéa 8, insérer l’alinéa suivant :\n\n« Lorsqu’une entreprise ferroviaire estime ne plus être en mesure d’assurer durablement l’exploitation d’une desserte pertinente en matière d’aménagement du territoire, elle en informe l’État et la région concernés au moins douze mois avant la cessation envisagée du service, sauf circonstances exceptionnelles dûment justifiées. Durant ce délai, l’État, la région et les collectivités territoriales concernées peuvent engager avec l’entreprise ferroviaire toute concertation utile en vue d’assurer la continuité de la desserte, notamment par la conclusion d’un contrat de service public dans les conditions prévues par le règlement (CE) n° 1370/2007 du Parlement européen et du Conseil du 23 octobre 2007 relatif aux services publics de transport de voyageurs par chemin de fer et par route, et abrogeant les règlements (CEE) n° 1191/69 et (CEE) n° 1107/70 du Conseil. »", "article": "10", "effet": [{"t": "=", "s": "I.-Le livre Ier de la deuxième partie du code des transports est ainsi modifié :\n1° L'article L. 2111-25 est ainsi modifié :\na) À la troisième phrase du premier alinéa, le mot : « trois » est remplacé par le mot : « cinq » ;\nb) Le deuxième alinéa est remplacé par deux alinéas ainsi rédigés :\n« En vue d'inciter les services librement organisés de transport de voyageurs à assurer des dessertes ferroviaires pertinentes en matière d'aménagement du territoire, SNCF Réseau peut définir des segments de marché spécifiques pour les services assurant ces dessertes. Sur chacun de ces segments de marché, le niveau total des redevances ne peut pas dépasser le coût directement imputable à l'exploitation des services ferroviaires, sauf si le dépassement décidé, le cas échéant, par SNCF Réseau permet à une entreprise ferroviaire efficacement gérée de dégager un bénéfice raisonnable au titre de l'exploitation de ces services sur le segment de marché concerné. Toutefois, pour les dessertes ferroviaires pertinentes en matière d'aménagement du territoire qui ont pour objet d'assurer des arrêts intermédiaires, SNCF Réseau n'est pas tenu de définir un segment de marché spécifique et peut appliquer une modulation tarifaire.\n« Les segments de marché définis pour les services librement organisés de transport de voyageurs qui n'assurent pas une desserte ferroviaire pertinente en matière d'aménagement du territoire peuvent être soumis à des majorations de redevance dans la limite de la soutenabilité financière de ces majorations pour une entreprise ferroviaire efficacement gérée. » ;\n2° La section 3 du chapitre Ier du titre II est complétée par un article L. 2121-12-1 ainsi rédigé :\n« Art. L. 2121-12-1.-En cas de difficulté économique persistante dans l'exploitation d'une desserte pertinente en matière d'aménagement du territoire au titre d'un service librement organisé, l'entreprise ferroviaire en informe la région concernée, si la desserte est d'intérêt régional, ou l'État, si la desserte est d'intérêt national. La région lui indique si elle envisage de faire application de l'article L. 2121-4-2. L'État lui indique s'il envisage de faire application de l'article L. 2121-1-1", "amdt": false}, {"t": "+", "s": ".\n« Lorsqu'une entreprise ferroviaire estime ne plus être en mesure d'assurer durablement l'exploitation d'une desserte pertinente en matière d'aménagement du territoire, elle en informe l'État et la région concernés au moins douze mois avant la cessation envisagée du service, sauf circonstances exceptionnelles dûment justifiées. Durant ce délai, l'État, la région et les collectivités territoriales concernées peuvent engager avec l'entreprise ferroviaire toute concertation utile en vue d'assurer la continuité de la desserte, notamment par la conclusion d'un contrat de service public dans les conditions prévues par le règlement (CE) n° 1370 / 2007 du Parlement européen et du Conseil du 23 octobre 2007 relatif aux services publics de transport de voyageurs par chemin de fer et par route, et abrogeant les règlements (CEE) n° 1191 / 69 et (CEE) n° 1107 / 70 du Conseil", "amdt": false}, {"t": "=", "s": ".", "amdt": true}, {"t": "=", "s": "\n« Le document de référence du réseau précise les modalités selon lesquelles le gestionnaire d'infrastructure garantit le maintien d'un niveau de desserte conforme aux objectifs nationaux d'aménagement du territoire et d'égalité d'accès aux services de transport.\n« Constitue une desserte structurante toute desserte à grande vitesse assurant une fonction d'armature nationale, reliant régulièrement les grands pôles urbains, les villes moyennes et les territoires ruraux.\n« Le gestionnaire d'infrastructure veille à ce que les décisions d'allocation de capacité, les travaux programmés ou les évolutions d'offre n'entraînent pas une dégradation substantielle des dessertes structurantes, appréciée au regard de la fréquence, du temps de parcours, de la régularité et de l'accessibilité.\n« Toute modification substantielle d'une desserte à grande vitesse fait l'objet d'une évaluation territoriale préalable, analysant ses impacts socio-économiques et sa compatibilité avec les objectifs d'équité territoriale. Cette évaluation est transmise aux autorités organisatrices concernées et rendue publique. » ;\n3° Après l'article L. 2122-4-1, il est inséré un article L. 2122-4-1-1 A ainsi rédigé :\n« Art. L. 2122-4-1-1 A.-Lorsque les perturbations des circulations opérées par un opérateur ferroviaire qui lui sont directement imputables, notamment des retards répétés qui ne sont pas liés à une défaillance de l'infrastructure ferroviaire, perturbent de façon significative, durable et régulière les circulations opérées par les autres opérateurs, ou amènent ces derniers à prendre en charge régulièrement des voyageurs en application de l'article L. 2151-6 en nombre disproportionné par rapport aux capacités résiduelles de leur matériel roulant, le gestionnaire d'infrastructure peut retirer les capacités ferroviaires correspondant aux itinéraires concernés si l'opérateur n'est pas en mesure de démontrer sa capacité à résoudre ces difficultés dans un délai raisonnable et proportionné. » ;\n4° Après la première phrase du premier alinéa de l'article L. 2122-5, est insérée une phrase ainsi rédigée : « Le document de référence du réseau prend en compte notamment les enjeux d'aménagement du territoire en termes de transport ferroviaire de voyageurs et de fret ferroviaire et prévoit des dispositifs incitatifs à cet effet. » ;\n5° L'article L. 2122-6 est complété par deux phrases ainsi rédigées : « Le gestionnaire d'infrastructure peut prévoir, après avis conforme de l'Autorité de régulation des transports, dans des conditions transparentes et non discriminatoires, que les capacités faisant l'objet de l'accord-cadre comportent des dessertes ferroviaires pertinentes en matière d'aménagement du territoire. Si les capacités d'infrastructure ferroviaires disponibles ne permettent pas de satisfaire l'ensemble des demandes formulées par les candidats, le gestionnaire d'infrastructure peut tenir compte, dans la conclusion de l'accord-cadre, de critères relatifs aux enjeux d'aménagement du territoire. »\nII.-Par dérogation au 1° du I du présent article, les principes et montants des redevances perçues pour les horaires de service de 2027 à 2029 peuvent être fixés sur une période de trois ans et les principes et montants des redevances perçues pour les horaires de service de 2030 à 2033 peuvent être fixés sur une période de quatre ans.\nIII.-Les deuxième et troisième alinéas de l'article L. 2111-25 du code des transports, dans leur rédaction résultant du b du 1° du I, s'appliquent à compter de la première tarification pluriannuelle publiée après la promulgation de la présente loi.", "amdt": false}]}, {"numero": 11, "vise": "ART. 23", "dispositif": "Supprimer le mot : « étant ».", "article": "23", "effet": [{"t": "=", "s": "À Mayotte, par dérogation à l'article 5 de la loi n° 2014-173 du 21 février 2014 de programmation pour la ville et la cohésion urbaine et jusqu'au 1er janvier 2030, chaque commune est considérée comme", "amdt": false}, {"t": "-", "s": " étant", "amdt": false}, {"t": "=", "s": " un quartier prioritaire de la politique de la ville.", "amdt": false}]}, {"numero": 12, "vise": "ART. 5", "dispositif": "Après l’alinéa 7, insérer l’alinéa suivant :\n\n« Le médecin s’assure des capacités pleines entières de discernement de la personne tout au long de la procédure de l’aide à mourir. »", "article": "5", "effet": [{"t": "=", "s": "La section 2 bis du chapitre Ier du titre Ier du livre Ier de la première partie du code de la santé publique, telle qu'elle résulte de l'article 2 de la présente loi, est complétée par une sous-section 3 ainsi rédigée :\n« Sous-section 3\n« Procédure\n« Art. L. 1111-12-3.-I.-La personne qui souhaite accéder à l'aide à mourir en fait la demande expresse à un médecin en activité qui n'est ni son parent, ni son allié, ni son conjoint, ni son concubin, ni le partenaire auquel elle est liée par un pacte civil de solidarité, ni son ayant droit.\n« La personne ne peut pas présenter de demande lors d'une téléconsultation.\n« Une même personne ne peut présenter simultanément plusieurs demandes.\n« Le médecin demande à la personne si elle fait l'objet d'une mesure de protection juridique avec assistance ou représentation relative à la personne. Il vérifie ces informations en ayant accès au registre mentionné à l'article 427-1 du code civil. Le cas échéant, le médecin doit à la personne protégée une information loyale, claire et appropriée sur son état. Cette information est délivrée à la personne de manière appropriée et adaptée à ses facultés de discernement. Son consentement est systématiquement recherché. En cas de doute ou de conflit, le juge des tutelles ou le conseil de famille, s'il est constitué, peut être saisi.\n", "amdt": false}, {"t": "=", "s": "«", "amdt": true}, {"t": "+", "s": " Le médecin s'assure des capacités pleines entières de discernement de la personne tout au long de la procédure de l'aide à mourir.\n«", "amdt": false}, {"t": "=", "s": " II.-Le médecin mentionné au I du présent article :\n« 1° Informe la personne sur son état de santé, sur les perspectives d'évolution de celui-ci ainsi que sur les traitements et les dispositifs d'accompagnement disponibles ;\n« 2° Informe la personne qu'elle peut bénéficier de l'accompagnement et des soins palliatifs définis à l'article L. 1110-10 et s'assure, si la personne le souhaite, qu'elle y ait accès de manière effective ;\n« 3° Propose à la personne de l'orienter vers un psychologue ou un psychiatre ;\n« 4° Indique à la personne qu'elle peut renoncer, à tout moment, à sa demande ;\n« 5° Explique à la personne les conditions d'accès à l'aide à mourir et sa mise en œuvre. »", "amdt": false}]}, {"numero": 13, "vise": "APRÈS ART. 17", "dispositif": "Au dernier alinéa de l’article L. 162‑32‑3 du code de la sécurité sociale, le mot : « trois » est remplacé par le mot : « quatre ».", "article": "17 BIS", "effet": [{"t": "+", "s": "Au dernier alinéa de l'article L. 162-32-3 du code de la sécurité sociale, le mot : « trois » est remplacé par le mot : « quatre ».", "amdt": false}]}, {"numero": 14, "vise": "APRÈS ART. 5", "dispositif": "Après l’article L. 212‑1 du code de l’environnement, il est inséré un article L. 212‑1‑1 ainsi rédigé :\n\n« Art. L. 212‑1‑1. – I. – Les projets territoriaux de gestion de l’eau ont pour objet de mettre en œuvre une gestion concertée et intégrée des ressources en eau à l’échelle d’un bassin versant ou d’une unité hydrographique pertinente, en associant les collectivités territoriales, les usagers, les acteurs économiques et les services de l’État, conformément à la composition de la commission locale de l’eau précisée au II de l’article L. 212‑4.\n\n« II. – Ces projets visent notamment à :\n\n« 1° Définir des objectifs partagés de gestion équilibrée et durable de la ressource en eau ;\n\n« 2° Prévenir et gérer les conflits d’usage entre les différents usages de l’eau, notamment la consommation humaine, la préservation des milieux aquatiques, les activités agricoles et d’élevage, l’industrie, la production d’énergie, la navigation, la sécurité civile et les activités de loisir ;\n\n« 3° Promouvoir des mesures de sobriété et d’économie de la ressource ;\n\n« 4° Coordonner les actions de prévention des risques liés à l’eau, tels que les inondations et la sécheresse ;\n\n« 5° Favoriser la transparence et la participation des parties prenantes à la gouvernance locale de l’eau.\n\n« III. – Les projets territoriaux de gestion de l’eau sont élaborés dans le respect des schémas directeurs d’aménagement et de gestion des eaux définis à l’article L. 212‑1 ainsi que des schémas d’aménagement et de gestion des eaux mentionnés à l’article L. 212‑3.\n\n« IV. – L’État veille à la reconnaissance, à la promotion et au suivi des projets territoriaux de gestion de l’eau, dans le cadre de sa politique nationale de l’eau.\n\n« V. – Un décret en Conseil d’État précise les conditions d’application du présent article. »", "article": "5 BIS", "effet": [{"t": "+", "s": "Après l'article L. 212-1 du code de l'environnement, il est inséré un article L. 212-1-1 ainsi rédigé :\n« Art. L. 212-1-1.-I.-Les projets territoriaux de gestion de l'eau ont pour objet de mettre en œuvre une gestion concertée et intégrée des ressources en eau à l'échelle d'un bassin versant ou d'une unité hydrographique pertinente, en associant les collectivités territoriales, les usagers, les acteurs économiques et les services de l'État, conformément à la composition de la commission locale de l'eau précisée au II de l'article L. 212-4.\n« II.-Ces projets visent notamment à :\n« 1° Définir des objectifs partagés de gestion équilibrée et durable de la ressource en eau ;\n« 2° Prévenir et gérer les conflits d'usage entre les différents usages de l'eau, notamment la consommation humaine, la préservation des milieux aquatiques, les activités agricoles et d'élevage, l'industrie, la production d'énergie, la navigation, la sécurité civile et les activités de loisir ;\n« 3° Promouvoir des mesures de sobriété et d'économie de la ressource ;\n« 4° Coordonner les actions de prévention des risques liés à l'eau, tels que les inondations et la sécheresse ;\n« 5° Favoriser la transparence et la participation des parties prenantes à la gouvernance locale de l'eau.\n« III.-Les projets territoriaux de gestion de l'eau sont élaborés dans le respect des schémas directeurs d'aménagement et de gestion des eaux définis à l'article L. 212-1 ainsi que des schémas d'aménagement et de gestion des eaux mentionnés à l'article L. 212-3.\n« IV.-L'État veille à la reconnaissance, à la promotion et au suivi des projets territoriaux de gestion de l'eau, dans le cadre de sa politique nationale de l'eau.\n« V.-Un décret en Conseil d'État précise les conditions d'application du présent article. »", "amdt": false}]}, {"numero": 15, "vise": "ART. PREMIER", "dispositif": "À la deuxième phrase de l’alinéa 11, après le mot :\n\n« malade, »\n\ninsérer les mots :\n\n« en particulier à domicile si la personne le souhaite et ».", "article": "PREMIER", "effet": [{"t": "=", "s": "I.-Le code de la santé publique est ainsi modifié :\n1° Au dernier alinéa de l'article L. 1110-5-1, après le mot : « dispensant », sont insérés les mots : « l'accompagnement et » ;\n2° Au premier alinéa de l'article L. 1110-8, après les mots : « relève de », sont insérés les mots : « l'accompagnement et des » ;\n3° L'article L. 1110-10 est ainsi rédigé :\n« Art. L. 1110-10.-L'accompagnement et les soins palliatifs garantissent le droit fondamental à la protection de la santé mentionné à l'article L. 1110-1. Ils sont destinés aux personnes de tout âge en souffrance du fait de leur état de santé affecté par une ou par plusieurs maladies graves et, en particulier, aux personnes approchant de la fin de leur vie. Ils ont pour objet, à l'initiative et sous la conduite des médecins et des professionnels de l'équipe de soins, de garantir une prise en charge globale et de proximité de la personne malade afin de préserver sa dignité, son autonomie, sa qualité de vie et son bien-être. Ils sont accessibles sur l'ensemble du territoire national et leur répartition garantit un accès équitable aux personnes malades.\n« Ils sont adaptés à l'âge et aux besoins particuliers des personnes, notamment celles en situation de handicap.\n« Dans le respect de la volonté de la personne, ils comprennent la prévention, le dépistage précoce, l'évaluation et la prise en charge globale des problèmes physiques, y compris de la douleur et des autres symptômes pénibles, ainsi que la réponse aux affections psychologiques et aux besoins sociaux et spirituels.\n« Ils sont délivrés de façon précoce, active et continue tout au long du parcours de soins de la personne malade et soutiennent son entourage, y compris après son décès. Si nécessaire, ils sont proposés conjointement aux traitements curatifs agissant spécifiquement sur la maladie.\n« Ils sont prodigués de manière intégrée avec les soins de support et de confort.\n« L'accompagnement et les soins palliatifs ne visent ni à hâter, ni à différer la survenance de la mort.\n« L'accompagnement et les soins palliatifs sont pratiqués par une équipe pluridisciplinaire. Ils sont garantis quel que soit le lieu de résidence ou de soins de la personne malade,", "amdt": false}, {"t": "+", "s": " en particulier à domicile si la personne le souhaite et", "amdt": false}, {"t": "=", "s": " y compris dans les lieux de privation de liberté, selon des modalités adaptées. Ils comportent une information et un accompagnement pour la rédaction des directives anticipées définies à l'article L. 1111-11 et la désignation de la personne de confiance définie à l'article L. 1111-6. Les bénévoles mentionnés à l'article L. 1110-11 peuvent intervenir en appui de l'équipe pluridisciplinaire.\n« Les structures spécialisées dans la douleur chronique labellisées par les agences régionales de santé sont associées à l'accompagnement des malades prévu au présent article.\n« Dans les établissements publics de santé, un référent chargé de coordonner l'accès à l'accompagnement et aux soins palliatifs est nommé dans chaque service mentionné à l'article L. 6146-1. Ce référent exerce ces fonctions à titre bénévole.\n« Les tarifs des honoraires des professionnels de santé pour les missions réalisées dans le cadre du présent article ne peuvent donner lieu à dépassement. Tous les deux ans, les administrations de sécurité sociale publient un rapport évaluant l'état de la prise en charge financière des soins palliatifs et d'accompagnement, du recours aux subventions des fonds d'action sanitaire et sociale et du reste à charge pesant sur les ménages dans l'accompagnement de la fin de vie. » ;\n4° La troisième phrase du premier alinéa du I de l'article L. 1111-2 est remplacée par deux phrases ainsi rédigées : « Elle se voit remettre un livret d'information, accessible aux personnes en situation de handicap visuel ou auditif et disponible sous le format « facile à lire et à comprendre », sur ses droits en matière d'accompagnement et de soins palliatifs mentionnés à l'article L. 1110-10 ; elle est également informée de la possibilité de recevoir, lorsque son état de santé le permet, cet accompagnement et ces soins sous forme ambulatoire ou à domicile ainsi que de celle d'enregistrer ses directives anticipées mentionnées à l'article L. 1111-11 dans l'espace numérique de santé ou de les actualiser si nécessaire. Elle peut également bénéficier de l'accompagnement d'un professionnel de santé pour sa démarche. » ;\n5° À la dernière phrase du troisième alinéa de l'article L. 1111-4, après le mot : « dispensant », sont insérés les mots : « l'accompagnement et » ;\n6° L'article L. 1112-4 est ainsi modifié :\na) À la première phrase du premier alinéa, après le mot : « assurer », sont insérés les mots : « l'accompagnement et » ;\nb) À la première phrase de l'avant-dernier alinéa, après le mot : « requiert », sont insérés les mots : « un accompagnement et ».\nII.-Le code de l'action sociale et des familles est ainsi modifié :\n1° Au 5° de l'article L. 311-1, les mots : « de soins et d'accompagnement » sont remplacés par les mots : « d'accompagnement et de soins » ;\n2° L'avant-dernière phrase du premier alinéa de l'article L. 311-8 est ainsi modifiée :\na) Les mots : « des soins palliatifs » sont remplacés par les mots : « un accompagnement et des soins palliatifs mentionnés à l'article L. 1110-10 du code de la santé publique » ;\nb) Sont ajoutés les mots : « du présent code ».", "amdt": false}]}, {"numero": 16, "vise": "ART. 39", "dispositif": "Compléter cet article par les trois alinéas suivants :\n\n« V. – Au IV de l’article 42 de la loi n°2018 du 10 août 2018 pour un État au service d’une société de confiance, les mots : « des articles 9 à 12 » sont remplacés par les mots : « de l’article 11 » et après la troisième occurrence du mot : « administratives, », sont insérés les mots : « ainsi qu’à celles relatives aux exigences spécifiques à l’égard des systèmes d’information permettant des échanges d’informations par voie électronique avec le public et d’autres administrations mentionnées au troisième alinéa de l’article 16 de la loi n° du , ».\n\n« VI. – Au dernier alinéa de l’article 29‑4 de la loi n°90‑568 du 2 juillet 1990 relative à l’organisation du service public de la poste et à France Télécom, les mots : « des articles 9 à 12 » sont remplacés par les mots : « de l’article 11 » et après la troisième occurrence du mot : « administratives, », sont insérés les mots : « ainsi qu’à celles relatives aux exigences spécifiques à l’égard des systèmes d’information permettant des échanges d’informations par voie électronique avec le public et d’autres administrations mentionnées au troisième alinéa de l’article 16 de la loi n° du , ».\n\n« VII. – À l’article L. 212‑3 du code des relations entre le public et l’administration, les mots : « règles du référentiel général de sécurité mentionné au I de l’article 9 de l’ordonnance n° 2005‑1516 du 8 décembre 2005 relative aux échanges électroniques entre les usagers et les autorités administratives et entre les autorités administratives » sont remplacés par les mots : « exigences spécifiques à l’égard des systèmes d’information permettant des échanges d’informations par voie électronique avec le public et d’autres administrations mentionnées au troisième alinéa de l’article 16 de la loi n° du . »", "article": "39", "effet": [{"t": "=", "s": "I.-Le chapitre Ier du titre II du livre III de la deuxième partie du code de la défense est ainsi modifié :\n1° L'article L. 2321-2-1 est ainsi modifié :\na) Au premier alinéa, la première occurrence du mot : « ou » est remplacée par le signe : «, » et les mots : « à l'article 5 de la loi n° 2018-133 du 26 février 2018 portant diverses dispositions d'adaptation au droit de l'Union européenne dans le domaine de la sécurité » sont remplacés par les mots : « des entités essentielles au sens des articles 8 et 10 de la loi n° du relative à la résilience des infrastructures critiques et au renforcement de la cybersécurité » ;\nb) Au quatrième alinéa, la première occurrence du mot : « ou » est remplacée par le signe : «, » et les mots : « à l'article 5 de la loi n° 2018-133 du 26 février 2018 précitée » sont remplacés par les mots : « des entités essentielles au sens des articles 8 et 10 de la loi n° du précitée » ;\n2° L'article L. 2321-3 est ainsi modifié :\na) Au premier alinéa, les mots : « opérateurs mentionnés à l'article 5 de la loi n° 2018-133 du 26 février 2018 portant diverses dispositions d'adaptation au droit de l'Union européenne dans le domaine de la sécurité » sont remplacés par les mots : « entités essentielles au sens de la loi n° du relative à la résilience des infrastructures critiques et au renforcement de la cybersécurité » ;\nb) Au deuxième alinéa, la première occurrence du mot : « ou » est remplacée par le signe : «, » et les mots : « à l'article 5 de la loi n° 2018-133 du 26 février 2018 précitée » sont remplacés par les mots : « d'une entité essentielle au sens des articles 8 et 10 de la loi n° du précitée ».\nII.-Le code des postes et des communications électroniques est ainsi modifié :\n1° L'article L. 33-1 est ainsi modifié :\na) À la fin du a du I, les mots : « qui incluent des obligations de notification à l'autorité compétente des incidents de sécurité ayant eu un impact significatif sur leur fonctionnement » sont supprimés ;\nb) Après le q du même I, il est inséré un r ainsi rédigé :\n« r) Les prescriptions en matière de sécurité des systèmes d'information prévues par loi n° du relative à la résilience des infrastructures critiques et au renforcement de la cybersécurité. » ;\nc) À l'avant-dernier alinéa dudit I, les mots : « n ter et o » sont remplacés par les mots : « n ter, o et r » ;\nd) Après le 3° du VII, il est inséré un 4° ainsi rédigé :\n« 4° Les dispositions du r du I sont applicables en Polynésie française, dans les îles Wallis et Futuna et en Nouvelle-Calédonie dans leur rédaction issue de la loi n° du relative à la résilience des infrastructures critiques et au renforcement de la cybersécurité. » ;\n2° Après le deuxième alinéa de l'article L. 45, il est inséré un alinéa ainsi rédigé :\n« Chaque office d'enregistrement est responsable du fonctionnement technique du domaine de premier niveau qui lui est attribué, incluant notamment l'exploitation de ses serveurs de noms de domaine, la maintenance de ses bases de données d'enregistrement et la distribution des fichiers de zone du domaine de premier niveau sur les serveurs de noms de domaine, qu'il effectue lui-même ces opérations ou qu'elles soient sous-traitées. » ;\n3° Au deuxième alinéa de l'article L. 45-3, après le mot : « territoire », sont insérés les mots : « de l'un des États membres » ;\n4° L'article 45-4 est ainsi modifié :\na) La première phrase du premier alinéa est complétée par les mots : « ainsi que par les agents agissant pour le compte de ces derniers » ;\nb) À la seconde phrase du même premier alinéa, après le mot : « enregistrement », sont insérés les mots : « ni aux agents agissant pour le compte de ces derniers » ;\nc) Le dernier alinéa est complété par une phrase ainsi rédigée : « Les bureaux d'enregistrement sont responsables vis-à-vis de l'office d'enregistrement du respect de ces règles par les agents agissant pour leur compte. » ;\nd) Il est ajouté un alinéa ainsi rédigé :\n« Le décret en Conseil d'État prévu à l'article L. 45-7 précise les catégories d'agents pouvant agir pour le compte des bureaux d'enregistrement. » ;\n5° L'article L. 45-5 est ainsi modifié :\na) Le deuxième alinéa est ainsi rédigé :\n« Les offices d'enregistrement, par l'intermédiaire des bureaux d'enregistrement ainsi que des agents agissant pour le compte de ces derniers, collectent les données nécessaires à l'enregistrement des noms de domaine, notamment celles relatives à l'identification des personnes physiques ou morales titulaires de ces noms de domaine et des personnes chargées de leur gestion. Après l'enregistrement, et sans retard injustifié, les offices et les bureaux d'enregistrement rendent publiques, au moins quotidiennement, ces données dès lors qu'elles n'ont pas de caractère personnel. Ils tiennent ces bases de données à jour, en maintenant les données exactes et complètes, sans redondance de collecte, et sont responsables du traitement de ces données dans le respect de la loi n° 78-17 du 6 janvier 1978 relative à l'informatique, aux fichiers et aux libertés. » ;\nb) À la première phrase du dernier alinéa, après le mot : « inexactes », sont insérés les mots : « ou incomplètes » ;\nc) Sont ajoutés deux alinéas ainsi rédigés :\n« Les offices d'enregistrement et les bureaux d'enregistrement répondent aux demandes d'accès aux données d'enregistrement dans un délai n'excédant pas soixante-douze heures après réception de la demande.\n« Le décret en Conseil d'État prévu à l'article L. 45-7 fixe la liste des données d'enregistrement devant être collectées. » ;\n6° L'article L. 45-8 est complété par les mots : « dans leur rédaction issue de la loi n° du relative à la résilience des infrastructures critiques et au renforcement de la cybersécurité ».\nIII.-Le titre Ier de la loi n° 2018-133 du 26 février 2018 portant diverses dispositions d'adaptation au droit de l'Union européenne dans le domaine de la sécurité est abrogé.\nIV.-L'ordonnance n° 2005-1516 du 8 décembre 2005 relative aux échanges électroniques entre les usagers et les autorités administratives et entre les autorités administratives est ainsi modifiée :\n1° Les 2° et 3° du II de l'article 1er sont abrogés ;\n2° Les articles 9 et 12 sont abrogés ;\n3° Le I de l'article 14 est abrogé.", "amdt": false}, {"t": "+", "s": "\nV.-Au IV de l'article 42 de la loi n° 2018 du 10 août 2018 pour un État au service d'une société de confiance, les mots : « des articles 9 à 12 » sont remplacés par les mots : « de l'article 11 » et après la troisième occurrence du mot : « administratives, », sont insérés les mots : « ainsi qu'à celles relatives aux exigences spécifiques à l'égard des systèmes d'information permettant des échanges d'informations par voie électronique avec le public et d'autres administrations mentionnées au troisième alinéa de l'article 16 de la loi n° du, ».\nVI.-Au dernier alinéa de l'article 29-4 de la loi n° 90-568 du 2 juillet 1990 relative à l'organisation du service public de la poste et à France Télécom, les mots : « des articles 9 à 12 » sont remplacés par les mots : « de l'article 11 » et après la troisième occurrence du mot : « administratives, », sont insérés les mots : « ainsi qu'à celles relatives aux exigences spécifiques à l'égard des systèmes d'information permettant des échanges d'informations par voie électronique avec le public et d'autres administrations mentionnées au troisième alinéa de l'article 16 de la loi n° du, ».\nVII.-À l'article L. 212-3 du code des relations entre le public et l'administration, les mots : « règles du référentiel général de sécurité mentionné au I de l'article 9 de l'ordonnance n° 2005-1516 du 8 décembre 2005 relative aux échanges électroniques entre les usagers et les autorités administratives et entre les autorités administratives » sont remplacés par les mots : « exigences spécifiques à l'égard des systèmes d'information permettant des échanges d'informations par voie électronique avec le public et d'autres administrations mentionnées au troisième alinéa de l'article 16 de la loi n° du. »", "amdt": false}]}, {"numero": 17, "vise": "ART. PREMIER", "dispositif": "Compléter l’alinéa 7 par les mots :\n\n« de manière proportionnée, en tenant compte des entreprises de transformation alimentaire dont l’activité repose principalement sur des procédés traditionnels définis par voie réglementaire ainsi que de l’ampleur de leur production et de leurs pratiques de communication commerciale ».", "article": "PREMIER", "effet": [{"t": "=", "s": "Le code de la santé publique est ainsi modifié :\n1° Le chapitre III du titre III du livre Ier de la deuxième partie est complété par un article L. 2133-3 ainsi rédigé :\n« Art. L. 2133-3.-Les messages publicitaires et activités promotionnelles en faveur d'aliments ultra transformés au sens de l'article L. 3233-1 du code de la santé publique qui apparaissent, par leur caractère, leur présentation ou leur objet, comme principalement destinés aux mineurs sont interdits sur tout support de communication.\n« Pour les produits visés au premier alinéa, l'usage sur les emballages d'éléments graphiques ou textuels de nature à attirer l'attention des enfants est interdit. À titre transitoire, les produits conditionnés avant l'entrée en vigueur de la loi peuvent être mis sur le marché dans un délai de six mois.\n« Le premier alinéa ne s'applique pas aux aliments et boissons qui figurent sur une liste fixée par arrêté du ministre chargé de la santé, pris après avis de l'Agence nationale de sécurité sanitaire de l'alimentation, de l'environnement et du travail, compte tenu de leurs caractéristiques nutritionnelles adaptées aux besoins de l'enfant dans le cadre d'une alimentation équilibrée.\n« Le non-respect du présent article est puni de 30 000 € d'amende par diffusion illégale constatée, le montant de cette amende pouvant être porté à 30 % des dépenses consacrées à la publicité, sans préjudice des sanctions plus élevées prévues par le code de la communication audiovisuelle.\n« Les modalités d'application du présent article sont déterminées par décret", "amdt": false}, {"t": "+", "s": " de manière proportionnée, en tenant compte des entreprises de transformation alimentaire dont l'activité repose principalement sur des procédés traditionnels définis par voie réglementaire ainsi que de l'ampleur de leur production et de leurs pratiques de communication commerciale", "amdt": false}, {"t": "=", "s": ". » ;\n2° Le livre II bis de la troisième partie est complété par un chapitre III ainsi rédigé :\n« Chapitre III\n« Aliments ultra transformés\n« Art. L. 3233.-Un aliment ultra transformé s'entend de toute denrée alimentaire, au sens de l'article 2 du règlement (CE) n° 718 / 2002 du Parlement européen et du conseil du 28 janvier 2002 établissant les principes généraux et les prescriptions générales de la législation alimentaire, instituant l'Autorité européenne de sécurité des aliments et fixant des procédures relatives à la sécurité des denrées alimentaires, ayant subi un ou plusieurs procédés de transformation physico-chimiques ou technologiques ou contenant un ou plusieurs ingrédients dont la liste est établie par arrêté du ministère en charge de la santé sur proposition du Haut conseil de la Santé publique et de l'Institut national de la santé et de la recherche médicale. »", "amdt": false}]}, {"numero": 18, "vise": "ART. 28 TER", "dispositif": "I. – Rédiger ainsi l’alinéa 3 :\n\n« a) La seconde phrase est complétée par les mots : « , et, en cas de récidive, la déchéance du droit à l’ensemble des prestations versées par les organismes précédemment cités » ; »\n\nII. – En conséquence, supprimer l’alinéa 5.", "article": "28 TER", "effet": [{"t": "=", "s": "Le code de la sécurité sociale est ainsi modifié :\n1° L'article L. 114-12-3 est ainsi modifié :\n", "amdt": false}, {"t": "=", "s": "a)", "amdt": true}, {"t": "-", "s": " À la première", "amdt": false}, {"t": "+", "s": " La seconde", "amdt": false}, {"t": "=", "s": " phrase", "amdt": true}, {"t": "-", "s": ", les mots : « la suspension du versement des prestations dans les conditions prévues au même article L. 161-1-4 et le réexamen » sont remplacés", "amdt": false}, {"t": "+", "s": " est complétée", "amdt": false}, {"t": "=", "s": " par les mots : «", "amdt": true}, {"t": "+", "s": ", et, en cas de récidive,", "amdt": false}, {"t": "=", "s": " la déchéance", "amdt": true}, {"t": "+", "s": " du droit à l'ensemble des prestations versées par les organismes précédemment cités", "amdt": false}, {"t": "=", "s": " » ;", "amdt": true}, {"t": "=", "s": "\nb) Est ajoutée une phrase ainsi rédigée : « Les organismes mentionnés au même article L. 114-12 procèdent à la récupération des indus. » ;", "amdt": false}, {"t": "-", "s": "\n2° À l'article L. 161-15-1, après la référence : « L. 160-1 », sont insérés les mots : «, si elle a obtenu frauduleusement un numéro d'inscription au répertoire national d'identification des personnes physiques ».", "amdt": false}]}, {"numero": 19, "vise": "ART. 3", "dispositif": "Après l’alinéa 5, insérer l’alinéa suivant :\n\n« I bis. – Les organisations syndicales des agents représentatives au niveau national au sein du ministère de l’agriculture sont associées à l’élaboration de l’ordonnance prévue au I. »", "article": "3", "effet": [{"t": "=", "s": "I.-Dans les conditions prévues à l'article 38 de la Constitution, le Gouvernement est habilité à prendre par ordonnance, dans un délai de douze mois à compter de la publication de la présente loi, toute mesure relevant du domaine de la loi en vue de renforcer et d'améliorer les contrôles en matière de sécurité sanitaire des aliments, de santé et de bien-être des animaux ainsi que de santé et de protection des végétaux et permettre :\n1° D'adapter l'organisation des services et la compétence des agents habilités à conduire des inspections et contrôles et à rechercher et constater des infractions et des manquements ;\n2° D'adapter les pouvoirs de contrôle et d'enquête de ces agents ;\n3° D'adapter les mesures de police administrative et les sanctions administratives et pénales pour garantir une meilleure protection de la santé publique et de l'environnement et d'améliorer leur proportionnalité ;\n4° De prendre toute mesure permettant d'assurer la cohérence entre les dispositions édictées dans le cadre de l'habilitation prévue aux points 1° à 3° et d'autres dispositions législatives.\n", "amdt": false}, {"t": "+", "s": "I bis.-Les organisations syndicales des agents représentatives au niveau national au sein du ministère de l'agriculture sont associées à l'élaboration de l'ordonnance prévue au I.\n", "amdt": false}, {"t": "=", "s": "II.-Un projet de loi de ratification est déposé devant le Parlement dans un délai de trois mois à compter de la publication de chacune des ordonnances prévues par le I du présent article.", "amdt": false}]}, {"numero": 20, "vise": "ART. 15", "dispositif": "Après l’alinéa 9, insérer l'alinéa suivant :\n\n« La commission remet annuellement au Gouvernement et au Parlement un rapport comparant les données de suivi et d’évaluation recueillies dans le cadre de son activité mentionnée au 2° du présent article avec les données publiques de l’Oregon portant sur le même objet ».", "article": "15", "effet": [{"t": "=", "s": "La section 2 bis du chapitre Ier du titre Ier du livre Ier de la première partie du code de la santé publique, telle qu'elle résulte de l'article 2 de la présente loi, est complétée par une sous-section 5 ainsi rédigée :\n« Sous-section 5\n« Contrôle et évaluation\n« Art. L. 1111-12-13.-I.-Une commission de contrôle et d'évaluation, placée auprès du ministre chargé de la santé, assure :\n« 1° Le contrôle a posteriori, à partir notamment des données enregistrées dans le système d'information mentionné à l'article L. 1111-12-9, du respect, pour chaque procédure d'aide à mourir, des conditions prévues aux sous-sections 2 à 4 de la présente section ;\n« 2° Le suivi et l'évaluation de l'application de la présente section, notamment en exploitant des données agrégées et anonymisées, afin d'en informer annuellement le Gouvernement et le Parlement et de formuler des recommandations. Ce suivi et cette évaluation reposent notamment sur une approche sociologique et éthique ;\n« 3° L'enregistrement des déclarations des professionnels de santé mentionnées au III de l'article L. 1111-12-12 dans un registre accessible aux seuls professionnels de santé, dans des conditions définies par un décret en Conseil d'État pris après avis de la Commission nationale de l'informatique et des libertés.\n« Lorsque, à l'issue du contrôle mentionné au 1° du présent I, la commission estime que des faits commis à l'occasion de la mise en œuvre, par des professionnels de santé, des dispositions des sous-sections 2 à 4 de la présente section sont susceptibles de constituer un manquement aux règles déontologiques ou professionnelles, elle peut saisir la chambre disciplinaire de l'ordre compétent.\n« Lorsque la commission estime que des faits commis à l'occasion de la mise en œuvre des mêmes dispositions sont susceptibles de constituer un crime ou un délit, elle le signale au procureur de la République dans les conditions prévues à l'article 40 du code de procédure pénale.\n", "amdt": false}, {"t": "=", "s": "«", "amdt": true}, {"t": "+", "s": " La commission remet annuellement au Gouvernement et au Parlement un rapport comparant les données de suivi et d'évaluation recueillies dans le cadre de son activité mentionnée au 2° du présent article avec les données publiques de l'Oregon portant sur le même objet\n«", "amdt": false}, {"t": "=", "s": " II.-La commission est responsable du système d'information mentionné à l'article L. 1111-12-9 du présent code.\n« Nonobstant l'article L. 1110-4, les données enregistrées dans ce système d'information sont traitées et partagées dans des conditions définies par un décret en Conseil d'État pris après avis de la Commission nationale de l'informatique et des libertés, aux seules fins d'assurer le suivi, le contrôle et l'évaluation des dispositions prévues à la présente section.\n« III.-Nonobstant l'article L. 1110-4, les médecins membres de la commission peuvent accéder, dans la mesure strictement nécessaire à leur mission, au dossier médical de la personne ayant procédé ou fait procéder à l'administration de la substance létale.\n« IV.-La composition de la commission et les règles de fonctionnement propres à garantir son indépendance et son impartialité ainsi que les modalités d'examen, pour chaque personne ayant demandé l'aide à mourir, du respect des conditions prévues aux sous-sections 2 à 4 de la présente section sont déterminées par décret en Conseil d'État. La commission comprend au moins :\n« 1° Deux médecins ;\n« 2° Un conseiller d'État ;\n« 3° Un conseiller à la Cour de cassation ;\n« 4° Deux membres d'associations agréées représentant les usagers du système de santé dans les instances hospitalières ou dans les instances de santé publique ;\n« 5° Deux personnalités désignées en raison de leurs compétences dans le domaine des sciences humaines et sociales. »", "amdt": false}]}, {"numero": 21, "vise": "ART. PREMIER", "dispositif": "Rédiger ainsi l’alinéa 1 :\n\n« Un rapport est transmis annuellement aux commissions chargées des finances du Parlement présentant, pour chaque opérateur de l’État, une liste non-nominative des dix rémunérations brutes les plus élevées. »", "article": "PREMIER", "effet": [{"t": "-", "s": "Les rémunérations", "amdt": false}, {"t": "+", "s": " Un rapport est transmis annuellement aux commissions chargées", "amdt": false}, {"t": "=", "s": " des", "amdt": true}, {"t": "-", "s": " agents comprises dans les trois", "amdt": false}, {"t": "+", "s": " finances du Parlement présentant,", "amdt": false}, {"t": "=", "s": " pour", "amdt": true}, {"t": "-", "s": " cent des rémunérations les plus élevées au sein des agences et opérateurs", "amdt": false}, {"t": "+", "s": " chaque opérateur", "amdt": false}, {"t": "=", "s": " de l'État", "amdt": true}, {"t": "-", "s": " font l'objet d'un contrôle annuel par", "amdt": false}, {"t": "+", "s": ", une liste non-nominative des dix rémunérations brutes", "amdt": false}, {"t": "=", "s": " les", "amdt": true}, {"t": "-", "s": " commissions des finances de l'Assemblée nationale et du Sénat", "amdt": false}, {"t": "+", "s": " plus élevées", "amdt": false}, {"t": "=", "s": ".", "amdt": true}, {"t": "=", "s": "\nDans l'exercice de cette mission, les commissions des finances peuvent demander communication de tout élément utile relatif aux politiques de rémunération, dans le respect des secrets protégés par la loi.\nCe contrôle s'exerce à l'égard des agences et opérateurs de l'État dont la liste est fixée par décret.", "amdt": false}]}, {"numero": 22, "vise": "ART. PREMIER", "dispositif": "À l’alinéa 55, substituer au mot :\n\n« attribution »,\n\nle mot :\n\n« application ».", "article": "PREMIER", "effet": [{"t": "=", "s": "L'article 140 de la loi n° 2018-1021 du 23 novembre 2018 portant évolution du logement, de l'aménagement et du numérique est ainsi modifié :\nA.-Le I est ainsi modifié :\n1° Le premier alinéa est ainsi modifié :\na) Au début, les mots : « À titre expérimental et pour une durée de huit ans à compter de la publication de la présente loi, dans les zones mentionnées à l'article 17 de la loi n° 89-462 du 6 juillet 1989 tendant à améliorer les rapports locatifs et portant modification de la loi n° 86-1290 du 23 décembre 1986 » sont remplacés par les mots : « Dans les communes classées dans les zones géographiques mentionnées au I de l'article 232 du code général des impôts ou dans les communes qui présentent un déséquilibre entre l'offre et la demande de logements entraînant des difficultés sérieuses d'accès au logement » ;\nb) Les mots : « demander qu'» sont remplacés par les mots : « mettre en œuvre » ;\nc) À la fin, les mots : « soit mis en place » sont supprimés ;\nd) Est ajoutée une phrase ainsi rédigée : « Ce dispositif peut porter sur tout ou partie du territoire de la collectivité ou de l'établissement. » ;\n2° Après le même premier alinéa, sont insérés deux alinéas ainsi rédigés :\n« Les communes peuvent également délibérer en vue de la mise en œuvre de ce dispositif. Lorsque les communes ne sont pas classées dans les zones géographiques mentionnées au même I, la délibération est motivée par un déséquilibre entre l'offre et la demande de logements entraînant des difficultés sérieuses d'accès au logement. Lorsque les communes relèvent d'un des établissements ou d'une des métropoles mentionnées au premier alinéa du présent I, cette délibération ne peut intervenir que si, dans un délai de trois mois après avoir été saisi d'une telle demande par sa commune membre, l'établissement public ou la métropole a opposé un refus implicite ou explicite à la prise d'une telle délibération.\n« Le dispositif d'encadrement des loyers peut également être mis en place dans les communes dont toutes les communes limitrophes sont soumises au dispositif. » ;\n3° Les deuxième à sixième alinéas sont supprimés ;\n4° Au début du septième alinéa, les mots : « Pour chaque territoire ainsi délimité, » sont supprimés ;\n4° bis L'avant-dernier alinéa est supprimé ;\n5° À la fin du dernier alinéa, les mots : « cette expérimentation » sont remplacés par les mots : « ce dispositif » ;\nB.-Le III est ainsi modifié :\n1° Le A est ainsi modifié :\na) (Supprimé)\nb) Après le premier alinéa, il est inséré un alinéa ainsi rédigé :\n« Toute action en diminution de loyer est prescrite dans les conditions prévues à l'article 7-1 de la même et au plus tard un an après la résiliation ou la fin du dernier contrat de location. La saisine de la commission départementale de conciliation a un effet suspensif jusqu'à la réception de l'avis de celle-ci. » ;\nc) Le second alinéa est ainsi modifié :\n-après le mot : « précitée », sont insérés les mots : « ou d'activité consistant à fournir un logement s'apparentant à une location meublée au sens du titre Ier bis de la même loi et donnant accès à des espaces partagés ou à des services réservés aux seuls titulaires d'un tel contrat de location et dont la définition est précisée par décret » ;\n-est ajoutée une phrase ainsi rédigée : « Le propriétaire communique au colocataire qui en fait la demande le montant des loyers perçus de la part de l'ensemble des colocataires et, le cas échéant, une copie du contrat unique. » ;\nd) Il est ajouté un alinéa ainsi rédigé :\n« Les professionnels mentionnés au II de l'article 5 de la loi n° 89-46 du 6juillet 1989 précitée informent les propriétaires qui les mandatent pour la mise en location d'un logement du niveau des loyers de référence qui s'appliquent à ce logement. » ;\n2° Le B est ainsi modifié :\naa) Au premier alinéa, après le mot : « caractéristiques », sont insérés les mots : « propres et objectives » ;\na) Après le quatrième alinéa, sont insérés trois alinéas ainsi rédigés :\n« Des surfaces, autres que celles mentionnées au troisième alinéa du I, peuvent donner droit à l'application d'un complément de loyer. Un décret fixe le coefficient correcteur définissant la valeur de ces surfaces en fonction de leur nature.\n« Le complément de loyer ne peut excéder 20 % du montant du loyer de référence majoré.\n« Le montant du complément de loyer est précisé dans les annonces relatives à la mise en location d'un logement définies à l'article 2-1 de la loi n° 89-462 du 6 juillet 1989 précitée. » ;\na bis) Le cinquième alinéa est ainsi modifié :\n-après le mot : « vis-à-vis », sont insérés les mots : « dans la pièce principale » ;\n-à la fin, les mots : « une mauvaise exposition de la pièce principale » sont remplacés par les mots : « une surface habitable égale ou inférieure à 14 mètres carrés » ;\nb) Au sixième alinéa, les mots : « dispose d'un délai de trois mois à compter de la signature du bail pour » sont remplacés par le mot : « peut » ;\nc) La première phrase de l'avant-dernier alinéa est ainsi modifiée :\n-les mots : « dispose d'un délai de trois mois » sont supprimés ;\n-le mot : « pour » est remplacé par le mot : « peut » ;\nd) Il est ajouté un alinéa ainsi rédigé :\n« Les professionnels mentionnés au II de l'article 5 de la loi n° 89-462 du 6 juillet 1989 précitée informent les propriétaires qui les mandatent pour la mise en location d'un logement des obligations prévues au présent B. » ;\nB bis.-Le dernier alinéa du IV est supprimé ;\nB ter.-Le VI est ainsi modifié :\n1° Au premier alinéa, après la première occurrence du mot : « contrat », sont insérés les mots : « ou de sa reconduction tacite » ;\n2° À la première phrase du deuxième alinéa, après le mot : « contrat », sont insérés les mots : « ou de sa reconduction tacite » ;\nC.-Le VII est ainsi modifié :\n1° A À la première phrase du premier alinéa, les mots : « dispositions du A » sont remplacés par les mots : « A et B » ;\n1° La première phrase du deuxième alinéa est ainsi modifiée :\na) Le montant : « 5 000 € » est remplacé par le montant : « 10 000 € » ;\nb) Le montant : « 15 000 € » est remplacé par le montant : « 30 000 € » ;\n2° Le première phrase du dernier alinéa est ainsi modifié :\na) Après le mot : « habitat, », sont insérés les mots : « aux maires, » ;\nb) Les mots : « au maire de Paris, » sont supprimés ;\n3° Il est ajouté un alinéa ainsi rédigé :\n« Le produit des amendes prévues au deuxième alinéa du présent VII est intégralement versé à la commune, à la métropole ou à l'établissement public de coopération intercommunale délégataires des attributions du représentant de l'État en application de l'avant-dernier alinéa du présent VII. » ;\nD.-Sont ajoutés des IX et X ainsi rédigés :\n« IX.-Le présent article demeure applicable dans sa rédaction antérieure à la loi n° du pour retrouver la confiance et l'équilibre dans les rapports locatifs pour les collectivités sur le territoire desquelles l'encadrement des loyers prévu au présent article est en vigueur à la promulgation de la même loi, jusqu'à ce qu'elles délibèrent en", "amdt": false}, {"t": "-", "s": " attribution", "amdt": false}, {"t": "+", "s": " application", "amdt": false}, {"t": "=", "s": " du I du présent article.\n« X.-Cinq ans après la promulgation de la loi n° du précitée, le Gouvernement remet au Parlement un rapport d'évaluation du dispositif. »", "amdt": false}]}, {"numero": 23, "vise": "ART. PREMIER", "dispositif": "À l’alinéa 7, après le mot :\n\n« psychologiques »,\n\ninsérer les mots :\n\n« , aux souffrances psychiques et psychologiques ».", "article": "PREMIER", "effet": [{"t": "=", "s": "I.-Le code de la santé publique est ainsi modifié :\n1° Au dernier alinéa de l'article L. 1110-5-1, après le mot : « dispensant », sont insérés les mots : « l'accompagnement et » ;\n2° Au premier alinéa de l'article L. 1110-8, après les mots : « relève de », sont insérés les mots : « l'accompagnement et des » ;\n3° L'article L. 1110-10 est ainsi rédigé :\n« Art. L. 1110-10.-L'accompagnement et les soins palliatifs garantissent le droit fondamental à la protection de la santé mentionné à l'article L. 1110-1. Ils sont destinés aux personnes de tout âge en souffrance du fait de leur état de santé affecté par une ou par plusieurs maladies graves et, en particulier, aux personnes approchant de la fin de leur vie. Ils ont pour objet, à l'initiative et sous la conduite des médecins et des professionnels de l'équipe de soins, de garantir une prise en charge globale et de proximité de la personne malade afin de préserver sa dignité, son autonomie, sa qualité de vie et son bien-être. Ils sont accessibles sur l'ensemble du territoire national et leur répartition garantit un accès équitable aux personnes malades.\n« Ils sont adaptés à l'âge et aux besoins particuliers des personnes, notamment celles en situation de handicap.\n« Dans le respect de la volonté de la personne, ils comprennent la prévention, le dépistage précoce, l'évaluation et la prise en charge globale des problèmes physiques, y compris de la douleur et des autres symptômes pénibles, ainsi que la réponse aux affections", "amdt": false}, {"t": "+", "s": " psychologiques, aux souffrances psychiques et", "amdt": false}, {"t": "=", "s": " psychologiques", "amdt": true}, {"t": "=", "s": " et aux besoins sociaux et spirituels.\n« Ils sont délivrés de façon précoce, active et continue tout au long du parcours de soins de la personne malade et soutiennent son entourage, y compris après son décès. Si nécessaire, ils sont proposés conjointement aux traitements curatifs agissant spécifiquement sur la maladie.\n« Ils sont prodigués de manière intégrée avec les soins de support et de confort.\n« L'accompagnement et les soins palliatifs ne visent ni à hâter, ni à différer la survenance de la mort.\n« L'accompagnement et les soins palliatifs sont pratiqués par une équipe pluridisciplinaire. Ils sont garantis quel que soit le lieu de résidence ou de soins de la personne malade, y compris dans les lieux de privation de liberté, selon des modalités adaptées. Ils comportent une information et un accompagnement pour la rédaction des directives anticipées définies à l'article L. 1111-11 et la désignation de la personne de confiance définie à l'article L. 1111-6. Les bénévoles mentionnés à l'article L. 1110-11 peuvent intervenir en appui de l'équipe pluridisciplinaire.\n« Les structures spécialisées dans la douleur chronique labellisées par les agences régionales de santé sont associées à l'accompagnement des malades prévu au présent article.\n« Dans les établissements publics de santé, un référent chargé de coordonner l'accès à l'accompagnement et aux soins palliatifs est nommé dans chaque service mentionné à l'article L. 6146-1. Ce référent exerce ces fonctions à titre bénévole.\n« Les tarifs des honoraires des professionnels de santé pour les missions réalisées dans le cadre du présent article ne peuvent donner lieu à dépassement. Tous les deux ans, les administrations de sécurité sociale publient un rapport évaluant l'état de la prise en charge financière des soins palliatifs et d'accompagnement, du recours aux subventions des fonds d'action sanitaire et sociale et du reste à charge pesant sur les ménages dans l'accompagnement de la fin de vie. » ;\n4° La troisième phrase du premier alinéa du I de l'article L. 1111-2 est remplacée par deux phrases ainsi rédigées : « Elle se voit remettre un livret d'information, accessible aux personnes en situation de handicap visuel ou auditif et disponible sous le format « facile à lire et à comprendre », sur ses droits en matière d'accompagnement et de soins palliatifs mentionnés à l'article L. 1110-10 ; elle est également informée de la possibilité de recevoir, lorsque son état de santé le permet, cet accompagnement et ces soins sous forme ambulatoire ou à domicile ainsi que de celle d'enregistrer ses directives anticipées mentionnées à l'article L. 1111-11 dans l'espace numérique de santé ou de les actualiser si nécessaire. Elle peut également bénéficier de l'accompagnement d'un professionnel de santé pour sa démarche. » ;\n5° À la dernière phrase du troisième alinéa de l'article L. 1111-4, après le mot : « dispensant », sont insérés les mots : « l'accompagnement et » ;\n6° L'article L. 1112-4 est ainsi modifié :\na) À la première phrase du premier alinéa, après le mot : « assurer », sont insérés les mots : « l'accompagnement et » ;\nb) À la première phrase de l'avant-dernier alinéa, après le mot : « requiert », sont insérés les mots : « un accompagnement et ».\nII.-Le code de l'action sociale et des familles est ainsi modifié :\n1° Au 5° de l'article L. 311-1, les mots : « de soins et d'accompagnement » sont remplacés par les mots : « d'accompagnement et de soins » ;\n2° L'avant-dernière phrase du premier alinéa de l'article L. 311-8 est ainsi modifiée :\na) Les mots : « des soins palliatifs » sont remplacés par les mots : « un accompagnement et des soins palliatifs mentionnés à l'article L. 1110-10 du code de la santé publique » ;\nb) Sont ajoutés les mots : « du présent code ».", "amdt": false}]}, {"numero": 24, "vise": "ART. 18", "dispositif": "À la fin de l’alinéa 1, substituer aux mots :\n\n« au deuil et à l’accompagnement des personnes en situation de deuil »\n\nles mots :\n\n« aux soins palliatifs et aux droits des malades ».", "article": "18", "effet": [{"t": "=", "s": "Le ministère chargé de la santé et des solidarités réalise annuellement une campagne nationale de sensibilisation et de prévention relative", "amdt": false}, {"t": "-", "s": " au deuil", "amdt": false}, {"t": "+", "s": " aux soins palliatifs", "amdt": false}, {"t": "=", "s": " et", "amdt": true}, {"t": "-", "s": " à l'accompagnement", "amdt": false}, {"t": "+", "s": " aux droits", "amdt": false}, {"t": "=", "s": " des", "amdt": true}, {"t": "-", "s": " personnes en situation de deuil", "amdt": false}, {"t": "+", "s": " malades", "amdt": false}, {"t": "=", "s": ".\nUn décret précise les modalités de mise en œuvre et d'application du présent article.", "amdt": false}]}, {"numero": 25, "vise": "ART. 13", "dispositif": "Compléter cet article par les deux alinéas suivants :\n\n« Après l’article L. 4123‑2 du code de la défense, il est inséré un article L. 4123‑2‑1 A ainsi rédigé :\n\n« Art. L. 4123‑2‑1 A. – Tout personnel militaire ou civil du service de santé des armées ayant été exposé, dans l’exercice de ses missions, à des agents biologiques ou à des agents issus de biotechnologies offensives au sens de l’article L. 3135‑1 du code de la santé publique bénéficie d’un suivi médical renforcé d’une durée minimale de vingt ans à compter de la date de cessation de l’exposition. Ce suivi est retracé dans le dossier médical individuel de l’agent concerné. Les modalités d’application du présent article sont fixées par décret en Conseil d’État, pris après avis du Haut Conseil de la santé publique. »", "article": "13", "effet": [{"t": "=", "s": "Le code de la santé publique est ainsi modifié :\n1° À l'article L. 3135-1 :\na) Au premier alinéa du I, les mots : « établissements de ravitaillement sanitaire du service de santé des armées » sont remplacés par les mots : « toute entité du service de santé des armées, avec le concours éventuel d'autres services de l'État, » ;\nb) Au 2° du même I, après les mots : « ou d'exposition » sont insérés les mots : «, suspectée ou confirmée, » ;\nc) Au premier alinéa du II, les mots : « et du ministre chargé de la santé » sont remplacés par les mots : «, du ministre chargé de la santé et, le cas échéant, du ou des ministres ayant autorité sur les services de l'État dont le concours mentionné au I est prévu » ;\nd) Au 3° du même II, après les mots : « peuvent être » sont insérés les mots : « distribués par le service de santé des armées avec le concours éventuel d'autres services de l'État, » ;\ne) Le 4° du même II est complété par les mots : « et de leur destruction » ;\n2° Au second alinéa de l'article L. 3135-2, les mots : « et les établissements de ravitaillement sanitaire du service de santé des armées, » sont remplacés par les mots : «, les entités du service de santé des armées et les services de l'État concourant à leur distribution » ;\n3° L'article L. 5121-32-1 est remplacé par les dispositions suivantes :\n« Art. L. 5121-32-1.-Les dispositions des articles L. 5121-29 à L. 5121-32 et du I de l'article L. 5121-33 ne sont pas applicables à la pharmacie centrale des armées et au centre de transfusion sanguine des armées, lorsque ceux-ci sont titulaires d'une autorisation de mise sur le marché ou exploitent un médicament. » ;\n4° À l'article L. 5124-8 :\na) Le I est remplacé par les dispositions suivantes :\n« I.-Les dispositions des articles L. 5124-1 et L. 5124-2, à l'exception des dispositions du premier alinéa de cet article, s'appliquent :\n« 1° Aux établissements de ravitaillement sanitaire du service de santé des armées, chargés de l'importation, l'exportation et la distribution en gros de médicaments, produits et objets mentionnés à l'article L. 4211-1 ;\n« 2° À la pharmacie centrale des armées ;\n« 3° Au centre de transfusion sanguine des armées. » ;\nb) Après le I, il est inséré un I bis ainsi rédigé :\n« I. bis.-Les médicaments mentionnés à l'article L. 4211-1, fabriqués par la pharmacie centrale des armées ou par le centre de transfusion sanguine des armées, sont soumis aux dispositions de l'article L. 5121-8, sous réserve du II du présent article. » ;\nc) Le II et le III sont remplacés par les dispositions suivantes :\n« II.-Ne sont pas soumis aux dispositions de l'article L. 5121-8 les médicaments mentionnés à l'article L. 5121-1 qui sont nécessaires aux besoins spécifiques de la défense et qui sont destinés à pallier l'absence de spécialité pharmaceutique disponible ou adaptée, lorsqu'ils remplissent l'une des conditions suivantes :\n« 1° Ils sont fabriqués par le service de santé des armées ;\n« 2° Ils sont exploités par le service de santé des armées et fabriqués à la demande du ministère de la défense :\n« a) Par un établissement pharmaceutique dûment autorisé ;\n« b) Ou, s'agissant de ceux destinés à répondre aux situations de crise mentionnées aux 1° et 2° du I de l'article L. 3135-1, par dérogation aux dispositions de l'article L. 5124-1, par un établissement non pharmaceutique temporairement autorisé par l'Agence nationale de sécurité du médicament et des produits de santé.\n« III.-L'autorisation temporaire prévue au b du 2° du II est délivrée par l'Agence nationale de sécurité du médicament et des produits de santé, sur demande de l'établissement concerné, formulée après accord du ministre de la défense, pour répondre à un besoin spécifique exprimé par le service de santé des armées.\n« Les conditions d'octroi, notamment en vue d'assurer la protection de la santé, de suspension ou de retrait de cette autorisation temporaire, ainsi que la durée maximale pour laquelle elle peut être délivrée, sont fixées par décret en Conseil d'État. » ;\n5° À l'article L. 5124-8-1, les mots : « II et au III de l'article L. 5124-8 » sont remplacés par les mots : « I bis et au II de l'article L. 5124-8 ».", "amdt": false}, {"t": "+", "s": "\nAprès l'article L. 4123-2 du code de la défense, il est inséré un article L. 4123-2-1 A ainsi rédigé :\n« Art. L. 4123-2-1 A.-Tout personnel militaire ou civil du service de santé des armées ayant été exposé, dans l'exercice de ses missions, à des agents biologiques ou à des agents issus de biotechnologies offensives au sens de l'article L. 3135-1 du code de la santé publique bénéficie d'un suivi médical renforcé d'une durée minimale de vingt ans à compter de la date de cessation de l'exposition. Ce suivi est retracé dans le dossier médical individuel de l'agent concerné. Les modalités d'application du présent article sont fixées par décret en Conseil d'État, pris après avis du Haut Conseil de la santé publique. »", "amdt": false}]}, {"numero": 26, "vise": "ART. PREMIER", "dispositif": "Après l’alinéa 8, insérer l’alinéa suivant :\n\n« 4° Lorsque celle-ci permet le maintien des liens dans les fratries dès lors que ceux-ci sont préconisés. »", "article": "PREMIER", "effet": [{"t": "=", "s": "I.-La section 2 du chapitre Ier du titre IX du livre Ier du code civil est ainsi modifiée :\n1° À l'article 375 :\na) Le quatrième alinéa est remplacé par les dispositions suivantes :\n« La mesure prévue au 3° de l'article 375-3 ne peut excéder une durée non renouvelable d'un an pour les mineurs âgés de moins de trois ans au jour du prononcé et de deux ans pour les mineurs d'au moins trois ans.\n« Toutefois, par décision spécialement motivée, le juge des enfants peut renouveler cette mesure pour les mêmes durées :\n« 1° Dans l'attente d'un retour de l'enfant dans son milieu familial, envisagé à court terme ;\n« 2° Lorsque l'action éducative menée a été jusqu'alors insuffisante ou qu'aucune autre mesure n'est susceptible de faire cesser la situation de danger visée au premier alinéa ;\n« 3° Lorsqu'une procédure relative au changement de statut de l'enfant est envisagée ou en cours", "amdt": false}, {"t": "+", "s": ".\n« 4° Lorsque celle-ci permet le maintien des liens dans les fratries dès lors que ceux-ci sont préconisés", "amdt": false}, {"t": "=", "s": ".", "amdt": true}, {"t": "=", "s": "\n« Lorsque les parents présentent des difficultés relationnelles et éducatives graves, sévères et chroniques, affectant durablement leurs compétences dans l'exercice de leur responsabilité parentale, la mesure d'accueil ordonnée en application des 2° à 5° de l'article 375-3 peut être renouvelée pour une durée supérieure à celles prévues aux alinéas précédents, afin de permettre à l'enfant de bénéficier d'une continuité relationnelle, affective et géographique dans son lieu de vie dès lors qu'il est adapté à ses besoins immédiats et à venir. Lorsque l'enfant est âgé de plus de treize ans, la mesure de placement peut être renouvelée dans les mêmes conditions pour toute la durée de sa minorité. »\nb) Au dernier alinéa :\n-à la première phrase, le mot : « deux » est remplacé par le mot : « trois » ;\n-l'alinéa est complété par une phrase ainsi rédigée :\n« En outre, à l'expiration d'un délai de deux ans depuis le prononcé d'une mesure d'accueil ordonnée en application du 3° de l'article 375-3, ou d'un an s'agissant d'un enfant de moins de trois ans, et lorsque le retour au domicile parental n'est pas préconisé, ce rapport comprend des propositions alternatives au renouvellement de la mesure d'accueil ou, à défaut, de renouvellement de la mesure d'accueil dans les conditions prévues par le code de l'action sociale et des familles. »\n2° Après le troisième alinéa de l'article 375-7, il est inséré un alinéa ainsi rédigé :\n« Lorsque le service départemental de l'aide sociale à l'enfance envisage de modifier le lieu d'accueil de l'enfant, confié en application de l'article 375-3, pour une durée supérieure à deux ans, il saisit le juge des enfants d'une demande motivée au moins un mois avant la date de changement envisagée afin que le juge statue sur la modification du lieu d'accueil. En cas d'urgence, le service départemental de l'aide sociale à l'enfance procède au changement de lieu d'accueil, à charge pour lui de saisir le juge des enfants dans un délai de quarante-huit heures suivant ce changement aux fins de statuer sur cette modification. »\nII.-Le troisième alinéa de l'article L. 223-5 du code de l'action sociale et des familles est complété par les dispositions suivantes :\n« À l'issue des durées de placement mentionnées au quatrième alinéa de l'article 375 du code civil, le rapport comporte un avis sur les perspectives d'évolution éducative. Lorsque l'évolution des compétences parentales ne permet pas d'envisager le retour de l'enfant auprès de sa famille, le rapport propose un projet de vie faisant état de la recherche de mesures alternatives au renouvellement de la mesure d'accueil auprès de l'aide sociale à l'enfance. Il se prononce, le cas échéant, sur l'adéquation du statut juridique de l'enfant confié à ses besoins, sur la possibilité de confier l'enfant à un membre de sa famille ou à un tiers digne de confiance, à défaut, sur l'opportunité de renouveler le placement auprès de l'aide sociale à l'enfance, la durée du renouvellement et les modalités de celui-ci en examinant prioritairement la possibilité d'un accueil auprès d'un assistant familial ou au sein d'un village d'enfants. »", "amdt": false}]}, {"numero": 27, "vise": "ART. PREMIER", "dispositif": "Après l’alinéa 14, insérer les deux alinéas suivants :\n\n« 7° L’atténuation du changement climatique et l’adaptation des logements et des quartiers à ses effets ;\n\n« 8° L’adaptation et l’accompagnement des quartiers au vieillissement. »", "article": "PREMIER", "effet": [{"t": "=", "s": "I.-Le titre Ier de la loi n° 2003-710 du 1er août 2003 d'orientation et de programmation pour la ville et la rénovation urbaine est ainsi modifié :\n1° Après le chapitre II bis, il est inséré un chapitre II ter ainsi rédigé :\n« Chapitre II ter\n« Troisième programme national de renouvellement urbain\n« Art. 9-4.-I.-Le troisième programme national de renouvellement urbain concourt à la reconquête républicaine et à la revitalisation globale des quartiers et des centres urbains les plus fragiles ainsi qu'à la réalisation des objectifs définis à l'article 1er de la loi n° 2014-173 du 21 février 2014 de programmation pour la ville et la cohésion urbaine par des interventions en faveur de la requalification et de la résilience des quartiers prioritaires de la politique de la ville définis à l'article 5 de la loi n° 2014-173 du 21 février 2014 précitée. Il peut également concerner des quartiers présentant soit une concentration élevée d'habitat indigne et une situation économique et sociale des habitants particulièrement difficile, soit une part élevée d'habitat dégradé vacant et un déséquilibre important entre l'offre et la demande de logements. Ce programme, qui couvre la période 2026-2040, vise en priorité les quartiers présentant les dysfonctionnements urbains ou les vulnérabilités sécuritaires, environnementales et d'accessibilité, liées à la faible présence des services publics ou du tissu économique, les plus importants.\n« Les interventions du troisième programme national de renouvellement urbain sont menées selon les mêmes modalités, poursuivent les mêmes finalités et comprennent les mêmes opérations que celles mentionnées aux trois derniers alinéas du I de l'article 9-1 de la présente loi.\n« Les habitants ainsi que des représentants des associations et des acteurs économiques sont associés à la définition, à la mise en œuvre et à l'évaluation des projets de renouvellement urbain. Chaque projet prévoit la mise en place d'une maison du projet mentionnée au III du même article 9-1.\n« Les conventions de projet de renouvellement urbain précisent notamment les engagements pris par l'ensemble des parties signataires sur chacun des axes interministériels suivants :\n« 1° La sécurité et la reconquête républicaine ;\n« 2° Les services publics du quotidien ;\n« 3° La revitalisation économique et l'emploi ;\n« 4° La transition écologique et la résilience climatique ;\n« 5° La mixité sociale et le désenclavement ;\n« 6° L'éducation, la santé et l'accessibilité universelle", "amdt": false}, {"t": "+", "s": ".\n« 7° L'atténuation du changement climatique et l'adaptation des logements et des quartiers à ses effets ;\n« 8° L'adaptation et l'accompagnement des quartiers au vieillissement", "amdt": false}, {"t": "=", "s": ".", "amdt": true}, {"t": "=", "s": "\n« Le ministre chargé de la politique de la ville détermine, par décret, la liste des quartiers répondant aux critères mentionnés au premier alinéa du présent I, sur proposition du conseil d'administration de l'Agence nationale pour la rénovation urbaine et après consultation des représentants de l'État dans les départements.\n« II.-Le programme est placé sous la responsabilité du Premier ministre, qui en assure le pilotage stratégique et veille à la cohérence des engagements de chaque ministère. Les ministres chargés de la ville et du logement coordonnent sa mise en œuvre opérationnelle.\n« Art. 9-5.-Les moyens financiers consacrés à la mise en œuvre du troisième programme national de renouvellement urbain sont fixés à 5 milliards d'euros.\n« Ces moyens proviennent, notamment, des recettes mentionnées à l'article 12.\n« Art. 9-6.-Les articles 8 et 9 s'appliquent, dans les mêmes conditions, au troisième programme national de renouvellement urbain. » ;\n2° Après l'article 10-4, il est inséré un article 10-5 ainsi rédigé :\n« Art. 10-5.-L'Agence nationale pour la rénovation urbaine contribue à la réalisation du troisième programme national de renouvellement urbain selon les mêmes modalités que celles définies à l'article 10-3. » ;\n3° L'article 14-1 est complété par un alinéa ainsi rédigé :\n« Le présent article est également applicable au troisième programme national de renouvellement urbain. »\nII.-Le code de la construction et de l'habitation est ainsi modifié :\n1° À la première phrase du premier alinéa des III de l'article L. 353-15 et II de l'article L. 442-6 et à la première phrase des articles L. 472-1-8 et L. 481-3, après le mot : « articles », est insérée la référence : « 9-4, » ;\n2° Au deuxième alinéa de l'article L. 443-15-1-1, après le mot : « urbaine », sont insérés les mots : « ou figurant dans le décret mentionné au dernier alinéa du I de l'article 9-4 de la loi n° 2003-710 du 1er août 2003 précitée, ».\nIII.-Au premier alinéa de l'article L. 421-5-3 du code de l'urbanisme, les mots : « du nouveau programme national de renouvellement urbain définies à l'article 9-1 » sont remplacés par les mots : « des programmes nationaux de renouvellement urbain définies aux articles 9-1 ou 9-4 ».", "amdt": false}]}, {"numero": 28, "vise": "ART. PREMIER", "dispositif": "Compléter l’alinéa 9 par la phrase suivante :\n\n« L’établissement public réalise les études, les analyses et les diagnostics nécessaires avant tout transfert. »", "article": "PREMIER", "effet": [{"t": "=", "s": "I.-Le I de l'article L. 3211-13-1 du code général de la propriété des personnes publiques est ainsi modifié :\n1° Au premier alinéa, après les mots :
