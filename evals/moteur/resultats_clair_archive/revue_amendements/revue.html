gramme de développement durable à horizon 2030, adopté le 25 septembre 2015 par l'Assemblée générale des Nations unies. Le contenu de ce rapport et, si nécessaire, les modalités de son élaboration, sont fixés par décret.\n« Art. L. 7350-3.-Préalablement aux débats sur le projet de budget, le président de l'assemblée de Mayotte présente un rapport sur la situation en matière d'égalité entre les femmes et les hommes intéressant le fonctionnement du Département-Région de Mayotte, les politiques qu'il mène sur son territoire et les orientations et programmes de nature à améliorer cette situation. Le contenu de ce rapport et les modalités de son élaboration sont fixés par décret.\n« CHAPITRE IER\n« BUDGETS ET COMPTES\n« Art. L. 7351-1.-Le budget du Département-Région de Mayotte est l'acte par lequel sont prévues et autorisées les recettes et les dépenses annuelles de la collectivité. Le budget voté doit être équilibré en dépenses et en recettes.\n« Le budget du Département-Région de Mayotte est établi en section de fonctionnement et en section d'investissement, tant en recettes qu'en dépenses. Certains services, interventions ou activités sont individualisés au sein de budgets annexes.\n« Le budget du Département-Région de Mayotte est divisé en chapitres et articles.\n« Un décret fixe les conditions d'application du présent article.\n« Art. L. 7351-2.-L'attribution des subventions donne lieu à une délibération distincte du vote du budget. Toutefois, pour les subventions dont l'attribution n'est pas assortie de conditions d'octroi, l'assemblée de Mayotte peut décider :\n« 1° Soit d'individualiser au budget les crédits par bénéficiaire ;\n« 2° Soit d'établir, dans un état annexé au budget, une liste de bénéficiaires avec, pour chacun d'eux, l'objet et le montant de la subvention.\n« L'individualisation des crédits ou la liste établie conformément au 2° vaut décision d'attribution des subventions en cause.\n« Art. L. 7351-3.-Dans un délai de dix semaines précédant l'examen du budget, un débat a lieu au sein de l'assemblée de Mayotte sur les orientations budgétaires de l'exercice ainsi que sur les engagements pluriannuels envisagés.\n« Ce débat porte également sur l'état d'avancement des mesures prévues par le plan de convergence couvrant le territoire de la collectivité.\n« Le projet de budget de la collectivité est préparé et présenté par le président de l'assemblée de Mayotte qui est tenu de le communiquer aux membres de l'assemblée de Mayotte avec les rapports correspondants, douze jours au moins avant l'ouverture de la première réunion consacrée à l'examen dudit budget.\n« Le budget primitif, le budget supplémentaire et les décisions modificatives sont votés par l'assemblée de Mayotte.\n« Art. L. 7351-4.-Le budget du Département-Région de Mayotte est voté soit par nature, soit par fonction. Si le budget est voté par nature, il comporte, en outre, une présentation croisée par fonction ; s'il est voté par fonction, il comporte une présentation croisée par nature. La nomenclature par nature et la nomenclature par fonction sont fixées par arrêté conjoint du ministre chargé des collectivités territoriales et du ministre chargé du budget.\n« Les documents budgétaires sont présentés conformément aux modèles fixés par arrêté conjoint du ministre chargé des collectivités territoriales et du ministre chargé du budget.\n« Un décret fixe les conditions d'application du présent article.\n« Art. L. 7351-5.-Les crédits sont votés par chapitre et, si l'assemblée de Mayotte en décide ainsi, par article. Dans ces deux cas, l'assemblée de Mayotte peut cependant spécifier que certains crédits sont spécialisés par article.\n« En cas de vote par article, le président de l'assemblée de Mayotte peut effectuer, par décision expresse, des virements d'article à article à l'intérieur du même chapitre à l'exclusion des articles dont les crédits sont spécialisés.\n« Dans une limite fixée à l'occasion du vote du budget et ne pouvant dépasser 7, 5 % des dépenses réelles de chacune des sections, l'assemblée de Mayotte peut déléguer à son président la possibilité de procéder à des mouvements de crédits de chapitre à chapitre, à l'exclusion des crédits relatifs aux dépenses de personnel. Dans ce cas, le président de l'assemblée de Mayotte informe l'assemblée délibérante de ces mouvements de crédits lors de sa plus proche séance.\n« Art. L. 7351-6.-I.-Si l'assemblée de Mayotte le décide, les dotations affectées aux dépenses d'investissement comprennent des autorisations de programme et des crédits de paiement.\n« Les autorisations de programme constituent la limite supérieure des dépenses qui peuvent être engagées pour l'exécution des investissements. Elles demeurent valables, sans limitation de durée, jusqu'à ce qu'il soit procédé à leur annulation. Elles peuvent être révisées.\n« Les crédits de paiement constituent la limite supérieure des dépenses pouvant être ordonnancées ou payées pendant l'année pour la couverture des engagements contractés dans le cadre des autorisations de programme correspondantes.\n« L'équilibre budgétaire de la section d'investissement s'apprécie en tenant compte des seuls crédits de paiement.\n« II.-Si l'assemblée de Mayotte le décide, les dotations affectées aux dépenses de fonctionnement comprennent des autorisations d'engagement et des crédits de paiement.\n« La faculté prévue au premier alinéa du présent II est réservée aux seules dépenses résultant de conventions, de délibérations ou de décisions au titre desquelles le Département-Région de Mayotte s'engage, au-delà d'un exercice budgétaire, dans le cadre de l'exercice de ses compétences, à verser une subvention, une participation ou une rémunération à un tiers à l'exclusion des frais de personnel.\n« Les autorisations d'engagement constituent la limite supérieure des dépenses qui peuvent être engagées pour le financement des dépenses mentionnées au sixième alinéa. Elles demeurent valables sans limitation de durée jusqu'à ce qu'il soit procédé à leur annulation. Elles peuvent être révisées.\n« Les crédits de paiement constituent la limite supérieure des dépenses pouvant être mandatées pendant l'année pour la couverture des engagements contractés dans le cadre des autorisations d'engagement correspondantes.\n« L'équilibre budgétaire de la section de fonctionnement s'apprécie en tenant compte des seuls crédits de paiement.\n« À l'occasion du vote du compte administratif, le président de l'assemblée de Mayotte présente un bilan de la gestion pluriannuelle. La situation des autorisations d'engagement et de programme ainsi que des crédits de paiement y afférents donne lieu à un état joint au compte administratif.\n« Un décret fixe les conditions d'application du présent article.\n« Art. L. 7351-7.-Avant le vote de la première délibération budgétaire qui suit son renouvellement, l'assemblée de Mayotte établit son règlement budgétaire et financier.\n« Le règlement budgétaire et financier du Département-Région de Mayotte précise notamment :\n« 1° Les modalités de gestion des autorisations de programme, des autorisations d'engagement et des crédits de paiement y afférents, et notamment les règles relatives à la caducité et à l'annulation des autorisations de programme et des autorisations d'engagement ;\n« 2° Les modalités d'information de l'assemblée de Mayotte sur la gestion des engagements pluriannuels au cours de l'exercice.\n« Il peut aussi préciser les modalités de report des crédits de paiement afférents à une autorisation de programme, dans les cas et conditions fixés par arrêté conjoint du ministre chargé des collectivités territoriales et du ministre chargé du budget.\n« Art. L. 7351-8.-Lorsque la section d'investissement ou la section de fonctionnement du budget comporte soit des autorisations de programme et des crédits de paiement, soit des autorisations d'engagement et des crédits de paiement, le président de l'assemblée de Mayotte peut, jusqu'à l'adoption du budget ou jusqu'à son règlement en cas de non-adoption du budget, liquider et mandater les dépenses d'investissement et les dépenses de fonctionnement correspondant aux autorisations ouvertes au cours des exercices antérieurs, dans la limite d'un montant de crédits de paiement par chapitre égal au tiers des autorisations ouvertes au cours de l'exercice précédent. Les crédits correspondants sont inscrits au budget lors de son adoption ou de son règlement. Le comptable est en droit de payer les mandats émis dans ces conditions.\n« Art. L. 7351-9.-Le président de l'assemblée de Mayotte présente annuellement le compte administratif à l'assemblée de Mayotte, qui en débat sous la présidence de l'un de ses membres.\n« Le président de l'assemblée de Mayotte peut, même s'il n'est plus en fonctions, assister à la discussion. Il doit se retirer au moment du vote.\n« Le compte administratif est adopté par l'assemblée de Mayotte.\n« Préalablement, l'assemblée de Mayotte arrête le compte de gestion de l'exercice clos.\n« Art. L. 7351-10.-Le résultat excédentaire de la section de fonctionnement dégagé au titre de l'exercice clos, cumulé avec le résultat antérieur reporté, est affecté en totalité dès la plus proche décision budgétaire suivant le vote du compte administratif et, en tout état de cause, avant la clôture de l'exercice suivant. La délibération d'affectation prise par le Département-Région de Mayotte est produite à l'appui de la décision budgétaire de reprise de ce résultat.\n« Le résultat déficitaire de la section de fonctionnement, le besoin de financement ou l'excédent de la section d'investissement sont repris en totalité dès la plus proche décision budgétaire suivant le vote du compte administratif et, en tout état de cause, avant la fin de l'exercice.\n« Entre la date limite de mandatement fixée au dernier alinéa de l'article L. 1612-11 et la date limite de vote des taux des impositions locales prévue à l'article 1639 A du code général des impôts, l'assemblée de Mayotte peut, au titre de l'exercice clos et avant l'adoption de son compte administratif, reporter de manière anticipée au budget le résultat de la section de fonctionnement, le besoin de financement de la section d'investissement ou, le cas échéant, l'excédent de la section d'investissement ainsi que la prévision d'affectation.\n« Si le compte administratif fait apparaître une différence avec les montants reportés par anticipation, l'assemblée de Mayotte procède à leur régularisation et à la reprise du résultat dans la plus proche décision budgétaire suivant le vote du compte administratif et, en tout état de cause, avant la fin de l'exercice.\n« Un décret fixe les conditions d'application du présent article.\n« Art. L. 7351-11.-Lorsque la section d'investissement du budget présente un excédent après reprise des résultats, la collectivité peut transférer cet excédent à la section de fonctionnement dans les cas et conditions définis par décret.\n« Art. L. 7351-12.-Le budget et le compte administratif arrêtés du Département-Région de Mayotte restent déposés à l'hôtel de l'assemblée de Mayotte où ils sont mis sur place à la disposition du public dans les quinze jours qui suivent leur adoption ou éventuellement leur notification après règlement par le représentant de l'État. Ces documents peuvent également être mis à la disposition du public dans chaque canton, dans un lieu public.\n« Le public est avisé de la mise à disposition de ces documents par tout moyen de publicité au choix du président du conseil général.\n« Une présentation brève et synthétique retraçant les informations financières essentielles est jointe au budget primitif et au compte administratif afin de permettre aux citoyens d'en saisir les enjeux.\n« La présentation prévue au troisième alinéa du présent article, le rapport adressé à l'assemblée de Mayotte à l'occasion du débat sur les orientations budgétaires de l'exercice prévu à l'article L. 7351-3, le rapport annexé au budget primitif et le rapport annexé au compte administratif, conformément à l'article L. 3121-19, sont mis en ligne sur le site internet du Département-Région de Mayotte, lorsqu'il existe, après l'adoption par l'assemblée de Mayotte des délibérations auxquelles ils se rapportent et dans des conditions prévues par décret en Conseil d'État.\n« Art. L. 7351-13.-Les documents budgétaires sont assortis en annexe, notamment :\n« 1° De données synthétiques sur la situation financière du Département-Région de Mayotte ;\n« 2° De la liste des concours attribués par le Département-Région de Mayotte sous forme de prestations en nature ou de subventions. Ce document est joint au seul compte administratif ;\n« 3° De la présentation agrégée des résultats afférents au dernier exercice connu du budget principal et des budgets annexes du Département-Région de Mayotte. Ce document est joint au seul compte administratif ;\n« 4° De la liste des organismes pour lesquels le Département-Région de Mayotte :\n« a) Détient une part du capital ;\n« b) A garanti un emprunt ;\n« c) A versé une subvention supérieure à 75 000 euros ou représentant plus de 50 % du produit figurant au compte de résultat de l'organisme.\n« La liste indique le nom, la raison sociale et la nature juridique de l'organisme ainsi que la nature et le montant de l'engagement financier du Département-Région de Mayotte ;\n« 5° D'un tableau retraçant l'encours des emprunts garantis par le Département-Région de Mayotte ainsi que l'échéancier de leur amortissement ;\n« 6° De la liste des délégataires de service public ;\n« 7° D'une annexe retraçant l'ensemble des engagements financiers du Département-Région de Mayotte résultant des marchés de partenariat prévus à l'article L. 1 414-1 ;\n« 8° D'une annexe retraçant la dette liée à la part investissements des marchés de partenariat ;\n« 9° De l'état de variation du patrimoine prévu à l'article L. 4221-4 ;\n« 10° De la présentation de l'évolution des dépenses consacrées à la formation professionnelle des jeunes ;\n« 11° Des autres états portant sur la situation patrimoniale et financière du Département-Région de Mayotte ainsi que sur ses différents engagements.\n« Lorsqu'une décision modificative ou le budget supplémentaire a pour effet de modifier le contenu de l'une des annexes, celle-ci doit être à nouveau produite pour le vote de la décision modificative ou du budget supplémentaire.\n« Les documents mentionnés au 1° font l'objet d'une insertion dans une ou plusieurs publications locales dont la diffusion totale couvre l'ensemble du territoire du Département-Région de Mayotte.\n« Un décret fixe les conditions d'application du présent article.\n« Art. L. 7351-14.-Les comptes certifiés des organismes mentionnés au 4° de l'article L. 7351-13 sont transmis au Département-Région de Mayotte.\n« Ils sont communiqués par le Département-Région de Mayotte aux conseillers à l'assemblée de Mayotte qui en font la demande, dans les conditions prévues à l'article L. 4132-17, ainsi qu'à toute personne intéressée, dans les conditions prévues à l'article L. 4132-16.\n« Sont transmis par le Département-Région de Mayotte au représentant de l'État et au comptable du Département-Région de Mayotte à l'appui du compte administratif les comptes certifiés des organismes non dotés d'un comptable public et pour lesquels le Département-Région de Mayotte :\n« 1° Soit détient au moins 33 % du capital ;\n« 2° Soit a garanti un emprunt ;\n« 3° Soit a versé une subvention supérieure à 75 000 euros ou représentant plus de 50 % du produit figurant au compte de résultat de l'organisme et dépassant le seuil prévu au quatrième alinéa de l'article 10 de la loi n° 2000-321 du 12 avril 2000 relative aux droits des citoyens dans leurs relations avec les administrations.\n« CHAPITRE II\n« DÉPENSES\n« Art. L. 7352-1.-Ne sont pas obligatoires pour le Département-Région de Mayotte les dépenses mentionnées aux 7°, 8°, 10° bis, 11° et 14° de l'article L. 3321-1.\n« Les cotisations au régime général de la sécurité sociale en application de l'article L. 3123-20-2 s'entendent des cotisations obligatoires pour l'employeur au titre du régime de sécurité sociale applicable à Mayotte.\n« Sont également obligatoires pour le Département-Région de Mayotte :\n« 1° Les dépenses dont il a la charge en matière de transports et d'apprentissage à la date de la première réunion suivant le renouvellement du conseil général de Mayotte en 2011 ;\n« 2° Toute dépense liée à l'exercice d'une compétence transférée par l'État à compter de la même date ;\n« 3° Les dépenses liées à l'organisation des transports scolaires ;\n« 4° Les dépenses d'entretien et de construction des ports maritimes de commerce et de pêche qui lui sont transférées.\n« Art. L. 7352-2.-Lors du vote du budget ou d'une décision modificative, l'assemblée de Mayotte peut voter des autorisations de programme et des autorisations d'engagement de dépenses imprévues respectivement en section d'investissement et en section de fonctionnement. Pour chacune des deux sections, leur montant ne peut être supérieur à 2 % des dépenses réelles de la section.\n« L'absence d'engagement d'une autorisation de programme ou d'une autorisation d'engagement de dépenses imprévues, constatée à la fin de l'exercice, entraîne la caducité de l'autorisation.\n« Les autorisations de programme et les autorisations d'engagement de dépenses imprévues sont affectées dans les conditions prévues par décret.\n« CHAPITRE III\n« RESSOURCES\n« Art. L. 7353-1.-Les ressources attribuées au Département-Région de Mayotte, en application du IV de l'article 12 de l'ordonnance n° 2012-576 du 26 avril 2012 portant extension et adaptation à Mayotte du code de la construction et de l'habitation ainsi que de diverses lois relatives au logement, sont composées d'une part du produit de la taxe intérieure de consommation sur les produits énergétiques et sont affectées au financement par le Département-Région de Mayotte du fonds de solidarité pour le logement.\n« Art. L. 7353-2.-Pour leur application à Mayotte, les articles L. 3332-1, L. 3332-2 et L. 3332-3 sont ainsi rédigés :\n« “ Art. L. 3332-1.-Les recettes fiscales de la section de fonctionnement comprennent le produit des impositions de toute nature affectées au Département-Région de Mayotte ou instituées par lui.\n« “ Art. L. 3332-2.-Les recettes non fiscales de la section de fonctionnement comprennent notamment :\n« “ 1° Le revenu et le produit des propriétés du Département-Région de Mayotte ;\n« “ 2° Le produit de l'exploitation des services et des régies du Département-Région de Mayotte ;\n« “ 3° Le produit du droit de péage des bacs et passages d'eau sur les routes et chemins à la charge du Département-Région de Mayotte, des autres droits de péage et de tous les autres droits concédés à la collectivité par des lois ;\n« “ 4° Les dotations de l'État ;\n« “ 5° Les subventions de l'État et les contributions des communes, de leurs groupements et des tiers aux dépenses de fonctionnement ;\n« “ 6° Les autres ressources provenant de l'État, de l'Union européenne et d'autres collectivités ;\n« “ 7° Le produit des amendes ;\n« “ 8° Les remboursements d'avances effectués sur les ressources de la section de fonctionnement ;\n« “ 9° Le produit de la neutralisation des dotations aux amortissements ;\n« “ 10° La reprise des subventions d'équipement reçues ;\n« “ 11° Les dons et legs en espèces hormis ceux mentionnés au 7° de l'article L. 3332-3.\n« “ Art. L. 3332-3.-Les recettes de la section d'investissement comprennent notamment :\n« “ 1° Le produit des emprunts ;\n« “ 2° La dotation de soutien à l'investissement des départements ;\n« “ 3° Les versements au titre du Fonds de compensation pour la taxe sur la valeur ajoutée ;\n« “ 4° Les subventions de l'État et les contributions des communes, de leurs groupements et des tiers aux dépenses d'investissement ;\n« “ 5° Le produit des cessions d'immobilisations ;\n« “ 6° Le remboursement des prêts consentis par la collectivité territoriale de Mayotte ;\n« “ 7° Les dons et legs en nature et les dons et legs en espèces affectés à l'achat d'une immobilisation financière ou physique ;\n« “ 8° Les amortissements ;\n« “ 9° Le virement prévisionnel de la section de fonctionnement et le produit de l'affectation du résultat de fonctionnement conformément à l'article L. 3312-6. ”\n« Art. L. 7353-3.-Le taux des droits assimilés au droit d'octroi de mer auxquels sont soumis les rhums et spiritueux fabriqués et livrés à la consommation locale dans le Département-Région de Mayotte est fixé par délibération de l'assemblée de Mayotte dans les limites prévues à l'article 22 de la loi de finances rectificative pour 1963 (n° 63-778 du 31 juillet 1963), modifiée par l'article 13 de la loi de finances rectificative pour 1972 (n° 72-1147 du 23 décembre 1972) et complétée par l'article 20 de la loi de finances rectificative pour 1976 (n° 76-1220 du 28 décembre 1976). Le produit de ces droits constitue une recette du budget du Département-Région de Mayotte.\n« CHAPITRE IV\n« COMPTABILITÉ\n« Art. L. 7354-1.-Le président de l'assemblée de Mayotte tient la comptabilité de l'engagement des dépenses dans les conditions fixées par arrêté conjoint du ministre de l'intérieur et du ministre chargé du budget pris après consultation du comité des finances locales.\n« Art. L. 7354-2.-Le comptable du Département-Région de Mayotte est seul chargé d'exécuter, sous sa responsabilité et sous réserve des contrôles qui lui incombent, le recouvrement des recettes ainsi que le paiement des dépenses du Département-Région de Mayotte dans la limite des crédits régulièrement ouverts par l'assemblée de Mayotte.\n« TITRE VI\n« COMPENSATION DES TRANSFERTS DE COMPÉTENCE\n« CHAPITRE UNIQUE\n« Art. L. 7361-1.-Pour l'application du chapitre IV du titre Ier du livre VI, l'évaluation des dépenses exposées par l'État au titre de l'exercice des compétences transférées au Département-Région et aux communes de Mayotte et la constatation des charges résultant des créations et extensions de compétences sont soumises, préalablement à la consultation de la commission consultative sur l'évaluation des charges mentionnée à l'article L. 1211-4-1, à l'avis d'un comité local présidé par un magistrat des juridictions financières et composé à parité de représentants de l'État désignés par le représentant de l'État à Mayotte et de représentants des collectivités territoriales de Mayotte. La composition et les modalités de fonctionnement du comité local sont fixées par décret. » ;\n36° Le livre IV de la septième partie, dans sa rédaction résultant de la loi organique n° du relative au Département-Région de Mayotte, est ainsi modifié :\na) L'article L. 7321-1 devient l'article L. 7421-1 ;\nb) L'article L. 7322-1 devient l'article L. 7422-1 ;\nc) Les articles L. 7323-1, L. 7323-2, L. 7323-3, L. 7323-4, L. 7323-5 et L. 7323-6 deviennent respectivement les articles L. 7423-1, L. 7423-2, L. 7423-3, L. 7423-4, L. 7423-5 et L. 7423-6 et, au dernier alinéa de l'article L. 7423-4, la référence : « L. 7323-5 » est remplacée par la référence : « L. 7423-5 » ;\nd) Les articles L. 7324-1, L. 7324-2 et L. 7324-3 deviennent respectivement les articles L. 7424-1, L. 7424-2 et L. 7424-3 ;\ne) Au premier alinéa de l'article L. 7424-1, la référence : « L. 7323-1 » est remplacée par la référence : « L. 7423-1 » ;\nf) À l'article L. 7424-2, la référence : « L. 7324-1 » est remplacée par la référence : « L. 7424-1 » ;\ng) Les articles L. 7331-1, L. 7331-2 et L. 7331-3 deviennent respectivement les articles L. 7431-1, L. 7431-2 et L. 7431-3 ;\n37° Le livre VII de la première partie, le livre V de la troisième partie et le chapitre VII du titre III du livre IV de la quatrième partie sont abrogés.\nIII.-Le présent article entre en vigueur à une date fixée par décret et, au plus tard, le 1er janvier 2026.\nPar dérogation au premier alinéa du présent III, la section 3 du chapitre Ier du titre II du livre III de la septième partie du code général des collectivités territoriales relative au conseil économique, social, environnemental, de la culture et de l'éducation de Mayotte entre en vigueur à compter de la première réunion de l'assemblée de Mayotte suivant le prochain renouvellement général des conseils départementaux. Le conseil économique et social régional ainsi que le conseil de la culture, de l'éducation et de l'environnement de Mayotte continuent de fonctionner selon les dispositions prévues au titre III du livre IV de la quatrième partie du même code jusqu'à cette date.", "amdt": false}]}, {"numero": 141, "vise": "ART. PREMIER", "dispositif": "À l’alinéa 3, après le mot :\n\n« publique »,\n\ninsérer les mots :\n\n« ou d’un produit ou d’un service comprenant notamment lesdits aliments ».", "article": "PREMIER", "effet": [{"t": "=", "s": "Le code de la santé publique est ainsi modifié :\n1° Le chapitre III du titre III du livre Ier de la deuxième partie est complété par un article L. 2133-3 ainsi rédigé :\n« Art. L. 2133-3.-Les messages publicitaires et activités promotionnelles en faveur d'aliments ultra transformés au sens de l'article L. 3233-1 du code de la santé publique", "amdt": false}, {"t": "+", "s": " ou d'un produit ou d'un service comprenant notamment lesdits aliments", "amdt": false}, {"t": "=", "s": " qui apparaissent, par leur caractère, leur présentation ou leur objet, comme principalement destinés aux mineurs sont interdits sur tout support de communication.\n« Pour les produits visés au premier alinéa, l'usage sur les emballages d'éléments graphiques ou textuels de nature à attirer l'attention des enfants est interdit. À titre transitoire, les produits conditionnés avant l'entrée en vigueur de la loi peuvent être mis sur le marché dans un délai de six mois.\n« Le premier alinéa ne s'applique pas aux aliments et boissons qui figurent sur une liste fixée par arrêté du ministre chargé de la santé, pris après avis de l'Agence nationale de sécurité sanitaire de l'alimentation, de l'environnement et du travail, compte tenu de leurs caractéristiques nutritionnelles adaptées aux besoins de l'enfant dans le cadre d'une alimentation équilibrée.\n« Le non-respect du présent article est puni de 30 000 € d'amende par diffusion illégale constatée, le montant de cette amende pouvant être porté à 30 % des dépenses consacrées à la publicité, sans préjudice des sanctions plus élevées prévues par le code de la communication audiovisuelle.\n« Les modalités d'application du présent article sont déterminées par décret. » ;\n2° Le livre II bis de la troisième partie est complété par un chapitre III ainsi rédigé :\n« Chapitre III\n« Aliments ultra transformés\n« Art. L. 3233.-Un aliment ultra transformé s'entend de toute denrée alimentaire, au sens de l'article 2 du règlement (CE) n° 718 / 2002 du Parlement européen et du conseil du 28 janvier 2002 établissant les principes généraux et les prescriptions générales de la législation alimentaire, instituant l'Autorité européenne de sécurité des aliments et fixant des procédures relatives à la sécurité des denrées alimentaires, ayant subi un ou plusieurs procédés de transformation physico-chimiques ou technologiques ou contenant un ou plusieurs ingrédients dont la liste est établie par arrêté du ministère en charge de la santé sur proposition du Haut conseil de la Santé publique et de l'Institut national de la santé et de la recherche médicale. »", "amdt": false}]}, {"numero": 142, "vise": "ART. 6", "dispositif": "I. – Après l’alinéa 7, insérer les deux alinéas suivants :\n\n« c) D’un professionnel de santé disposant d’une formation dans la prise en charge de la douleur ou exerçant dans une structure spécialisée dans la prise en charge de la douleur ;\n\n« d) D’un psychologue ou d’un psychiatre qui intervient auprès de la personne ou, à défaut, d’un autre psychologue ou d’un autre psychiatre ; »\n\nII. – En conséquence, à l’alinéa 8, supprimer les mots :\n\n« et de psychologues ».\n\nIII. – En conséquence, compléter cet article par l’alinéa suivant :\n\n« VII. – L’article 18 de la présente loi n’est pas applicable aux professionnels mentionnés aux c et d du II de l’article L. 1111‑12‑4 du code de la santé publique. ».", "article": "6", "effet": [{"t": "=", "s": "La sous-section 3 de la section 2 bis du chapitre Ier du titre Ier du livre Ier de la première partie du code de la santé publique, telle qu'elle résulte de l'article 5 de la présente loi, est complétée par un article L. 1111-12-4 ainsi rédigé :\n« Art. L. 1111-12-4.-I.-Le médecin mentionné à l'article L. 1111-12-3 vérifie que la personne remplit les conditions prévues à l'article L. 1111-12-2.\n« La personne dont le discernement est gravement altéré par une maladie lors de la démarche de demande d'aide à mourir ne peut pas être regardée comme manifestant une volonté libre et éclairée.\n« II.-Pour procéder à l'appréciation des conditions mentionnées aux 3° à 5° de l'article L. 1111-12-2, dans le cadre d'une procédure collégiale pluriprofessionnelle, le médecin :\n« 1° Recueille l'avis écrit :\n« a) D'un médecin qui remplit les conditions prévues au premier alinéa du I de l'article L. 1111-12-3 et qui n'intervient pas dans le traitement de la personne, spécialiste de la pathologie de celle-ci, sans qu'il existe de lien hiérarchique entre les deux médecins. Ce médecin a accès au dossier médical de la personne et il examine celle-ci, sauf s'il ne l'estime pas nécessaire, avant de rendre son avis ;\n« b) D'un auxiliaire médical ou d'un aide-soignant qui intervient dans le traitement de la personne ou, à défaut, d'un autre auxiliaire médical ;\n", "amdt": false}, {"t": "=", "s": "«", "amdt": true}, {"t": "+", "s": " c) D'un professionnel de santé disposant d'une formation dans la prise en charge de la douleur ou exerçant dans une structure spécialisée dans la prise en charge de la douleur ;\n« d) D'un psychologue ou d'un psychiatre qui intervient auprès de la personne ou, à défaut, d'un autre psychologue ou d'un autre psychiatre ;\n«", "amdt": false}, {"t": "=", "s": " 2° Peut également recueillir l'avis d'autres professionnels de santé, de professionnels mentionnés aux 6° et 7° du I de l'article L. 312-1 du code de l'action sociale et des familles", "amdt": false}, {"t": "-", "s": " et de psychologues", "amdt": false}, {"t": "=", "s": " qui interviennent dans le traitement de la personne ;\n« 3° Lorsque la personne fait l'objet d'une mesure de protection juridique avec assistance ou représentation relative à la personne, informe la personne chargée de la mesure de protection et tient compte des observations qu'elle formule ;\n« 4° Peut, à la demande de la personne, recueillir l'avis de la personne de confiance, si elle existe.\n« La concertation peut être réalisée à distance.\n« III.-Le médecin se prononce dans un délai de quinze jours à compter de la demande et notifie, oralement et par écrit, sa décision motivée à la personne. Il en informe par écrit, le cas échéant, la personne chargée d'une mesure de protection juridique avec assistance ou représentation relative à la personne.\n« IV.-Après un délai de réflexion d'au moins deux jours à compter de la notification de la décision mentionnée au III du présent article, la personne confirme au médecin qu'elle demande l'administration de la substance létale. Toutefois, ce délai peut être abrégé à la demande de la personne si le médecin estime que cela est de nature à préserver la dignité de cette dernière telle qu'elle la conçoit.\n« Lorsque la confirmation de la demande intervient plus de trois mois après la notification, le médecin évalue à nouveau le caractère libre et éclairé de la manifestation de la volonté en mettant en œuvre, si besoin, la procédure définie au II.\n« V.-Lorsque la personne a confirmé sa volonté, le médecin l'informe oralement et par écrit des modalités d'action de la substance létale.\n« Il détermine, en accord avec la personne, les modalités de l'administration et le médecin ou l'infirmier chargé de l'accompagner pour l'administration de la substance létale.\n« V bis.-La procédure prévue au présent article ne peut être réalisée par des sociétés de téléconsultation.\n« VI.-Le médecin mentionné à l'article L. 1111-12-3 prescrit la substance létale conformément aux recommandations prévues au 23° de l'article L. 161-37 du code de la sécurité sociale.\n« Il adresse cette prescription à l'une des pharmacies à usage intérieur désignées par l'arrêté du ministre chargé de la santé mentionné au second alinéa du 1° de l'article L. 5121-1 du présent code. »", "amdt": false}, {"t": "+", "s": "\nVII.-L'article 18 de la présente loi n'est pas applicable aux professionnels mentionnés aux c et d du II de l'article L. 1111-12-4 du code de la santé publique.", "amdt": false}]}, {"numero": 143, "vise": "ART. 2", "dispositif": "I. – Compléter l’alinéa 4 par les mots :\n\n« notamment en raison de difficultés sérieuses et durables de financement des activités sportives à caractère professionnel des associations qui lui sont affiliées et des sociétés sportives ».\n\nII. – En conséquence, supprimer l’alinéa 7.", "article": "2", "effet": [{"t": "=", "s": "Après l'article L. 132-1-2 du code du sport, il est inséré un article L. 132-1-3 ainsi rédigé :\n« Art. L. 132-1-3.-I.-La subdélégation octroyée à une ligue professionnelle par une fédération délégataire en application de l'article L. 131-14 prend fin au terme de la convention prévue au même article L. 131-14, sauf si une nouvelle convention la renouvelle. Le cas échéant, la fédération informe la ligue de son souhait de ne pas renouveler la convention au minimum six mois avant son échéance. Si, dans les trois mois avant l'échéance de la subdélégation aucun accord n'a pu être trouvé entre la fédération et la ligue professionnelle, le ministre chargé des sports désigne un médiateur. Si, à l'échéance de la convention de subdélégation, celui-ci n'a pu aboutir à un accord, le ministre chargé des sports peut prolonger sa mission et proroger la convention de subdélégation existante pour une durée maximale de trois mois. Le ministre chargé des sports peut, pendant cette période, soumettre un projet de convention aux assemblées générales de la fédération et de la ligue professionnelle. Au terme de la prorogation, et après consultation de la fédération, le ministre chargé des sports peut donner force exécutoire à ce propre projet de convention.\n« Une fédération délégataire peut retirer la subdélégation qu'elle a octroyée avant le terme de la convention qui l'organise :\n« 1° En cas de défaillance grave dans l'exercice des prérogatives subdéléguées", "amdt": false}, {"t": "+", "s": " notamment en raison de difficultés sérieuses et durables de financement des activités sportives à caractère professionnel des associations qui lui sont affiliées et des sociétés sportives", "amdt": false}, {"t": "=", "s": " ;\n« 2° En cas d'atteinte à l'ordre public ou à la moralité publique ;\n« 3° En cas de manquement grave aux obligations résultant du présent code ou de la convention mentionnée au premier alinéa du présent I", "amdt": false}, {"t": "-", "s": " ;\n« 4° En cas de difficulté sérieuse de financement des activités sportives à caractère professionnel des associations qui lui sont affiliées et des sociétés sportives", "amdt": false}, {"t": "=", "s": " ;\n« 5° (Supprimé)\n« La subdélégation est retirée par une décision motivée, à laquelle le ministre chargé des sports peut s'opposer si elle est manifestement infondée ou disproportionnée, prise à l'issue d'une phase contradictoire dont les modalités sont fixées par décret. La ligue professionnelle est préalablement informée des motifs fondant le retrait et est mise à même de présenter des observations écrites ou orales.\n« II.-Le retrait de la subdélégation ou son non-renouvellement dans un délai de trois mois suivant le terme de la convention qui l'organise entraîne la dissolution de la ligue professionnelle.\n« Les biens d'une ligue professionnelle dissoute sont transférés à la fédération délégataire qui l'a créée. Celle-ci est substituée à la ligue professionnelle dissoute dans ses droits et obligations, y compris ceux relatifs aux contrats de travail, sans atteinte aux contrats de diffusion.\n« Le retrait de la subdélégation, son non-renouvellement et la dissolution de la ligue professionnelle n'ouvrent droit à aucune indemnisation pour les dirigeants de cette dernière et ne peuvent donner lieu au versement d'une somme d'argent à leur profit.\n« III.-Lorsqu'elle en est devenue détentrice en application du II, la fédération délégataire cède, à titre gratuit, tout ou partie des titres de propriété du capital social et des droits de vote de la société commerciale créée en application de l'article L. 333-1 à chacune des sociétés sportives, propriétaires des droits d'exploitation audiovisuelle en application du même article L. 333-1, qui participent aux compétitions ou manifestations sportives dont les droits d'exploitation sont commercialisés ou gérés par cette société commerciale. La société commerciale devient alors régie par l'article L. 333-2-1.\n« La fédération délégataire et, le cas échéant, les sociétés sportives ne peuvent détenir moins de 80 % du capital et des droits de vote de la société commerciale. »", "amdt": false}]}, {"numero": 144, "vise": "APRÈS ART. 2", "dispositif": "Les agences régionales de santé établissent et publient une cartographie interactive de l’accessibilité géographique aux maternités prenant en compte les temps de trajet réels. Cette cartographie est actualisée chaque année.", "article": "2 BIS", "effet": [{"t": "+", "s": "Les agences régionales de santé établissent et publient une cartographie interactive de l'accessibilité géographique aux maternités prenant en compte les temps de trajet réels. Cette cartographie est actualisée chaque année.", "amdt": false}]}, {"numero": 145, "vise": "ART. 3", "dispositif": "À la fin de l’alinéa 6, substituer aux mots :\n\n« ainsi qu’à 25 % de la surface totale sur l’ensemble d’un département d’outre-mer »\n\nles mots :\n\n« ou est fixé par le représentant de l’État territorialement compétent au regard de la surface totale occupée par les enseignes d’un même groupe sur la collectivité concernée ».", "article": "3", "effet": [{"t": "=", "s": "Le code de commerce est ainsi modifié :\n1° Le troisième alinéa du III de l'article L. 430-2 est ainsi modifié :\na) Les mots : « à 15 millions d'euros, ou » sont supprimés ;\nb) Les mots : « dans le secteur du commerce de détail » sont supprimés ;\n2° Avant le dernier alinéa de l'article L. 752-1, il est inséré un alinéa ainsi rédigé :\n« Dans les collectivités relevant de l'article 73 de la Constitution et les collectivités d'outre-mer de Saint-Barthélemy, de Saint-Martin et de Saint-Pierre-et-Miquelon, pour l'application des 1°, 2°, 4° et 5°, le seuil de surface de vente au delà duquel un projet est soumis à une autorisation d'exploitation commerciale est fixé, par dérogation, de 300 mètres carrés", "amdt": false}, {"t": "-", "s": " ainsi qu", "amdt": false}, {"t": "+", "s": " ou est fixé par le représentant de l", "amdt": false}, {"t": "=", "s": "'", "amdt": true}, {"t": "-", "s": "à 25 %", "amdt": false}, {"t": "+", "s": " État territorialement compétent au regard", "amdt": false}, {"t": "=", "s": " de la surface totale", "amdt": true}, {"t": "-", "s": " sur l'ensemble", "amdt": false}, {"t": "+", "s": " occupée par les enseignes", "amdt": false}, {"t": "=", "s": " d'un", "amdt": true}, {"t": "-", "s": " département d'outre-mer", "amdt": false}, {"t": "+", "s": " même groupe sur la collectivité concernée", "amdt": false}, {"t": "=", "s": ". »", "amdt": false}]}, {"numero": 146, "vise": "ART. 5", "dispositif": "À l’alinéa 53, supprimer les mots :\n\n« sans délai ».", "article": "5", "effet": [{"t": "=", "s": "I.-Le titre III du livre Ier du code des assurances est complété par un chapitre V ainsi rédigé :\n« Chapitre V\n« Contrats conclus pour le remboursement et l'indemnisation des frais occasionnés par une maladie, une maternité ou un accident\n« Art. L. 135-1.-Les entreprises d'assurance sont autorisées à traiter, en application du h du paragraphe 2 de l'article 9 du règlement (UE) 2016 / 679 du Parlement européen et du Conseil du 27 avril 2016, relatif à la protection des personnes physiques à l'égard du traitement des données à caractère personnel et à la libre circulation de ces données, et abrogeant la directive 95 / 46 / CE (règlement général sur la protection des données), et dans le respect de la loi n° 78-17 du 6 janvier 1978 relative à l'informatique, aux fichiers et aux libertés, les données à caractère personnel relatives à la santé de leurs assurés et ayants droit couverts par un contrat d'assurance conclu pour le remboursement et l'indemnisation des frais occasionnés par une maladie, une maternité ou un accident, notamment les numéros de code des actes effectués et des prestations servies.\n« Elles sont également autorisées à traiter les données d'identification et de facturation des professionnels et organismes ou établissements ayant prescrit ou dispensé ces actes ou prestations.\n« Art. L. 135-2.-Peuvent faire l'objet du traitement prévu à l'article L. 135-1 les seules données strictement nécessaires :\n« 1° Au remboursement et à l'indemnisation des frais occasionnés par une maladie, une maternité ou un accident dans le cadre des contrats mentionnés au même article L. 135-1, y compris dans le cadre du tiers payant ;\n« 2° Au contrôle et aux vérifications du respect des contrats couvrant les assurés et leurs ayants droit et des conventions souscrites avec les professionnels et organismes ou établissements de santé ;\n« 3° À la constatation, à l'exercice ou à la défense de droits en justice.\n« Art. L. 135-3.-Les entreprises d'assurance mettent en œuvre les mesures techniques et organisationnelles appropriées afin de garantir un niveau élevé de sécurité ainsi que la protection des droits des personnes concernées. Elles s'assurent que les données à caractère personnel ne sont conservées que pendant une durée n'excédant pas celle strictement nécessaire au regard des finalités mentionnées à l'article L. 135-2 et que leurs personnels, qui font l'objet d'une habilitation spécifique, n'accèdent qu'aux données strictement nécessaires à leurs missions.\n« Les données à caractère personnel des traitements mis en œuvre en application du présent chapitre sont stockées exclusivement au sein de l'Espace économique européen, dans des conditions garantissant notamment la protection des données contre tout accès par des autorités publiques d'États tiers non autorisé par le droit de l'Union européenne ou d'un État membre.\n« Seuls des professionnels de santé et les personnels placés sous leur autorité chargés du contrôle médical du dossier ont accès, dans le cadre de leurs fonctions et pour la durée de leur accomplissement, aux données à caractère personnel relatives à la santé d'un assuré ou d'un ayant droit couvert par un contrat mentionné à l'article L. 135-1, lorsqu'elles sont associées au numéro de code d'une pathologie diagnostiquée.\n« Tout personnel de l'entreprise d'assurance est tenu au secret professionnel pour toutes les données à caractère personnel relatives à la santé ou d'identification et de facturation mentionnées au même article L. 135-1.\n« Art. L. 135-4.-Par dérogation à l'article L. 1110-4 du code de la santé publique et pour les seuls besoins de la mise en œuvre du tiers payant, les professionnels de santé, organismes ou établissements dispensant des actes ou prestations remboursés ou indemnisés dans le cadre des contrats mentionnés à l'article L. 135-1 du présent code à des assurés ou à leurs ayants droit couverts par ces contrats sont autorisés à communiquer aux entreprises d'assurance les données mentionnées à l'article L. 161-29 du code de la sécurité sociale et toutes autres données strictement nécessaires à cette fin.\n« Seuls des professionnels de santé et les personnels placés sous leur autorité chargés du contrôle médical du dossier ont accès, dans le cadre de leurs fonctions et pour la durée de leur accomplissement, aux données à caractère personnel relatives à la santé d'un assuré ou d'un ayant droit couvert par les contrats d'assurance mentionnés à l'article L. 135-1 du présent code, lorsqu'elles sont associées au numéro de code d'une pathologie diagnostiquée.\n« Le personnel des entreprises d'assurance est soumis au secret professionnel, dans les conditions et sous les peines prévues à l'article 226-13 du code pénal, pour toutes les informations communiquées en application du présent article.\n« Art. L. 135-5.-Un décret en Conseil d'État, pris après avis de la Commission nationale de l'informatique et des libertés, de l'Union nationale des professionnels de santé et de l'Union nationale des organismes complémentaires d'assurance maladie, précise les modalités d'application du présent chapitre, notamment :\n« 1° Les catégories de données traitées, en particulier celles mentionnées à l'article L. 135-2 et pouvant être communiquées aux entreprises d'assurance pour la mise en œuvre du tiers payant ;\n« 2° Les durées de conservation des données prévues au 1° du présent article ;\n« 3° Les modalités d'information des assurés, de leurs ayants droit et des professionnels de santé concernés, ainsi que les modalités d'exercice des droits qu'ils tiennent du règlement (UE) 2016 / 679 du Parlement européen et du Conseil du 27 avril 2016 relatif à la protection des personnes physiques à l'égard du traitement des données à caractère personnel et à la libre circulation de ces données, et abrogeant la directive 95 / 46 / CE (règlement général sur la protection des données) ;\n« 4° Les modalités de distinction entre les traitements de données réalisés à des fins de contrôle de l'exécution du contrat et ceux réalisés à des fins de constatation, d'exercice ou de défense de droits en justice ;\n« 5° Les modalités de supervision des échanges d'informations par les autorités compétentes, notamment la Commission nationale de l'informatique et des libertés, l'Autorité de contrôle prudentiel et de résolution et l'Union nationale des caisses d'assurance maladie ;\n« 6° La transmission annuelle à la Commission nationale de l'informatique et des libertés et à l'Autorité de contrôle prudentiel et de résolution d'un rapport consolidé sur les échanges réalisés au titre des articles L. 135-1 à L. 135-4 du présent code. »\nII.-Le chapitre Ier du titre Ier du livre II du code de la mutualité est complété par une section 3 ainsi rédigée :\n« Section 3\n« Contrats conclus pour le remboursement et l'indemnisation des frais occasionnés par une maladie, une maternité ou un accident\n« Art. L. 211-16.-Les mutuelles et unions sont autorisées à traiter, en application du h du paragraphe 2 de l'article 9 du règlement (UE) 2016 / 679 du Parlement européen et du Conseil du 27 avril 2016, relatif à la protection des personnes physiques à l'égard du traitement des données à caractère personnel et à la libre circulation de ces données, et abrogeant la directive 95 / 46 / CE (règlement général sur la protection des données), et dans le respect de la loi n° 78-17 du 6 janvier 1978 relative à l'informatique, aux fichiers et aux libertés, les données à caractère personnel relatives à la santé de leurs membres participants et ayants droit couverts par un contrat ou un règlement conclu pour le remboursement et l'indemnisation des frais occasionnés par une maladie, une maternité ou un accident, notamment les numéros de code des actes effectués et des prestations servies.\n« Elles sont également autorisées à traiter les données d'identification et de facturation des professionnels et organismes ou établissements ayant prescrit ou dispensé ces actes ou prestations.\n« Art. L. 211-17.-Peuvent faire l'objet du traitement prévu à l'article L. 211-16 les seules données strictement nécessaires :\n« 1° Au remboursement et à l'indemnisation des frais occasionnés par une maladie, une maternité ou un accident dans le cadre d'un contrat ou de l'adhésion à un règlement mentionné au même article L. 211-16, y compris dans le cadre du tiers payant ;\n« 2° Au contrôle et aux vérifications du respect des contrats ou règlements couvrant les membres participants et leurs ayants droit et des conventions souscrites avec les professionnels et organismes ou établissements de santé ;\n« 3° À la constatation, à l'exercice ou à la défense de droits en justice.\n« Art. L. 211-18.-Les mutuelles ou unions mettent en œuvre les mesures techniques et organisationnelles appropriées afin de garantir un niveau élevé de sécurité ainsi que la protection des droits des personnes concernées. Elles s'assurent que les données à caractère personnel ne sont conservées que pendant une durée n'excédant pas celle strictement nécessaire au regard des finalités mentionnées à l'article L. 211-17 et que leurs personnels, qui font l'objet d'une habilitation spécifique, n'accèdent qu'aux données strictement nécessaires à leurs missions.\n« Les données à caractère personnel des traitements mis en œuvre en application de la présente section sont stockées exclusivement au sein de l'Espace économique européen, dans des conditions garantissant notamment la protection des données contre tout accès par des autorités publiques d'États tiers non autorisé par le droit de l'Union européenne ou d'un État membre.\n« Seuls des professionnels de santé et les personnels placés sous leur autorité chargés du contrôle médical du dossier ont accès, dans le cadre de leurs fonctions et pour la durée de leur accomplissement, aux données à caractère personnel relatives à la santé d'un membre participant ou d'un ayant droit couvert par un contrat ou un règlement mentionné à l'article L. 211-16 lorsqu'elles sont associées au numéro de code d'une pathologie diagnostiquée.\n« Tout personnel de la mutuelle ou de l'union est tenu au secret professionnel pour toutes les données à caractère personnel relatives à la santé ou d'identification et de facturation mentionnées au même article L. 211-16.\n« Art. L. 211-19.-Par dérogation à l'article L. 1110-4 du code de la santé publique et pour les seuls besoins de la mise en œuvre du tiers payant, les professionnels de santé, organismes ou établissements dispensant des actes ou prestations remboursés dans le cadre des contrats et règlements mentionnés à l'article L. 211-16 du présent code à des membres participants ou à leurs ayants droit couverts par ces contrats ou règlements sont autorisés à communiquer aux mutuelles et unions les données mentionnées à l'article L. 161-29 du code de la sécurité sociale et toutes autres données strictement nécessaires à cette fin.\n« Seuls des professionnels de santé et les personnels placés sous leur autorité chargés du contrôle médical du dossier ont accès, dans le cadre de leurs fonctions et pour la durée de leur accomplissement, aux données à caractère personnel relatives à la santé d'un membre participant ou d'un ayant droit couvert par un contrat ou un règlement mentionné à l'article L. 211-16 du présent code, lorsqu'elles sont associées au numéro de code d'une pathologie diagnostiquée.\n« Le personnel des mutuelles et de leurs unions est soumis au secret professionnel, dans les conditions et sous les peines prévues à l'article 226-13 du code pénal, pour toutes les informations communiquées en application du présent article.\n« Art. L. 211-20.-Un décret en Conseil d'État, pris après avis de la Commission nationale de l'informatique et des libertés, de l'Union nationale des professionnels de santé et de l'Union nationale des organismes complémentaires d'assurance maladie, précise les modalités d'application de la présente section, notamment :\n« 1° Les catégories de données traitées, en particulier celles mentionnées à l'article L. 211-17 et pouvant être communiquées aux mutuelles et unions pour la mise en œuvre du tiers payant ;\n« 2° Les durées de conservation des données prévues au 1° du présent article ;\n« 3° Les modalités d'information des membres participants, de leurs ayants droit et des professionnels de santé concernés, ainsi que des modalités d'exercice des droits qu'ils tiennent du règlement (UE) 2016 / 679 du Parlement européen et du Conseil du 27 avril 2016 relatif à la protection des personnes physiques à l'égard du traitement des données à caractère personnel et à la libre circulation de ces données, et abrogeant la directive 95 / 46 / CE (règlement général sur la protection des données). »\nIII.-Le code de la sécurité sociale est ainsi modifié :\n1° Après l'article L. 114-9, sont insérés des articles L. 114-9-1 à L. 114-9-5 ainsi rédigés :\n« Art. L. 114-9-1.-Lorsque les investigations menées en application de l'article L. 114-9 mettent en évidence des faits de nature à faire présumer l'un des cas de fraude en matière sociale mentionnés au deuxième alinéa de l'article L. 114-16-2 et que l'importance ou la nature de la fraude présumée le justifie, dans des conditions définies par décret en Conseil d'État, les agents chargés du contrôle mentionnés à l'article L. 114-10 du présent code ou à l'article L. 724-7 du code rural et de la pêche maritime communiquent aux organismes d'assurance maladie complémentaire les informations strictement nécessaires à l'identification de l'auteur de ces faits et des actes et prestations sur lesquels ils portent.\n« Dans le cadre de cette communication, les données à caractère personnel relatives à la santé sont strictement limitées à la nature des actes et prestations concernés. Les informations transmises ne peuvent être conservées par l'organisme d'assurance maladie complémentaire que pour la durée strictement nécessaire aux fins de contrôle et de vérification du respect des contrats conclus pour le remboursement et l'indemnisation des frais occasionnés par une maladie, une maternité ou un accident et des conventions souscrites avec les professionnels de santé, professionnels et organismes ou établissements de santé et, le cas échéant, de constatation, d'exercice ou de défense de droits en justice.\n« Lorsqu'une décision de déconventionnement est prononcée, les agents mentionnés au premier alinéa du présent article en informent les organismes d'assurance maladie complémentaire.\n« Art. L. 114-9-2.-Lorsque l'organisme d'assurance maladie complémentaire de l'assuré a connaissance de faits pouvant être de nature à constituer une fraude et que l'importance ou la nature de la fraude le justifie, dans des conditions définies par décret en Conseil d'État, il communique aux agents chargés du contrôle mentionnés à l'article L. 114-10 du présent code ou à l'article L. 724-7 du code rural et de la pêche maritime de l'organisme compétent les informations strictement nécessaires à l'identification de l'auteur de ces faits et des actes et prestations sur lesquels ils portent.\n« Les informations transmises ne peuvent être conservées par l'organisme d'assurance maladie obligatoire qu'aux fins de déclencher ou poursuivre la procédure de contrôle ou d'enquête mentionnée au premier alinéa de l'article L. 114-9 du présent code, de constater et, le cas échéant, d'exercer ou de défendre des droits en justice, de mettre en œuvre une procédure de sanction administrative prévue à l'article L. 114-17-1 ou l'une des procédures de déconventionnement définies aux articles L. 162-15-1 et L. 162-32-3 pour les organismes d'assurance maladie obligatoire.\n« Art. L. 114-9-3.-Toute personne au sein des organismes d'assurance maladie complémentaire dont les interventions sont nécessaires aux finalités mentionnées aux articles L. 114-9-1 et L. 114-9-2 est tenue au secret professionnel.\n« Les informations communiquées en application des mêmes articles L. 114-9-1 et L. 114-9-2 ne peuvent être utilisées à d'autres fins que celles prévues à ces articles, sous peine des sanctions prévues à l'article 226-21 du code pénal.\n« Les organismes concernés s'assurent de la mise à jour des informations transmises et procèdent", "amdt": false}, {"t": "-", "s": " sans délai", "amdt": false}, {"t": "=", "s": " à la suppression des données enregistrées dès lors que la suspicion de fraude est écartée et que la personne physique ou morale concernée est mise hors de cause.\n« Art. L. 114-9-4.-Les organismes d'assurance maladie obligatoire et complémentaire peuvent recourir à un intermédiaire présentant des garanties techniques et organisationnelles appropriées assurant un haut niveau de sécurité des données ainsi que des garanties d'indépendance et d'expertise nécessaires à la mise en œuvre des échanges d'informations prévus aux articles L. 114-9-1 à L. 114-9-3.\n« Art. L. 114-9-5.-Un décret en Conseil d'État, pris après avis de la Commission nationale de l'informatique et des libertés, de l'Union nationale des professionnels de santé, de l'Union nationale des caisses d'assurance maladie et de l'Union nationale des organismes d'assurance maladie complémentaire précise les conditions et modalités de mise en œuvre des échanges d'informations prévus aux articles L. 114-9-1 à L. 114-9-4, notamment les conditions d'habilitation des personnels de l'organisme d'assurance maladie complémentaire concerné ainsi que les modalités d'information des assurés et des professionnels concernés par ces échanges. Il définit le rôle, les attributions et les garanties de sécurité de l'intermédiaire mentionné à l'article L. 114-9-4. » ;\n2° La section 1 du chapitre Ier du titre III du livre IX est complétée par des articles L. 931-3-9 à L. 931-3-13 ainsi rédigés :\n« Art. L. 931-3-9.-Les institutions de prévoyance et leurs unions sont autorisées à traiter, en application du h du paragraphe 2 de l'article 9 du règlement (UE) 2016 / 679 du Parlement européen et du Conseil du 27 avril 2016, relatif à la protection des personnes physiques à l'égard du traitement des données à caractère personnel et à la libre circulation de ces données, et abrogeant la directive 95 / 46 / CE (règlement général sur la protection des données), et dans le respect de la loi n° 78-17 du 6 janvier 1978 relative à l'informatique, aux fichiers et aux libertés, les données à caractère personnel relatives à la santé de leurs membres participants et ayants droit couverts par un contrat ou un règlement conclu pour le remboursement et l'indemnisation des frais occasionnés par une maladie, une maternité ou un accident, notamment les numéros de code des actes effectués et des prestations servies.\n« Elles sont également autorisées à traiter les données d'identification et de facturation des professionnels et organismes ou établissements ayant prescrit ou dispensé ces actes ou prestations.\n« Art. L. 931-3-10.-Peuvent faire l'objet du traitement prévu à l'article L. 931-3-9 les seules données strictement nécessaires :\n« 1° Au remboursement et à l'indemnisation des frais occasionnés par une maladie, une maternité ou un accident dans le cadre d'un contrat ou de l'adhésion à un règlement mentionné à l'article L. 931-3-9, y compris dans le cadre du tiers payant ;\n« 2° Au contrôle et aux vérifications du respect des contrats ou règlements couvrant les membres participants ainsi que leurs ayants droit et des conventions souscrites avec les professionnels et organismes ou établissements de santé ;\n« 3° À la constatation, à l'exercice ou à la défense de droits en justice.\n« Art. L. 931-3-11.-Les institutions de prévoyance et leurs unions mettent en œuvre les mesures techniques et organisationnelles appropriées afin de garantir un niveau élevé de sécurité ainsi que la protection des droits des personnes concernées. Elles s'assurent que les données à caractère personnel ne sont conservées que pendant une durée n'excédant pas celle strictement nécessaire au regard des finalités mentionnées à l'article L. 931-3-10 et que leurs personnels, qui font l'objet d'une habilitation spécifique, n'accèdent qu'aux données strictement nécessaires à leurs missions.\n« Les données à caractère personnel des traitements mis en œuvre en application de la présente section sont stockées exclusivement au sein de l'Espace économique européen, dans des conditions garantissant notamment la protection des données contre tout accès par des autorités publiques d'États tiers non autorisé par le droit de l'Union européenne ou d'un État membre.\n« Seuls des professionnels de santé et les personnels placés sous leur autorité chargés du contrôle médical du dossier ont accès, dans le cadre de leurs fonctions et pour la durée de leur accomplissement, aux données à caractère personnel relatives à la santé d'un membre participant ou d'un ayant droit couvert par un contrat ou un règlement mentionné à l'article L. 913-3-9 lorsqu'elles sont associées au numéro de code d'une pathologie diagnostiquée.\n« Tout personnel de l'institution de prévoyance ou de leur union est tenu au secret professionnel pour toutes les données à caractère personnel relatives à la santé ou d'identification et de facturation mentionnées au même article L. 931-3-9.\n« Art. L. 931-3-12.-Par dérogation à l'article L. 1110-4 du code de la santé publique et pour les seuls besoins de la mise en œuvre du tiers payant, les professionnels de santé, organismes ou établissements dispensant des actes ou prestations remboursés dans le cadre des contrats ou règlements mentionnés à l'article L. 931-3-9 du présent code à des membres participants ou à leurs ayants droit couverts par ces contrats ou règlements sont autorisés à communiquer aux institutions de prévoyance et à leurs unions les données mentionnées à l'article L. 161-29 et toutes autres données strictement nécessaires à cette fin.\n« Seuls des professionnels de santé et les personnels placés sous leur autorité chargés du contrôle médical du dossier ont accès, dans le cadre de leurs fonctions et pour la durée de leur accomplissement, aux données à caractère personnel relatives à la santé d'un membre participant ou d'un ayant droit couvert par un contrat ou un règlement mentionné à l'article L. 931-3-9 lorsqu'elles sont associées au numéro de code d'une pathologie diagnostiquée.\n« Le personnel des institutions de prévoyance et de leurs unions est soumis au secret professionnel, dans les conditions et sous les peines prévues à l'article 226-13 du code pénal, pour toutes les informations communiquées en application du présent article.\n« Art. L. 931-3-13.-Un décret en Conseil d'État, pris après avis de la Commission nationale de l'informatique et des libertés, de l'Union nationale des professionnels de santé et de l'Union nationale des organismes complémentaires d'assurance maladie, précise les modalités d'application des articles L. 931-3-9 à L. 931-3-12, notamment :\n« 1° Les catégories de données traitées, en particulier celles mentionnées à l'article L. 931-3-10 et pouvant être communiquées aux institutions de prévoyance et à leurs unions pour la mise en œuvre du tiers payant ;\n« 2° Les durées de conservation des données prévues au 1° du présent article ;\n« 3° Les modalités d'information des membres participants, de leurs ayants droit et des professionnels de santé concernés ainsi que les modalités d'exercice des droits qu'ils tiennent du règlement (UE) 2016 / 679 du Parlement européen et du Conseil du 27 avril 2016 relatif à la protection des personnes physiques à l'égard du traitement des données à caractère personnel et à la libre circulation de ces données, et abrogeant la directive 95 / 46 / CE (règlement général sur la protection des données). »\nIII bis.-L'article L. 1226-1 du code du travail est ainsi modifié :\n1° À la fin du 1°, les mots : « code de la sécurité sociale » sont remplacés par les mots : « même code » ;\n2° Après le cinquième alinéa, il est inséré un alinéa ainsi rédigé :\n« L'employeur informé de la suspension, prévue à l'article L. 315-2 dudit code, du service de l'allocation mentionnée au premier alinéa du présent article en avise, le cas échéant, l'entreprise d'assurance, la mutuelle ou union ou l'institut de prévoyance ou union assurant le versement de prestations au salarié concerné dans le cadre des garanties collectives mentionnées à l'article L. 911-2 du même code. » ;\n3° L'avant-dernier alinéa est complété par les mots : « du présent article ».\nIV.-Le 3° de l'article 65 de la loi n° 78-17 du 6 janvier 1978 relative à l'informatique, aux fichiers et aux libertés est ainsi modifié :\n1° Les mots : « ainsi que » sont remplacés par le mot : « et » ;\n2° Après le mot : « complémentaire », la fin est ainsi rédigée : « ainsi que les traitements mis en œuvre pour les finalités mentionnées à l'article L. 931-3-10 du code de la sécurité sociale, à l'article L. 135-2 du code des assurances et à l'article L. 211-17 du code de la mutualité. »", "amdt": false}]}, {"numero": 147, "vise": "ART. 6", "dispositif": "Après l’alinéa 4, insérer l’alinéa suivant :\n\n« Les chefs d’établissements des lycées, à travers le règlement intérieur adaptent les modalités de l’interdiction du téléphone portable à la réalité des pratiques et des usages. »", "article": "6", "effet": [{"t": "=", "s": "I.-Le code de l'éducation est ainsi modifié :\n1° Le premier alinéa de l'article L. 511-5 est ainsi modifié :\na) Les mots : « et les collèges » sont remplacés par les mots : «, les collèges et les lycées » ;\nb) Est ajoutée une phrase ainsi rédigée : « Dans les lycées disposant de formations de l'enseignement supérieur, le règlement intérieur peut déroger à cette interdiction pour les étudiants. » ;\n", "amdt": false}, {"t": "+", "s": "Les chefs d'établissements des lycées, à travers le règlement intérieur adaptent les modalités de l'interdiction du téléphone portable à la réalité des pratiques et des usages.\n", "amdt": false}, {"t": "=", "s": "c) Le deuxième alinéa est supprimé ;\n2° La sixième ligne du tableau du second alinéa du I de l'article L. 565-1 est ainsi rédigée :\nII.-Le présent article entre en vigueur à la date de la rentrée scolaire 2026-2027.", "amdt": false}]}, {"numero": 148, "vise": "ART. 2", "dispositif": "Compléter l’alinéa 3 par la phrase suivante :\n\n« Il assure également la coordination des comités locaux pour le droit à l’emploi existants dans un même département ou dans une même métropole. »", "article": "2", "effet": [{"t": "=", "s": "Après l'article L. 5132-2-1 du code du travail, il est inséré un article L. 5132-2-2 ainsi rédigé :\n« Art. L. 5132-2-2.-I.-Il est institué un fonds d'activation des territoires zéro chômeur de longue durée chargé de veiller au respect par les territoires mentionnés au I de l'article L. 5132-2-1, de la mise en place des comités locaux pour le droit à l'emploi et des orientations des entreprises conventionnées prévues au même article. Il apporte à ces territoires et à ces entreprises l'appui et l'accompagnement nécessaires.\n« Le fonds d'activation des territoires zéro chômeur de longue durée assure le financement d'une fraction du montant de la rémunération des emplois nécessaires à l'installation et à l'animation du comité local pour l'emploi", "amdt": false}, {"t": "+", "s": ". Il assure également la coordination des comités locaux pour le droit à l'emploi existants dans un même département ou dans une même métropole", "amdt": false}, {"t": "=", "s": ".", "amdt": true}, {"t": "=", "s": "\n« Le fonds d'activation des territoires zéro chômeur de longue durée assure également le financement d'une fraction du montant de la rémunération des emplois supplémentaires créés par les entreprises mentionnées au III de l'article L. 5132-2-1 ainsi qu'une fraction du montant de l'indemnité légale ou conventionnelle de licenciement lorsque celui-ci intervient dans les conditions prévues au V de l'article L. 5132-2-3. Ce fonds peut financer le démarrage et le développement des entreprises conventionnées mentionnées au même article L. 5132-2-3.\n« II.-Sous réserve de satisfaire aux conditions d'habilitation définies dans un cahier des charges fixé par arrêté du ministre chargé de l'emploi et d'avoir recueilli l'accord du président du département, les collectivités territoriales, les établissements publics de coopération intercommunale ou les groupes de collectivités territoriales volontaires peuvent se porter candidats à la mise en place d'un territoire zéro chômeur de longue durée prévu à l'article L. 5132-2-1. Le concours départemental visé au VI de l'article L. 5132-2-3 peut être co-financé par le département, ainsi que par les autres collectivités territoriales auxquelles appartient le territoire zéro chômeur de longue durée ; en l'absence de ce cofinancement, c'est le département qui assure le concours départemental.\n« Cette candidature détermine notamment l'objectif de création d'emplois supplémentaires en équivalents temps plein nécessaires pour répondre à l'exhaustivité des demandes des personnes dont l'éligibilité est prévue au 6° du II de L. 5132-2-1. Sur proposition du fonds d'activation des territoires zéro chômeur de longue durée, un arrêté du ministre chargé de l'emploi procède à l'habilitation du territoire et approuve la candidature retenue pour conduire la mise en place du territoire zéro chômeur de longue durée et répondre au volontariat des personnes durablement privées d'emploi.\n« Le cahier des charges prend en compte les spécificités des outre-mers et de la Corse.\n« Le fonds d'activation des territoires zéro chômeur de longue durée propose au Ministre chargé de l'emploi le retrait de l'habilitation pour les territoires qui ne respecteraient plus les conditions fixées par le cahier des charges.\n« Par dérogation au premier alinéa du présent I, les 83 territoires habilités dans le cadre de la loi n° 2020-1577 du 14 décembre 2020 relative au renforcement de l'inclusion dans l'emploi par l'activité économique et à l'expérimentation territoire zéro chômeur de longue durée dans sa rédaction antérieure à la présente loi, sont habilités de droit à poursuivre le territoire zéro chômeur de longue durée qu'ils ont amorcé sous l'empire de cette loi. Ils veillent à prendre les mesures éventuellement nécessaires à leur conformité au cahier des charges mentionné au premier alinéa du présent II.\n« III.-La gestion du fonds d'activation des territoires zéro chômeur de longue durée est confiée à l'association chargée des mêmes fonctions par la loi n° 2020-1577 du 14 décembre 2020 relative au renforcement de l'inclusion dans l'emploi par l'activité économique et à l'expérimentation territoire zéro chômeur de longue durée. Celle-ci est administrée par un conseil d'administration dont la composition est définie par un décret en Conseil d'État.\n« Les membres du conseil d'administration siègent à titre bénévole. Le conseil d'administration peut déléguer certaines de ses compétences à son président et à un bureau constitué en son sein.\n« Le ministre chargé de l'emploi désigne un commissaire du Gouvernement auprès de cette association. Le commissaire du Gouvernement assiste de droit aux séances de toutes les instances de délibération et d'administration de l'association. Il est destinataire de toutes les délibérations du conseil d'administration et a communication de tous les documents relatifs à la gestion du fonds, de même que les maires et les présidents des collectivités territoriales engagés dans la mise en place d'un territoire zéro chômeur de longue durée.\n« Lorsque le commissaire du Gouvernement estime qu'une délibération du conseil d'administration ou qu'une décision prise par une autre instance de l'association gestionnaire du fonds est contraire aux dispositions régissant les missions et la gestion du fonds, il peut s'opposer, par décision motivée, à sa mise en œuvre.\n« Le fonds publie annuellement un rapport moral et financier retraçant notamment l'ensemble des financements perçus par les territoires et les entreprises mentionnées au V de l'article L. 5132-2-1 de la présente loi ainsi que les sommes ayant concouru à son financement ainsi qu'à celui des comités locaux. Ce rapport présente le nombre de personnes embauchées par ces entreprises ainsi que le montant des prestations diverses dont elles ont bénéficié l'année précédant leur embauche. »", "amdt": false}]}, {"numero": 149, "vise": "ART. PREMIER", "dispositif": "Compléter l’alinéa 3 par la phrase suivante :\n\n« Elles sont compatibles avec la stratégie nationale bas-carbone mentionnée à l’article L. 222‑1 B du code de l’environnement et avec la stratégie nationale pour la biodiversité mentionnée à l’article L. 110‑3 du même code. »", "article": "PREMIER", "effet": [{"t": "=", "s": "Les objectifs de l'action de l'État dans le domaine des infrastructures de transport ferroviaire, routier y compris cyclable, fluvial et portuaire sont fixés par des lois de programmation portant sur une période qui ne peut être inférieure à dix ans et font l'objet d'une clause de revoyure au plus tard cinq ans après l'entrée en vigueur de celles-ci.\nLes infrastructures de transport routier comprennent l'ensemble du réseau routier, qu'il s'agisse du réseau national non concédé, départemental, intercommunal ou communal.\nCes lois de programmation déterminent les investissements projetés, en donnant la priorité à la régénération, au développement, à la modernisation, à la performance et à l'adaptation des réseaux au changement climatique", "amdt": false}, {"t": "+", "s": ". Elles sont compatibles avec la stratégie nationale bas-carbone mentionnée à l'article L. 222-1 B du code de l'environnement et avec la stratégie nationale pour la biodiversité mentionnée à l'article L. 110-3 du même code", "amdt": false}, {"t": "=", "s": ".", "amdt": true}, {"t": "=", "s": "\nCes investissements incluent, en ce qui concerne le réseau ferré national, le réseau structurant ainsi que les lignes classées de 7 à 9 par l'Union internationale des chemins de fer.\nElles déterminent également les modalités du financement de ces investissements, notamment les ressources qui devraient y être associées. Ces ressources comprennent une partie des recettes spécifiques générées par les modes de transport. Les recettes publiques spécifiques aux concessions autoroutières sont affectées en totalité au financement des infrastructures de transport par la première loi de programmation suivant l'entrée en vigueur de la présente loi. Cette première loi de programmation prévoit également les ressources nécessaires au financement des investissements dans la régénération, la modernisation et la performance des réseaux jusqu'à l'affectation de nouvelles recettes publiques spécifiques aux concessions autoroutières.\nElles font l'objet d'un travail de concertation avec les autorités organisatrices de la mobilité au plus tard trente-six mois avant le démarrage physique des travaux et, par exception, trois mois avant la première loi de programmation.\nElles définissent les critères d'équité territoriale et de répartition par mode de transport mis en œuvre par l'Agence de financement des infrastructures de transport de France lorsqu'elle assure la répartition de ces ressources sur l'ensemble du territoire national.", "amdt": false}]}, {"numero": 150, "vise": "ART. 8", "dispositif": "Compléter l’alinéa 13 par les mots :\n\n« visant à protéger les enfants et à lutter contre les violences en milieu scolaire ».", "article": "8", "effet": [{"t": "=", "s": "Le code de l'éducation est ainsi modifié :\n1° À la seconde phrase de l'article L. 151-4, les mots : « l'éducation nationale » sont remplacés par les mots : « l'enseignement privé » ;\n2° Les articles L. 234-2, L. 234-6 et L. 234-7 sont abrogés ;\n3° À la fin du premier alinéa de l'article L. 234-8, les mots : «, sous réserve des dispositions des articles L. 234-2 et L. 234-6 » sont supprimés ;\n4° (Supprimé)\n5° L'article L. 442-10 est ainsi modifié :\na) Les mots : « de la commission de concertation instituée à l'article L. 442-11 » sont remplacés par les mots : « du conseil académique de l'enseignement privé siégeant dans sa formation prévue à l'article L. 442-20-5 » ;\nb) Les mots : « soit à son » sont remplacés par les mots : « ou par l'autorité compétente de l'État en matière d'éducation, soit à leur » ;\n6° L'article L. 442-11 est abrogé ;\n7° À l'article L. 442-19, les mots : « L. 442-11 et L. 442-13 » sont remplacés par les mots : « L. 442-10, L. 442-13, L. 442-20-4 et L. 442-20-5 » ;\n8° Après la section 5 du chapitre II du titre IV du livre IV, est insérée une section 5 bis ainsi rédigée :\n« Section 5 bis\n« Conseil académique de l'enseignement privé", "amdt": false}, {"t": "+", "s": " visant à protéger les enfants et à lutter contre les violences en milieu scolaire", "amdt": false}, {"t": "=", "s": "\n« Art. L. 442-20-1.-Un conseil de l'enseignement privé est institué dans chaque académie.\n« Ce conseil se réunit dans les formations prévues aux articles L. 442-20-3 et L. 442-20-5.\n« Art. L. 442-20-2.-I.-Le conseil académique de l'enseignement privé donne son avis sur :\n« 1° Les autorisations prévues à l'article L. 731-8 ;\n« 2° L'habilitation donnée à des établissements du second degré privés de recevoir des boursiers nationaux prévue à l'article L. 531-4.\n« II.-Il tient également lieu de conseil de discipline et rend, à ce titre, un avis préalable à la décision du recteur compétent pour se prononcer sur :\n« 1° Les sanctions prévues à l'article L. 914-6 ;\n« 2° Les sanctions prévues à l'article L. 444-9 ;\n« 3° Les sanctions prévues par décret pour les manquements aux dispositions relatives au contrôle de la fréquentation et de l'assiduité scolaire.\n« Les avis du conseil sont émis à la majorité. En cas de partage égal des voix, la voix du président est prépondérante.\n« Art. L. 442-20-3.-Lorsqu'il exerce les compétences prévues à l'article L. 442-20-2, le conseil académique de l'enseignement privé comprend :\n« 1° Le recteur, en sa qualité de président du conseil ;\n« 2° En nombre égal, des représentants des enseignants des établissements d'enseignement privés, des représentants du personnel de direction en fonction dans les établissements d'enseignement privés et des représentants de l'État ;\n« 3° Des représentants des enseignants des établissements d'enseignement publics des premier et second degrés.\n« Lorsque le conseil exerce des compétences relatives à l'enseignement supérieur, un administrateur d'un établissement privé relevant de cet enseignement, nommé par le recteur, lui est adjoint.\n« La durée du mandat des membres nommés ou élus est de trois ans.\n« Art. L. 442-20-4.-Le conseil académique de l'enseignement privé exerce une mission de concertation relative aux établissements d'enseignement privés sous contrat.\n« Il peut, sous réserve de l'article L. 442-10, être consulté sur toute question relative à l'instruction, à la passation et à l'exécution des contrats ainsi qu'à l'utilisation des fonds publics conformément à leur destination, dans le cadre de ces contrats.\n« Il veille également à la mixité sociale des publics scolarisés au sein des établissements parties au contrat, en tenant compte du nombre d'établissements d'enseignement privés liés à l'État par contrat, par secteur géographique concerné. Il est saisi avant tout recours contentieux relatif à ces questions.\n« Il donne son avis sur les locaux et les subventions attribués aux établissements d'enseignement privés, dans les conditions prévues à l'article L. 151-4. Cet avis est transmis pour validation au conseil de l'éducation nationale institué dans chaque académie mentionné à l'article L. 234-1.\n« Il est consulté sur l'élaboration et la révision des schémas prévisionnels des formations prévus aux articles L. 214-1 et L. 214-2.\n« Art. L. 442-20-5.-Lorsqu'il exerce les compétences prévues à l'article L. 442-20-4, le conseil académique de l'enseignement privé comprend :\n« 1° Le recteur, en sa qualité de président du conseil ;\n« 2° Le représentant de l'État ;\n« 3° En nombre égal :\n« a) Des représentants des collectivités territoriales ;\n« b) Des représentants du personnel de direction, des enseignants et des usagers des établissements d'enseignement privés ;\n« c) Des personnes désignées par l'État.\n« D
