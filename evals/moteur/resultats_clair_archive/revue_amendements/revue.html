la méconnaissance par un exploitant d'aéronefs :\n« 1° De l'obligation prévue par le paragraphe 1 de l'article 5 du règlement (UE) 2023 / 2405 du Parlement européen et du Conseil du 18 octobre 2023 d'embarquer une quantité annuelle de carburant d'aviation dans un aéroport de l'Union représentant au moins 90 % de la quantité annuelle de carburant d'aviation requise, lorsque cette méconnaissance n'est pas justifiée par la nécessité de respecter des règles de sécurité en matière de carburant prévue par le paragraphe 2 de cet article 5 ou par l'octroi de l'exemption temporaire régie par les paragraphes 3 à 8 du même article ;\n« 2° Des obligations de déclaration incombant à l'exploitant d'aéronef prévues par l'article 8 du même règlement.\n« Art. L. 229-85.-Le montant de cette amende tient compte de la nature, de la durée, de la récurrence et de la gravité des manquements constatés. Il est compris entre deux et cinq fois le montant résultant de la multiplication du prix moyen annuel de la tonne de carburant d'aviation par la quantité annuelle totale non embarquée, sur la base des données dont l'autorité administrative compétente dispose.\n« Sous-section 3\n« Sanctions applicables aux gestionnaires d'aéroport\n« Art. L. 229-86.-Est passible d'une amende prononcée par l'autorité administrative compétente la méconnaissance par l'entité gestionnaire d'un aéroport de l'obligation de prendre toutes les mesures nécessaires pour faciliter l'accès des exploitants d'aéronefs à des carburants d'aviation contenant des parts minimales de carburants d'aviation durables prévue par le paragraphe 1 de l'article 6 du règlement (UE) 2023 / 2405 du Parlement européen et du Conseil du 18 octobre 2023.\n« Art. L. 229-87.-Le montant de cette amende tient compte de la nature, de la durée, de la récurrence et de la gravité des manquements constatés. Il ne peut excéder 15 000 € par manquement.\n« Art. L. 229-88.-Le prononcé d'une sanction en application de la présente sous-section est sans préjudice de la mise en œuvre de la procédure prévue par le paragraphe 2 et par la première phrase du paragraphe 3 de l'article 6 du règlement (UE) 2023 / 2405 du Parlement européen et du Conseil du 18 octobre 2023.\n« Sous-section 4\n« Dispositions communes et finales\n« Art. L. 229-89.-Les modalités de calcul du montant des sanctions prévues aux sous-sections 1 et 2 de la présente section sont fixées par arrêté du ministre chargé de l'aviation civile.\n« Art. L. 229-90.-Les agents des douanes et les agents placés sous l'autorité du ministre chargé de l'aviation civile sont autorisés à se communiquer, sur demande ou spontanément, tous les renseignements et documents détenus ou recueillis dans l'exercice de leurs missions relatives aux carburants d'aviation.\n« Art. L. 229-91.-La procédure suivie par l'autorité administrative compétente pour prononcer les sanctions prévues à la présente section est définie par décret en Conseil d'État.\n« Ce décret précise également les modalités de la mise en œuvre des déclarations aux autorités compétentes associées. »", "amdt": false}]}, {"numero": 41, "vise": "ART. 15", "dispositif": "Au début de l’alinéa 1, insérer les mots suivants :\n\n« Afin de garantir l’égalité réelle des citoyens de Mayotte en matière d’accès aux droits sociaux, ».", "article": "15", "effet": [{"t": "+", "s": "Afin de garantir l'égalité réelle des citoyens de Mayotte en matière d'accès aux droits sociaux,", "amdt": false}, {"t": "=", "s": " I.-Dans les conditions prévues à l'article 38 de la Constitution, le Gouvernement est autorisé à prendre par voie d'ordonnance, dans un délai d'un an à compter de la promulgation de la présente loi, toute mesure relevant du domaine de la loi afin de rendre applicable à Mayotte, sous réserve d'adaptations tenant compte des caractéristiques et des contraintes particulières du territoire, la législation en vigueur en métropole dans les matières relatives :\n1° Aux prestations de sécurité sociale, à l'aide sociale et à la prise en charge des frais de santé ;\n2° Aux cotisations, contributions et impositions affectées au financement des régimes de sécurité sociale ;\n3° À l'organisation et à la gestion des régimes de sécurité sociale ;\n4° Aux règles applicables à l'offre de soins ;\n5° Aux contrôles et à la lutte contre la fraude, aux échanges d'informations et aux contentieux relatifs à la sécurité sociale et à l'aide sociale ;\n6° Aux conditions dans lesquelles les exonérations définies à l'article L. 752-3-2 du code de la sécurité sociale sont rendues applicables à Mayotte à partir du 1er janvier 2026 et l'article 244 quater du code général des impôts abrogé.\nCes ordonnances procèdent aux modifications nécessaires pour assurer le respect de la hiérarchie des normes, améliorer la cohérence rédactionnelle des textes, harmoniser l'état du droit, remédier aux erreurs et insuffisances et abroger les dispositions obsolètes ou devenues sans objet.\nUn projet de loi de ratification est déposé devant le Parlement dans un délai de six mois à compter de la publication de chaque ordonnance.\nII.-À partir de 2026 et jusqu'en 2036, le Gouvernement remet chaque année au Parlement un rapport sur les disparités entre les montants de prestations sociales versés à Mayotte et ceux versés dans l'hexagone et dans les autres départements d'outre-mer.\nCe rapport présente notamment les ordonnances prises en application du premier alinéa du I du présent article au cours de l'année écoulée et les autres mesures à caractère législatif ou réglementaire applicables à Mayotte prises dans les matières mentionnées aux 1° à 5° du même I et les compare avec le calendrier proposé dans le rapport prévu à l'article 36 de la loi n° 2025-176 du 24 février 2025 d'urgence pour Mayotte.\nDans des conditions déterminées par décret, deux parlementaires sont associés aux travaux visant à rendre applicable à Mayotte, sous réserve d'adaptations tenant compte des caractéristiques et contraintes particulières du territoire, la législation en vigueur en métropole dans les matières énumérées aux 1° à 5° du I du présent article.\nIII.-La perte de recettes pour les organismes de sécurité sociale résultant du 6° du I est compensée à due concurrence par la majoration de l'accise sur les tabacs prévue au chapitre IV du titre Ier du livre III du code des impositions sur les biens et services.", "amdt": false}]}, {"numero": 42, "vise": "ART. 3", "dispositif": "I. – Substituer à l’alinéa 6 les quatre alinéas suivants :\n\n« 2° Après le même article L. 2113‑4, il est inséré un article L. 2113‑4‑1 ainsi rédigé :\n\n« Art. L. 2113‑4‑1. – I. – Par dérogation au c du III de l’article L. 3113‑2, lorsque les communes concernées par une demande de création d’une commune nouvelle dont la population totale serait comprise entre 3 500 et 3 999 habitants ne sont pas situées sur le territoire d’un même canton, leurs conseils municipaux peuvent, par délibérations concordantes, demander à ce que la commune nouvelle soit intégrée dans le canton sur lequel est située la commune concernée par cette demande la plus peuplée.\n\n« Par dérogation au c du III de l’article L. 3113‑2, dans un délai de six mois suivant la création d’une commune nouvelle dont la population est comprise entre 3 500 et 3 999 habitants à la date de sa création, une délibération de son conseil municipal peut demander à ce que la commune nouvelle soit intégrée dans le canton sur lequel est située la partie de son territoire la plus peuplée.\n\n« II. – Les modifications des limites cantonales demandées en application du I du présent article sont décidées dans les conditions définies au I de l’article L. 3113‑2. »\n\nII. – En conséquence, à la première phrase de l’alinéa 7, substituer aux mots :\n\n« c du III de l’article L. 3113‑2 »\n\nles mots :\n\n« I de l’article L. 2113‑4‑1 ».\n\nIII. – En conséquence, à la même première phrase de l’alinéa 7, substituer à la deuxième occurrence du mot :\n\n« est »\n\nles mots :\n\n« peut être ».\n\nIV. – En conséquence, après la référence :\n\n« II »,\n\nrédiger ainsi la fin de l’alinéa 8 :\n\n« sont décidées dans les conditions définies au I de l’article L. 3113‑2 du code général des collectivités territoriales, dans le respect de l’article L. 567‑1 A du code électoral. »", "article": "3", "effet": [{"t": "=", "s": "I.-Le code général des collectivités territoriales est ainsi modifié :\n1° L'article L. 2113-4 est ainsi modifié :\na) À la dernière phrase, les mots : « décision est réputée » sont remplacés par les mots : « avis est réputé » ;\nb) Il est ajouté un alinéa ainsi rédigé :\n« Par dérogation au premier alinéa du présent article, si au moins un conseil départemental ou un conseil régional concerné a adopté une délibération motivée s'opposant à cette modification, le ministre chargé des collectivités territoriales saisit les communes concernées par la demande de création d'une commune nouvelle. Celles-ci doivent confirmer, par délibérations concordantes et motivées, leur projet de création d'une commune nouvelle en précisant les motifs justifiant le rattachement à un département ou une région. Dans ce cas, la modification des limites territoriales des départements ou des régions est décidée par décret en Conseil d'État. »\n", "amdt": false}, {"t": "=", "s": "2°", "amdt": true}, {"t": "-", "s": " (Supprimé)", "amdt": false}, {"t": "+", "s": " Après le même article L. 2113-4, il est inséré un article L. 2113-4-1 ainsi rédigé :", "amdt": false}, {"t": "=", "s": "\n", "amdt": false}, {"t": "-", "s": "II", "amdt": false}, {"t": "+", "s": " « Art. L. 2113-4-1.-I", "amdt": false}, {"t": "=", "s": ".-Par dérogation au c du III de l'article L. 3113-2", "amdt": true}, {"t": "+", "s": ", lorsque les communes concernées par une demande de création d'une commune nouvelle dont la population totale serait comprise entre 3 500 et 3 999 habitants ne sont pas situées sur le territoire d'un même canton, leurs conseils municipaux peuvent, par délibérations concordantes, demander à ce que la commune nouvelle soit intégrée dans le canton sur lequel est située la commune concernée par cette demande la plus peuplée.\n« Par dérogation au c du III de l'article L. 3113-2, dans un délai de six mois suivant la création d'une commune nouvelle dont la population est comprise entre 3 500 et 3 999 habitants à la date de sa création, une délibération de son conseil municipal peut demander à ce que la commune nouvelle soit intégrée dans le canton sur lequel est située la partie de son territoire la plus peuplée.\n« II.-Les modifications des limites cantonales demandées en application du I du présent article sont décidées dans les conditions définies au I de l'article L. 3113-2. »\nII.-Par dérogation au I de l'article L. 2113-4-1", "amdt": false}, {"t": "=", "s": " du code général des collectivités territoriales, toute commune nouvelle dont la population est comprise entre 3 500 et 3 999 habitants à la date de publication de la présente loi", "amdt": false}, {"t": "-", "s": " est", "amdt": false}, {"t": "+", "s": " peut être", "amdt": false}, {"t": "=", "s": " intégrée, à sa demande, dans le canton sur lequel est située la partie de son territoire la plus peuplée. La demande est formulée par délibération du conseil municipal de la commune nouvelle, au plus tard le 1er septembre 2026.\nLes modifications des limites cantonales effectuées en application du présent II", "amdt": false}, {"t": "-", "s": " doivent intervenir avant le 1er janvier 2027. Elles", "amdt": false}, {"t": "=", "s": " sont décidées dans les conditions définies au I de l'article L. 3113-2 du code général des collectivités territoriales", "amdt": true}, {"t": "+", "s": ", dans le respect de l'article L", "amdt": false}, {"t": "=", "s": ".", "amdt": true}, {"t": "+", "s": " 567-1 A du code électoral.", "amdt": false}]}, {"numero": 43, "vise": "ART. 1ER BIS", "dispositif": "Compléter cet article par l’alinéa suivant :\n\n« II. – Au premier alinéa de l’article 40‑4 du code de procédure pénale, après la référence « 3° », sont insérés les mots : « du I ».", "article": "1ER BIS", "effet": [{"t": "=", "s": "L'article 10-2 du code de procédure pénale est ainsi modifié :\n1° Au début du premier alinéa, est ajoutée la mention : « I.-» ;\n2° Il est ajouté un II ainsi rédigé :\n« II.-Les officiers et les agents mentionnés au premier alinéa du I interrogent la victime sur sa connaissance des biens mobiliers ou immobiliers susceptibles d'avoir été l'instrument de l'infraction motivant la plainte. La victime est informée du caractère obligatoire de la confiscation de ces biens dans les cas prévus à l'article 131-21 du code pénal et des possibilités de se faire payer l'indemnisation ou la réparation accordée par la juridiction sur les fonds ou sur la valeur liquidative des biens confisqués en application de l'article 706-164 du présent code. »", "amdt": false}, {"t": "+", "s": "\nII.-Au premier alinéa de l'article 40-4 du code de procédure pénale, après la référence « 3° », sont insérés les mots : « du I ».", "amdt": false}]}, {"numero": 44, "vise": "ART. 7", "dispositif": "Substituer à l’alinéa 62 les deux alinéas suivants :\n\n« 3° Le 2° du II de l’article L. 950‑1 est complété par un alinéa ainsi rédigé :\n\n« Toutefois, les articles L. 820‑4, L. 820‑15, L. 821‑4, L. 821‑18, L. 821‑25, L. 821‑35, L. 821‑54, L. 821‑63, L. 821‑67, L. 821‑74, L. 822‑1, L. 822‑2, L. 822‑6, L. 822‑20, L. 822‑24, L. 822‑28 et L. 822‑38 sont applicables dans leur rédaction résultant de la loi n° du portant diverses dispositions d’adaptation au droit de l’Union européenne en matière économique, financière, environnementale, énergétique, de transport, de santé et de circulation des personnes. »", "article": "7", "effet": [{"t": "=", "s": "Le code de commerce, dans sa rédaction résultant de l'ordonnance n° 2023-1142 du 6 décembre 2023 relative à la publication et à la certification d'informations en matière de durabilité et aux obligations environnementales, sociales et de gouvernement d'entreprise des sociétés commerciales, est modifié conformément aux dispositions du présent article.\nI.-Au livre II :\n1° À l'article L. 232-6-3 :\na) Au III, les mots : « organisme tiers indépendant inscrit sur la liste mentionnée au I de l'article L. 822-3 » sont remplacés par les mots : « auditeur des informations en matière de durabilité inscrit sur la liste mentionnée à l'article L. 822-4 » ;\nb) Au deuxième alinéa du V, les mots : « société consolidante » sont remplacés par les mots : « entreprise consolidante » ;\n2° Au IV de l'article L. 232-6-4, les mots : « organisme tiers indépendant inscrit sur la liste mentionnée au I de l'article L. 822-3 » sont remplacés par les mots : « auditeur des informations en matière de durabilité inscrit sur la liste mentionnée à l'article L. 822-4 » ;\n3° À l'article L. 233-28-4 :\na) Au III, les mots : « organisme tiers indépendant inscrit sur la liste mentionnée au I de l'article L. 822-3 » sont remplacés par les mots : « auditeur des informations en matière de durabilité inscrit sur la liste mentionnée à l'article L. 822-4 » ;\nb) Au V, les mots : « société consolidante » sont remplacés par les mots : « entreprise consolidante » ;\n4° Au IV de l'article L. 233-28-5, les mots : « organisme tiers indépendant inscrit sur la liste mentionnée au I de l'article L. 822-3 » sont remplacés par les mots : « auditeur des informations en matière de durabilité inscrit sur la liste mentionnée à l'article L. 822-4 ».\nII.-Au titre II du livre VIII :\n1° Aux deuxième et sixième alinéas du II de l'article L. 820-4, les mots : « au I de l'article L. 822-4 » sont remplacés par les mots : « à l'article L. 822-4 » ;\n2° Au premier alinéa de l'article L. 820-15, les mots : « auditeurs de durabilité » sont remplacés par les mots : « auditeurs des informations en matière de durabilité » ;\n3° Au premier alinéa du I de l'article L. 821-4 :\na) À la deuxième phrase, les mots : « honoraires perçus » sont remplacés par les mots : « sommes perçues » ;\nb) À la quatrième phrase, les mots : « envisage de réaliser » sont remplacés par le mot : « réalise » ;\n4° Au 2° du I de l'article L. 821-18, les mots : « organisme tiers indépendant inscrit sur la liste mentionnée au I de l'article L. 822-3 » sont remplacés par les mots : « auditeur des informations en matière de durabilité inscrit sur la liste mentionnée à l'article L. 822-4 » ;\n5° À l'article L. 821-25 :\na) Les deuxième et troisième phrases du premier alinéa sont supprimées ;\nb) Après le premier alinéa, il est inséré un alinéa ainsi rédigé :\n« La profession de commissaire aux comptes ne peut être exercée qu'au sein d'une seule société de commissaires aux comptes. Les membres du conseil d'administration ou du conseil de surveillance peuvent être salariés de la société sans limitation de nombre ni condition d'ancienneté au titre de la qualité de salarié. » ;\nc) Le quatrième alinéa, qui devient le cinquième, est remplacé par un alinéa ainsi rédigé :\n« Par dérogation au premier alinéa, l'exercice de la profession est possible simultanément au sein d'un groupe de sociétés de commissaires aux comptes formé par une société et les sociétés qu'elle contrôle au sens des II et III de l'article L. 233-16 du présent code. L'exercice de la profession est également possible simultanément au sein de deux sociétés de commissaires aux comptes dans le cas où leurs associés ou actionnaires sont communs pour au moins la moitié d'entre eux. » ;\n6° À la fin de la troisième phrase du troisième alinéa de l'article L. 821-35, sont ajoutés les mots : « ou des informations combinées en matière de durabilité. » ;\n7° Au II de l'article L. 821-54 :\na) Au premier alinéa, les mots : « le respect des exigences prévues à ces mêmes articles, ainsi que sur » sont remplacés par les mots : « la conformité à ces mêmes dispositions, y compris » ;\nb) Les 1°, 2°, 3° et 4° sont remplacés par les dispositions suivantes :\n« 1° Les normes d'information en matière de durabilité adoptées par la Commission européenne en vertu des articles 29 ter ou 29 quater de la directive 2013 / 34 / UE du Parlement européen et du Conseil ;\n« 2° Les exigences découlant des normes mentionnées au 1° en ce qui concerne le processus mis en œuvre par l'entité pour déterminer les informations publiées, ce qui inclut, lorsque l'entité y est soumise, l'obligation mentionnée au sixième alinéa de l'article L. 2312-17 du code du travail ;\n« 3° Les exigences de balisage de l'information, conformément au format d'information électronique précisé à l'article 3 du règlement délégué (UE) 2019 / 815 de la Commission européenne.\n« Cet avis porte également sur le respect des exigences de publication des informations prévues à l'article 8 du règlement (UE) 2020 / 852 du Parlement européen et du Conseil. » ;\nc) Au sixième alinéa, les mots : « Cet avis » sont remplacés par le mot : « Il » ;\n8° Au I de l'article L. 821-63 :\na) Au 3°, les mots : « au rapport de durabilité » sont remplacés par les mots : « à ces informations » ;\nb) Le 4° est supprimé et les 5° et 6° deviennent respectivement les 4° et 5° ;\n9° Au III de l'article L. 821-67, les mots : « Dans ce cas, ce comité est composé conformément aux dispositions de l'alinéa premier du II. » sont supprimés et il est ajouté un alinéa ainsi rédigé :\n« La composition de ce comité est fixée, selon le cas, par l'organe chargé de l'administration ou de la surveillance. Elle ne peut comprendre que des membres de l'organe chargé de l'administration ou de la surveillance en fonction dans la société, à l'exclusion de ceux exerçant des fonctions de direction. » ;\n10° Au septième alinéa de l'article L. 821-74, les mots : « au I de l'article L. 822-4 » sont remplacés par les mots : « à l'article L. 822-4 » et les mots : « auditeurs de durabilité » sont remplacés par les mots : « auditeurs des informations en matière de durabilité » ;\n11° Au 2° du II de l'article L. 822-1, les mots : « énumérées au II de l'article L. 822-4 et inscrite sur la liste mentionnée au I de l'article L. 822-4 » sont remplacés par les mots : « énumérées à l'article L. 822-4 et inscrite sur la liste mentionnée au même article » ;\n12° À la fin du deuxième alinéa de l'article L. 822-2, il est ajouté une phrase ainsi rédigée : « Ces dispositions s'appliquent également lorsqu'une personne établit des comptes combinés ou des informations combinées en matière de durabilité. » ;\n13° Après le deuxième alinéa de l'article L. 822-6, il est inséré un alinéa ainsi rédigé :\n« Par dérogation au précédent alinéa, un auditeur des informations en matière de durabilité associé, actionnaire ou dirigeant d'un organisme tiers indépendant peut exercer cette mission simultanément au sein d'un groupe de sociétés inscrites sur la liste mentionnée à l'article L. 822-3, formé par une société et les sociétés qu'elle contrôle au sens des II et III de l'article L. 233-16 du présent code. L'exercice de la mission est également possible simultanément au sein de deux sociétés inscrites sur la liste mentionnée à l'article L. 822-3 dans le cas où leurs associés ou actionnaires sont communs pour au moins la moitié d'entre eux. » ;\n14° Au troisième alinéa de l'article L. 822-20, les mots : « auditeur de durabilité » sont remplacés, deux fois, par les mots : « auditeur des informations en matière de durabilité » ;\n15° À l'article L. 822-24 :\na) Au premier alinéa, les mots : « le respect des exigences prévues selon les cas, aux articles » sont remplacés par les mots : « la conformité aux dispositions des articles » et les mots : « ainsi que sur » sont remplacés par les mots : « selon le cas, y compris » ;\nb) Les 1°, 2°, 3° et 4° sont remplacés par les dispositions suivantes :\n« 1° Les normes d'information en matière de durabilité adoptées par la Commission européenne en vertu des articles 29 ter ou 29 quater de la directive 2013 / 34 / UE du Parlement européen et du Conseil ;\n« 2° Les exigences découlant des normes mentionnées au 1° en ce qui concerne le processus mis en œuvre par l'entité pour déterminer les informations publiées, ce qui inclut, lorsque l'entité y est soumise, l'obligation mentionnée au sixième alinéa de l'article L. 2312-17 du code du travail ;\n« 3° Les exigences de balisage de l'information, conformément au format d'information électronique précisé à l'article 3 du règlement délégué (UE) 2019 / 815 de la Commission européenne.\n« Cet avis porte également sur le respect des exigences de publication des informations prévues à l'article 8 du règlement (UE) 2020 / 852 du Parlement européen et du Conseil. » ;\nc) Au sixième alinéa, les mots : « Cet avis » sont remplacés par le mot : « Il » ;\n16° Au I de l'article L. 822-28 :\na) Au 2°, les mots : « au rapport de durabilité » sont remplacés par les mots : « aux informations en matière de durabilité » ;\nb) Au 4° :\ni) Les mots : « le rapport de certification des » sont remplacés par le mot : « les » ;\nii) Les mots : « comparés à celui » sont remplacés par les mots : « comparées à celles » ;\n17° À l'article L. 822-38, les mots : « ainsi qu'aux manquements » sont remplacés par les mots : « ainsi qu'aux auditeurs des informations en matière de durabilité ayant manqué ».\nIII.-Au titre IV du livre IX :\n1° À l'avant-dernier alinéa du 2° du I de l'article L. 950-1, les références : « L. 232-6-3, L. 232-6-4 » et « L. 233-28-4, L. 233-28-5 » sont supprimées ;\n2° À la suite de l'avant-dernier alinéa du 2° du I de l'article L. 950-1, il est inséré un alinéa ainsi rédigé :\n« Les articles L. 232-6-3, L. 232-6-4, L. 233-28-4 et L. 233-28-5 sont applicables dans leur rédaction résultant de la loi n° du » ;\n", "amdt": false}, {"t": "=", "s": "3°", "amdt": true}, {"t": "-", "s": " Au", "amdt": false}, {"t": "+", "s": " Le", "amdt": false}, {"t": "=", "s": " 2° du II de l'article L. 950-1", "amdt": true}, {"t": "+", "s": " est complété par un alinéa ainsi rédigé :\n« Toutefois", "amdt": false}, {"t": "=", "s": ",", "amdt": true}, {"t": "-", "s": " après", "amdt": false}, {"t": "=", "s": " les", "amdt": true}, {"t": "-", "s": " mots : « dans leur rédaction résultant de l'ordonnance n° 2023-1142 du 6 décembre 2023 », sont insérés les mots : «, à l'exception des", "amdt": false}, {"t": "=", "s": " articles L. 820-4, L. 820-15, L. 821-4, L. 821-18, L. 821-25, L. 821-35, L. 821-54, L. 821-63, L. 821-67, L. 821-74, L. 822-1, L. 822-2, L. 822-6, L. 822-20, L. 822-24, L. 822-28 et L. 822-38", "amdt": true}, {"t": "-", "s": " qui", "amdt": false}, {"t": "=", "s": " sont applicables dans leur rédaction résultant de la loi n° du", "amdt": true}, {"t": "+", "s": " portant diverses dispositions d'adaptation au droit de l'Union européenne en matière économique, financière, environnementale, énergétique, de transport, de santé et de circulation des personnes.", "amdt": false}, {"t": "=", "s": " »", "amdt": true}, {"t": "-", "s": ".", "amdt": false}]}, {"numero": 45, "vise": "ART. 3", "dispositif": "À l’alinéa 14, après le mot :\n\n« passation »,\n\ninsérer les mots :\n\n« et de retrait ».", "article": "3", "effet": [{"t": "=", "s": "Après l'article L. 5132-2-2 du code du travail, il est inséré un article L. 5132-2-3 ainsi rédigé :\n« Art. L. 5132-2-3.-I.-Le fonds d'activation des territoires zéro chômeur de longue durée signe des conventions avec les entreprises mentionnées au III de l'article L. 5132-2-1 afin qu'elles concluent avec les personnes remplissant les conditions mentionnées au VII du même article L. 5132-2-1, des contrats de travail à durée indéterminée au moins rémunérés au niveau du salaire minimum de croissance mentionné à l'article L. 3231-2. Ces conventions sont signées pour une période de cinq ans.\n« Chaque convention fixe les conditions à respecter pour bénéficier du financement du fonds, notamment les engagements de l'entreprise sur sa trajectoire d'embauche prévue et son plan d'affaires, le contenu des postes proposés, les conditions d'accompagnement et les actions de formation envisagées pour les salariés, conformément aux objectifs du projet. La modification de la trajectoire d'embauche prévue dans la candidature du territoire s'opère avec l'accord du fonds d'activation des territoires zéro chômeur de longue durée. La convention précise également la part de la rémunération prise en charge par le fonds, compte tenu de la durée de travail prévue dans le contrat et en fonction du prévisionnel et de la situation économique de l'entreprise. Elle prévoit en outre la fraction de l'indemnité de licenciement prise en charge par le fonds et due lorsque le licenciement intervient dans les conditions prévues au V du présent article.\n« Le président du conseil départemental est cosignataire de la convention.\n« II.-Le contrat de travail conclu dans le cadre du I du présent article peut être suspendu avec l'accord du salarié afin de permettre d'accomplir une période d'essai afférente à une offre d'emploi en contrat de travail à durée indéterminée ou à durée déterminée au moins égale à six mois. En cas d'embauche à l'issue de cette période d'essai, le contrat est rompu sans préavis. L'aide attribuée pour cet emploi par le fonds dans le cadre du territoire zéro chômeur de longue durée n'est pas versée pendant la période de suspension du contrat de travail.\n« III.-Les conventions antérieurement conclues avec les entreprises conventionnées dans le cadre de la loi n° 2016-231 du 29 février 2016 d'expérimentation territoriale visant à résorber le chômage de longue durée sont automatiquement reconduites à l'entrée en vigueur du présent titre, elles doivent ensuite être prolongées par des conventions conforme au I du présent article.\n« À compter de la date définie par le décret mentionné au VII du présent article, et au plus tard à compter du 1er juillet 2026, les dispositions de la présente loi sont substituées à celles de la loi n° 2020-1577 du 14 décembre 2020 relative au renforcement de l'inclusion dans l'emploi par l'activité économique et à l'expérimentation « territoire zéro chômeur de longue durée ».\n« Le cas échéant, les transferts de biens, droits et obligations réalisées dans le cadre des dévolutions, à titre gratuit ou moyennant la seule prise en charge du passif ayant grevé l'acquisition des biens transférés au profit du fonds d'activation territoires zéro chômeur de longue durée mentionné au I de l'article L. 5132-2-2 et de l'association gestionnaire mentionnée au III du même article, ne donnent lieu au paiement d'aucun droit, taxe ou impôt de quelque nature que ce soit. Ils ne donnent pas non plus lieu au paiement de la contribution prévue à l'article 879 du code général des impôts.\n« Les contrats de travail conclus par les entreprises dans les territoires mentionnés au I de l'article 1er de la loi n° 2016-231 du 29 février 2016 précitée se poursuivent dans les conditions prévues par la présente loi.\n« IV.-Le fonds d'activation des territoires zéro chômeur de longue durée est financé par l'État et les départements concernés ainsi que, de manière volontaire, par les collectivités territoriales, les établissements publics de coopération intercommunale, les groupes de collectivités territoriales, les organismes publics et privés mentionnés au I de l'article L. 5132-2-1 pour assurer son fonctionnement et permettre le versement des aides financières associées aux conventions mentionnées au I du présent article.\n« Le fonds signe avec chaque collectivité territoriale, établissement public de coopération intercommunale ou groupe de collectivités territoriales volontaire participant aux territoires zéro chômeur de longue durée mentionnés à l'article L. 5132-2-1 une convention qui précise leur engagement à respecter le cahier des charges mentionné au II de l'article L. 5132-2-2, fixe les conditions de leur participation volontaire au financement aux territoires zéro chômeur de longue durée et définit l'affectation de cette participation. L'État, France Travail ainsi que le président du conseil départemental sont également cosignataires de ces conventions. Ces conventions sont signées pour une durée de cinq ans.\n« Le fonds signe une convention avec l'État, les conseils départementaux et chacun des organismes publics et privés participant aux territoires zéro chômeur de longue durée mentionnés à l'article L. 5132-2-1 afin de fixer le montant de leur contribution à son financement et de définir l'affectation de cette contribution. Ces conventions sont signées pour une durée de cinq ans.\n« V.-Si un territoire zéro chômeur de longue durée mentionné à l'article L. 5132-2-1 est interrompu par une décision du fonds mentionné au I de l'article L. 5132-2-2, les entreprises mentionnées au I de l'article L. 5132-2-1 reçoivent une notification du fonds d'activation des territoires zéro chômeur de longue durée suspendant ou dénonçant leur conventionnement et signifiant la fin de la prise en charge d'une fraction des rémunérations dans le cadre de l'expérimentation. Dans ce cas, ces entreprises peuvent rompre tout ou partie des contrats de travail mentionnés au I du présent article. Ce licenciement, qui repose sur un motif économique et sur une cause réelle et sérieuse, est prononcé selon les modalités d'un licenciement individuel pour motif économique. Le fonds verse à l'employeur la fraction du montant de l'indemnité de licenciement fixée par la convention mentionnée au I de l'article L. 5132-2-2. Dans tous les autres cas, le licenciement intervient dans les conditions du droit commun.\n« VI.-Un décret en Conseil d'État définit les modalités d'application des articles L. 5132-2-1 et L. 5132-2-2, ainsi que du présent article, notamment la méthodologie de l'évaluation du développement des territoires zéro chômeur de longue durée et leur relation avec les acteurs du réseau pour l'emploi, les modalités de transmission dans le cadre de l'évaluation mentionnée au V de l'article L. 5132-2-1 ainsi qu'au fonds mentionné au I de l'article L5132-2-2 des données à caractère personnel, y compris le numérod'inscription au répertoire national d'identification des personnes physiques, relatives aux personnes mentionnées au V de l'article L. 5132-2-1 et nécessaires au pilotage et à l'évaluation du territoire zéro chômeur de longue durée, les modalités de fonctionnement et de gestion des comités locaux et du fonds respectivement mentionnés au VI du même article L. 5132-2-1 et à l'article L. 5132-2-2, les modalités de financement du fonds par les départements, les modalités de passation", "amdt": false}, {"t": "+", "s": " et de retrait", "amdt": false}, {"t": "=", "s": " des conventions conclues entre le fonds et les entreprises mentionnées à l'article L. 5132-2-1 et celles conclues entre le fonds et les collectivités territoriales, les établissements publics de coopération intercommunale ou les groupes de collectivités territoriales participant aux territoires zéro chômeur de longue durée mentionnés au même article L. 5132-2-1 ainsi que les critères retenus pour fixer le montant du financement du montant de la rémunération des emplois nécessaires à l'installation et à l'animation du comité local pour l'emploi et de la fraction de la rémunération prise en charge par le fonds mentionné à l'article L. 5132-2-2.\n« Le décret mentionné au premier alinéa du présent VI ne peut prévoir que le montant du concours financier obligatoire des départements excède, pour chaque salarié embauché à temps plein dans le cadre des territoires zéro chômeur de longue durée mentionnés au V de l'article L. 5132-2-1, celui du montant forfaitaire mentionné à l'article L. 262-3 du code de l'action sociale et des familles.\n« Le concours obligatoire des départements fixé par le décret peut être complété par une contribution volontaire.\n« VII.-Les dispositions du présent titre entrent en vigueur à une date fixée par décret, et au plus tard le 1er juillet 2026. »", "amdt": false}]}, {"numero": 46, "vise": "ART. 28", "dispositif": "Rédiger ainsi l’alinéa 5 :\n\n« L’avis rendu par l’Autorité de régulation des transports sur l’avant-projet de contrat pluriannuel de l’attributaire pressenti n’est rendu public dans les conditions prévues par l’article L. 1261‑2 que pour le candidat désigné comme concessionnaire de l’aéroport et lorsque le contrat de concession a été signé. »", "article": "28", "effet": [{"t": "=", "s": "I.-Le code des transports est ainsi modifié :\n1° Après le premier alinéa de l'article L. 6325-2, il est inséré un alinéa ainsi rédigé :\n« La durée maximale prévue au premier alinéa peut être portée à quinze ans pour le premier contrat pluriannuel conclu à la suite de l'attribution d'un contrat de concession pour la construction, l'entretien et l'exploitation d'un aérodrome. » ;\n2° Le dernier alinéa du I de l'article L. 6327-3 est complété par une phrase ainsi rédigée :\n", "amdt": false}, {"t": "=", "s": "«", "amdt": true}, {"t": "-", "s": " Par dérogation à l'article", "amdt": false}, {"t": "=", "s": " L", "amdt": true}, {"t": "-", "s": ". 1261-2, l", "amdt": false}, {"t": "=", "s": "'avis", "amdt": true}, {"t": "-", "s": " de", "amdt": false}, {"t": "+", "s": " rendu par", "amdt": false}, {"t": "=", "s": " l'Autorité de régulation des transports", "amdt": true}, {"t": "-", "s": " n'est pas rendu public, sauf celui qu'elle a rendu", "amdt": false}, {"t": "=", "s": " sur l'avant-projet de contrat pluriannuel", "amdt": true}, {"t": "-", "s": " remis", "amdt": false}, {"t": "+", "s": " de l'attributaire pressenti n'est rendu public dans les conditions prévues", "amdt": false}, {"t": "=", "s": " par", "amdt": true}, {"t": "+", "s": " l'article L. 1261-2 que pour", "amdt": false}, {"t": "=", "s": " le candidat", "amdt": true}, {"t": "-", "s": " une fois celui-ci", "amdt": false}, {"t": "=", "s": " désigné comme concessionnaire de l'aéroport et lorsque le contrat de concession a été signé. » ;", "amdt": true}, {"t": "=", "s": "\n3° L'article L. 6763-1 est complété par un alinéa ainsi rédigé :\n« L'article L. 6325-2 est applicable en Nouvelle-Calédonie dans sa rédaction résultant de la loi n° du. » ;\n4° L'article L. 6773-1 est complété par un alinéa ainsi rédigé :\n« L'article L. 6325-2 est applicable en Polynésie française dans sa rédaction résultant de la loi n° du. ».\nII.-Le I du présent article s'applique aux contrats mentionnés à l'article L. 6325-2 relatifs aux aérodromes pour lesquels un contrat de concession fait l'objet d'une consultation qui a été engagée ou dont l'avis de concession est publié après la date de publication de la présente loi.", "amdt": false}]}, {"numero": 47, "vise": "ART. 2", "dispositif": "Après l’alinéa 1, insérer l’alinéa suivant :\n\n« Les entreprises dont plus de 50 % de la production de médicaments concernés est réalisée en France ou dans un autre État membre de l’Union européenne sont exonérées de la contribution due au titre du chiffre d’affaires prévue au premier alinéa du présent article. »", "article": "2", "effet": [{"t": "=", "s": "Le taux de la contribution due au titre du chiffre d'affaires est fixé à 0, 10 %. La contribution est assise sur le chiffre d'affaires hors taxes réalisé en France métropolitaine et dans les départements d'outre-mer au cours d'une année civile au titre des médicaments bénéficiant d'une autorisation de mise sur le marché et inscrits sur les listes mentionnées aux deux premiers alinéas de l'article L. 162-17 du code de la sécurité sociale ou sur la liste mentionnée à l'article L. 5123-2 du code de la santé publique, à l'exception des médicaments orphelins désignés comme tels en application du règlement (CE) n° 141 / 2000 du Parlement européen et du Conseil, du 16 décembre 1999, concernant les médicaments orphelins.\n", "amdt": false}, {"t": "+", "s": "Les entreprises dont plus de 50 % de la production de médicaments concernés est réalisée en France ou dans un autre État membre de l'Union européenne sont exonérées de la contribution due au titre du chiffre d'affaires prévue au premier alinéa du présent article.\n", "amdt": false}, {"t": "=", "s": "Un rapport sur l'affectation et l'utilisation du produit de cette contribution est remis chaque année au Parlement.\nLes modalités d'application du présent article sont définies par décret en Conseil d'État.", "amdt": false}]}, {"numero": 48, "vise": "ART. 4", "dispositif": "À l’alinéa 4, après le mot :\n\n« initiale »,\n\ninsérer les mots :\n\n« , en amont de leur prise de fonction, ».", "article": "4", "effet": [{"t": "=", "s": "Le chapitre II du titre IV de la deuxième partie du code de l'éducation est ainsi modifié :\n1° Le livre IV est ainsi modifié :\na) La section 1 est complétée par un article L. 442-3-1 ainsi rédigé :\n« Art. L. 442-3-1.-Les établissements d'enseignement privés justifient que l'ensemble des membres de leur personnel, quelles que soient leurs fonctions, bénéficie d'une formation initiale", "amdt": false}, {"t": "+", "s": ", en amont de leur prise de fonction,", "amdt": false}, {"t": "=", "s": " et continue à la prévention et à la détection de toutes les formes de violences contre les enfants.\n« Cette formation, dont les modalités de mise en œuvre sont précisées par décret, vise à garantir une culture commune de la protection de l'enfance en danger, des besoins fondamentaux des enfants et d'une éducation respectueuse de leurs droits. » ;\nb) À l'article L. 442-20, après les mots : « L. 521-1 », sont insérés les mots : «, l'article L. 542-3, » ;\n2° Le livre V est ainsi modifié :\na) À la première phrase de l'article L. 542-1, après le mot : « domaine », sont insérés les mots : « des besoins fondamentaux des enfants et » ;\nb) Le premier alinéa de l'article L. 542-3 est ainsi modifié :\n-après le mot : « sexuel », sont insérés les mots : « et sur les violences commises par des adultes exerçant une fonction d'autorité » ;\n-sont ajoutés les mots : « publics comme privés ».", "amdt": false}]}, {"numero": 49, "vise": "ART. 14", "dispositif": "Après l’alinéa 8, insérer l’alinéa suivant :\n\n« Les personnes mentionnées au premier alinéa peuvent se prévaloir auprès de l’Autorité nationale de sécurité des systèmes d’information, lors d’un contrôle, du recours à des prestataires de services qualifiés pour démontrer leur respect de tout ou partie des objectifs mentionnés au sixième alinéa dans des conditions fixées par décret en Conseil d’État. »", "article": "14", "effet": [{"t": "=", "s": "Les entités essentielles, les entités importantes, les administrations de l'État et leurs établissements publics administratifs qui exercent leurs activités dans les domaines de la sécurité publique, de la défense et de la sécurité nationale ainsi que de la répression pénale, les missions diplomatiques et consulaires françaises pour leurs réseaux et systèmes d'information, le Commissariat à l'énergie atomique et aux énergies alternatives pour ses activités dans le domaine de la défense ainsi que les juridictions administratives et judiciaires prennent les mesures techniques, opérationnelles et organisationnelles appropriées et proportionnées pour gérer les risques qui menacent la sécurité des réseaux et des systèmes d'information qu'elles utilisent dans le cadre de leurs activités ou de la fourniture de leurs services, ainsi que pour éliminer ou réduire les conséquences que les incidents ont sur les destinataires de leurs services et sur d'autres services. Ces mesures garantissent, pour leurs réseaux et leurs systèmes d'information, un niveau de sécurité adapté et proportionné au risque existant. Elles visent à :\n1° Prévoir que les organes de direction approuvent et supervisent les mesures de pilotage de la sécurité des réseaux et systèmes d'information, leurs membres ainsi que les personnes exposées aux risques devant être formés à la cybersécurité ;\n2° Assurer la protection des réseaux et systèmes d'information, y compris en cas de recours à la sous-traitance ;\n3° Mettre en place des outils et des procédures pour assurer la défense des réseaux et systèmes d'information et gérer les incidents ;\n4° Garantir la résilience des activités.\nUn décret en Conseil d'État fixe les objectifs auxquels doivent se conformer les personnes mentionnées au premier alinéa afin que les mesures adoptées pour la gestion des risques satisfassent aux 1° à 4°. Ce décret détermine également les conditions d'élaboration, de modification et de publication d'un référentiel d'exigences techniques et organisationnelles qui sont adaptées aux différentes personnes mentionnées au premier alinéa, en fonction de leur degré d'exposition aux risques, de leur taille, de la probabilité de survenance d'incidents et de leur gravité, y compris leurs conséquences économiques et sociales, et les modalités de concertation des représentants des entités concernées et des associations d'élus.\nCe référentiel peut prescrire le recours à des produits, des services ou des processus certifiés au titre du règlement (UE) n° 2019 / 881 du Parlement européen et du Conseil du 17 avril 2019 relatif à l'ENISA (Agence de l'Union européenne pour la cybersécurité) et à la certification de cybersécurité des technologies de l'information et des communications, et abrogeant le règlement (UE) n° 526 / 2013.\nPar dérogation aux sixième et septième alinéas du présent article, lorsqu'ils sont des entités importantes ou essentielles, les fournisseurs de services de systèmes de noms de domaine, les offices d'enregistrement, les fournisseurs de services d'informatique en nuage, les fournisseurs de services de centres de données, les fournisseurs de réseaux de diffusion de contenu, les fournisseurs de services gérés, les fournisseurs de services de sécurité gérés, ainsi que les fournisseurs de places de marché en ligne, de moteurs de recherche en ligne et de plateformes de services de réseaux sociaux et les prestataires de services de confiance mettent en œuvre les exigences techniques et méthodologiques qui leur sont propres.\n", "amdt": false}, {"t": "+", "s": "Les personnes mentionnées au premier alinéa peuvent se prévaloir auprès de l'Autorité nationale de sécurité des systèmes d'information, lors d'un contrôle, du recours à des prestataires de services qualifiés pour démontrer leur respect de tout ou partie des objectifs mentionnés au sixième alinéa dans des conditions fixées par décret en Conseil d'État.\n", "amdt": false}, {"t": "=", "s": "Ces mesures techniques, opérationnelles et organisationnelles sont mises en œuvre aux frais des personnes concernées.", "amdt": false}]}, {"numero": 50, "vise": "ART. 23 TER", "dispositif": "Compléter cet article par l’alinéa suivant :\n\n« IV. – Les I et II du présent article s’appliquent aux délais de reprise venant à expiration à compter de la publication de la présente loi. »", "article": "23 TER", "effet": [{"t": "=", "s": "I.-À la fin de l'article 1416 du code général des impôts, les mots : « qui peut être mis en recouvrement au plus tard le 31 décembre de l'année suivant celle de l'imposition » sont supprimés.\nII.-Le livre des procédures fiscales est ainsi modifié :\n1° Au premier alinéa de l'article L. 173, les mots : «, à l'exception de la cotisation foncière des entreprises, de la cotisation sur la valeur ajoutée des entreprises et de leurs taxes additionnelles » sont supprimés ;\n2° Au début du premier alinéa de l'article L. 174, les mots : « Les omissions ou les erreurs concernant » sont remplacés par les mots : « Par dérogation à l'article L. 173, les omissions ou erreurs concernant la taxe annuelle sur les logements vacants mentionnée à l'article 232 du code général des impôts, la taxe d'habitation sur les résidences secondaires mentionnée à l'article 1407 du même code, la taxe d'habitation sur les résidences secondaires afférente aux logements vacants mentionnée à l'article 1407 bis dudit code, ».\nIII.-Le 3° du II de l'article 55 de la loi n° 2022-1726 du 30 décembre 2022 de finances pour 2023 est abrogé.", "amdt": false}, {"t": "+", "s": "\nIV.-Les I et II du présent article s'appliquent aux délais de reprise venant à expiration à compter de la publication de la présente loi.", "amdt": false}]}, {"numero": 51, "vise": "ART. 5", "dispositif": "Après l’alinéa 20, insérer l’alinéa suivant :\n\n« « Par dérogation à l’alinéa précédent, la périodicité du contrôle est ramenée à au moins une fois tous les deux ans pour les personnels visés à l’article L. 911‑5 exerçant des fonctions dans un internat scolaire, qu’il soit public ou privé, ou participant à des hébergements de nuit liés aux activités organisées par l’établissement. » »", "article": "5", "effet": [{"t": "=", "s": "Le code de l'éducation est ainsi modifié :\n1° Le titre préliminaire du livre IV de la deuxième partie est complété par deux articles L. 401-5 et L. 401-6 ainsi rédigés :\n« Art. L. 401-5.-Nul ne peut intervenir, de manière régulière ou occasionnelle, à quelque titre que ce soit, y compris bénévole, au sein d'un établissement d'enseignement du premier ou du second degré ou de tout établissement de formation accueillant un public d'âge scolaire, qu'il soit public ou privé, ou participer à une activité organisée en lien avec celui-ci, s'il fait l'objet d'une mention au fichier judiciaire national automatisé des auteurs d'infractions sexuelles ou violentes ou au fichier judiciaire national automatisé des auteurs d'infractions terroristes.\n« Les dispositions du présent article ne sont pas applicables aux personnes soumises au régime d'incapacité prévu à l'article L. 911-5 du code de l'éducation. »\n« Art. L. 401-6.-Le contrôle des incapacités mentionnées à l'article L. 401-5 est assuré, avant l'exercice de l'activité de la personne puis au moins tous les trois ans lors de leur exercice, par l'accès aux informations contenues dans le fichier judiciaire national automatisé des auteurs d'infractions sexuelles ou violentes dans les conditions prévues à l'article 706-53-7 du code de procédure pénale et par l'accès aux informations contenues dans le fichier judiciaire national automatisé des auteurs d'infractions terroristes dans les conditions prévues à l'article 706-25-9 du même code.\n« L'administration chargée de ce contrôle peut délivrer une attestation à la personne qui ne fait pas l'objet d'une mention entraînant les incapacités mentionnées à l'article L. 401-5 au moyen d'un système d'information sécurisé permettant, par dérogation au premier alinéa des articles 706-53-11 et 777-3 du code de procédure pénale, la consultation des traitements de données mentionnés au premier alinéa.\n« L'attestation mentionnée au deuxième alinéa fait état de l'absence de mention au fichier judiciaire national automatisé des auteurs d'infractions sexuelles ou violentes ou au fichier judiciaire national automatisé des auteurs d'infractions terroristes.\n« L'attestation ainsi délivrée peut être communiquée au directeur d'un établissement mentionné à l'article L. 401-5.\n« Les conditions d'application du présent article sont déterminées par décret en Conseil d'État. »\n2° L'article L. 911-5 du code de l'éducation est ainsi rédigé :\n« Art. L. 911-5.-I.-Nul ne peut diriger un établissement d'enseignement du premier ou du second degré ou tout établissement de formation accueillant un public d'âge scolaire, qu'il soit public ou privé, ni y être employé, à quelque titre que ce soit, s'il a été condamné définitivement pour un crime ou un délit contraire à la probité ou aux mœurs, y compris un crime ou un délit à caractère terroriste, notamment ceux prévus au I de l'article L. 133-6 du code de l'action sociale et des familles.\n« II.-Sont également incapables de diriger ou d'être employés dans les établissements mentionnés au I du présent article :\n« 1° Ceux qui ont été privés par jugement de tout ou partie des droits civiques, civils et de famille mentionnés à l'article 131-26 du code pénal, ou qui ont été déchus de l'autorité parentale ;\n« 2° Ceux qui ont été frappés, par le juge pénal, d'interdiction d'exercer, à titre définitif, une fonction d'enseignement ou une activité professionnelle ou bénévole impliquant un contact habituel avec des mineurs ;\n« 3° Ceux qui, ayant exercé dans l'un des établissements soumis au présent article, ont été révoqués ou licenciés en application d'une sanction disciplinaire prononcée en raison de faits contraires à la probité et aux mœurs ;\n« III.-Les incapacités prévues au présent article sont applicables en cas de condamnation définitive figurant au fichier judiciaire national automatisé des auteurs d'infractions sexuelles ou violentes ou au fichier judiciaire national automatisé des auteurs d'infractions terroristes, même si cette condamnation n'est pas inscrite au bulletin n° 2 du casier judiciaire.\n« IV.-En cas de condamnation, prononcée par une juridiction étrangère et passée en force de chose jugée, pour une infraction constituant, selon la loi française, un crime ou l'un des délits visés au I du présent article, le tribunal judiciaire du domicile du condamné, statuant en matière correctionnelle, déclare, à la requête du ministère public, qu'il y a lieu à l'application de l'incapacité d'exercice prévue au présent article, après constatation de la régularité et de la légalité de la condamnation et l'intéressé dûment appelé en chambre du conseil.\n« Les personnes faisant l'objet d'une incapacité d'exercice peuvent demander à en être relevées dans les conditions prévues à l'article 132-21 du code pénal ainsi qu'aux articles 702-1 et 703 du code de procédure pénale. Cette requête est portée devant la chambre des appels correctionnels de la cour d'appel dans le ressort de laquelle le requérant réside lorsque la condamnation résulte d'une condamnation étrangère et qu'il a été fait application du premier alinéa du présent IV. »\n3° Après le même article L. 911-5 du code de l'éducation, sont insérés deux articles L. 911-5-1-A et L. 911-5-1-B ainsi rédigés :\n« Art. L. 911-5-1-A.-Le contrôle des incapacités mentionnées aux I et aux 1° et 2° du II de l'article L. 911-5 est assuré avant l'exercice des fonctions de la personne puis au moins tous les trois ans lors de leur exercice par la délivrance du bulletin n° 2 du casier judiciaire dans les conditions prévues à l'article 776 du code de procédure pénale, par l'accès aux informations contenues dans le fichier judiciaire national automatisé des auteurs d'infractions sexuelles ou violentes dans les conditions prévues à l'article 706-53-7 du même code et par l'accès aux informations contenues dans le fichier judiciaire national automatisé des auteurs d'infractions terroristes dans les conditions prévues à l'article 706-25-9 dudit code. »\n", "amdt": false}, {"t": "=", "s": "«", "amdt": true}, {"t": "+", "s": " Par dérogation à l'alinéa précédent, la périodicité du contrôle est ramenée à au moins une fois tous les deux ans pour les personnels visés à l'article L. 911-5 exerçant des fonctions dans un internat scolaire, qu'il soit public ou privé, ou participant à des hébergements de nuit liés aux activités organisées par l'établissement. »\n«", "amdt": false}, {"t": "=", "s": " Art. L. 911-5-1-B.-L'administration chargée de ce contrôle peut délivrer une attestation à la personne qui ne fait pas l'objet d'une inscription entraînant les incapacités mentionnées aux I et II de l'article L. 911-5 au moyen d'un système d'information sécurisé permettant, par dérogation au premier alinéa des articles 706-53-11 et 777-3 du code de procédure pénale, la consultation des traitements de données mentionnés à l'article L. 911-5-1-A.\n« L'attestation mentionnée au premier alinéa fait état de l'absence de condamnation non définitive ou de mise en examen mentionnées au fichier judiciaire national automatisé des auteurs d'infractions sexuelles ou violentes ou au fichier judiciaire national automatisé des auteurs d'infractions terroristes.\n« L'attestation ainsi délivrée est communiquée à l'administration et le cas échéant à l'employeur ou au directeur d'un établissement mentionné au premier alinéa du I de l'article L. 911-5. L'administration chargée du contrôle doit également transmettre à cet employeur ou à ce directeur l'information selon laquelle une personne en exercice est frappée par une incapacité mentionnée aux I et II de l'article L. 911-5. Il revient à l'employeur ou au directeur de tirer les conséquences d'une telle incapacité.\n« Les conditions d'application du présent article sont déterminées par décret en Conseil d'État. »", "amdt": false}]}, {"numero": 52, "vise": "APRÈS ART. 20 QUATER", "dispositif": "Dans un délai d’un an à compter de la promulgation de la présente loi, le Gouvernement remet au Parlement un rapport sur l’amélioration de l’incitation à la rédaction de directives anticipées et une meilleure prise en compte de ces dernières.", "article": "20 QUATER BIS", "effet": [{"t": "+", "s": "Dans un délai d'un an à compter de la promulgation de la présente loi, le Gouvernement remet au Parlement un rapport sur l'amélioration de l'incitation à la rédaction de directives anticipées et une meilleure prise en compte de ces dernières.", "amdt": false}]}, {"numero": 53, "vise": "APRÈS ART. PREMIER", "dispositif": "Après le premier alinéa du I de l’article L. 218‑1 du code de la propriété intellectuelle, il est inséré un alinéa ainsi rédigé :\n\n« Les services de presse en ligne, reconnus dans les conditions prévues par le décret mentionné au dernier alinéa de l’article premier de la loi n° 86‑897 du 1er août 1986 portant réforme du régime juridique de la presse, sont couverts par la présente définition. »", "article": "PREMIER BIS", "effet": [{"t": "+", "s": "Après le premier alinéa du I de l'article L. 218-1 du code de la propriété intellectuelle, il est inséré un alinéa ainsi rédigé :\n« Les services de presse en ligne, reconnus dans les conditions prévues par le décret mentionné au dernier alinéa de l'article premier de la loi n° 86-897 du 1er août 1986 portant réforme du régime juridique de la presse, sont couverts par la présente définition. »", "amdt": false}]}, {"numero": 54, "vise": "ART. 7", "dispositif": "Après le mot :\n\n« fixé »\n\nrédiger ainsi la fin de l’alinéa 11 :\n\n« , le représentant de l’État ou l’autorité compétente en matière d’éducation prononce l’une des mesures suivantes : »", "article": "7", "effet": [{"t": "=", "s": "Le code de l'éducation est ainsi modifié :\n1° Le II de l'article L. 241-4 est abrogé ;\n2° Le chapitre II du titre IV du livre IV de la deuxième partie est ainsi modifié :\na) Après l'article L. 442-1, sont insérés sept articles L. 442-1-1 à L. 442-1-7 ainsi rédigés :\n« Art. L. 442-1-1.-I.-Le contrôle de l'État sur les établissements d'enseignement privés qui ont passé l'un des contrats prévus aux articles L. 442-5 et L. 442-12 porte sur l'ensemble des obligations pédagogiques, administratives et financières prévues par les textes législatifs et réglementaires qui leur sont applicables, sur le respect des stipulations du contrat, ainsi que sur le respect de l'ordre public et des valeurs de la République, la prévention sanitaire et sociale et la protection de l'enfance et de la jeunesse, notamment contre toute forme de harcèlement scolaire.\n« II.-Tout contrôle peut donner lieu à des entretiens avec des élèves volontaires ou librement choisis par les inspecteurs, pouvant porter sur les différents aspects de leur vie au sein de l'établissement. Les entretiens peuvent être menés sans la présence du personnel de l'établissement.\n« III.-Chaque établissement d'enseignement privé sous contrat fait l'objet d'un contrôle pédagogique, administratif et financier au moins une fois tous les cinq ans. Les établissements dotés d'un internat, qu'ils soient publics ou privés, font l'objet d'un contrôle annuel s'ils relèvent du premier degré, et d'un contrôle au moins tous les trois ans s'ils relèvent du second degré.\n« IV.-La date du dernier contrôle effectué est rendue publique, selon des modalités fixées par décret.\n« Art. L. 442-1-2.-Les établissements d'enseignement privés qui ont passé l'un des contrats prévus aux articles L. 442-5 et L. 442-12 communiquent chaque année à l'autorité de l'État compétente en matière d'éducation le nom et les fonctions des personnes qu'ils emploient ainsi que les pièces attestant leur identité, leur âge et leur nationalité dans des conditions fixées par décret.\n« Art. L. 442-1-3.-Le représentant de l'État dans le département ou l'autorité de l'État compétente en matière d'éducation peuvent adresser au directeur de l'établissement et à la personne physique ou morale gestionnaire de l'établissement une mise en demeure de mettre fin, dans un délai qu'elle détermine et en l'informant des mesures dont il serait l'objet en cas contraire, aux manquements aux obligations mentionnées à l'article L. 442-1-1.\n« Art. L. 442-1-4.-S'il n'a pas été remédié aux manquements relevés dans la mise en demeure mentionnée à l'article L. 442-1-3, après l'expiration du délai fixé", "amdt": false}, {"t": "=", "s": ",", "amdt": true}, {"t": "-", "s": " il peut être prononcé par", "amdt": false}, {"t": "=", "s": " le représentant de l'État ou l'autorité compétente en matière d'éducation", "amdt": true}, {"t": "+", "s": " prononce", "amdt": false}, {"t": "=", "s": " l'une des mesures suivantes :", "amdt": true}, {"t": "=", "s": "\n« 1° L'avertissement ;\n« 2° L'amende administrative, dont le taux ne peut excéder 15 % des ressources de l'établissement, à l'exclusion de celles tirées du concours de l'État et de la première contribution mentionnée au troisième alinéa de l'article L. 442-9 du présent code ;\n« 3° La résiliation du contrat, dans les conditions fixées à l'article L. 442-10.\n« Art. L. 442-1-5.-S'il n'a pas été remédié aux manquements relevés dans la mise en demeure mentionnée à l'article L. 442-1-3, après l'expiration du délai fixé, le représentant de l'État dans le département peut prononcer la fermeture définitive de l'établissement ou des classes concernées.\n« Il agit après avis ou sur proposition de l'autorité compétente de l'État en matière d'éducation, pour les motifs tirés de risques pour l'ordre public, la santé et la sécurité physique ou morale des mineurs que présentent les conditions de fonctionnement de l'établissement, et sur la proposition de cette autorité pour les autres motifs.\n« Par dérogation aux dispositions de l'article L. 442-10, la fermeture définitive d'un établissement privé ayant passé l'un des contrats prévus aux articles L. 442-5 et L. 442-12 entraîne la résiliation du contrat passé entre l'établissement et l'État.\n« Lorsqu'est prononcée la fermeture de l'établissement, l'autorité compétente de l'État en matière d'éducation met en demeure les parents des élèves scolarisés dans l'établissement d'inscrire leurs enfants dans un autre établissement d'enseignement scolaire dans les quinze jours suivant la notification de la mise en demeure.\n« Art. L. 442-1-6.-Les mesures prévues aux articles L. 442-1-4 et L. 442-1-5 peuvent être prononcées sans mise en demeure préalable en cas d'urgence absolue pour la sécurité des élèves, d'atteinte d'une particulière gravité aux valeurs de la République ou en cas de refus de se soumettre au contrôle ou d'obstacle au bon déroulement de celui-ci.\n« Art. L. 442-1-7.-L'autorité ayant prononcé une des mesures prévues aux articles L. 442-1-3, L. 442-1-4 ou L. 442-1-5 en informe le maire de la commune sur le territoire de laquelle est implanté l'établissement, le représentant de la collectivité intéressée et, le cas échéant, les membres de la commission compétente de cette dernière. Le directeur de l'établissement en informe son organe délibérant dès la notification de la mesure.\n« À titre complémentaire, la mesure prononcée en application des articles L. 442-1-4 et L. 442-1-5 peut, sous réserve des secrets protégés par la loi, être rendue publique accompagnée des motifs qui la justifient. Les modalités de cette publication sont proportionnées à la gravité du manquement. »\nb) À la première phrase du deuxième alinéa de l'article L. 442-5, après le mot : « association », sont insérés les mots : «, qui est signé et renouvelé par l'autorité compétente de l'État en matière d'éducation, » ;\nc) Au septième alinéa de l'article L. 442-5-1, les mots : « le représentant de l'État dans le département » sont remplacés par les mots : « l'autorité compétente de l'État en matière d'éducation » ;\nd) À l'article L. 442-5-2, les mots : « le représentant de l'État dans le département » sont remplacés par les mots : « l'autorité compétente de l'État en matière d'éducation » ;\ne) L'article L. 422-12 est ainsi modifié :\n-au premier alinéa, après le mot : « simple », sont insérés les mots : «, qui est signé et renouvelé par l'autorité compétente de l'État en matière d'éducation, » ;\n-le deuxième alinéa est ainsi modifié :\ni) à la première phrase, après le mot : « simple », sont insérés les mots : «, qui est signé et renouvelé par l'autorité compétente de l'État en matière d'éducation, » ;\nii) la seconde phrase est supprimée ;\n-à la première phrase du troisième alinéa, après le mot : « simple », sont insérés les mots : « qui est signé et renouvelé par l'autorité compétente de l'État en matière d'éducation, » ;\n-à la fin de l'avant-dernier alinéa, après le mot : « simple », sont insérés les mots : «, qui est signé et renouvelé par l'autorité compétente de l'État en matière d'éducation, ».", "amdt": false}]}, {"numero": 55, "vise": "ART. 6", "dispositif": "Compléter l’alinéa 18 par la phrase suivante :\n\n« Les mesures prises par le procureur prennent fin à compter de la décision statuant sur la demande d’ordonnance de protection de l’enfant ou sur la demande d’ordonnance d’accueil provisoire en application de l’article 375‑5. »", "article": "6", "effet": [{"t": "=", "s": "I.-L'article 375-5 du code civil est ainsi modifié :\n1° Le premier alinéa est remplacé par six alinéas ainsi rédigés :\n« À titre provisoire mais à charge d'appel, le juge peut, pendant l'instance et en cas d'urgence, prendre une ordonnance d'accueil provisoire. À l'occasion de la délivrance de l'ordonnance d'accueil provisoire, il peut :\n« 1° Prendre l'une des mesures prévues aux articles 375-3 et 375-4 ;\n« 2° Confier provisoirement l'enfant au parent au domicile duquel la résidence principale a été fixée et, sans préjudice du quatrième alinéa de l'article 375-7, suspendre le droit de visite et d'hébergement de l'autre parent ;\n« 3° Interdire à la partie défenderesse de se rendre dans certains lieux spécialement désignés par le juge dans lesquels l'enfant se trouve de façon habituelle ;\n« 4° Interdire à la partie défenderesse de recevoir ou de rencontrer l'enfant ainsi que d'entrer en relation avec lui, de quelque façon que ce soit.\n« Les mesures mentionnées au 1° du présent article sont prises pour une durée maximale de six mois. Les mesures mentionnées aux 2° à 4° sont prises pour une durée maximale d'un mois, pendant laquelle il appartient à la partie la plus diligente de saisir le juge aux affaires familiales d'une demande d'ordonnance de protection de l'enfant. » ;\n2° à 4° (Supprimés)\nI bis.-Le titre XIV du livre Ier du même code est complété par des articles 515-13-2 et 515-13-3 ainsi rédigés :\n« Art. 515-13-2.-Si l'un des parents expose son enfant à un danger grave et immédiat, l'autre parent ou, dans le cadre d'un signalement ou de la transmission d'une information préoccupante au sens de l'article L. 226-2-1 du code de l'action sociale et des familles, un tiers peut saisir le procureur de la République aux fins de délivrance d'une ordonnance provisoire de protection de l'enfant.\n« Le procureur de la République délivre l'ordonnance provisoire de protection de l'enfant dans un délai de vingt-quatre heures à compter de sa saisine, s'il estime, au vu des seuls éléments joints à la requête, qu'il existe des raisons sérieuses de considérer comme vraisemblable le danger grave et immédiat auquel l'enfant est exposé.\n« Le procureur de la République est compétent pour :\n« 1° Suspendre les droits de correspondance, de visite et d'hébergement de la partie défenderesse ;\n« 2° Fixer la résidence principale chez la partie demanderesse ;\n« 3° Interdire à la partie défenderesse de se rendre dans certains lieux spécialement désignés par le juge, dans lesquels l'enfant se trouve de façon habituelle ;\n« 4° Interdire à la partie défenderesse de recevoir ou de rencontrer l'enfant ainsi que d'entrer en relation avec lui, de quelque façon que ce soit.\n« Dans un délai de huit jours à compter de la délivrance de l'ordonnance provisoire, le procureur de la République saisit le juge compétent en application de l'article 515-13-3 ou des articles 375-3 et 375-4", "amdt": false}, {"t": "+", "s": ". Les mesures prises par le procureur prennent fin à compter de la décision statuant sur la demande d'ordonnance de protection de l'enfant ou sur la demande d'ordonnance d'accueil provisoire en application de l'article 375-5", "amdt": false}, {"t": "=", "s": ".", "amdt": true}, {"t": "=", "s": "\n« Art. 515-13-3.-Lorsque le juge aux affaires familiales est saisi d'une demande d'ordonnance de protection de l'enfant par le procureur dans les conditions prévues au dernier alinéa de l'article 515-13-2 ou par le parent dont l'enfant a fait l'objet de la mesure mentionnée au 3° de l'article 375-5, il convoque, pour une audience, la partie demanderesse, la partie défenderesse et le mineur capable ou non de discernement, assisté d'un avocat non rémunéré, ainsi que le ministère public à fin d'avis. Ces auditions peuvent avoir lieu séparément. L'audience se tient en chambre du conseil. À la demande de la partie demanderesse ou du mineur capable de discernement, les auditions se tiennent séparément.\n« L'ordonnance de protection de l'enfant est délivrée par le juge aux affaires familiales s'il estime, au vu des éléments produits devant lui et contradictoirement débattus, qu'il existe des raisons sérieuses de considérer comme vraisemblable le danger grave auquel est exposé le mineur. Il la délivre dans un délai de quinze jours à compter de la saisine par le procureur de la République ou par le parent.\n« À l'occasion de sa délivrance, le juge aux affaires familiales est compétent pour :\n« 1° Interdire à la partie défenderesse de recevoir ou de rencontrer l'enfant ainsi que d'entrer en relation avec lui, de quelque façon que ce soit ;\n« 2° Interdire à la partie défenderesse de se rendre dans certains lieux spécialement désignés par le juge, dans lesquels l'enfant se trouve de façon habituelle ;\n« 3° Attribuer la jouissance du logement familial à la partie demanderesse, même si celle-ci a bénéficié d'un hébergement d'urgence. Dans ce cas, la prise en charge des frais afférents peut être à la charge de la partie défenderesse ;\n« 4° Se prononcer sur les modalités d'exercice de l'autorité parentale et, au sens de l'article 373-2-9, sur les modalités du droit de visite et d'hébergement ainsi que sur la contribution à l'entretien et à l'éducation des enfants.\n« Lorsque le juge délivre une ordonnance de protection de l'enfant, il en informe sans délai le procureur de la République.\n« Les mesures mentionnées aux 1° à 4° du présent article sont prises pour une durée maximale de douze mois à compter de la notification de l'ordonnance. Le juge aux affaires familiales peut à tout moment, à la demande du ministère public ou de l'une des parties ou après avoir fait procéder à toute mesure d'instruction utile, après avoir invité chacune d'entre elles à s'exprimer, supprimer ou modifier tout ou partie des mesures énoncées dans l'ordonnance de protection de l'enfant, en décider de nouvelles, accorder à la personne défenderesse une dispense temporaire d'observer certaines des obligations qui lui ont été imposées ou rapporter l'ordonnance de protection. »\nII.-Le chapitre VII du titre II du livre II du code pénal est ainsi modifié :\n1° La section 2 bis est ainsi modifiée :\na) Après le mot : « familiales », la fin de l'intitulé est ainsi rédigée : « et de l'ordonnance de protection de l'enfant » ;\nb) Il est ajouté un article 227-4-4 ainsi rédigé :\n« Art. 227-4-4.-Le fait de ne pas respecter une ou plusieurs modalités prévues dans une ordonnance de protection provisoire de l'enfant rendue en application de l'article 515-13-3 du code civil, dans une ordonnance provisoire de protection de l'enfant rendue en application de l'article 515-13-2 du même code ou les mesures prises en application des 2° à 4° de l'article 375-5 dudit code est puni de trois ans d'emprisonnement et de 45 000 € d'amende. » ;\n2° La section 3 est complétée par un article 227-11-1 ainsi rédigé :\n« Art. 227-11-1.-Par dérogation, nul ne peut être poursuivi sur le fondement des articles 227-5 et 227-7 pour des faits commis par un parent entre le moment où il saisit la juridiction compétente aux fins de délivrance de l'ordonnance de protection provisoire prévue à l'article 375-5 du code civil et la date à laquelle la décision statuant sur cette demande lui est notifiée. »\nIII.-L'ordonnance mentionnée au présent article fait expressément mention de la possibilité pour la victime ou, le cas échéant, pour son représentant légal de solliciter la reconnaissance d'une affection de longue durée en application de l'article L. 160-14 du code de la sécurité sociale.", "amdt": false}]}, {"numero": 56, "vise": "ART. 7", "dispositif": "À l’alinéa 8, après le mot :\n\n« pédiatriques »,\n\ninsérer les mots :\n\n« , en poursuivant l’objectif d’atteindre un minimum de deux unités par région d’ici le 31 décembre 2030, ».", "article": "7", "effet": [{"t": "=", "s": "Les crédits de paiement supplémentaires de la stratégie décennale d'accompagnement et des soins palliatifs évoluent sur la période de 2024 à 2034 en application du tableau du deuxième alinéa. Selon l'évaluation prévue à l'article L. 1110-9 du code de la santé publique, ces crédits peuvent être réévalués afin de garantir un accès équitable des malades à un accompagnement et à des soins palliatifs.\nCrédits de paiement et plafonds des taxes allouées aux mesures nouvelles prévues par la stratégie décennale\nLe périmètre budgétaire concerné intègre les dépenses relatives :\n1° À l'hôpital de jour et aux courts séjours ;\n2° Aux séjours en service de médecine générale ou de chirurgie ;\n3° Aux séjours en lits identifiés de soins palliatifs ;\n4° Aux séjours en unité de soins palliatifs ;\n5° Aux créations d'unités de soins palliatifs et d'unités de soins palliatifs pédiatriques", "amdt": false}, {"t": "+", "s": ", en poursuivant l'objectif d'atteindre un minimum de deux unités par région d'ici le 31 décembre 2030,", "amdt": false}, {"t": "=", "s": " et aux créations de maisons d'accompagnement ;\n6° Aux journées d'hospitalisation à domicile ;\n7° Aux séjours en unité de soins médicaux et de réadaptation ;\n8° Aux missions d'intérêt général et d'aide à la contractualisation ;\n9° Au fonds d'intervention régional, dont les équipes mobiles de soins palliatifs et les équipes ressources régionales de soins palliatifs pédiatriques ;\n10° Aux actes des professionnels de santé libéraux ;\n11° Aux médicaments délivrés en ville et relevant d'un parcours palliatif ;\n12° À la structuration d'une filière universitaire dédiée aux soins palliatifs et d'accompagnement et à la création d'un diplôme d'études spécialisées en médecine palliative et en soins palliatifs et d'accompagnement.", "amdt": false}]}, {"numero": 57, "vise": "APRÈS ART. 3", "dispositif": "Après l’article L. 2133‑4 du code de la santé publique, il est inséré un article L. 2133‑5 ainsi rédigé :\n\n« Art. L. 2133‑5. – Les opérateurs de communications électroniques ne peuvent proposer d’offres commerciales de services de téléphonie ou d’accès à internet spécifiquement destinées aux mineurs.\n\n« Les modalités d’application du présent article sont précisées par décret en Conseil d’État. »", "article": "3 BIS", "effet": [{"t": "+", "s": "Après l'article L. 2133-4 du code de la santé publique, il est inséré un article L. 2133-5 ainsi rédigé :\n« Art. L. 2133-5.-Les opérateurs de communications électroniques ne peuvent proposer d'offres commerciales de services de téléphonie ou d'accès à internet spécifiquement destinées aux mineurs.\n« Les modalités d'application du présent article sont précisées par décret en Conseil d'État. »", "amdt": false}]}, {"numero": 58, "vise": "ART. PREMIER", "dispositif": "Après le mot :\n\n« caisse »,\n\nrédiger ainsi la fin de l’alinéa 3 :\n\n« locale de l’alimentation ».", "article": "PREMIER", "effet": [{"t": "=", "s": "Au sens de la présente loi, la « sécurité sociale de l'alimentation » s'entend d'un régime de démocratie et de solidarité alimentaire qui repose sur :\n1° Un principe d'universalité, permettant de garantir le droit et l'accès de chaque personne à l'alimentation ;\n2° Un principe de solidarité garanti par un mécanisme de contribution auprès d'une caisse", "amdt": false}, {"t": "-", "s": " primaire spécialisée ;", "amdt": false}, {"t": "+", "s": " locale de l'alimentation", "amdt": false}, {"t": "=", "s": "\n3° Un principe d'organisation démocratique, notamment pour attribuer le conventionnement des entités économiques et associatives auprès desquelles il est possible de s'approvisionner en produits alimentaires.\nLa sécurité sociale de l'alimentation vise à favoriser l'accès digne de tous les citoyens, sans le subordonner à une nécessaire condition de ressources, à une alimentation saine, qualitative et équilibrée, tout en soutenant des modèles agricoles rémunérateurs pour les producteurs, et protecteurs de l'environnement et des ressources naturelles. Elle prend en compte la réalité des écosystèmes locaux et les interdépendances des systèmes alimentaires à l'échelle planétaire.", "amdt": false}]}, {"numero": 59, "vise": "APRÈS ART. 4", "dispositif": "Une instance chargée du pilotage de la stratégie décennale des soins palliatifs et d’accompagnement, placée auprès du ministre chargé de la santé, assure le pilotage et le suivi de la mise en œuvre de la stratégie, établit un bilan à mi-parcours et contribue à son évolution.\n\nElle comprend notamment un député, un sénateur, des représentants de collectivités territoriales, des représentants du ministre chargé de l’enseignement supérieur et de la recherche et des personnalités qualifiées.\n\nUn décret précise ses missions et sa composition et définit ses modalités d'organisation et de fonctionnement", "article": "4 BIS", "effet": [{"t": "+", "s": "Une instance chargée du pilotage de la stratégie décennale des soins palliatifs et d'accompagnement, placée auprès du ministre chargé de la santé, assure le pilotage et le suivi de la mise en œuvre de la stratégie, établit un bilan à mi-parcours et contribue à son évolution.\nElle comprend notamment un député, un sénateur, des représentants de collectivités territoriales, des représentants du ministre chargé de l'enseignement supérieur et de la recherche et des personnalités qualifiées.\nUn décret précise ses missions et sa composition et définit ses modalités d'organisation et de fonctionnement", "amdt": false}]}, {"numero": 60, "vise": "APRÈS ART. 5", "dispositif": "Dans un délai de six mois à compter de la promulgation de la présente loi, le Gouvernement remet au Parlement un rapport sur l’adéquation des maisons d’arrêt à l’accueil de personnes condamnées en exécution d’une courte peine. Ce rapport évalue notamment la capacité des maisons d’arrêt à remplir les missions qui leur sont confiées lorsqu’elles accueillent des personnes condamnées, en matière de suivi socio-éducatif, d’accès aux activités, à la formation, aux soins et à la préparation à la sortie.", "article": "5 BIS", "effet": [{"t": "+", "s": "Dans un délai de six mois à compter de la promulgation de la présente loi, le Gouvernement remet au Parlement un rapport sur l'adéquation des maisons d'arrêt à l'accueil de personnes condamnées en exécution d'une courte peine. Ce rapport évalue notamment la capacité des maisons d'arrêt à remplir les missions qui leur sont confiées lorsqu'elles accueillent des personnes condamnées, en matière de suivi socio-éducatif, d'accès aux activités, à la formation, aux soins et à la préparation à la sortie.", "amdt": false}]}, {"numero": 61, "vise": "APRÈS ART. 4", "dispositif": "Le Gouvernement est chargé de prendre un décret d’application précisant les modalités d’intervention du procureur de la République en cas de danger grave et immédiat, notamment lorsque des éléments sérieux laisse lui supposer la commission d’une infraction à l’encontre du mineur\n\nCe décret fixe notamment :\n\n1° Les conditions dans lesquelles le procureur ordonne sans délai des mesures provisoires de protection notamment de rupture de contact avec le présumé agresseur.\n\n2° Le faisceau d’indices sérieux permettant de constater un danger et justifiant l’adoption de ces mesures.", "article": "4 BIS", "effet": [{"t": "+", "s": "Le Gouvernement est chargé de prendre un décret d'application précisant les modalités d'intervention du procureur de la République en cas de danger grave et immédiat, notamment lorsque des éléments sérieux laisse lui supposer la commission d'une infraction à l'encontre du mineur\nCe décret fixe notamment :\n1° Les conditions dans lesquelles le procureur ordonne sans délai des mesures provisoires de protection notamment de rupture de contact avec le présumé agresseur.\n2° Le faisceau d'indices sérieux permettant de constater un danger et justifiant l'adoption de ces mesures.", "amdt": false}]}, {"numero": 62, "vise": "ART. 2", "dispositif": "Après le mot :\n\n« comité »\n\nrédiger ainsi la fin de l’alinéa 6 :\n\n« national placé auprès du ministère de l’Education nationale, associant les collectivités territoriales compétentes et des représentants de parents d’élèves et des enseignants ».", "article": "2", "effet": [{"t": "=", "s": "I.-Il est institué un fonds national dénommé « fonds d'action pour l'éducation à l'alimentation ». Les recettes de ce fonds sont constituées :\n1° De la contribution de l'État ;\n2° Des dons de personnes physiques ou morales.\nII.-Les crédits de ce fonds sont répartis au profit des établiss
