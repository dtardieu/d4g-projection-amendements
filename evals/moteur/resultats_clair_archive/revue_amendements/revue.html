10-10-3 ainsi rédigé :\n« Art. L. 1110-10-3.-La politique de soins palliatifs", "amdt": false}, {"t": "-", "s": " de la République", "amdt": false}, {"t": "=", "s": " est fondée sur la volonté de garantir à chacun, selon ses besoins et sur tout le territoire, l'accès aux soins palliatifs.\n« La loi de programmation pluriannuelle de l'accompagnement et des soins palliatifs détermine, tous les cinq ans, la trajectoire de développement de l'offre d'accompagnement et de soins palliatifs mentionnés à l'article L. 1110-10, notamment à domicile et en établissement, en fonction de besoins pour lesquels elle établit des prévisions pluridécennales. Elle définit les objectifs, les moyens et les financements publics nécessaires pour assurer l'effectivité de cette offre et pour réaliser les recrutements suffisants ainsi que pour assurer la formation continue des professionnels. »", "amdt": false}]}, {"numero": 107, "vise": "ART. 14", "dispositif": "À l’alinéa 2, substituer aux mots :\n\n« , leurs membres »\n\nles mots :\n\n« . Les membres de ces organes ».", "article": "14", "effet": [{"t": "=", "s": "Les entités essentielles, les entités importantes, les administrations de l'État et leurs établissements publics administratifs qui exercent leurs activités dans les domaines de la sécurité publique, de la défense et de la sécurité nationale ainsi que de la répression pénale, les missions diplomatiques et consulaires françaises pour leurs réseaux et systèmes d'information, le Commissariat à l'énergie atomique et aux énergies alternatives pour ses activités dans le domaine de la défense ainsi que les juridictions administratives et judiciaires prennent les mesures techniques, opérationnelles et organisationnelles appropriées et proportionnées pour gérer les risques qui menacent la sécurité des réseaux et des systèmes d'information qu'elles utilisent dans le cadre de leurs activités ou de la fourniture de leurs services, ainsi que pour éliminer ou réduire les conséquences que les incidents ont sur les destinataires de leurs services et sur d'autres services. Ces mesures garantissent, pour leurs réseaux et leurs systèmes d'information, un niveau de sécurité adapté et proportionné au risque existant. Elles visent à :\n1° Prévoir que les organes de direction approuvent et supervisent les mesures de pilotage de la sécurité des réseaux et systèmes d'information", "amdt": false}, {"t": "-", "s": ", leurs", "amdt": false}, {"t": "+", "s": ". Les", "amdt": false}, {"t": "=", "s": " membres", "amdt": true}, {"t": "+", "s": " de ces organes", "amdt": false}, {"t": "=", "s": " ainsi que les personnes exposées aux risques devant être formés à la cybersécurité ;\n2° Assurer la protection des réseaux et systèmes d'information, y compris en cas de recours à la sous-traitance ;\n3° Mettre en place des outils et des procédures pour assurer la défense des réseaux et systèmes d'information et gérer les incidents ;\n4° Garantir la résilience des activités.\nUn décret en Conseil d'État fixe les objectifs auxquels doivent se conformer les personnes mentionnées au premier alinéa afin que les mesures adoptées pour la gestion des risques satisfassent aux 1° à 4°. Ce décret détermine également les conditions d'élaboration, de modification et de publication d'un référentiel d'exigences techniques et organisationnelles qui sont adaptées aux différentes personnes mentionnées au premier alinéa, en fonction de leur degré d'exposition aux risques, de leur taille, de la probabilité de survenance d'incidents et de leur gravité, y compris leurs conséquences économiques et sociales, et les modalités de concertation des représentants des entités concernées et des associations d'élus.\nCe référentiel peut prescrire le recours à des produits, des services ou des processus certifiés au titre du règlement (UE) n° 2019 / 881 du Parlement européen et du Conseil du 17 avril 2019 relatif à l'ENISA (Agence de l'Union européenne pour la cybersécurité) et à la certification de cybersécurité des technologies de l'information et des communications, et abrogeant le règlement (UE) n° 526 / 2013.\nPar dérogation aux sixième et septième alinéas du présent article, lorsqu'ils sont des entités importantes ou essentielles, les fournisseurs de services de systèmes de noms de domaine, les offices d'enregistrement, les fournisseurs de services d'informatique en nuage, les fournisseurs de services de centres de données, les fournisseurs de réseaux de diffusion de contenu, les fournisseurs de services gérés, les fournisseurs de services de sécurité gérés, ainsi que les fournisseurs de places de marché en ligne, de moteurs de recherche en ligne et de plateformes de services de réseaux sociaux et les prestataires de services de confiance mettent en œuvre les exigences techniques et méthodologiques qui leur sont propres.\nCes mesures techniques, opérationnelles et organisationnelles sont mises en œuvre aux frais des personnes concernées.", "amdt": false}]}, {"numero": 108, "vise": "ART. 39", "dispositif": "À l’alinéa 29, substituer aux mots :\n\n« huitième, dixième et dernier »,\n\nles mots :\n\n« huitième et dixième ».", "article": "39", "effet": [{"t": "=", "s": "Le chapitre VI du titre VI du livre V de la partie législative du code de l'environnement est ainsi modifié :\n1° À la troisième phrase de l'article L. 566-3, après les mots : « Ces évaluations sont », sont insérés les mots : « réexaminées et, si nécessaire, » ;\n2° À l'article L. 566-4 :\na) Au premier alinéa :\ni) À la première phrase :\n-après les mots : « L. 566-1, », sont insérés les mots : « ainsi que » ;\n-les mots : « et les critères nationaux de caractérisation de l'importance du risque d'inondation. » sont supprimés ;\nii) À la deuxième phrase :\n-les mots : « Le projet de » sont remplacés par les mots : «. Il arrête la » ;\n-après les mots : « projet de stratégie », sont insérés les mots : « nationale de gestion des risques d'inondation » ;\n-les mots : « en particulier ces critères, est soumis à l'» sont remplacés par le mot : « après » ;\niii) La troisième phrase est supprimée ;\nb) Le second alinéa est supprimé ;\n3° À l'article L. 566-5 :\na) Le I est abrogé ;\nb) Au II :\ni) La mention : « II.-» est supprimée ;\nii) Les mots : « décline les critères nationaux pour sélectionner » sont remplacés par le mot : « identifie » ;\n4° À la deuxième phrase de l'article L. 566-6, après les mots : « ces cartes sont », sont insérés les mots : « réexaminées et, si nécessaire, » ;\n5° À l'article L. 566-7 :\na) Au premier alinéa :\ni) À la première phrase, les mots : « pour les territoires définis à l'article L. 566-5 » sont supprimés ;\nii) À la deuxième phrase, les mots : « au même » sont remplacés par les mots : « à l'» ;\nb) À la fin de la première phrase du deuxième alinéa, sont ajoutés les mots : « en synergie avec les objectifs du schéma directeur d'aménagement et de gestion des eaux » ;\nc) Le 1° est abrogé ;\nd) Au 2°, qui devient le 1°, le mot : « Les » est remplacé par le mot : « Des » et les mots : « qui comprennent notamment le schéma directeur de prévision des crues prévu à l'article L. 564-2 » sont remplacés par les mots : « en tenant compte notamment du schéma directeur de prévision des crues prévu à l'article L. 564-2 » ;\ne) Au 3°, qui devient le 2°, le mot : « Les » est remplacé par le mot : « Des » ;\nf) Le 4° devient le 3° ;\ng) Les septième,", "amdt": false}, {"t": "=", "s": " huitième", "amdt": true}, {"t": "-", "s": ",", "amdt": false}, {"t": "+", "s": " et", "amdt": false}, {"t": "=", "s": " dixième", "amdt": true}, {"t": "-", "s": " et dernier", "amdt": false}, {"t": "=", "s": " alinéas sont supprimés ;\n6° À l'article L. 566-8, à la première phrase :\na) Après les mots : « pour les territoires », sont insérés les mots : « à risque important d'inondation » ;\nb) Les mots : « elles conduisent à l'identification de mesures pour ces derniers » sont remplacés par les mots : « Elles déclinent les objectifs du plan de gestion des risques d'inondation et conduisent à l'identification des mesures appropriées pour ces territoires » ;\n7° À la seconde phrase de l'article L. 566-9, les mots : « d'une information et » sont supprimés ;\n8° À l'article L. 566-11 :\na) Au premier alinéa, qui devient un I, après les mots : « sont élaborés et », sont insérés les mots : «, le cas échéant, », la quatrième occurrence du mot : « et » est supprimée et après les mots : « de l'espace », sont insérés les mots : « et de gestion des milieux aquatiques et de prévention des inondations » ;\nb) Au deuxième alinéa, qui devient un II, après les mots : « ses observations », sont ajoutés les mots : «, les documents mentionnés au I, un an au moins avant la date prévue d'entrée en vigueur du plan de gestion des risques d'inondation. » ;\nc) Les troisième, quatrième, cinquième et septième alinéas sont supprimés ;\n9° L'article L. 566-12 est abrogé.", "amdt": false}]}, {"numero": 109, "vise": "ART. 10", "dispositif": "Après l’alinéa 7, insérer l’alinéa suivant :\n\n« 3° À l’avant-dernier alinéa, le mot : « septième » est remplacé par le mot : « huitième ». »", "article": "10", "effet": [{"t": "=", "s": "I.-L'article L. 114-19 du code de la sécurité sociale est ainsi modifié :\n1° Le 5° est ainsi modifié :\na) Après le mot : « articles », sont insérées les références : « L. 211-1, L. 212-1, » ;\nb) Après le mot : « code », sont insérés les mots : « et à l'article L. 723-2 du code rural et de la pêche maritime » ;\nc) Sont ajoutés les mots : « du présent code » ;\n2° Après le même 5°, il est inséré un 6° ainsi rédigé :\n« 6° Aux agents des services mentionnés à l'article L. 262-15 du code de l'action sociale et des familles désignés par le président du conseil départemental afin de mener les actions de contrôle et de lutte contre la fraude relative au revenu de solidarité active. »\n", "amdt": false}, {"t": "+", "s": "3° À l'avant-dernier alinéa, le mot : « septième » est remplacé par le mot : « huitième ».\n", "amdt": false}, {"t": "=", "s": "II.-L'article L. 134 du livre des procédures fiscales est ainsi modifié :\n1° Au début, est ajoutée la mention : « I.-» ;\n2° Il est ajouté un II ainsi rédigé :\n« II.-Sur leur demande, précisant les entreprises concernées, reçoivent communication de renseignements liés au chiffre d'affaires des entreprises ayant placé tout ou partie de leurs salariés en activité partielle :\n« 1° Les agents du ministère chargé de l'emploi, dans le cadre de leur mission de lutte contre la fraude et de contrôle du dispositif d'activité partielle mentionné à l'article L. 5122-1 du code du travail ;\n« 2° Les agents des services centraux du ministère chargé de l'emploi, dans le cadre de leur mission d'appui et de coordination des services mentionnés au 1° du présent II. »", "amdt": false}]}, {"numero": 110, "vise": "APRÈS ART. 19", "dispositif": "Dans un délai de six mois à compter de la promulgation de la présente loi, le Gouvernement remet au Parlement un rapport relatif la sociologie des personnes ayant eu recours à l’euthanasie et au suicide assisté.", "article": "19 BIS", "effet": [{"t": "+", "s": "Dans un délai de six mois à compter de la promulgation de la présente loi, le Gouvernement remet au Parlement un rapport relatif la sociologie des personnes ayant eu recours à l'euthanasie et au suicide assisté.", "amdt": false}]}, {"numero": 111, "vise": "ART. 8", "dispositif": "Compléter l’alinéa 18 par la phrase suivante :\n\n« Il peut également prévoir une trajectoire de transition vers des pratiques agroécologiques permettant de réduire le recours aux produits phytopharmaceutiques mentionnés à l’article L. 253‑1 du code rural et de la pêche maritime, à l’exception des produits de biocontrôle mentionnés à l’article L. 253‑6 du même code, dans une logique de contractualisation avec l’agence de l’eau territorialement compétente et de valorisation des services écosystémiques. »", "article": "8", "effet": [{"t": "=", "s": "I.-Le code général des collectivités territoriales est ainsi modifié :\n1° L'article L. 2224-7-5 est remplacé par les dispositions suivantes :\n« Art. L. 2224-7-5.-Toute personne publique responsable de la production d'eau qui assure tout ou partie du prélèvement contribue à la gestion et à la préservation de la ressource en eau.\n« Le premier alinéa ne s'applique pas aux personnes publiques responsables de la production d'eau qui ne sont pas tenues d'élaborer et de mettre en œuvre un plan de gestion de la sécurité sanitaire de l'eau en application du 7° du I de l'article L. 1321-4 du code de la santé publique.\n« La personne publique responsable de la production d'eau peut être exonérée de cette contribution en fonction de la qualité de l'eau brute au point de prélèvement.\n« Un décret en Conseil d'État définit la méthode et les critères d'exonération, ainsi que les conditions de révision de cette exonération, en tenant compte de l'objectif de prévention des pollutions et de réduction des traitements de l'eau brute nécessaires à la production d'eau destinée à la consommation humaine. » ;\n2° Au troisième alinéa de l'article L. 2224-7-6 :\na) À la première phrase, après les mots : « eau potable correspondante », sont ajoutés les mots : «, identifiant les zones les plus vulnérables aux pollutions » ;\nb) La seconde phrase est remplacée par une phrase ainsi rédigée :\n« Dans un délai fixé par décret, la personne publique mentionnée au premier alinéa transmet au représentant de l'État dans le département le plan d'action qu'elle a établi ainsi qu'une proposition de délimitation de l'aire d'alimentation des captages d'eau potable correspondante. »\n3° Le dernier alinéa de l'article L. 2224-7-7 est supprimé.\nII.-Le code de l'environnement est ainsi modifié :\n1° À l'article L. 211-3 :\na) Les deux alinéas du 7° du II sont abrogés ;\nb) Les V et VI sont remplacés par les dispositions suivantes :\n« V.-Sur la base des propositions transmises par les personnes publiques responsables de la production d'eau, en application de l'article L. 2224-7-6 du code général des collectivités territoriales, le représentant de l'État dans le département arrête la délimitation des aires d'alimentation des captages dont les zones les plus vulnérables aux pollutions. À défaut de transmission par la personne publique d'une proposition de délimitation, le représentant de l'État dans le département peut délimiter lui-même l'aire d'alimentation des captages. Il est tenu d'arrêter l'aire d'alimentation des captages, identifiant les zones les plus vulnérables aux pollutions, pour les points de prélèvement prioritaires définis au présent V, même en l'absence de transmission par la personne publique responsable de la production d'eau.\n« Le représentant de l'État dans le département arrête la liste de points de prélèvement prioritaires, en tenant notamment compte des objectifs d'atteinte du bon état des eaux, de réduction des traitements de l'eau brute nécessaires à la production d'eau destinée à la consommation humaine et de sécurisation de l'alimentation en eau potable.\n« Dans les zones les plus vulnérables des aires d'alimentation des captages associées à des points de prélèvement prioritaires, il arrête un programme d'actions encadrant les installations, travaux, activités, dépôts, ouvrages, aménagements ou occupations du sol de nature à nuire directement ou indirectement à la qualité des eaux. Ce programme d'actions encadre, limite ou peut interdire certaines pratiques agricoles et l'utilisation d'intrants dans les conditions prévues à l'article L. 114-1 du code rural et de la pêche maritime.", "amdt": false}, {"t": "+", "s": " Il peut également prévoir une trajectoire de transition vers des pratiques agroécologiques permettant de réduire le recours aux produits phytopharmaceutiques mentionnés à l'article L. 253-1 du code rural et de la pêche maritime, à l'exception des produits de biocontrôle mentionnés à l'article L. 253-6 du même code, dans une logique de contractualisation avec l'agence de l'eau territorialement compétente et de valorisation des services écosystémiques.", "amdt": false}, {"t": "=", "s": "\n« Un décret en Conseil d'État précise les critères d'identification des captages prioritaires, ainsi que les modalités d'élaboration du programme d'actions visant à protéger les aires d'alimentation de ces captages.\n« VI.-Dans le cas où un périmètre de protection éloignée a été délimité, en application de l'article L. 1321-2 du code de la santé publique, l'acte délimitant l'aire d'alimentation de captage associée au point de prélèvement et arrêtant, le cas échéant, un programme d'actions pris en application du 5° du II ou du V du présent article, supprime ce périmètre de protection éloignée. »\n2° L'article L. 211-11-1 est abrogé.\nIII.-La deuxième phrase du premier alinéa de l'article L. 1321-2 du code de la santé publique est remplacée par les dispositions suivantes :\n« Pour les points de prélèvement pour lesquels la contribution mentionnée à l'article L. 2224-7-5 du code général des collectivités territoriales n'est pas obligatoire, un périmètre de protection éloignée peut être adjoint aux périmètres de protection immédiate et rapprochée. »\nIV.-L'accroissement des charges résultant pour les communes et leurs groupements de l'extension des compétences obligatoires instituée par le présent article fait l'objet d'une compensation financière dans les conditions fixées aux articles L. 1614-1-1 et L. 1614-3-1 du code général des collectivités territoriales.", "amdt": false}]}, {"numero": 112, "vise": "ART. 5", "dispositif": "Compléter l’alinéa 6 par la phrase suivante :\n\n« La répartition des volumes tient également compte de la nécessité de garantir la viabilité économique des exploitations agricoles concernées et le maintien des capacités de production alimentaire. »", "article": "5", "effet": [{"t": "=", "s": "Le code de l'environnement est ainsi modifié :\n1° Le III de l'article L. 181-10-1 est ainsi modifié :\na) À la première phrase du second alinéa du 1°, après les mots : « d'élevage », sont insérés les mots : « ainsi que pour les projets d'ouvrages de stockage d'eau et les prélèvements sur les eaux superficielles ou souterraines associés, définis dans le cadre d'un projet de territoire pour la gestion de l'eau mentionné au 10° du II de l'article L. 211-3 » ;\nb) À la première phrase du neuvième alinéa, après les mots : « d'élevage », sont insérés les mots : « ainsi que pour les projets d'ouvrages de stockage d'eau et les prélèvements sur les eaux superficielles ou souterraines associés mentionnés au 1° du présent III » ;\n2° Le II de l'article L. 211-3 est ainsi modifié :\na) Après la deuxième phrase du 6°, sont insérées deux phrases ainsi rédigées : « Cet organisme unique est chargé, dans le périmètre pour lequel il est désigné, de déposer la demande d'autorisation pluriannuelle de prélèvement, d'élaborer et de mettre en œuvre une stratégie concertée d'irrigation permettant l'adaptation de l'agriculture du territoire au changement climatique et à la disponibilité de la ressource et d'établir chaque année, avec un objectif d'efficacité et de sobriété à l'hectare de l'usage de l'eau, le plan de répartition du volume d'eau autorisé entre les irrigants. Le plan annuel de répartition assure un accès équitable à la ressource sans exclure l'accès de nouveaux irrigants. La stratégie concertée d'irrigation et un bilan annuel des volumes prélevés au regard des volumes autorisés sont rendus publics selon des modalités déterminées par décret. En cas de défaillance de l'organisme unique et après mise en demeure restée sans effet à l'expiration du délai imparti, l'autorité administrative peut, après l'avoir mis en mesure de présenter ses observations, faire procéder d'office, aux frais de cet organisme, à l'exécution des actes relevant de ses missions", "amdt": false}, {"t": "+", "s": ". La répartition des volumes tient également compte de la nécessité de garantir la viabilité économique des exploitations agricoles concernées et le maintien des capacités de production alimentaire", "amdt": false}, {"t": "=", "s": ".", "amdt": true}, {"t": "=", "s": " » ;\nb) Il est ajouté un 10° ainsi rédigé :\n« 10° Arrêter les volumes prélevables et leur répartition par usages sur les sous-bassins classés en zone de répartition des eaux ou identifiés comme étant en situation de déséquilibre quantitatif dans le schéma directeur d'aménagement et de gestion des eaux et approuver, au terme d'une démarche concertée, des projets de territoire pour la gestion de l'eau visant à adapter les usages de l'eau à la disponibilité de la ressource sur un ou plusieurs de ces sous-bassins ou fractions de sous-bassins pour respecter ces volumes prélevables. Les volumes prélevables arrêtés ainsi que les projets de territoire pour la gestion de l'eau approuvés en application du présent article, lorsqu'ils sont susceptibles de conduire à la révision d'un schéma d'aménagement et de gestion des eaux en application de l'article L. 212-9-1 du présent code ou à une dérogation à ses règles, sont notamment établis sur le fondement des meilleures connaissances scientifiques disponibles ou, lorsqu'elle a été réalisée, d'une étude portant sur l'hydrologie, les milieux aquatiques, les usages de l'eau et le changement climatique sur le sous-bassin ou la fraction de sous-bassin concerné.\n« Lorsque le périmètre d'un projet de territoire pour la gestion de l'eau est inclus en tout ou partie dans celui d'un schéma d'aménagement et de gestion des eaux, la commission locale de l'eau compétente, élargie à l'ensemble des membres du projet de territoire qui n'en sont pas membres, constitue le comité de pilotage chargé de superviser l'élaboration et la mise en œuvre de ce projet. Le préfet coordonnateur de bassin approuve le projet de territoire après avis de la commission locale de l'eau. À défaut d'avis rendu dans un délai de quatre mois à compter de sa saisine, cet avis est réputé rendu.\n« Lorsque le périmètre d'un projet de territoire pour la gestion de l'eau n'est inclus dans aucun schéma d'aménagement et de gestion des eaux, la composition du comité de pilotage chargé de la supervision de son élaboration et de sa mise en œuvre garantit une représentation équilibrée des collectivités territoriales et de leurs groupements, des représentants des différents usages de l'eau et des associations agréées de protection de l'environnement mentionnées à l'article L. 141-1. Un décret précise les modalités d'application du présent alinéa. » ;\n3° Après l'article L. 214-3-1, il est ajouté un article L. 214-3-2 ainsi rédigé :\n« Art. L. 214-3-2.-En cas d'annulation d'une autorisation de prélèvement délivrée à un organisme unique de gestion collective de l'irrigation mentionné au 6° du II de l'article L. 211-3, l'autorité administrative peut, à titre provisoire et pour une durée maximale de deux ans, le cas échéant sous réserve de prescriptions, autoriser la poursuite des prélèvements jusqu'à la délivrance d'une nouvelle autorisation, en tenant notamment compte de la nature et de la portée de l'illégalité en cause, des considérations d'ordre économique et social ou de tout autre motif d'intérêt général pouvant justifier la poursuite des prélèvements ainsi que de l'atteinte éventuellement causée par ceux-ci aux intérêts mentionnés aux articles L. 181-3 et L. 181-4 ou à d'autres intérêts publics et privés.\n« Les modalités d'application du présent article sont précisées par décret en Conseil d'État. »", "amdt": false}]}, {"numero": 113, "vise": "ART. PREMIER", "dispositif": "À la fin de l’alinéa 6, substituer aux mots :\n\n« en lien avec le monde agricole »\n\nles mots :\n\n« d’accompagnement d’agriculteurs et d’agricultrices en difficulté ».", "article": "PREMIER", "effet": [{"t": "=", "s": "Le titre VII du livre Ier de la première partie du code de la santé publique est complété par un chapitre IV ainsi rédigé :\n« Chapitre IV\n« Santé mentale des agricultrices et agriculteurs\n« Art. L. 1174-1.-Il est créé un dispositif national de sentinelles agricoles.\n« Ce dispositif a la charge de coordonner les acteurs en capacité de détecter et de traiter les situations de souffrance psychique et de risque suicidaire rencontrées parmi les agricultrices et agriculteurs.\n« Ces acteurs comprennent notamment les agricultrices et agriculteurs, les conseillers agricoles, les experts comptables agricoles, les membres de sociétés coopératives agricoles, les vétérinaires, les membres des conseils municipaux, départementaux et régionaux territorialement compétents, les membres d'associations", "amdt": false}, {"t": "+", "s": " d'accompagnement d'agriculteurs et d'agricultrices", "amdt": false}, {"t": "=", "s": " en", "amdt": true}, {"t": "-", "s": " lien avec le monde agricole", "amdt": false}, {"t": "+", "s": " difficulté", "amdt": false}, {"t": "=", "s": ".\n« La liste de ces acteurs est fixée par arrêté conjoint des ministres chargés de la santé et de l'agriculture.\n« Lesdits acteurs bénéficient d'une formation certifiée prise en charge par l'État, dans le cadre d'un référentiel national validé par la mission nationale pour la santé mentale des agricultrices et agriculteurs mentionnée à l'article L. 1174-3 du code de la santé publique.\n« Cette formation comprend a minima des modules relatifs à l'identification de signaux de détresse mentale des agricultrices et agriculteurs, à la conduite d'un dialogue adapté et à l'orientation vers un guichet unique départemental de santé mentale agricole.\n« Les acteurs ainsi formés peuvent se prévaloir du label « Sentinelle agricole ».\n« Lesdits acteurs participent à un réseau territorial animé conjointement par les caisses départementales de la mutualité sociale agricole et les chambres départementales d'agriculture.\n« Les sentinelles détectent les premiers signaux de souffrance psychique et de risque suicidaire et réorientent les agricultrices et les agriculteurs vers le guichet unique départemental de santé mentale agricole afin de garantir une prise en charge rapide.\n« Les modalités d'application du présent article sont fixées par arrêté conjoint des ministres chargés de la santé et de l'agriculture. »", "amdt": false}]}, {"numero": 114, "vise": "ART. 7", "dispositif": "À la fin de la deuxième phrase de l’alinéa 16, substituer aux mots :\n\n« de leur département gardien »,\n\nles mots :\n\n« du département auquel ils ont été confiés ».", "article": "7", "effet": [{"t": "=", "s": "I.-Le code de l'action sociale et des familles est ainsi modifié :\n1° L'article L. 221-2-3 est ainsi modifié :\na) Au premier alinéa, après la référence : « L. 222-5 », sont insérés les mots : « ou d'une personne mentionnée au I de l'article L. 221-2-4 » et, après le mot : « mentionnées », la fin est ainsi rédigée : « aux articles L. 221-2-1 et L. 421-2 ou dans des établissements et services autorisés au titre du présent code, à l'exclusion de ceux mentionnés à l'article L. 321-1. » ;\nb) Le second alinéa est supprimé ;\n2° Le titre II du livre II est complété par un chapitre IX ainsi rédigé :\n« Chapitre IX\n« Systèmes d'information, services et outils numériques\n« Art. L. 229-1.-Afin de garantir l'échange, le partage, la sécurité et la confidentialité des données à caractère personnel, les systèmes d'information, les services ou les outils numériques utilisés pour la mise en œuvre de la politique de protection de l'enfance définie à l'article L. 112-3 par l'État, les services départementaux de l'aide sociale à l'enfance et les établissements et services sociaux et médico-sociaux mentionnés aux 1°, 4°, 12° et 17° du I et au III de l'article L. 312-1 doivent être conformes à des référentiels d'interopérabilité, de sécurité et d'éthique approuvés par arrêté des ministres compétents et doivent bénéficier des moyens adaptés.\n« Les systèmes d'information, les services ou les outils numériques utilisés à la date de publication des référentiels mentionnés au premier alinéa du présent article sont mis en conformité avec ceux-ci dans un délai fixé par arrêté des ministres compétents, qui ne peut excéder dix-huit mois. À l'expiration de ce délai, l'autorité administrative compétente peut mettre en demeure la personne responsable de leur utilisation de procéder à cette mise en conformité dans un délai qu'elle fixe.\n« Les conditions d'élaboration des référentiels mentionnés au premier alinéa du présent article sont fixées par décret dans un délai de six mois à compter de la promulgation de la loi n° du relative à la protection des enfants.\n« Les référentiels d'interopérabilité, de sécurité et d'éthique prévus à l'article L. 1470-5 du code de la santé publique, lorsqu'ils concourent à la politique de protection de l'enfance, peuvent être rendus opposables, par arrêté des ministres compétents, aux systèmes d'information, services et outils numériques des personnes mentionnées au premier alinéa du présent article. » ;\n3° Le III de l'article L. 312-1 est ainsi modifié :\na) (Supprimé)\nb) La dernière phrase est ainsi rédigée : « Les conditions techniques minimales d'organisation et de fonctionnement et les règles de financement et de tarification des lieux de vie et d'accueil sont définies par un décret pris après avis de la section sociale du Comité national de l'organisation sanitaire et sociale. » ;\nc) Il est ajouté un alinéa ainsi rédigé :\n« Le représentant de l'État dans le département peut, à tout moment et de sa propre initiative, faire procéder au contrôle de tout établissement ou service ainsi que de tout lieu de vie et d'accueil mentionné au présent article. Ce contrôle vise à s'assurer des conditions de prise en charge, de la santé, de la sécurité et du respect des droits des personnes accueillies, notamment des enfants accueillis en dehors", "amdt": false}, {"t": "-", "s": " de leur", "amdt": false}, {"t": "+", "s": " du", "amdt": false}, {"t": "=", "s": " département", "amdt": true}, {"t": "-", "s": " gardien", "amdt": false}, {"t": "+", "s": " auquel ils ont été confiés", "amdt": false}, {"t": "=", "s": ". Si ces conditions ne sont pas respectées, il prend les mesures nécessaires prévues par le présent code. » ;\n4° et 5° (Supprimés)\n6° L'intitulé du titre II du livre III est ainsi rédigé : « Autres établissements soumis à autorisation ou déclaration » ;\n7° Les articles L. 321-1 à L. 321-3 sont ainsi rédigés :\n« Art. L. 321-1.-Sous réserve des dispositions applicables aux autres personnes mentionnées au premier alinéa de l'article L. 221-2-3, toute personne physique qui désire héberger ou recevoir des mineurs pris en charge en application de l'article L. 222-5 de manière habituelle, collectivement, à titre gratuit ou onéreux, ou toute personne morale de droit privé à but non lucratif qui souhaite assurer un tel accueil de manière habituelle ou ponctuelle doit y être préalablement autorisée par le président du conseil départemental. L'autorisation ne peut être délivrée à une personne morale de droit privé poursuivant un but lucratif. Le président du conseil départemental vérifie le respect de cette condition au regard des statuts, de la composition des organes dirigeants, des comptes annuels, des conventions conclues avec des tiers et de tout document permettant d'apprécier les conditions réelles d'organisation, de gestion et de financement de l'activité. Cette vérification peut donner lieu à des contrôles sur pièces et sur place. La méconnaissance de cette condition, le refus de communiquer les documents nécessaires au contrôle ou la communication d'informations inexactes entraîne le refus, la suspension ou le retrait de l'autorisation.\n« L'autorisation est accordée pour une durée maximale de cinq ans si le projet :\n« 1° Est compatible avec les objectifs et principes fixés aux articles L. 112-3, L. 112-4 et L. 221-2-3, notamment avec les ratios minimaux d'encadrement des mineurs accueillis définis par catégorie d'établissement ou de service et par tranche d'âge ;\n« 2° Satisfait aux règles d'organisation et de fonctionnement prévues par le présent code.\n« L'autorisation ou son renouvellement peuvent être assortis de conditions particulières imposées dans l'intérêt des personnes accueillies.\n« Le contenu de la demande d'autorisation, ses modalités de délivrance, de révision et de renouvellement ainsi que les conditions techniques minimales de fonctionnement des structures relevant du présent article sont définies par un décret pris après avis de la section sociale du Comité national de l'organisation sanitaire et sociale.\n« Tout changement important relatif à l'activité, à l'installation, à l'organisation, à la direction ou au fonctionnement d'un établissement autorisé au titre du présent article est préalablement autorisé par le président du conseil départemental dans des conditions déterminées par décret. Le président du conseil départemental en informe le représentant de l'État dans le département.\n« Lorsqu'un mineur est confié, au titre de la protection de l'enfance, à une structure autorisée en application du présent article située hors du département qui assure sa prise en charge, le président du conseil départemental de ce dernier transmet sans délai au président du conseil départemental du lieu d'implantation de la structure l'identité du mineur concerné, la date de début de l'accueil, la structure d'accueil ainsi que, le cas échéant, la date de fin prévisionnelle de l'accueil. Cette transmission est réalisée dans des conditions garantissant la confidentialité des informations relatives au mineur.\n« Chaque président de conseil départemental transmet annuellement à l'Observatoire national de la protection de l'enfance, sous une forme consolidée, la liste des mineurs confiés à une structure située hors de leur département d'origine, en précisant le département d'origine, le département d'accueil, la nature de la structure, la durée de l'accueil et l'autorité responsable de la mesure, dans des conditions garantissant la protection des données à caractère personnel.\n« Art. L. 321-2.-Le contrôle et la police administrative des personnes mentionnées à l'article L. 321-1 sont exercés dans les conditions définies à la section 4 du chapitre III du titre Ier du présent livre.\n« Art. L. 321-3.-Les articles L. 133-6, L. 133-6-1, L. 133-6-2 et L. 135-2 sont applicables à l'accueil de mineurs autorisé au titre de l'article L. 321-1. » ;\n8° L'article L. 321-4 est ainsi modifié :\na) Le 1° est ainsi rédigé :\n« 1° Le fait, pour une personne physique, d'héberger ou de recevoir des mineurs, collectivement et de manière habituelle, ou, pour une personne morale de droit privé, de manière habituelle ou ponctuelle, dans un établissement mentionné à l'article L. 321-1 sans autorisation préalable du président du conseil départemental ; »\nb) Au 2°, les mots : «, sans avoir effectué la déclaration préalable auprès du président du conseil départemental » sont supprimés et les mots : « malgré l'opposition » sont remplacés par les mots : « sans autorisation préalable » ;\nc) Le 3° est abrogé ;\n9° À l'article L. 331-7, les mots : « de l'article L. 312-1 ou déclaré en vertu de l'article » sont remplacés par les mots : « des articles L. 312-1 et » ;\n10° À l'article L. 331-8-1, les mots : « l'autorisation prévue à l'article L. 313-1 ou pour recevoir leur déclaration en application des articles L. 321-1 et » sont remplacés par les mots : « les autorisations prévues aux articles L. 313-1 et L. 321-1 ou pour recevoir leur déclaration en application de l'article ».\nII.-Les personnes qui ont effectué une déclaration sur le fondement de l'article L. 321-1 du code de l'action sociale et des familles dans sa rédaction antérieure à la présente loi et dont l'activité est soumise à un régime d'autorisation en application du 7° du I du même article L. 321-1 dans sa rédaction résultant de la présente loi peuvent continuer à exercer leur activité jusqu'à l'intervention de la décision administrative statuant sur leur demande d'autorisation et, en l'absence d'une telle demande, au plus tard jusqu'au premier jour du douzième mois suivant la publication de la présente loi.", "amdt": false}]}, {"numero": 115, "vise": "ART. 8", "dispositif": "Compléter l’alinéa 2 par la phrase suivante :\n\n« La préparation magistrale létale est une préparation qui provoque la mort rapidement et sans souffrance. »", "article": "8", "effet": [{"t": "=", "s": "La sous-section 3 de la section 2 bis du chapitre Ier du titre Ier du livre Ier de la première partie du code de la santé publique, telle qu'elle résulte des articles 5 à 7 de la présente loi, est complétée par un article L. 1111-12-6 ainsi rédigé :\n« Art. L. 1111-12-6.-Lorsque la date de l'administration de la substance létale est fixée, la pharmacie hospitalière à usage intérieur mentionnée au second alinéa du VI de l'article L. 1111-12-4 réalise la préparation magistrale létale et la transmet à la pharmacie d'officine désignée par le médecin ou l'infirmier chargé d'accompagner la personne en accord avec celle-ci. La pharmacie d'officine délivre la préparation magistrale létale au médecin ou à l'infirmier.", "amdt": false}, {"t": "+", "s": " La préparation magistrale létale est une préparation qui provoque la mort rapidement et sans souffrance.", "amdt": false}, {"t": "=", "s": "\n« Lorsque la personne est admise ou hébergée dans un établissement qui est doté d'une pharmacie à usage intérieur, cette dernière remplit les missions de la pharmacie d'officine prévues au premier alinéa du présent article. »", "amdt": false}]}, {"numero": 116, "vise": "ART. 4", "dispositif": "Après l’alinéa 7, insérer l’alinéa suivant :\n\n« La phase avancée d’une affection grave et incurable est définie comme l’entrée dans un processus irréversible marqué par l’aggravation de l’état de santé de la personne malade qui affecte sa qualité de vie. »", "article": "4", "effet": [{"t": "=", "s": "La section 2 bis du chapitre Ier du titre Ier du livre Ier de la première partie du code de la santé publique, telle qu'elle résulte de l'article 2 de la présente loi, est complétée par une sous-section 2 ainsi rédigée :\n« Sous-section 2\n« Conditions d'accès\n« Art. L. 1111-12-2.-Pour accéder à l'aide à mourir, une personne doit répondre à toutes les conditions suivantes :\n« 1° Être âgée d'au moins dix-huit ans ;\n« 2° Être de nationalité française ou résider de façon stable et régulière en France ;\n« 3° Être atteinte d'une affection grave et incurable, quelle qu'en soit la cause, qui engage le pronostic vital, en phase avancée ou terminale ;\n", "amdt": false}, {"t": "=", "s": "«", "amdt": true}, {"t": "+", "s": " La phase avancée d'une affection grave et incurable est définie comme l'entrée dans un processus irréversible marqué par l'aggravation de l'état de santé de la personne malade qui affecte sa qualité de vie.\n«", "amdt": false}, {"t": "=", "s": " 4° Présenter une souffrance physique ou psychologique liée à cette affection, qui est soit réfractaire aux traitements, soit insupportable selon la personne lorsque celle-ci a choisi de ne pas recevoir ou d'arrêter de recevoir un traitement ;\n« 5° Être apte à manifester sa volonté de façon libre et éclairée. »", "amdt": false}]}, {"numero": 117, "vise": "ART. PREMIER", "dispositif": "Supprimer les alinéas 8 à 11.", "article": "PREMIER", "effet": [{"t": "=", "s": "Le code de la santé publique est ainsi modifié :\n1° Le chapitre III du titre III du livre Ier de la deuxième partie est complété par un article L. 2133-3 ainsi rédigé :\n« Art. L. 2133-3.-Les messages publicitaires et activités promotionnelles en faveur d'aliments ultra transformés au sens de l'article L. 3233-1 du code de la santé publique qui apparaissent, par leur caractère, leur présentation ou leur objet, comme principalement destinés aux mineurs sont interdits sur tout support de communication.\n« Pour les produits visés au premier alinéa, l'usage sur les emballages d'éléments graphiques ou textuels de nature à attirer l'attention des enfants est interdit. À titre transitoire, les produits conditionnés avant l'entrée en vigueur de la loi peuvent être mis sur le marché dans un délai de six mois.\n« Le premier alinéa ne s'applique pas aux aliments et boissons qui figurent sur une liste fixée par arrêté du ministre chargé de la santé, pris après avis de l'Agence nationale de sécurité sanitaire de l'alimentation, de l'environnement et du travail, compte tenu de leurs caractéristiques nutritionnelles adaptées aux besoins de l'enfant dans le cadre d'une alimentation équilibrée.\n« Le non-respect du présent article est puni de 30 000 € d'amende par diffusion illégale constatée, le montant de cette amende pouvant être porté à 30 % des dépenses consacrées à la publicité, sans préjudice des sanctions plus élevées prévues par le code de la communication audiovisuelle.\n« Les modalités d'application du présent article sont déterminées par décret. » ;", "amdt": false}, {"t": "-", "s": "\n2° Le livre II bis de la troisième partie est complété par un chapitre III ainsi rédigé :\n« Chapitre III\n« Aliments ultra transformés\n« Art. L. 3233.-Un aliment ultra transformé s'entend de toute denrée alimentaire, au sens de l'article 2 du règlement (CE) n° 718 / 2002 du Parlement européen et du conseil du 28 janvier 2002 établissant les principes généraux et les prescriptions générales de la législation alimentaire, instituant l'Autorité européenne de sécurité des aliments et fixant des procédures relatives à la sécurité des denrées alimentaires, ayant subi un ou plusieurs procédés de transformation physico-chimiques ou technologiques ou contenant un ou plusieurs ingrédients dont la liste est établie par arrêté du ministère en charge de la santé sur proposition du Haut conseil de la Santé publique et de l'Institut national de la santé et de la recherche médicale. »", "amdt": false}]}, {"numero": 118, "vise": "APRÈS ART. PREMIER", "dispositif": "Le Gouvernement remet au Parlement un rapport annuel évaluant les conséquences sociales et financières de la présente loi.", "article": "PREMIER BIS", "effet": [{"t": "+", "s": "Le Gouvernement remet au Parlement un rapport annuel évaluant les conséquences sociales et financières de la présente loi.", "amdt": false}]}, {"numero": 119, "vise": "ART. 4", "dispositif": "Compléter cet article par l’alinéa suivant :\n\n« 6° Ne pas avoir fait l’objet d’une mise sous protection judiciaire dans les dix dernières années. »", "article": "4", "effet": [{"t": "=", "s": "La section 2 bis du chapitre Ier du titre Ier du livre Ier de la première partie du code de la santé publique, telle qu'elle résulte de l'article 2 de la présente loi, est complétée par une sous-section 2 ainsi rédigée :\n« Sous-section 2\n« Conditions d'accès\n« Art. L. 1111-12-2.-Pour accéder à l'aide à mourir, une personne doit répondre à toutes les conditions suivantes :\n« 1° Être âgée d'au moins dix-huit ans ;\n« 2° Être de nationalité française ou résider de façon stable et régulière en France ;\n« 3° Être atteinte d'une affection grave et incurable, quelle qu'en soit la cause, qui engage le pronostic vital, en phase avancée ou terminale ;\n« 4° Présenter une souffrance physique ou psychologique liée à cette affection, qui est soit réfractaire aux traitements, soit insupportable selon la personne lorsque celle-ci a choisi de ne pas recevoir ou d'arrêter de recevoir un traitement ;\n« 5° Être apte à manifester sa volonté de façon libre et éclairée. »", "amdt": false}, {"t": "+", "s": "\n6° Ne pas avoir fait l'objet d'une mise sous protection judiciaire dans les dix dernières années.", "amdt": false}]}, {"numero": 120, "vise": "ART. 5", "dispositif": "Après l’alinéa 8, insérer les deux alinéas suivants :\n\n« Lorsque le périmètre d’un projet de territoire pour la gestion de l’eau est inclus en tout ou partie dans celui d’un schéma d’aménagement et de gestion des eaux, la commission locale de l’eau compétente, élargie à l’ensemble des acteurs membres du projet de territoire qui n’en sont pas membres, constitue le comité de pilotage chargé de superviser l’élaboration et la mise en œuvre de ce projet. Le préfet coordonnateur de bassin approuve le projet de territoire après avis de la commission locale de l’eau. À défaut d’avis rendu dans un délai de quatre mois à compter de sa saisine, cet avis est réputé rendu.\n\n« Lorsque le périmètre d’un projet de territoire pour la gestion de l’eau n’est inclus dans aucun schéma d’aménagement et de gestion des eaux, la composition du comité de pilotage chargé de la supervision de son élaboration et de sa mise en œuvre garantit une représentation équilibrée des collectivités territoriales et de leurs groupements, des représentants des différents usages de l’eau et des associations agréées de protection de l’environnement mentionnées à l’article L. 141‑1. Un décret précise les modalités d’application du présent alinéa. »", "article": "5", "effet": [{"t": "=", "s": "I.-Le III de l'article L. 181-10-1 du code de l'environnement est ainsi modifié :\n1° À la première phrase du second alinéa du 1°, après les mots : « activités d'élevage », sont insérés les mots : « ainsi que pour les projets d'ouvrages de stockage d'eau et les prélèvements sur les eaux superficielles ou souterraines associés, définis dans le cadre d'un projet de territoire pour la gestion de l'eau mentionné au 10° du II de l'article L. 211-3 » ;\n2° À la première phrase du neuvième alinéa, après les mots : « activités d'élevage », sont insérés les mots : « et pour les projets d'ouvrages de stockage d'eau et les prélèvements sur les eaux superficielles ou souterraines associés mentionnés au 1° ».\nII.-Le II de l'article L. 211-3 du même code est ainsi modifié :\n1° Après la deuxième phrase du 6° sont insérées deux phrases ainsi rédigées :\n« Cet organisme unique est chargé, dans le périmètre pour lequel il est désigné, de déposer la demande d'autorisation pluriannuelle de prélèvement, d'élaborer et de mettre en œuvre une stratégie concertée d'irrigation permettant l'adaptation de l'agriculture du territoire au changement climatique en tenant compte du renouvellement des générations, et d'établir chaque année le plan de répartition du volume d'eau autorisé entre irrigants. En cas de défaillance de l'organisme unique, et après mise en demeure restée sans effet à l'expiration du délai imparti, l'autorité administrative peut, après l'avoir mis en mesure de présenter ses observations, faire procéder d'office, aux frais de cet organisme, à l'exécution des actes relevant de ses missions. » ;\n2° Le II est complété par un 10° ainsi rédigé :\n« 10° Arrêter les volumes prélevables et leur répartition par usages sur les sous-bassins en situation de tension quantitative, et approuver, au terme d'une démarche concertée, des projets de territoires pour la gestion de l'eau visant à adapter les usages de l'eau à la disponibilité de la ressource sur un ou plusieurs de ces sous-bassins ou fractions de sous-bassins pour respecter ces volumes prélevables. »\n", "amdt": false}, {"t": "+", "s": "Lorsque le périmètre d'un projet de territoire pour la gestion de l'eau est inclus en tout ou partie dans celui d'un schéma d'aménagement et de gestion des eaux, la commission locale de l'eau compétente, élargie à l'ensemble des acteurs membres du projet de territoire qui n'en sont pas membres, constitue le comité de pilotage chargé de superviser l'élaboration et la mise en œuvre de ce projet. Le préfet coordonnateur de bassin approuve le projet de territoire après avis de la commission locale de l'eau. À défaut d'avis rendu dans un délai de quatre mois à compter de sa saisine, cet avis est réputé rendu.\nLorsque le périmètre d'un projet de territoire pour la gestion de l'eau n'est inclus dans aucun schéma d'aménagement et de gestion des eaux, la composition du comité de pilotage chargé de la supervision de son élaboration et de sa mise en œuvre garantit une représentation équilibrée des collectivités territoriales et de leurs groupements, des représentants des différents usages de l'eau et des associations agréées de protection de l'environnement mentionnées à l'article L. 141-1. Un décret précise les modalités d'application du présent alinéa.\n", "amdt": false}, {"t": "=", "s": "III.-Après l'article L. 214-3-1 du même code, il est ajouté un article L. 214-3-2 ainsi rédigé :\n« Art. L. 214-3-2.-En cas d'annulation d'une autorisation de prélèvement délivrée à un organisme unique de gestion collective de l'irrigation mentionné au 6° du II de l'article L. 211-3, l'autorité administrative peut, à titre provisoire et pour une durée maximale de deux ans, le cas échéant sous réserve de prescriptions, autoriser la poursuite des prélèvements jusqu'à la délivrance d'une nouvelle autorisation, en tenant notamment compte de la nature et de la portée de l'illégalité en cause, des considérations d'ordre économique et social ou tout autre motif d'intérêt général pouvant justifier la poursuite des prélèvements ainsi que de l'atteinte éventuellement causée par ceux-ci aux intérêts mentionnés aux articles L. 181-3 et L. 181-4 ou à d'autres intérêts publics et privés.\n« Les modalités d'application du présent article sont précisées par décret en Conseil d'État. »", "amdt": false}]}, {"numero": 121, "vise": "APRÈS ART. 20 QUATER", "dispositif": "I. – Le livre des procédures fiscales est ainsi modifié :\n\n1° A l’article L. 181‑0 A, les mots : « et 1649 AB » sont remplacés par les mots : « , 1649 AB et 1649 bis C » ;\n\n2° L’article L. 262 est ainsi modifié :\n\na) Après le 2, il est inséré un 2 bis ainsi rédigé :\n\n« 2 bis. Lorsque la saisie administrative à tiers détenteur porte sur des actifs numériques au sens de l’article L. 54‑10‑1 du code monétaire et financier conservés par un prestataire de services sur actifs numériques, elle s’applique indifféremment à l’ensemble du portefeuille d’actifs numériques détenus par le redevable au jour de la saisie, dans la limite du montant de cette dernière.\n\n« À défaut de vente par le redevable dans un délai fixé par décret, le prestataire mentionné à l’alinéa précédent procède, lorsqu’il y est habilité, à la vente des actifs numériques et est tenu de verser, dans un délai fixé par décret, aux créanciers saisissant le produit de la cession libellé en euros ou en devises. Lorsqu’il n’est pas habilité à procéder à cette vente, le prestataire en confie la réalisation à un prestataire habilité.\n\n« La vente des actifs numériques emporte l’effet d’attribution immédiate du produit de la cession aux créanciers mentionnés au 1, au jour de la notification de la saisie administrative à tiers détenteur, à concurrence du montant de cette dernière.\n\n« Les dispositions du présent 2 bis s’appliquent au titulaire du compte ainsi qu’au prestataire de services sur actifs numériques conservant les actifs numériques en cause. » ;\n\nb) Il est complété par un 6 ainsi rédigé :\n\n« 6. Le montant des frais afférents à la saisie administrative à tiers détenteur perçu par les prestataires de services sur actifs numériques ne peut dépasser le montant prévu au 5. »\n\nII. – L’article L. 262 du livre des procédures fiscales est ainsi modifié :\n\n1° Au 2 bis :\n\n– Au premier alinéa, les deux occurrences des mots : « actifs numériques » sont remplacées par les mots : « crypto-actifs » ;\n\n– Au même alinéa, les mots : « d’actifs numériques » sont remplacés par les mots : « de crypto-actifs » ;\n\n– À la première phrase du deuxième alinéa, à l’avant-dernier alinéa et au dernier alinéa, les mots : « actifs numériques » sont remplacés par les mots : « crypto-actifs » ;\n\n2° Au 6, les mots : « actifs numériques » sont remplacés par les mots : « crypto-actifs ».\n\nIII. – Le I du présent article entre en vigueur à compter de la promulgation de la présente loi.\n\nIV. – Le II du présent article entre en vigueur le 1er juillet 2026.", "article": "20 QUATER BIS", "effet": [{"t": "+", "s": "I.-Le livre des procédures fiscales est ainsi modifié :\n1° A l'article L. 181-0 A, les mots : « et 1649 AB » sont remplacés par les mots : «, 1649 AB et 1649 bis C » ;\n2° L'article L. 262 est ainsi modifié :\na) Après le 2, il est inséré un 2 bis ainsi rédigé :\n« 2 bis. Lorsque la saisie administrative à tiers détenteur porte sur des actifs numériques au sens de l'article L. 54-10-1 du code monétaire et financier conservés par un prestataire de services sur actifs numériques, elle s'applique indifféremment à l'ensemble du portefeuille d'actifs numériques détenus par le redevable au jour de la saisie, dans la limite du montant de cette dernière.\n« À défaut de vente par le redevable dans un délai fixé par décret, le prestataire mentionné à l'alinéa précédent procède, lorsqu'il y est habilité, à la vente des actifs numériques et est tenu de verser, dans un délai fixé par décret, aux créanciers saisissant le produit de la cession libellé en euros ou en devises. Lorsqu'il n'est pas habilité à procéder à cette vente, le prestataire en confie la réalisation à un prestataire habilité.\n« La vente des actifs numériques emporte l'effet d'attribution immédiate du produit de la cession aux créanciers mentionnés au 1, au jour de la notification de la saisie administrative à tiers détenteur, à concurrence du montant de cette dernière.\n« Les dispositions du présent 2 bis s'appliquent au titulaire du compte ainsi qu'au prestataire de services sur actifs numériques conservant les actifs numériques en cause. » ;\nb) Il est complété par un 6 ainsi rédigé :\n« 6. Le montant des frais afférents à la saisie administrative à tiers détenteur perçu par les prestataires de services sur actifs numériques ne peut dépasser le montant prévu au 5. »\nII.-L'article L. 262 du livre des procédures fiscales est ainsi modifié :\n1° Au 2 bis :\n-Au premier alinéa, les deux occurrences des mots : « actifs numériques » sont remplacées par les mots : « crypto-actifs » ;\n-Au même alinéa, les mots : « d'actifs numériques » sont remplacés par les mots : « de crypto-actifs » ;\n-À la première phrase du deuxième alinéa, à l'avant-dernier alinéa et au dernier alinéa, les mots : « actifs numériques » sont remplacés par les mots : « crypto-actifs » ;\n2° Au 6, les mots : « actifs numériques » sont remplacés par les mots : « crypto-actifs ».\nIII.-Le I du présent article entre en vigueur à compter de la promulgation de la présente loi.\nIV.-Le II du présent article entre en vigueur le 1er juillet 2026.", "amdt": false}]}, {"numero": 122, "vise": "ART. UNIQUE", "dispositif": "Rédiger ainsi l'alinéa 11 :\n\n« II – Le 1° et le 2° du I du présent article entrent en vigueur au 1er janvier 2026. Le 3° du I du présent article entre en vigueur au 1er juillet 2025. ».", "article": "UNIQUE", "effet": [{"t": "=", "s": "I.-L'article 125 de la loi n° 2020-1525 du 7 décembre 2020 d'accélération et de simplification de l'action publique est ainsi modifié :\n1° Le II est ainsi modifié :\na) À la fin du A, les mots : « produits de grande consommation au sens du I de l'article L. 441-4 du code de commerce » sont remplacés par les mots : « denrées alimentaires ou de produits destinés à l'alimentation des animaux de compagnie » ;\nb) Au 2° du C, les mots : « produits de grande consommation » sont remplacés par les mots : « denrées alimentaires ou de produits destinés à l'alimentation des animaux de compagnie » ;\n2° Le III est ainsi modifié :\na) Au premier alinéa, les mots : « produits de grande consommation pour lesquels » sont remplacés par les mots : « denrées ou catégories de denrées alimentaires pour lesquelles » ;\nb) Au 1°, les mots : « produits de grande consommation concernés » sont remplacés par les mots : « denrées ou catégories de denrées alimentaires concernées » ;\nc) Au début de la seconde phrase du 2°, les mots : « Pour les denrées ou les catégories de denrées alimentaires, » sont supprimés ;\n3° Le VIII est ainsi rédigé :\n« VIII.-Les I, II et le IV sont applicables jusqu'au 15 avril 2028. »\n", "amdt": false}, {"t": "=", "s": "II", "amdt": true}, {"t": "-", "s": ".", "amdt": false}, {"t": "=", "s": "-Le", "amdt": true}, {"t": "+", "s": " 1° et le 2° du I du présent article entrent en vigueur au 1er janvier 2026. Le 3° du", "amdt": false}, {"t": "=", "s": " I du présent article entre en vigueur", "amdt": true}, {"t": "-", "s": " le", "amdt": false}, {"t": "+", "s": " au", "amdt": false}, {"t": "=", "s": " 1er juillet 2025.", "amdt": true}]}, {"numero": 123, "vise": "APRÈS ART. 4", "dispositif": "Dans un délai de six mois suivant la promulgation de la présente loi, le Gouvernement remet au Parlement un rapport évaluant l’opportunité de garantir une représentation minimale des exploitants agricoles individuels et des petites exploitations dans les instances de gouvernance des chambres d’agriculture, par l’instauration de collèges électoraux spécifiques ou par un ajustement des modalités de scrutin qu’il jugerait nécessaire.", "article": "4 BIS", "effet": [{"t": "+", "s": "Dans un délai de six mois suivant la promulgation de la présente loi, le Gouvernement remet au Parlement un rapport évaluant l'opportunité de garantir une représentation minimale des exploitants agricoles individuels et des petites exploitations dans les instances de gouvernance des chambres d'agriculture, par l'instauration de collèges électoraux spécifiques ou par un ajustement des modalités de scrutin qu'il jugerait nécessaire.", "amdt": false}]}, {"numero": 124, "vise": "ART. 10", "dispositif": "Après l’alinéa 6, insérer l’alinéa suivant :\n\n« 4° La vérification des antécédents judiciaires des personnes nommément visées par la plainte ou mises en cause par la victime, par la consultation du fichier judiciaire automatisé des auteurs d’infractions sexuelles ou violentes et du fichier judiciaire national automatisé des auteurs d’infractions terroristes et, pour les personnes majeures, du bulletin n° 2 du casier judiciaire. »", "article": "10", "effet": [{"t": "=", "s": "I. ‒ Après l'article 706-47-4 du code de procédure pénale, il est inséré un article 706-47-5 ainsi rédigé :\n« Art. 706-47-5. ‒ I. ‒ À compter du dépôt d'une plainte ou de la réception par le procureur de la République d'un signalement ou d'une dénonciation portant sur un crime ou un délit mentionné à l'article 706-47 commis sur un mineur, il est procédé dans les meilleurs délais au moins aux actes suivants :\n« 1° L'audition sans délai de la victime, réalisée dans les conditions prévues à l'article 706-52 par des enquêteurs spécialement formés au recueil de la parole des mineurs et, sauf impossibilité, au sein d'une unité d'accueil pédiatrique enfance en danger ou de locaux adaptés, à laquelle est proposé un dispositif d'accompagnement spécialisé ;\n« 1° bis L'information de la victime mineure, dans des conditions adaptées à son âge et à sa compréhension, de l'ensemble des droits dont elle bénéficie au cours de la procédure, notamment de son droit à l'aide juridictionnelle, à être assistée par un avocat, à bénéficier d'une prise en charge médicale et psychologique ainsi que, le cas échéant, à l'assistance d'un interprète ou d'un traducteur ;\n« 2° Les réquisitions utiles permettant la préservation des preuves matérielles, numériques ou médico-légales ;\n« 3° Une enquête sur la personnalité et l'environnement social et familial de la personne mise en cause", "amdt": false}, {"t": "+", "s": ".\n« 4° La vérification des antécédents judiciaires des personnes nommément visées par la plainte ou mises en cause par la victime, par la consultation du fichier judiciaire automatisé des auteurs d'infractions sexuelles ou violentes et du fichier judiciaire national automatisé des auteurs d'infractions terroristes et, pour les personnes majeures, du bulletin n° 2 du casier judiciaire", "amdt": false}, {"t": "=", "s": ".", "amdt": true}, {"t": "=", "s": "\n« Lorsque la victime est mineure, les actes d'audition sont conduits de manière à éviter leur répétition injustifiée.\n« À l'expiration d'un délai de trois mois à compter du dépôt de la plainte ou de la réception du signalement ou de la dénonciation, l'officier de police judiciaire avise par tout moyen le procureur de la République de l'état d'avancement de l'enquête. Ce dernier informe le plaignant des éléments de l'enquête qu'il estime utiles ainsi que de son droit d'être aidé, dans la compréhension de la procédure et des droits qu'il détient, par une association d'aide aux victimes agréée mentionnée à l'article 41. Cette information est renouvelée à l'expiration de chaque nouvelle période de trois mois, jusqu'à la clôture de l'enquête.\n« II. ‒ La personne identifiée à l'encontre de laquelle existent une ou plusieurs raisons plausibles de soupçonner qu'elle a commis ou tenté de commettre un crime ou un délit mentionné au premier alinéa du I du présent article doit être entendue sur les faits dans un délai de trois mois à compter du jour où elle a été identifiée. S'il est impossible de procéder à cette audition ou si les nécessités de l'enquête ou de l'instruction justifient de la différer, le procureur de la République ou le juge d'instruction peut proroger ce délai pour une durée de trois mois, renouvelable.\n« II bis.-Aucune décision de classement sans suite motivée par l'insuffisance des charges ou par le défaut d'identification de l'auteur ne peut intervenir avant que les actes d'investigation essentiels mentionnés au I aient été accomplis ou que leur accomplissement se soit révélé impossible. L'avis de classement adressé à la victime ou à ses représentants légaux précise les actes d'investigation accomplis.\n« III. ‒ Le non-respect des délais prévus au présent article ne constitue pas une cause de nullité. »\nII. ‒ L'article 706-47-5 du code de procédure pénale est applicable aux plaintes et aux identifications des personnes soupçonnées intervenues à compter de la promulgation de la présente loi.", "amdt": false}]}, {"numero": 125, "vise": "ART. PREMIER", "dispositif": "I. – À l’alinéa 5, après la troisième occurrence du mot :\n\n« par »,\n\ninsérer le mot :\n\n« une ».\n\nII. – Au même alinéa, après le mot :\n\n« administrative »,\n\ninsérer les mots :\n\n« ou une décision du syndicat des copropriétaires ».", "article": "PREMIER", "effet": [{"t": "=", "s": "La loi n° 89-462 du 6 juillet 1989 tendant à améliorer les rapports locatifs et portant modification de la loi n° 86-1290 du 23 décembre 1986, dans sa rédaction résultant de l'article 160 de la loi n° 2021-1104 du 22 août 2021 portant lutte contre le dérèglement climatique et renforcement de la résilience face à ses effets, est ainsi modifiée :\n1° Le dixième alinéa de l'article 6 est remplacé par cinq alinéas ainsi rédigés :\n« L'obligation de décence énergétique définie au troisième alinéa est réputée satisfaite quand :\n« 1° Le logement a atteint le niveau de performance exigible à la date à laquelle le contrat de location a été conclu, reconduit ou tacitement renouvelé ;\n« 2° Le logement a une consommation énergétique finale conventionnelle inférieure à 450 kilowattheures par mètre carré de surface habitable et par an et, les travaux devant permettre l'atteinte du niveau de performance requis s'étant révélés impossibles pour des raisons techniques ou ayant été refusés par", "amdt": false}, {"t": "+", "s": " une", "amdt": false}, {"t": "=", "s": " décision administrative", "amdt": false}, {"t": "+", "s": " ou une décision du syndicat des copropriétaires", "amdt": false}, {"t": "=", "s": ", le propriétaire a réalisé tous les travaux d'amélioration énergétiques possibles au regard de ces contraintes ;\n« 3° Le logement est situé dans un immeuble relevant du statut de la copropriété et l'assemblée générale des copropriétaires a voté des travaux de nature à permettre le respect du niveau de performance exigible dans les conditions prévues au onzième alinéa. » ;\n« Le locataire ne peut se prévaloir d'un manquement du bailleur à son obligation de délivrance d'un logement respectant les conditions de décence énergétique précitées s'il fait obstacle à l'exécution de travaux permettant le respect de cette obligation. » ;\n2° Les quatrième à dernier alinéas de l'article 20-1 sont remplacés par un alinéa ainsi rédigé :\n« Sans préjudice de la réduction de loyer que le juge peut prononcer en application de l'alinéa précédent, une réduction de loyer peut être prononcée jusqu'à l'exécution des travaux découlant de l'obligation de décence énergétique définie à l'article 6, tenant compte du préjudice supporté par le locataire et de la diligence du bailleur. »", "amdt": false}]}, {"numero": 126, "vise": "ART. 12", "dispositif": "À l’alinéa 1, substituer au nombre :\n\n« cinq »\n\nle nombre :\n\n« un ».", "article": "12", "effet": [{"t": "=", "s": "À la seconde phrase du septième alinéa de l'article L. 143-1 du code rural et de la pêche maritime, les mots : « deux ans » sont remplacés par les mots : «", "amdt": false}, {"t": "-", "s": " cinq", "amdt": false}, {"t": "+", "s": " un", "amdt": false}, {"t": "=", "s": " ans ».", "amdt": false}]}, {"numero": 127, "vise": "ART. 7", "dispositif": "Après l'alinéa 2, insérer les cinq alinéas suivants :\n\n« Les données issues du dispositif de géolocalisation mentionné au présent article ne peuvent être collectées et traitées que pour la finalité exclusive de vérification de l’exécution effective des transports sanitaires facturés et de détection de fraudes caractérisées présentant un caractère grave ou répété.\n\n« Ces données ne peuvent être conservées au-delà d’une durée strictement nécessaire à l’accomplissement de cette finalité, laquelle ne peut excéder trois mois à compter de leur collecte, sauf lorsqu’elles sont nécessaires à une procédure de contrôle, d’enquête ou contentieuse en cours.\n\n« Elles ne peuvent faire l’objet d’aucune utilisation à des fins statistiques, d’évaluation de performance individuelle ou de profilage des entreprises ou des conducteurs.\n\n« Seuls les agents individuellement désignés et habilités des organismes d’assurance maladie, soumis au secret professionnel, peuvent accéder à ces données, dans la limite de leurs attributions et pour les seules finalités mentionnées au présent article. Un registre des accès est tenu et conservé dans des conditions fixées par décret en Conseil d’État.\n\n« Les dispositifs de géolocalisation utilisés garantissent la traçabilité et l’horodatage des données collectées. Les données sont sécurisées par des procédés techniques empêchant toute modification ou altération manuelle a posteriori. La certification mentionnée au premier alinéa porte notamment sur ces garanties techniques. »", "article": "7", "effet": [{"t": "=", "s": "I.-L'article L. 322-5-3 du code de la sécurité sociale est ainsi rétabli :\n« Art. L. 322-5-3.-Les entreprises de transport sanitaire et les entreprises de taxi ayant conclu une convention avec un organisme local d'assurance maladie équipent l'ensemble de leurs véhicules d'un dispositif de géolocalisation certifié par l'assurance maladie, dont les conditions d'utilisation sont précisées par décret en Conseil d'État, et d'un système électronique de facturation intégré. »\n", "amdt": false}, {"t": "+", "s": "Les données issues du dispositif de géolocalisation mentionné au présent article ne peuvent être collectées et traitées que pour la finalité exclusive de vérification de l'exécution effective des transports sanitaires facturés et de détection de fraudes caractérisées présentant un caractère grave ou répété.\nCes données ne peuvent être conservées au-delà d'une durée strictement nécessaire à l'accomplissement de cette finalité, laquelle ne peut excéder trois mois à compter de leur collecte, sauf lorsqu'elles sont nécessaires à une procédure de contrôle, d'enquête ou contentieuse en cours.\nElles ne peuvent faire l'objet d'aucune utilisation à des fins statistiques, d'évaluation de performance individuelle ou de profilage des entreprises ou des conducteurs.\nSeuls les agents individuellement désignés et habilités des organismes d'assurance maladie, soumis au secret professionnel, peuvent accéder à ces données, dans la limite de leurs attributions et pour les seules finalités mentionnées au présent article. Un registre des accès est tenu et conservé dans des conditions fixées par décret en Conseil d'État.\nLes dispositifs de géolocalisation utilisés garantissent la traçabilité et l'horodatage des données collectées. Les données sont sécurisées par des procédés techniques empêchant toute modification ou altération manuelle a posteriori. La certification mentionnée au premier alinéa porte notamment sur ces garanties techniques.\n", "amdt": false}, {"t": "=", "s": "II.-Le I entre en vigueur à une date fixée par décret, et au plus tard le 1er janvier 2027.", "amdt": false}]}, {"numero": 128, "vise": "ART. PREMIER", "dispositif": "Après l’alinéa 24, insérer l’alinéa suivant :\n\n« 2° bis Les pratiques managériales mobilisables ; ».", "article": "PREMIER", "effet": [{"t": "=", "s": "Le chapitre Ier du titre IV du livre II de la deuxième partie du code du travail est ainsi modifié :\n1° L'article L. 2241-1 est ainsi modifié :\na) Au premier alinéa, la référence : « 5° » est remplacée par la référence : « 5° bis » ;\nb) Après le 5°, il est inséré un 5° bis ainsi rédigé :\n« 5° bis Sur l'emploi et le travail des salariés expérimentés, en considération de leur âge ; »\nc) (Supprimé)\n2° L'article L. 2241-2-1 est ainsi rétabli :\n« Art. L. 2241-2-1.-L'accord de branche conclu dans le cadre des négociations prévues au 5° bis de l'article L. 2241-1 peut comporter un plan d'action type pour les entreprises de moins de trois cents salariés.\n« Si à l'issue d'une négociation sur l'emploi et le travail des salariés expérimentés, en considération de leur âge, avec les organisations syndicales de salariés représentatives dans l'entreprise, un accord collectif n'a pu être conclu, l'employeur peut l'appliquer au moyen d'un document unilatéral après avoir informé et consulté le comité social et économique, s'il en existe dans l'entreprise, ainsi que les salariés, par tous moyens. » ;\n3° Au a du 1° de l'article L. 2241-5 et à l'article L. 2241-6, la référence : « 5° » est remplacée par la référence : « 5° bis » ;\n4° (Supprimé)\n5° La sous-section 3 de la section 3 est complétée par un paragraphe 5 ainsi rédigé :\n« Paragraphe 5\n« Salariés expérimentés\n« Art. L. 2241-14-1.-Les organisations liées par une convention de branche ou, à défaut, par des accords professionnels se réunissent, une fois tous les trois ans, pour engager, après établissement d'un diagnostic, une négociation sur l'emploi et le travail des salariés expérimentés, en considération de leur âge.\n« Cette négociation porte sur :\n« 1° Le recrutement de ces salariés ;\n« 2° Leur maintien dans l'emploi ;\n« 3° L'aménagement des fins de carrière, en particulier les modalités d'accompagnement à la retraite progressive ou au temps partiel ;\n« 4° La transmission de leurs savoirs et compétences, en particulier les missions de mentorat, de tutorat et de mécénat de compétences.\n« Les informations nécessaires à la négociation sont déterminées par voie réglementaire.\n« Art. L. 2241-14-2.-La négociation prévue à l'article L. 2241-14-1 peut également, s'agissant des mêmes salariés, porter notamment sur :\n« 1° Le développement des compétences et l'accès à la formation ;\n« 2° Les impacts des transformations technologiques et environnementales sur les métiers ;\n", "amdt": false}, {"t": "=", "s": "«", "amdt": true}, {"t": "+", "s": " 2° bis Les pratiques managériales mobilisables ;\n«", "amdt": false}, {"t": "=", "s": " 3° Les modalités d'écoute, d'accompagnement et d'encadrement de ces salariés ;\n« 4° La santé au travail et la prévention des risques professionnels ;\n« 5° L'organisation et les conditions de travail. »", "amdt": false}]}, {"numero": 129, "vise": "ART. 7", "dispositif": "À la première phrase de l’alinéa 16, après le mot :\n\n« initiative »,\n\ninsérer les mots :\n\n« , y compris de manière inopinée, ».", "article": "7", "effet": [{"t": "=", "s": "I.-Le code de l'action sociale et des familles est ainsi modifié :\n1° L'article L. 221-2-3 est ainsi modifié :\na) Au premier alinéa, après la référence : « L. 222-5 », sont insérés les mots : « ou d'une personne mentionnée au I de l'article L. 221-2-4 » et, après le mot : « mentionnées », la fin est ainsi rédigée : « aux articles L. 221-2-1 et L. 421-2 ou dans des établissements et services autorisés au titre du présent code, à l'exclusion de ceux mentionnés à l'article L. 321-1. » ;\nb) Le second alinéa est supprimé ;\n2° Le titre II du livre II est complété par un chapitre IX ainsi rédigé :\n« Chapitre IX\n« Systèmes d'information, services et outils numériques\n« Art. L. 229-1.-Afin de garantir l'échange, le partage, la sécurité et la confidentialité des données à caractère personnel, les systèmes d'information, les services ou les outils numériques utilisés pour la mise en œuvre de la politique de protection de l'enfance définie à l'article L. 112-3 par l'État, les services départementaux de l'aide sociale à l'enfance et les établissements et services sociaux et médico-sociaux mentionnés aux 1°, 4°, 12° et 17° du I et au III de l'article L. 312-1 doivent être conformes à des référentiels d'interopérabilité, de sécurité et d'éthique approuvés par arrêté des ministres compétents et doivent bénéficier des moyens adaptés.\n« Les systèmes d'information, les services ou les outils numériques utilisés à la date de publication des référentiels mentionnés au premier alinéa du présent article sont mis en conformité avec ceux-ci dans un délai fixé par arrêté des ministres compétents, qui ne peut excéder dix-huit mois. À l'expiration de ce délai, l'autorité administrative compétente peut mettre en demeure la personne responsable de leur utilisation de procéder à cette mise en conformité dans un délai qu'elle fixe.\n« Les conditions d'élaboration des référentiels mentionnés au premier alinéa du présent article sont fixées par décret dans un délai de six mois à compter de la promulgation de la loi n° du relative à la protection des enfants.\n« Les référentiels d'interopérabilité, de sécurité et d'éthique prévus à l'article L. 1470-5 du code de la santé publique, lorsqu'ils concourent à la politique de protection de l'enfance, peuvent être rendus opposables, par arrêté des ministres compétents, aux systèmes d'information, services et outils numériques des personnes mentionnées au premier alinéa du présent article. » ;\n3° Le III de l'article L. 312-1 est ainsi modifié :\na) (Supprimé)\nb) La dernière phrase est ainsi rédigée : « Les conditions techniques minimales d'organisation et de fonctionnement et les règles de financement et de tarification des lieux de vie et d'accueil sont définies par un décret pris après avis de la section sociale du Comité national de l'organisation sanitaire et sociale. » ;\nc) Il est ajouté un alinéa ainsi rédigé :\n« Le représentant de l'État dans le département peut, à tout moment et de sa propre initiative", "amdt": false}, {"t": "+", "s": ", y compris de manière inopinée,", "amdt": false}, {"t": "=", "s": ", faire procéder au contrôle de tout établissement ou service ainsi que de tout lieu de vie et d'accueil mentionné au présent article. Ce contrôle vise à s'assurer des conditions de prise en charge, de la santé, de la sécurité et du respect des droits des personnes accueillies, notamment des enfants accueillis en dehors de leur département gardien. Si ces conditions ne sont pas respectées, il prend les mesures nécessaires prévues par le présent code. » ;\n4° et 5° (Supprimés)\n6° L'intitulé du titre II du livre III est ainsi rédigé : « Autres établissements soumis à autorisation ou déclaration » ;\n7° Les articles L. 321-1 à L. 321-3 sont ainsi rédigés :\n« Art. L. 321-1.-Sous réserve des dispositions applicables aux autres personnes mentionnées au premier alinéa de l'article L. 221-2-3, toute personne physique qui désire héberger ou recevoir des mineurs pris en charge en application de l'article L. 222-5 de manière habituelle, collectivement, à titre gratuit ou onéreux, ou toute personne morale de droit privé à but non lucratif qui souhaite assurer un tel accueil de manière habituelle ou ponctuelle doit y être préalablement autorisée par le président du conseil départemental. L'autorisation ne peut être délivrée à une personne morale de droit privé poursuivant un but lucratif. Le président du conseil départemental vérifie le respect de cette condition au regard des statuts, de la composition des organes dirigeants, des comptes annuels, des conventions conclues avec des tiers et de tout document permettant d'apprécier les conditions réelles d'organisation, de gestion et de financement de l'activité. Cette vérification peut donner lieu à des contrôles sur pièces et sur place. La méconnaissance de cette condition, le refus de communiquer les documents nécessaires au contrôle ou la communication d'informations inexactes entraîne le refus, la suspension ou le retrait de l'autorisation.\n« L'autorisation est accordée pour une durée maximale de cinq ans si le projet :\n« 1° Est compatible avec les objectifs et principes fixés aux articles L. 112-3, L. 112-4 et L. 221-2-3, notamment avec les ratios minimaux d'encadrement des mineurs accueillis définis par catégorie d'établissement ou de service et par tranche d'âge ;\n« 2° Satisfait aux règles d'organisation et de fonctionnement prévues par le présent code.\n« L'autorisation ou son renouvellement peuvent être assortis de conditions particulières imposées dans l'intérêt des personnes accueillies.\n« Le contenu de la demande d'autorisation, ses modalités de délivrance, de révision et de renouvellement ainsi que les conditions techniques minimales de fonctionnement des structures relevant du présent article sont définies par un décret pris après avis de la section sociale du Comité national de l'organisation sanitaire et sociale.\n« Tout changement important relatif à l'activité, à l'installation, à l'organisation, à la direction ou au fonctionnement d'un établissement autorisé au titre du présent article est préalablement autorisé par le président du conseil départemental dans des conditions déterminées par décret. Le président du conseil départemental en informe le représentant de l'État dans le département.\n« Lorsqu'un mineur est confié, au titre de la protection de l'enfance, à une structure autorisée en application du présent article située hors du département qui assure sa prise en charge, le président du conseil départemental de ce dernier transmet sans délai au président du conseil départemental du lieu d'implantation de la structure l'identité du mineur concerné, la date de début de l'accueil, la structure d'accueil ainsi que, le cas échéant, la date de fin prévisionnelle de l'accueil. Cette transmission est réalisée dans des conditions garantissant la confidentialité des informations relatives au mineur.\n« Chaque président de conseil départemental transmet annuellement à l'Observatoire national de la protection de l'enfance, sous une forme consolidée, la liste des mineurs confiés à une structure située hors de leur département d'origine, en précisant le département d'origine, le département d'accueil, la nature de la structure, la durée de l'accueil et l'autorité responsable de la mesure, dans des conditions garantissant la protection des données à caractère personnel.\n« Art. L. 321-2.-Le contrôle et la police administrative des personnes mentionnées à l'article L. 321-1 sont exercés dans les conditions définies à la section 4 du chapitre III du titre Ier du présent livre.\n« Art. L. 321-3.-Les articles L. 133-6, L. 133-6-1, L. 133-6-2 et L. 135-2 sont applicables à l'accueil de mineurs autorisé au titre de l'article L. 321-1. » ;\n8° L'article L. 321-4 est ainsi modifié :\na) Le 1° est ainsi rédigé :\n« 1° Le fait, pour une personne physique, d'héberger ou de recevoir des mineurs, collectivement et de manière habituelle, ou, pour une personne morale de droit privé, de manière habituelle ou ponctuelle, dans un établisseme
