u livre II du code pénal ;\n« 2° À l'article L. 3421-4 du code de la santé publique.\n« Sont également soumis à l'incapacité mentionnée au premier alinéa, dans les mêmes conditions :\n« 1° Les personnes faisant usage du titre de psychologue mentionné à l'article 44 de la loi n° 85-772 du 25 juillet 1985 portant diverses dispositions d'ordre social, du titre d'ostéopathe ou de chiropracteur mentionné à l'article 75 de la loi n° 2002-303 du 4 mars 2002 relative aux droits des malades et à la qualité du système de santé et du titre de psychothérapeute mentionné à l'article 52 de la loi n° 2004-806 du 9 août 2004 relative à la politique de santé publique ;\n« 2° Les élèves et étudiants des établissements préparant aux professions de santé régies par la quatrième partie du code de la santé publique.\n« II.-Le contrôle des incapacités mentionnées au I est assuré préalablement à l'exercice des fonctions et à intervalles réguliers par la délivrance du bulletin n° 2 du casier judiciaire dans les conditions prévues à l'article 776 du code de procédure pénale et par l'accès aux informations du fichier judiciaire national automatisé des auteurs d'infractions sexuelles ou violentes, dans les conditions prévues à l'article 706-53-7 du même code.\n« L'autorité compétente chargée de ce contrôle peut délivrer une attestation à la personne qui ne fait pas l'objet d'une inscription entraînant les incapacités mentionnées au I du présent article au moyen d'un système d'information sécurisé permettant, par dérogation au premier alinéa des articles 706-53-11 et 777-3 du code de procédure pénale, la consultation des deux traitements de données mentionnés au présent II.\n« L'attestation mentionnée au deuxième alinéa du présent II fait état, s'il y a lieu, de l'absence de condamnation non définitive ou de mise en examen mentionnées au fichier judiciaire national automatisé des auteurs d'infractions sexuelles ou violentes. Elle peut être communiquée à l'employeur, au responsable légal de l'établissement ou du lieu d'exercice.\n« Un décret en Conseil d'État détermine :\n« 1° Les intervalles des contrôles des incapacités ;\n« 2° Les conditions dans lesquelles est délivrée l'attestation mentionnée au deuxième alinéa du présent II ;\n« 3° Les autorités chargées du contrôle des incapacités, mentionnées au I ; peuvent être désignés à ce titre, les ordres professionnels mentionnés à la quatrième partie du présent code pour les professionnels de santé en relevant et les agences régionales de santé.\n« Art. L. 1191-2.-I.-Lorsqu'un agent public, un salarié, un professionnel relevant de l'article L. 6152-1 ou un élève ou un étudiant ne présente pas l'attestation mentionnée à l'article L. 1191-1, avant le terme d'un délai prévu par décret en Conseil d'État, l'employeur ou, s'agissant d'un élève ou d'un étudiant, la personne responsable notifie à l'intéressé, par tout moyen conférant date certaine et sans délai, la suspension d'un mois, des fonctions, du contrat de travail ou du contrat de mission. Durant cette suspension :\n« 1° Le salarié a droit au maintien de sa rémunération ;\n« 2° L'agent public conserve sa rémunération au sens de l'article L. 712-1 du code général de la fonction publique, ainsi que le financement des garanties de protection sociale complémentaire prévu à l'article L. 827-1 du même code ;\n« 3° Les personnels relevant de l'article L. 6152-1 et les élèves et étudiants conservent leurs émoluments et les primes et indemnités dans des conditions fixées par décret.\n« Pendant la période de suspension, l'employeur ou le responsable s'assure que, selon le cas, le salarié, l'agent public, le personnel relevant de l'article L. 6152-1, l'élève ou l'étudiant n'est pas frappé par une incapacité.\n« La suspension prend fin :\n« 1° Lorsqu'il est établi que l'intéressé n'est pas concerné par une incapacité mentionnée à l'article L. 1191-1 ;\n« 2° À l'issue des procédures engagées en application du II, lorsque l'incapacité est confirmée ;\n« 3° À la notification de l'arrêté motivé ou à la réception de l'information mentionnés au III, lorsque l'incapacité n'est pas confirmée et que l'intéressé fait l'objet, au titre d'une des infractions visées au I, d'une mise en examen ou d'une condamnation non définitive mentionnées au fichier judiciaire national automatisé des auteurs d'infractions sexuelles ou violentes.\n« II.-Lorsque l'incapacité est avérée pour un agent public, un salarié ou un personnel relevant de l'article L. 6152-1, il est mis fin à la relation de travail.\n« A.-Lorsque l'incapacité concerne un salarié en contrat à durée indéterminée, l'employeur engage une procédure de licenciement, l'incapacité constituant la cause réelle et sérieuse du licenciement. Le licenciement est prononcé dans les conditions prévues par les dispositions du code du travail relatives à la rupture du contrat de travail pour motif personnel. Le préavis prévu à l'article L. 1234-1 du code du travail n'est pas exécuté et ne donne pas lieu au versement de l'indemnité compensatrice.\n« Les dispositions de l'article L. 1234-9 du code du travail ne sont pas applicables au licenciement prononcé dans les conditions prévues au premier alinéa.\n« B.-Lorsque l'incapacité concerne un agent de droit privé non titulaire d'un contrat à durée indéterminée, sans préjudice des dispositions des articles L. 1243-1 et L. 1251-26 du code du travail, l'employeur met fin au contrat à durée déterminée ou au contrat de mission ou la lettre de mission et au contrat de mise à disposition avant l'échéance du terme.\n« Par dérogation aux articles L. 1243-4 et L. 1243-8 du code du travail, la rupture du contrat à durée déterminée en raison d'une incapacité résultant des dispositions de l'article L. 1191-1 ne donne lieu à aucune indemnité.\n« Par dérogation à l'article L. 1251-26 du code du travail, lorsque l'entreprise de travail temporaire met fin au contrat de mission en raison d'une incapacité résultant des dispositions du présent article, l'entreprise de travail temporaire n'est pas tenue de proposer un nouveau contrat de mission au salarié et la rupture du contrat de mission ne donne lieu à aucune indemnité.\n« Lorsque l'entreprise de travail temporaire est dans l'impossibilité de proposer une nouvelle mission au salarié lié par le contrat mentionné au L. 1251-58-1 du code du travail en raison d'une incapacité résultant des dispositions du présent article ayant donné lieu à la rupture d'un contrat de mise à disposition, l'employeur peut engager une procédure de licenciement du salarié, l'incapacité constituant la cause réelle et sérieuse du licenciement. Les dispositions de l'article L. 1234-9 du code du travail ne sont pas applicables au licenciement prononcé dans ces conditions.\n« C.-Lorsque l'incapacité concerne un fonctionnaire en activité, un autre agent public ou une personne relevant de l'article L. 6152-1, l'employeur engage une procédure de radiation des cadres si l'agent est fonctionnaire et exerce au sein de son administration, ou de licenciement sans indemnité ni préavis s'il est agent contractuel, ou encore remet le fonctionnaire détaché ou mis à disposition, à disposition de son administration d'origine. La décision, qui précise le motif ainsi que la date à laquelle la cessation définitive des fonctions, la rupture du contrat ou la réintégration dans l'administration d'origine intervient, est notifiée à la personne intéressée.\n« III.-Lorsque l'incapacité n'est pas confirmée et que le salarié ou l'agent public mentionné au I fait l'objet, à raison d'une des infractions mentionnées au I de l'article L. 1191-1, d'une mise en examen ou d'une condamnation non définitive mentionnée au fichier judiciaire national automatisé des auteurs d'infractions sexuelles ou violentes, l'autorité administrative compétente qui estime que son intervention ou l'exercice de fonctions au contact des usagers du système de santé présente un risque grave pour la santé ou la sécurité physique ou morale de ces derniers peut, par arrêté motivé, prononcer à son encontre l'interdiction temporaire d'exercer toute fonction ou activité dans les lieux soumis à incapacité en application du I de l'article L. 1191-1 au plus tard jusqu'à l'intervention d'une décision définitive rendue par la juridiction compétente.\n« Cette décision d'interdiction temporaire est prise au terme d'un délai d'un mois, après information de l'intéressé de son droit de présenter des observations écrites et, sur demande, orales.\n« La durée de l'interdiction est appréciée au regard des fonctions de l'intéressé, de son statut pénal, de la nature de l'infraction, de la peine prononcée et de son ancienneté.\n« Lorsque, à l'issue de la phase contradictoire, l'autorité compétente renonce au prononcé d'une mesure d'interdiction temporaire, elle en informe l'intéressé sans délai.\n« L'interdiction temporaire d'exercice prononcée emporte, selon les cas, la suspension du contrat de travail ou la mise en disponibilité de l'intéressé pour la durée de la mesure d'interdiction.\n« Art. L. 1191-3.-Lorsque le contrôle prévu au II de l'article L. 1191-1 visant une personne qui n'est ni agent public, ni un personnel relevant de l'article L. 6152-1, ni un élève ou un étudiant, révèle :\n« 1° Une condamnation définitive entraînant une incapacité au sens du I de l'article L. 1191-1, l'autorité compétente notifie à l'intéressé une interdiction d'exercer au contact des usagers du système de santé ;\n« 2° Une mise en examen ou d'une condamnation non définitive mentionnée au fichier prévu à l'article 706-53-7 du code de procédure pénale, l'autorité compétente lui notifie sans délai, par tout moyen conférant date certaine, une mesure de suspension de son activité ou de ses fonctions soumises à l'incapacité. Lorsque l'intervention de la personne contrôlée présente un risque grave pour la santé ou la sécurité physique ou morale des usagers du système de santé, l'autorité compétente peut, par décision motivée, prononcer à son encontre une interdiction temporaire d'exercer au contact des usagers du système de santé jusqu'à l'intervention d'une décision définitive rendue par la juridiction compétente.\n« Cette décision d'interdiction temporaire est prise au terme d'un délai d'un mois, après information du droit de présenter des observations écrites et, sur demande, orales.\n« La durée de l'interdiction est appréciée au regard des fonctions de l'intéressé, de son statut pénal, de la nature de l'infraction, de la peine prononcée et de son ancienneté.\n« La suspension prend fin à la notification de la décision d'interdiction temporaire d'exercice ou à la réception de l'information selon laquelle l'autorité compétente renonce au prononcé d'une mesure d'interdiction temporaire.\n« Art. L. 1191-4.-Est puni de deux ans d'emprisonnement et de 30 000 euros d'amende le fait d'exercer à quelque titre que ce soit l'une des activités visées à l'article L. 1191-1 en méconnaissance de l'incapacité résultant d'une des condamnations énoncées à cet article ou d'une interdiction d'exercice prononcée en application du III de l'article L. 1191-2 ou de l'article L. 1191-3.\n« Art. L. 1191-5.-L'incapacité d'exercice prévue à l'article L. 1191-1 et les interdictions d'exercice prononcées en application du III de l'article L. 1191-2 ou de l'article L. 1191-3 s'appliquent sans préjudice des sanctions disciplinaires propres à chaque profession concernée.\n« Art. L. 1191-6.-En cas de condamnation, prononcée par une juridiction étrangère et passée en force de chose jugée, pour une infraction constituant, selon la loi française, un crime ou l'un des délits mentionnés au I, le tribunal judiciaire du domicile du condamné, statuant en matière correctionnelle, déclare, à la requête du ministère public, qu'il y a lieu à l'application de l'incapacité d'exercice prévue à l'article L. 1191-1.\n« Art. L. 1191-7.-Les personnes faisant l'objet d'une incapacité d'exercice peuvent demander à en être relevées dans les conditions prévues à l'article 132-21 du code pénal ainsi qu'aux articles 702-1 et 703 du code de procédure pénale. Cette requête est portée devant la chambre des appels correctionnels de la cour d'appel dans le ressort de laquelle le requérant réside lorsque la condamnation résulte d'une condamnation étrangère et qu'il a été fait application du premier alinéa.\nVII.-1° Les I et II entrent en vigueur le premier jour du quatrième mois suivant la publication de la présente loi au Journal officiel de la République française, à l'exception du b du 2° du II ;\n2° Le III, les vingt-deuxième à vingt-huitième alinéas du 3° du IV, et le V entrent en vigueur au plus tard le premier jour du sixième mois suivant la publication de la présente loi au Journal officiel de la République française ;\n3° Le b du 2° du II et le VI entrent en vigueur à une date fixée par décret en Conseil d'État et au plus tard le premier jour du vingt-quatrième mois suivant la publication de la présente loi au Journal officiel de la République française.", "amdt": false}]}, {"numero": 82, "vise": "APRÈS ART. PREMIER", "dispositif": "Le code de l'éducation est ainsi modifié:\n\n1° La première phrase du quatrième alinéa de l’article L. 212‑8 est ainsi modifiée :\n\na) Après les mots : « établissements scolaires », sont insérés les mots : « ou, lorsque la commune de résidence est membre d’un regroupement pédagogique intercommunal constitué par convention, si la capacité d’accueil des établissements scolaires appréciée au niveau du regroupement pédagogique intercommunal, » ;\n\nb) Après les mots : « sa commune », sont insérés les mots : « ou hors du regroupement pédagogique intercommunal ».\n\n2° L’avant-dernière phrase de l’article L. 411‑1 est complétée par les mots suivants : « , lequel fixe également les conditions de représentation de chaque commune membre dans les regroupements pédagogiques intercommunaux constitués par convention ».\n\n3° Au deuxième alinéa de l’article L. 442‑5‑1, après le mot : « résider », sont insérés les mots : « ou d’une école située en dehors du regroupement pédagogique intercommunal auquel participe la commune de résidence dudit élève, ».", "article": "PREMIER BIS", "effet": [{"t": "+", "s": "Le code de l'éducation est ainsi modifié :\n1° La première phrase du quatrième alinéa de l'article L. 212-8 est ainsi modifiée :\na) Après les mots : « établissements scolaires », sont insérés les mots : « ou, lorsque la commune de résidence est membre d'un regroupement pédagogique intercommunal constitué par convention, si la capacité d'accueil des établissements scolaires appréciée au niveau du regroupement pédagogique intercommunal, » ;\nb) Après les mots : « sa commune », sont insérés les mots : « ou hors du regroupement pédagogique intercommunal ».\n2° L'avant-dernière phrase de l'article L. 411-1 est complétée par les mots suivants : «, lequel fixe également les conditions de représentation de chaque commune membre dans les regroupements pédagogiques intercommunaux constitués par convention ».\n3° Au deuxième alinéa de l'article L. 442-5-1, après le mot : « résider », sont insérés les mots : « ou d'une école située en dehors du regroupement pédagogique intercommunal auquel participe la commune de résidence dudit élève, ».", "amdt": false}]}, {"numero": 83, "vise": "ART. 21", "dispositif": "Compléter l’alinéa 4 par les mots :\n\n« ni à ceux relatifs à la rénovation des plateaux techniques et espaces professionnels des établissements de formation professionnelle et continue ».", "article": "21", "effet": [{"t": "=", "s": "I.-L'article 59 de la loi n° 2019-791 du 26 juillet 2019 pour une école de la confiance est ainsi modifié :\n1° Au premier alinéa, les mots : « et à Mayotte » sont supprimés ;\n2° Après le même premier alinéa, sont insérés deux alinéas ainsi rédigés :\n3° Au début du second alinéa, les mots : « Le présent article est applicable » sont remplacés par les mots : « Le premier alinéa et, tant qu'il s'applique aux marchés publics de conception-réalisation relatifs à la réalisation d'écoles élémentaires et maternelles, le deuxième alinéa sont applicables", "amdt": false}, {"t": "+", "s": " ni à ceux relatifs à la rénovation des plateaux techniques et espaces professionnels des établissements de formation professionnelle et continue", "amdt": false}, {"t": "=", "s": " » ;\n4° Il est ajouté un alinéa ainsi rédigé :\n« Six mois avant le terme de chacune de ces expérimentations, le Gouvernement remet au Parlement un rapport d'évaluation. Les modalités d'évaluation de ces expérimentations sont fixées par décret. »\nII.-En tant qu'elles concernent la réalisation de collèges et de lycées, de résidences universitaires au sens de l'article L. 631-12 du code de la construction et de l'habitation ainsi que de constructions affectées à l'enseignement supérieur public, l'article 59 de la loi n° 2019-791 du 26 juillet 2019 pour une école de la confiance est applicable aux marchés publics pour lesquels une consultation est engagée ou un avis d'appel à la concurrence est envoyé à compter de la promulgation de la présente loi.", "amdt": false}]}, {"numero": 84, "vise": "ART. 14", "dispositif": "Rédiger ainsi la première phrase de l’alinéa 9 :\n\n« III. – Le 2° du I s’applique aux revenus imposables au titre de l’année 2026 et des années suivantes. »", "article": "14", "effet": [{"t": "=", "s": "I.-Le code de la sécurité sociale est ainsi modifié :\n1° La section 2 du chapitre IV ter du titre Ier du livre Ier est complétée par un article L. 114-22-2-1 ainsi rédigé :\n« Art. L. 114-22-2-1.-Pour le calcul de l'ensemble des aides, des prestations ou des allocations attribuées sous condition de ressources ou réduites en fonction des revenus en application du présent code, du code de l'action sociale et des familles, du code rural et de la pêche maritime ou du code de la construction et de l'habitation, les sommes soumises à l'impôt sur le revenu en application de l'article 1649 quater-0 B bis du code général des impôts sont prises en compte. Ces sommes sont communiquées à l'organisme concerné par l'administration fiscale.\n« Les modalités d'application du présent article sont déterminées par décret en Conseil d'État. » ;\n2° Le IV de l'article L. 136-8 est ainsi rétabli :\n« IV.-Par dérogation au I, sont assujetties à la contribution sociale au taux de 25 % les sommes mentionnées au a du II de l'article L. 136-6 qui sont soumises à l'impôt sur le revenu en application de l'article 1649 quater-0 B bis du code général des impôts. »\nII.-Le II de l'article 154 quinquies du code général des impôts est complété par un alinéa ainsi rédigé :\n« Par dérogation au premier alinéa du présent II, la contribution afférente aux sommes mentionnées au a du II de l'article L. 136-6 du code de la sécurité sociale qui sont soumises à l'impôt sur le revenu en application de l'article 1649 quater-0 B bis du présent code n'est pas admise en déduction du revenu imposable. »\n", "amdt": false}, {"t": "=", "s": "III.-Le", "amdt": true}, {"t": "+", "s": " 2° du", "amdt": false}, {"t": "=", "s": " I s'applique", "amdt": true}, {"t": "-", "s": " à compter du 1er janvier", "amdt": false}, {"t": "+", "s": " aux revenus imposables au titre de l'année", "amdt": false}, {"t": "=", "s": " 2026", "amdt": true}, {"t": "+", "s": " et des années suivantes", "amdt": false}, {"t": "=", "s": ".", "amdt": true}, {"t": "=", "s": " Le II s'applique à l'impôt sur le revenu dû au titre de l'année 2026 et des années suivantes.\nIV.-Après l'article L. 5425-1 du code du travail, il est inséré un article L. 5425-1-1 ainsi rédigé :\n« Art. L. 5425-1-1.-Les allocations prévues au présent titre ne peuvent être cumulées, au titre d'une même période, avec des sommes soumises à l'impôt sur le revenu en application de l'article 1649 quater-0 B bis du code général des impôts. Ces sommes sont communiquées à l'organisme débiteur du revenu de remplacement par l'administration fiscale.\n« Les modalités d'application du présent article sont déterminées :\n« 1° Pour l'allocation d'assurance et l'allocation des travailleurs indépendants, par l'accord prévu à l'article L. 5422-20 du présent code ;\n« 2° Pour les allocations de solidarité, par décret en Conseil d'État.\n« Il peut être procédé au réexamen de la situation du bénéficiaire lorsqu'interviennent des éléments nouveaux, dans un délai raisonnable à compter de leur découverte, tels qu'un jugement pénal définitif ou l'annulation de la décision initiale des services fiscaux, y compris après le recouvrement du trop-perçu par l'organisme concerné.\n« Le montant des allocations prévues au présent titre ne peut être réduit qu'à hauteur des revenus illicites effectivement constatés. »", "amdt": false}]}, {"numero": 85, "vise": "ART. 2", "dispositif": "Après la première phrase de l’alinéa 5, insérer la phrase suivante :\n\n« Ils interviennent lors des missions de secours et de sauvetage animalier. »", "article": "2", "effet": [{"t": "=", "s": "La section 5 du chapitre III du titre II du livre VII du code de la sécurité intérieure, telle qu'elle résulte de l'article 1er de la présente loi, est complétée par des articles L. 723-28 à L. 723-31 ainsi rédigés :\n« Art. L. 723-28.-Les pharmaciens de sapeurs-pompiers assurent la conception, la direction, la mise en œuvre, l'évaluation et l'inspection des activités relatives à l'exercice de la pharmacie des services d'incendie et de secours. Ils interviennent en matière d'hygiène, de biologie et de risques nucléaires, bactériologiques et chimiques.\n« Art. L. 723-29.-Les infirmiers de sapeurs-pompiers participent aux soins dans le respect de leurs règles professionnelles et ordinales. Ils exercent des tâches liées à l'hygiène et à l'aptitude des sapeurs-pompiers.\n« Art. L. 723-30.-Les psychologues de sapeurs-pompiers participent aux soins et à la prévention dans le respect de leurs règles professionnelles. Ils réalisent des bilans et des examens psychologiques.\n« Art. L. 723-31.-Les vétérinaires de sapeurs-pompiers exercent la médecine vétérinaire dans le respect de leurs règles professionnelles et ordinales.", "amdt": false}, {"t": "=", "s": " Ils", "amdt": true}, {"t": "+", "s": " interviennent lors des missions de secours et de sauvetage animalier. Ils", "amdt": false}, {"t": "=", "s": " peuvent intervenir en matière d'hygiène, d'épizootie, de risques sanitaires d'origine animale ou biologique et de suivi médical des équipes cyno-techniques. »", "amdt": false}]}, {"numero": 86, "vise": "ART. 5", "dispositif": "À l’alinéa 4, substituer aux mots :\n\n« l’aide à mourir »\n\nles mots :\n\n« la provocation médicale du suicide ».", "article": "5", "effet": [{"t": "=", "s": "La section 2 bis du chapitre Ier du titre Ier du livre Ier de la première partie du code de la santé publique, telle qu'elle résulte de l'article 2 de la présente loi, est complétée par une sous-section 3 ainsi rédigée :\n« Sous-section 3\n« Procédure\n« Art. L. 1111-12-3.-I.-La personne qui souhaite accéder à", "amdt": false}, {"t": "-", "s": " l'aide à mourir", "amdt": false}, {"t": "+", "s": " la provocation médicale du suicide", "amdt": false}, {"t": "=", "s": " en fait la demande expresse à un médecin en activité qui n'est ni son parent, ni son allié, ni son conjoint, ni son concubin, ni le partenaire auquel elle est liée par un pacte civil de solidarité, ni son ayant droit.\n« La personne ne peut pas présenter de demande lors d'une téléconsultation.\n« Une même personne ne peut présenter simultanément plusieurs demandes.\n« Le médecin demande à la personne si elle fait l'objet d'une mesure de protection juridique avec assistance ou représentation relative à la personne. Il vérifie ces informations en ayant accès au registre mentionné à l'article 427-1 du code civil. Le cas échéant, le médecin doit à la personne protégée une information loyale, claire et appropriée sur son état. Cette information est délivrée à la personne de manière appropriée et adaptée à ses facultés de discernement. Son consentement est systématiquement recherché. En cas de doute ou de conflit, le juge des tutelles ou le conseil de famille, s'il est constitué, peut être saisi.\n« II.-Le médecin mentionné au I du présent article :\n« 1° Informe la personne sur son état de santé, sur les perspectives d'évolution de celui-ci ainsi que sur les traitements et les dispositifs d'accompagnement disponibles ;\n« 2° Informe la personne qu'elle peut bénéficier de l'accompagnement et des soins palliatifs définis à l'article L. 1110-10 et s'assure, si la personne le souhaite, qu'elle y ait accès de manière effective ;\n« 3° Propose à la personne de l'orienter vers un psychologue ou un psychiatre ;\n« 4° Indique à la personne qu'elle peut renoncer, à tout moment, à sa demande ;\n« 5° Explique à la personne les conditions d'accès à l'aide à mourir et sa mise en œuvre. »", "amdt": false}]}, {"numero": 87, "vise": "ART. PREMIER", "dispositif": "Après le mot :\n\n« personnes »,\n\nrédiger ainsi la fin de l’alinéa 19 :\n\n« privées durablement d’emploi depuis au moins un an justifiant d’au moins douze mois cumulatifs d’actes positifs de recherche d’emploi n’ayant été ni en formation, ni en emploi aidé, ni en stage au cours des six derniers mois. »", "article": "PREMIER", "effet": [{"t": "=", "s": "I.-Le titre II de la loi n° 2020-1577 du 14 décembre 2020 relative au renforcement de l'inclusion dans l'emploi par l'activité économique et à l'expérimentation « territoire zéro chômeur de longue durée » est abrogé.\nII.-Après l'article L. 5132-2 du code du travail, il est inséré un article L. 5132-2-1 ainsi rédigé :\n« Art. L. 5132-2-1.-I.-Dans des territoires désignés dans les conditions définies à l'article L. 5132-2-2 du code du travail, dont les territoires habilités dans le cadre de la loi n° 2020-1577 du 14 décembre 2020 relative au renforcement de l'inclusion dans l'emploi par l'activité économique et à l'expérimentation « territoire zéro chômeur de longue durée » dans sa rédaction antérieure à la présente loi, peuvent être mis en place des territoires zéro chômeur de longue durée. Ces territoires couvrent chacun tout ou partie de la superficie d'une ou de plusieurs collectivités territoriales, établissements publics de coopération intercommunale ou groupes de collectivités territoriales volontaires.\n« II.-Les collectivités territoriales, les établissements publics de coopération intercommunale ou les groupes de collectivités territoriales mettant en place un territoire zéro chômeur de longue durée installent et animent un comité local pour le droit à l'emploi chargé du pilotage de ce territoire, au sein duquel sont représentés les acteurs locaux du réseau pour l'emploi au sens de la loi n° 2023-1196 du 18 décembre 2023 pour le plein emploi, notamment les départements. Ce comité local est représenté aux instances territoriales mises en place par la loi n° 2023-1196 du 18 décembre 2023 précitée. Il définit un programme d'actions, approuvé par le fonds mentionné à l'article L. 5132-2-2, qui :\n« 1° Détermine les modalités d'information, de mobilisation et d'accompagnement des personnes mentionnées au VII ;\n« 2° Organise la coopération entre les acteurs du réseau pour l'emploi au sens de la loi n° 2023-1196 du 18 décembre 2023 précitée afin d'identifier les emplois existants accessibles aux personnes mentionnées au même VII ;\n« 3° Estime le volume d'emplois supplémentaires en équivalent temps plein nécessaires pour répondre à l'exhaustivité des besoins des personnes mentionnées audit VII ;\n« 4° Identifie les activités économiques susceptibles d'être exercées par les entreprises au III du présent article ;\n« 5° Propose le conventionnement d'entreprises existantes, notamment du secteur de l'insertion par l'activité économique et du secteur du travail protégé et adapté ou, à défaut, le conventionnement d'entreprises nouvelles, pour l'embauche des personnes mentionnées au même VII en veillant au caractère supplémentaire des emplois ainsi créés par rapport à ceux existants sur le territoire ;\n« 6° Apprécie l'éligibilité comme personne privée durablement d'emploi, au regard des conditions fixées au même VII, des personnes dont l'embauche est envisagée par les entreprises conventionnées ; elles sont inscrites à France Travail ; leur embauche s'opère dans l'ordre de leur éligibilité.\n« Les modalités de fonctionnement du comité local pour le droit à l'emploi sont définies par les acteurs locaux et approuvées par le fonds mentionné à l'article L. 5132-2-2.\n« III-Les territoires zéro chômeur de longue durée permettent aux personnes concernées dans les conditions définies au même VII d'être embauchées en contrat à durée indéterminée par des entreprises conventionnées à lucrativité limitée qui remplissent les conditions fixées aux articles 1er et 2 de la loi n° 2014-856 du 31 juillet 2014 relative à l'économie sociale et solidaire, pour exercer des activités économiques supplémentaires à celles déjà présentes sur le territoire. Les conditions de ces supplémentarités sont fixées par décret.\n« Sous réserve du volontariat des personnes mentionnées au VII, ces embauches sont réalisées après qu'ont été examinées les possibilités d'emploi accessibles parmi les acteurs du réseau pour l'emploi au sens de la loi n° 2023-1196 du 18 décembre 2023 précitée.\n« Les territoires zéro chômeur de longue durée sont mis en place avec le concours financier de l'État et des départements concernés ainsi que des autres collectivités territoriales et des établissements publics de coopération intercommunale volontaires mentionnés au premier alinéa du présent II et de tout organisme public et privé volontaire.\n« IV.-Tous les cinq ans, le fonds mentionné à l'article L. 5132-2-2 dresse le bilan de l'évolution de la privation de l'emploi dans ces territoires dans un rapport et propose les évolutions que l'expérience acquise conduit à envisager.\n« V.-Avec la même périodicité, une évaluation des actions menées dans ces territoires, de leur coût et du progrès de leur articulation avec les actions conduites par les acteurs locaux du réseau pour l'emploi au sens de la loi n° 2023-1196 du 18 décembre 2023 précitée est réalisée afin de proposer des évolutions qui pourraient améliorer leur efficacité. Il analyse le rapport entre les coûts et les bénéfices des territoires zéro chômeur de longue durée.\n« Un décret précise les modalités de cette évaluation.\n« VI.-Les rapports mentionnés aux IV et V sont adressés au Parlement et au ministre chargé de l'emploi et sont rendus publics.\n« VII.-Dans le cadre de ces territoires zéro chômeur de longue durée peuvent être embauchées par les entreprises mentionnées au III les personnes", "amdt": false}, {"t": "-", "s": " volontaires", "amdt": false}, {"t": "=", "s": " privées durablement d'emploi depuis au moins un an", "amdt": true}, {"t": "-", "s": " malgré l", "amdt": false}, {"t": "+", "s": " justifiant d", "amdt": false}, {"t": "=", "s": "'", "amdt": true}, {"t": "-", "s": "accomplissement", "amdt": false}, {"t": "+", "s": " au moins douze mois cumulatifs", "amdt": false}, {"t": "=", "s": " d'actes positifs de recherche d'emploi", "amdt": true}, {"t": "-", "s": " et domiciliées depuis", "amdt": false}, {"t": "+", "s": " n'ayant été ni en formation, ni en emploi aidé, ni en stage", "amdt": false}, {"t": "=", "s": " au", "amdt": true}, {"t": "-", "s": " moins", "amdt": false}, {"t": "+", "s": " cours des", "amdt": false}, {"t": "=", "s": " six", "amdt": true}, {"t": "+", "s": " derniers", "amdt": false}, {"t": "=", "s": " mois", "amdt": true}, {"t": "-", "s": " dans la zone géographique du territoire susmentionné", "amdt": false}, {"t": "=", "s": ".", "amdt": true}, {"t": "=", "s": " »", "amdt": false}]}, {"numero": 88, "vise": "ART. 6", "dispositif": "Compléter l’alinéa 18 par la phrase suivante :\n\n« La durée de validité de la prescription de la substance létale est de trois mois ».", "article": "6", "effet": [{"t": "=", "s": "La sous-section 3 de la section 2 bis du chapitre Ier du titre Ier du livre Ier de la première partie du code de la santé publique, telle qu'elle résulte de l'article 5 de la présente loi, est complétée par un article L. 1111-12-4 ainsi rédigé :\n« Art. L. 1111-12-4.-I.-Le médecin mentionné à l'article L. 1111-12-3 vérifie que la personne remplit les conditions prévues à l'article L. 1111-12-2.\n« La personne dont le discernement est gravement altéré par une maladie lors de la démarche de demande d'aide à mourir ne peut pas être regardée comme manifestant une volonté libre et éclairée.\n« II.-Pour procéder à l'appréciation des conditions mentionnées aux 3° à 5° de l'article L. 1111-12-2, dans le cadre d'une procédure collégiale pluriprofessionnelle, le médecin :\n« 1° Recueille l'avis écrit :\n« a) D'un médecin qui remplit les conditions prévues au premier alinéa du I de l'article L. 1111-12-3 et qui n'intervient pas dans le traitement de la personne, spécialiste de la pathologie de celle-ci, sans qu'il existe de lien hiérarchique entre les deux médecins. Ce médecin a accès au dossier médical de la personne et il examine celle-ci, sauf s'il ne l'estime pas nécessaire, avant de rendre son avis ;\n« b) D'un auxiliaire médical ou d'un aide-soignant qui intervient dans le traitement de la personne ou, à défaut, d'un autre auxiliaire médical ;\n« 2° Peut également recueillir l'avis d'autres professionnels de santé, de professionnels mentionnés aux 6° et 7° du I de l'article L. 312-1 du code de l'action sociale et des familles et de psychologues qui interviennent dans le traitement de la personne ;\n« 3° Lorsque la personne fait l'objet d'une mesure de protection juridique avec assistance ou représentation relative à la personne, informe la personne chargée de la mesure de protection et tient compte des observations qu'elle formule ;\n« 4° Peut, à la demande de la personne, recueillir l'avis de la personne de confiance, si elle existe.\n« La concertation peut être réalisée à distance.\n« III.-Le médecin se prononce dans un délai de quinze jours à compter de la demande et notifie, oralement et par écrit, sa décision motivée à la personne. Il en informe par écrit, le cas échéant, la personne chargée d'une mesure de protection juridique avec assistance ou représentation relative à la personne.\n« IV.-Après un délai de réflexion d'au moins deux jours à compter de la notification de la décision mentionnée au III du présent article, la personne confirme au médecin qu'elle demande l'administration de la substance létale. Toutefois, ce délai peut être abrégé à la demande de la personne si le médecin estime que cela est de nature à préserver la dignité de cette dernière telle qu'elle la conçoit.\n« Lorsque la confirmation de la demande intervient plus de trois mois après la notification, le médecin évalue à nouveau le caractère libre et éclairé de la manifestation de la volonté en mettant en œuvre, si besoin, la procédure définie au II.\n« V.-Lorsque la personne a confirmé sa volonté, le médecin l'informe oralement et par écrit des modalités d'action de la substance létale.\n« Il détermine, en accord avec la personne, les modalités de l'administration et le médecin ou l'infirmier chargé de l'accompagner pour l'administration de la substance létale.\n« V bis.-La procédure prévue au présent article ne peut être réalisée par des sociétés de téléconsultation.\n« VI.-Le médecin mentionné à l'article L. 1111-12-3 prescrit la substance létale conformément aux recommandations prévues au 23° de l'article L. 161-37 du code de la sécurité sociale.", "amdt": false}, {"t": "+", "s": " La durée de validité de la prescription de la substance létale est de trois mois", "amdt": false}, {"t": "=", "s": "\n« Il adresse cette prescription à l'une des pharmacies à usage intérieur désignées par l'arrêté du ministre chargé de la santé mentionné au second alinéa du 1° de l'article L. 5121-1 du présent code. »", "amdt": false}]}, {"numero": 89, "vise": "ART. PREMIER", "dispositif": "Après l’alinéa 13, insérer l’alinéa suivant :\n\n« 5° Souveraineté numérique : la capacité de l’État à établir les règles qui permettent d’utiliser le numérique, de contrôler les impacts de ses usages et à disposer de l’autonomie sur les technologies qui conditionnent ces usages du numérique tout en se protégeant des ingérences et attaques étrangères. »", "article": "PREMIER", "effet": [{"t": "=", "s": "Le chapitre II du titre III du livre III de la première partie du code de la défense est ainsi rédigé :\n« CHAPITRE II\n« Résilience des activités d'importance vitale\n« Section 1\n« Dispositions générales relatives aux activités d'importance vitale\n« Art. L. 1332-1.-Pour l'application du présent chapitre, on entend par :\n« 1° Activités d'importance vitale : les activités indispensables au fonctionnement de l'économie ou de la société ainsi qu'à la défense ou à la sécurité de la Nation ;\n« 2° Infrastructure critique : tout ou partie d'un bien, d'une installation, d'un équipement, d'un réseau ou d'un système nécessaire à l'exercice d'une activité d'importance vitale ou dont une perturbation pourrait mettre gravement en cause la santé de la population ou l'environnement ;\n« Parmi les infrastructures critiques, sont notamment distingués :\n« a) Les points d'importance vitale, c'est-à-dire les installations les plus sensibles, notamment celles qui sont difficilement substituables ;\n« b) Les systèmes d'information d'importance vitale, c'est-à-dire les systèmes d'information nécessaires à l'exercice d'une activité d'importance vitale ou à la gestion, à l'utilisation ou à la protection d'une ou plusieurs infrastructures critiques ;\n« 3° Incident : un événement qui perturbe ou est susceptible de perturber de manière importante l'exercice d'une activité d'importance vitale ;\n« 4° Résilience : la capacité d'un opérateur à prévenir, à se protéger et à résister contre tout type d'incident afin d'assurer la continuité de la ou des activités d'importance vitale qu'il exerce", "amdt": false}, {"t": "+", "s": ".\n« 5° Souveraineté numérique : la capacité de l'État à établir les règles qui permettent d'utiliser le numérique, de contrôler les impacts de ses usages et à disposer de l'autonomie sur les technologies qui conditionnent ces usages du numérique tout en se protégeant des ingérences et attaques étrangères", "amdt": false}, {"t": "=", "s": ".", "amdt": true}, {"t": "=", "s": "\n« Art. L. 1332-2.-I.-Sont désignés opérateurs d'importance vitale par l'autorité administrative :\n« 1° Les opérateurs publics ou privés exerçant, au moyen d'une ou de plusieurs infrastructures critiques situées sur le territoire national, une activité d'importance vitale.\n« L'autorité administrative précise, le cas échéant, dans l'acte de désignation de l'opérateur d'importance vitale, l'activité ou la liste des activités d'importance vitale exercées par l'opérateur qui constituent des services essentiels au fonctionnement du marché intérieur de l'Union européenne définis par le règlement délégué (UE) 2023 / 2450 de la Commission du 25 juillet 2023 complétant la directive (UE) 2022 / 2557 du Parlement européen et du Conseil en établissant une liste de services essentiels et qui, à ce titre, justifient que cet opérateur soit regardé comme une entité critique au sens de cette directive ;\n« 2° Les opérateurs publics ou privés, gestionnaires, propriétaires ou exploitants d'établissements mentionnés à l'article L. 511-1 du code de l'environnement ou comprenant une installation nucléaire de base mentionnée à l'article L. 593-2 du même code, lorsque la destruction ou l'avarie d'une ou plusieurs installations de ces établissements peut présenter un danger d'une particulière gravité pour la population ou l'environnement.\n« II.-Ces opérateurs mettent en œuvre, à leurs frais, les obligations leur incombant prévues au présent chapitre.\n« Lorsqu'un opérateur d'importance vitale exerce une activité d'importance vitale ou gère une infrastructure critique pour le compte d'une personne publique, cette dernière en est informée par l'autorité administrative.\n« Sous-section 1\n« Dispositions applicables aux opérateurs d'importance vitale\n« Art. L. 1332-3.-Les opérateurs d'importance vitale réalisent une analyse des risques de toute nature, y compris à caractère terroriste, qui pourraient perturber l'exercice de leurs activités d'importance vitale ou la sécurité de leurs infrastructures critiques, notamment des points d'importance vitale désignés par l'autorité administrative.\n« Cette analyse est réalisée au plus tard dans un délai de neuf mois à compter de la désignation prévue au I de l'article L. 1332-2 et est réévaluée au moins tous les quatre ans.\n« Sur le fondement de cette analyse, les opérateurs d'importance vitale adoptent des mesures proportionnées de résilience techniques, opérationnelles et organisationnelles afin d'assurer la continuité des activités d'importance vitale qu'ils exercent et de sauvegarder leurs infrastructures critiques.\n« L'analyse des risques ainsi que les mesures de résilience sont détaillées dans un document dénommé “ plan de résilience opérateur ” élaboré par l'opérateur, au plus tard dans un délai de dix mois à compter de la désignation prévue au I de l'article L. 1332-2, et approuvé par l'autorité administrative.\n« Lorsque, en application d'accords internationaux régulièrement ratifiés ou approuvés, de lois ou de règlements, l'opérateur a déjà décrit dans un document particulier tout ou partie des mesures prévues au troisième alinéa, l'autorité administrative peut décider que ce document tient lieu, pour tout ou partie, du “ plan de résilience opérateur ”.\n« En cas de refus de l'opérateur d'élaborer ce plan, de le modifier afin de le rendre conforme aux exigences prévues au présent article ou de le mettre en œuvre, l'autorité administrative met en demeure l'opérateur de le réaliser, de le modifier ou de le mettre en œuvre dans un délai qu'elle fixe et qui ne saurait être inférieur à un mois.\n« L'autorité administrative peut assortir cette mise en demeure d'une astreinte d'un montant maximal de 5 000 euros par jour de retard à compter de l'expiration du délai imparti par la mise en demeure.\n« L'astreinte peut également être prononcée à tout moment, après l'expiration du délai imparti par la mise en demeure, s'il n'y a pas été satisfait, après que l'intéressé a été invité à présenter ses observations.\n« Les opérateurs mentionnés au 2° du I de l'article L. 1332-2 mettent en œuvre ces mesures de résilience sous réserve des dispositions du titre Ier et du chapitre III du titre IX du livre V du code de l'environnement.\n« Un décret en Conseil d'État précise la nature des mesures de résilience pour chaque catégorie d'opérateur d'importance vitale mentionnée au I de l'article L. 1332-2.\n« Art. L. 1332-4.-Les opérateurs d'importance vitale réalisent, au plus tard dans un délai de neuf mois à compter de la désignation prévue au I de l'article L. 1332-2, une analyse de leurs dépendances à l'égard de tiers, y compris ceux situés en dehors du territoire national, pour l'exercice de leurs activités d'importance vitale. Celle-ci comprend notamment une analyse des éventuelles vulnérabilités de leurs chaînes d'approvisionnement. Les mesures de résilience adoptées par les opérateurs d'importance vitale tiennent compte de cette analyse.\n« Les opérateurs d'importance vitale prennent les mesures nécessaires pour garantir l'application du présent chapitre.\n« Art. L. 1332-5.-Les opérateurs pour lesquels un ou plusieurs points d'importance vitale sont désignés en application du présent chapitre réalisent pour chacun d'eux un document dénommé “ plan particulier de résilience ” détaillant les mesures de protection et de résilience les concernant.\n« Ces mesures comportent notamment des dispositions efficaces de surveillance, d'alarme, de protection matérielle et de conditions d'accès. Le plan est approuvé par l'autorité administrative.\n« Lorsque, en application d'accords internationaux régulièrement ratifiés ou approuvés, de lois ou de règlements, un point d'importance vitale fait déjà l'objet de mesures de protection suffisantes décrites dans un document particulier, l'autorité administrative peut décider que ce document tient lieu de “ plan particulier de résilience ”.\n« En cas de refus de l'opérateur d'élaborer ce plan, de le modifier afin de le rendre conforme aux exigences prévues aux alinéas précédents ou de le mettre en œuvre, l'autorité administrative met en demeure l'opérateur de le réaliser, de le modifier ou de le mettre en œuvre dans un délai qu'elle fixe et qui ne saurait être inférieur à un mois.\n« L'autorité administrative peut assortir cette mise en demeure d'une astreinte d'un montant maximal de 5 000 euros par jour de retard à compter de l'expiration du délai imparti par la mise en demeure.\n« L'astreinte peut également être prononcée à tout moment, après l'expiration du délai imparti par la mise en demeure, s'il n'y a pas été satisfait, après que l'opérateur concerné a été invité à présenter ses observations.\n« Art. L. 1332-6.-Avant d'accorder une autorisation d'accès physique ou à distance à ses points d'importance vitale et à ses systèmes d'information d'importance vitale, lorsqu'il estime nécessaire de s'assurer que le comportement de la personne devant faire l'objet de l'autorisation d'accès n'est pas de nature à porter atteinte à l'exercice d'une activité d'importance vitale ou à la sécurité d'une infrastructure critique, l'opérateur d'importance vitale peut demander l'avis de l'autorité administrative compétente dans les conditions prévues à l'article L. 114-1 du code de la sécurité intérieure, selon des modalités fixées par décret en Conseil d'État.\n« Il peut également solliciter cet avis avant le recrutement ou l'affectation d'une personne à un poste pour l'exercice duquel il est nécessaire d'avoir accès aux points d'importance vitale ou aux systèmes d'information d'importance vitale ou qui implique l'occupation de fonctions sensibles.\n« Les fonctions sensibles sont celles qui sont indispensables à la réalisation d'une activité d'importance vitale ou dont l'occupation expose l'opérateur à des vulnérabilités. Elles sont énumérées par l'opérateur dans le plan de résilience prévu au quatrième alinéa de l'article L. 1332-3 du présent code en tenant compte, le cas échéant, de critères déterminés par l'autorité administrative en fonction du secteur d'activité de l'opérateur.\n« Les cas dans lesquels les accès physiques ou à distance peuvent justifier la demande d'avis sont précisés par l'opérateur dans le plan de résilience prévu au même quatrième alinéa et, le cas échéant, dans le plan particulier de résilience prévu à l'article L. 1332-5 en tenant compte des vulnérabilités à des actes de malveillance.\n« La personne concernée est informée de l'enquête administrative dont elle fait l'objet.\n« En cas d'avis défavorable de l'autorité administrative, l'opérateur d'importance vitale est tenu de refuser l'autorisation s'il est une personne morale de droit privé. Un avis défavorable ne peut être émis que s'il ressort de l'enquête administrative que le comportement de la personne ayant fait l'objet de l'enquête est de nature à porter atteinte à l'exercice d'une activité d'importance vitale ou à la sécurité d'une infrastructure critique.\n« Art. L. 1332-7.-Les opérateurs d'importance vitale désignés au titre du 1° du I de l'article L. 1332-2 notifient à l'autorité administrative, au plus tard vingt-quatre heures après en avoir pris connaissance, tout incident susceptible de compromettre la continuité de leurs activités d'importance vitale dans des conditions fixées par décret en Conseil d'État.\n« L'autorité administrative informe le public de cet incident lorsqu'elle estime qu'il est dans l'intérêt général de le faire.\n« Sous-section 2\n« Dispositions applicables aux entités critiques d'importance européenne particulière\n« Art. L. 1332-8.-Les opérateurs d'importance vitale qui fournissent les services essentiels ou des services essentiels similaires à ou dans au moins six États membres en informent l'autorité administrative au plus tard en même temps que la présentation pour approbation du plan de résilience prévu au quatrième alinéa de l'article L. 1332-3.\n« Ces opérateurs sont identifiés comme entités critiques d'importance européenne particulière dans les conditions prévues à l'article 17 de la directive (UE) 2022 / 2557 du Parlement européen et du Conseil du 14 décembre 2022 sur la résilience des entités critiques, et abrogeant la directive 2008 / 114 / CE du Conseil.\n« Les opérateurs qui exercent des activités dans les domaines de la sécurité nationale, de la sécurité publique, de la défense, du nucléaire ou de la répression pénale, ou qui fournissent des services exclusivement destinés aux entités de l'administration publique exerçant dans ces domaines, peuvent être exonérés par l'autorité administrative de tout ou partie des obligations mentionnées à la présente sous-section, dans des conditions prévues par décret en Conseil d'État.\n« Art. L. 1332-9.-Lorsque l'opérateur a été désigné par la Commission européenne comme entité critique d'importance européenne particulière il peut, sur demande motivée de la Commission européenne ou d'un ou de plusieurs des États membres auxquels ou dans lesquels le service essentiel est fourni et avec l'accord de l'autorité administrative compétente, faire l'objet d'une mission de conseil au titre de laquelle il doit garantir l'accès aux informations, systèmes et installations relatifs à la fourniture de ses services essentiels qui sont nécessaires à l'exécution de cette mission de conseil, dans le respect des secrets protégés par la loi.\n« Sur le fondement des conclusions de la mission de conseil, l'opérateur se voit communiquer par la Commission européenne un avis sur le respect de ses obligations et, le cas échéant, sur les mesures qui pourraient être prises pour améliorer sa résilience.\n« Sous-section 3\n« Dispositifs techniques concourant à la protection des installations d'importance vitale\n« Art. L. 1332-10.-À des fins de protection des établissements, installations et ouvrages d'importance vitale mentionnés au I de l'article L. 1332-2, les services de l'État concourant à la défense nationale, à la sûreté de l'État et à la sécurité intérieure peuvent procéder, au moyen de caméras installées sur des aéronefs, à la captation, à l'enregistrement et à la transmission d'images dans les conditions définies aux articles L. 2364-2 à L. 2364-4.\n« Sous-section 4\n« Dispositions applicables aux systèmes d'information\n« Art. L. 1332-11.-I.-Pour gérer les risques qui menacent la sécurité des réseaux et des systèmes d'information qu'ils utilisent dans le cadre de leurs activités ou de la fourniture de leurs services, les opérateurs d'importance vitale mettent en œuvre les obligations prévues aux articles 14 à 16 et au premier alinéa de l'article 17 de la loi n° du relative à la résilience des infrastructures critiques et au renforcement de la cybersécurité.\n« II.-Pour répondre aux crises majeures menaçant ou affectant la sécurité des systèmes d'information, le Premier ministre peut décider des mesures que les opérateurs mentionnés au I de l'article L. 1332-2 doivent mettre en œuvre.\n« Section 2\n« Contrôles et sanctions administratives\n« Sous-section 1\n« Habilitation et contrôles\n« Art. L. 1332-12.-Sont habilités à rechercher et constater les manquements aux prescriptions du présent chapitre, à l'exception de l'article L. 1332-11, ainsi qu'aux dispositions réglementaires prises pour son application, en vue de la saisine de la commission prévue à l'article L. 1332-15, les agents de l'État spécialement désignés et assermentés à cette fin dans des conditions précisées par décret en Conseil d'État.\n« Art. L. 1332-13.-Les agents mentionnés à l'article L. 1332-12 ont accès, pour l'exercice de leurs missions, aux locaux des opérateurs d'importance vitale. Ils peuvent pénétrer dans les lieux à usage professionnel ou dans les lieux d'exécution d'une prestation de service.\n« Ils peuvent accéder à tout document nécessaire à l'accomplissement de leur mission auprès des administrations publiques, des établissements et organismes placés sous le contrôle de l'État et des collectivités territoriales ainsi que dans les entreprises ou services concédés par l'État, les régions, les départements et les communes.\n« Ils peuvent recueillir, sur place ou sur convocation, tout renseignement, toute justification ou tout document nécessaire aux contrôles. À ce titre, ils peuvent exiger la communication de documents de toute nature propres à faciliter l'accomplissement de leur mission. Ils peuvent les obtenir ou en prendre copie, par tout moyen et sur tout support, ou procéder à la saisie de ces documents en quelques mains qu'ils se trouvent.\n« Ils peuvent procéder, sur convocation ou sur place, aux auditions de toute personne susceptible d'apporter des éléments utiles à leurs constatations. Ils en dressent procès-verbal. Les personnes entendues procèdent elles-mêmes à sa lecture, peuvent y faire consigner leurs observations et y apposent leur signature. En cas de refus de signer le procès-verbal, mention en est faite sur celui-ci.\n« Ils sont astreints au secret professionnel pour les faits, actes ou renseignements dont ils ont pu avoir connaissance en raison de leurs fonctions, dans les conditions prévues à l'article 226-13 du code pénal. Le secret professionnel ne peut leur être opposé.\n« Les manquements sont constatés par des procès-verbaux, qui font foi jusqu'à preuve contraire. Il est dressé procès-verbal des vérifications et visites menées en application du présent article.\n« Art. L. 1332-14.-Il est interdit de faire obstacle à l'exercice des fonctions des agents habilités. L'opérateur contrôlé est tenu de coopérer avec l'autorité administrative. Les agents mentionnés à l'article L. 1332-12 peuvent constater toute action de l'opérateur d'importance vitale de nature à faire obstacle au contrôle.\n« Le fait pour quiconque de faire obstacle aux demandes de l'autorité compétente nécessaires à la recherche des manquements et à la mise en œuvre de ses pouvoirs de contrôle prévus à la présente sous-section, notamment en fournissant des renseignements incomplets ou inexacts, ou en communiquant des pièces incomplètes ou dénaturées, est puni d'une amende administrative prononcée par la commission des sanctions mentionnée à l'article L. 1332-15 dont le montant, proportionné à la gravité du manquement, ne peut excéder dix millions d'euros ou, lorsqu'il s'agit d'une entreprise, 2 % du chiffre d'affaires annuel mondial hors taxes de l'exercice précédent, le montant le plus élevé étant retenu.\n« Ces dispositions ne s'appliquent pas à l'État et à ses établissements publics administratifs qui font l'objet d'un contrôle.\n« Sous-section 2\n« Sanctions\n« Art. L. 1332-15.-Tout manquement aux dispositions du présent chapitre peut donner lieu aux sanctions prévues à l'article L. 1332-17, prononcées par une commission des sanctions instituée à cet effet auprès du Premier ministre.\n« Cette commission est saisie par l'autorité administrative des manquements constatés lors des contrôles effectués en application de l'article L. 1332-13. Cette autorité notifie à l'opérateur concerné les griefs susceptibles d'être retenus à son encontre.\n« La commission des sanctions reçoit les rapports et procès-verbaux des contrôles.\n« Art. L. 1332-16.-La commission des sanctions mentionnée à l'article L. 1332-15 est composée :\n« 1° D'un membre du Conseil d'État, président, désigné par le vice-président du Conseil d'État, d'un membre de la Cour de cassation désigné par le premier président de la Cour de cassation, d'un membre de la Cour des comptes désigné par le premier président de la Cour des comptes ;\n« 2° Et de trois personnalités qualifiées nommées respectivement par le Premier ministre, le président de l'Assemblée nationale et le président du Sénat en raison de leurs compétences dans le domaine de la sécurité des activités d'importance vitale.\n« Un suppléant est désigné dans les mêmes conditions pour les membres mentionnés au 1° du présent article.\n« Les membres de la commission des sanctions exercent leurs fonctions en toute impartialité. Dans l'exercice de leurs attributions, ils ne reçoivent ni ne sollicitent d'instruction d'aucune autorité.\n« Le président de la commission désigne un rapporteur parmi ses membres. Celui-ci ne peut recevoir aucune instruction.\n« La commission des sanctions statue par décision motivée. Aucune sanction ne peut être prononcée sans que l'opérateur concerné ou son représentant ait été entendu ou, à défaut, dûment convoqué. La commission peut auditionner toute personne qu'elle juge utile.\n« La commission statue à la majorité des membres présents. En cas de partage égal des voix, celle du président est prépondérante.\n« Le président et les membres de la commission mentionnés au 1° ainsi que leurs suppléants respectifs sont nommés par décret.\n« Le mandat du président, des membres de la commission ainsi que de leurs suppléants respectifs est de cinq ans, renouvelable une fois. Ils sont tenus au secret professionnel.\n« Art. L. 1332-17.-I.-En cas de manquement aux obligations découlant de l'application du présent chapitre, la commission des sanctions peut prononcer à l'encontre des opérateurs d'importance vitale, à l'exception des administrations de l'État et de ses établissements publics administratifs, des collectivités territoriales, de leurs groupements et de leurs établissements publics administratifs, une amende administrative dont le montant, proportionné à la gravité du manquement, ne peut excéder dix millions d'euros ou, lorsqu'il s'agit d'une entreprise, 2 % du chiffre d'affaires annuel mondial hors taxes de l'exercice précédent, le montant le plus élevé étant retenu.\n« Lorsque la commission des sanctions envisage également de prononcer la sanction prévue au deuxième alinéa de l'article L. 1332-14, le montant cumulé ne peut excéder le montant maximum prévu au premier alinéa du présent I.\n« II.-En cas de manquement constaté aux obligations mentionnées à l'article 26 de la loi n° du relative à la résilience des infrastructures critiques et au renforcement de la cybersécurité, la commission des sanctions, dans la composition prévue à l'article 36 de la même loi, peut prononcer les sanctions prévues aux articles 28 et 37 de ladite loi.\n« Art. L. 1332-18.-La commission des sanctions peut ordonner la publication, la diffusion ou l'affichage de la sanction pécuniaire ou d'un extrait de celle-ci, selon les modalités qu'elle précise. Les frais sont supportés par la personne sanctionnée.\n« Les sanctions pécuniaires sont versées au Trésor public et recouvrées comme créances de l'État étrangères à l'impôt et au domaine.\n« Les recours formés contre les décisions de la commission des sanctions sont des recours de pleine juridiction.\n« Art. L. 1332-19.-Les conditions d'application de la présente sous-section, notamment les règles de fonctionnement de la commission et les modalités de récusation de ses membres, sont définies par décret en Conseil d'État.\n« Section 3\n« Marchés publics et contrats de concession relatifs à la sécurité des activités d'importance vitale\n« Art. L. 1332-20.-Les marchés publics des opérateurs d'importance vitale mentionnés au I de l'article L. 1332-2 sont soumis aux règles définies au titre II du livre V de la deuxième partie du code de la commande publique lorsque :\n« 1° Ces marchés publics concernent la conception, la qualification, la fabrication, la modification, la maintenance ou le retrait des structures, équipements, systèmes, matériels, composants ou logiciels nécessaires à la protection des infrastructures critiques de l'opérateur ou dont le détournement de l'usage porterait atteinte aux intérêts essentiels de l'État ;\n« 2° Et que cette protection ou la prévention de ce détournement d'usage ne peuvent être garanties par d'autres moyens.\n« Art. L. 1332-21.-Les contrats de concession conclus par les opérateurs d'importance vitale mentionnés au I de l'article L. 1332-2 sont soumis aux règles définies au titre II du livre II de la troisième partie du code de la commande publique lorsque :\n« 1° Ces contrats de concession concernent la conception, la qualification, la fabrication, la modification, la maintenance ou le retrait des structures, équipements, systèmes, matériels, composants ou logiciels nécessaires à la protection des infrastructures critiques de l'opérateur ou dont le détournement de l'usage porterait atteinte aux intérêts essentiels de l'État ;\n« 2° Et que cette protection ou la prévention de ce détournement d'usage ne peuvent être garanties par d'autres moyens.\n« Art. L. 1332-22.-Les opérateurs d'importance vitale qui passent un marché ou un contrat de concession en application des articles L. 1332-20 et L. 1332-21 en informent l'autorité administrative dans des conditions et des délais précisés par décret. »", "amdt": false}]}, {"numero": 90, "vise": "ART. 2", "dispositif": "Après l’alinéa 6, insérer l’alinéa suivant :\n\n« L’incapacité physique est constatée par un médecin. »", "article": "2", "effet": [{"t": "=", "s": "Après la section 2 du chapitre Ier du titre Ier du livre Ier de la première partie du code de la santé publique, est insérée une section 2 bis ainsi rédigée :\n« Section 2 bis\n« Aide à mourir\n« Sous-section 1\n« Définition\n« Art. L. 1111-12-1.-I.-L'aide à mourir consiste à autoriser et à accompagner une personne qui en a exprimé la demande à recourir à une substance létale, dans les conditions et selon les modalités prévues aux articles L. 1111-12-2 à L. 1111-12-7, afin qu'elle se l'administre ou, lorsqu'elle n'est pas en mesure physiquement d'y procéder, se la fasse administrer par un médecin ou par un infirmier.\n", "amdt": false}, {"t": "=", "s": "«", "amdt": true}, {"t": "+", "s": " L'incapacité physique est constatée par un médecin.\n«", "amdt": false}, {"t": "=", "s": " II.-L'aide à mourir est un acte autorisé par la loi au sens de l'article 122-4 du code pénal. »", "amdt": false}]}, {"numero": 91, "vise": "ART. 5", "dispositif": "Compléter l’alinéa 88 par les mots :\n\n« ou pour une infraction prévue à l’article 225‑2 du code pénal lorsque la discrimination est commise pour l’un des motifs mentionnés à l’article 225‑1 du même code tenant à l’origine, à l’appartenance ou à la non-appartenance, vraie ou supposée, à une ethnie, à une nation, à une prétendue race ou à une religion déterminée, au sexe, à l’orientation sexuelle ou à l’identité de genre ainsi qu’à l’article 24 de la loi du 29 juillet 1881 sur la liberté de la presse lorsque la provocation à la discrimination, à la haine ou à la violence est commise pour l’un de ces mêmes motifs ».", "article": "5", "effet": [{"t": "=", "s": "I.-Le code civil est ainsi modifié :\n1° Après le septième alinéa de l'article 375-3, sont insérés quatre alinéas ainsi rédigés :\n« Avant tout placement chez un membre de la famille ou un tiers digne de confiance, ou avant le renouvellement de cette mesure, le juge des enfants vérifie ses antécédents judiciaires, ainsi que ceux des personnes majeures et mineures de plus de 13 ans résidant à son domicile, par la consultation du fichier judiciaire automatisé des auteurs d'infractions sexuelles ou violentes, du fichier judiciaire national automatisé des auteurs d'infractions terroristes et pour les personnes majeures du bulletin n° 2 du casier judiciaire. Ces consultations sont réalisées conformément aux dispositions des articles 776, 706-53-7 et 706-25-9 du code de procédure pénale. Il peut, dans les mêmes conditions et lorsque l'intérêt de l'enfant le justifie, procéder aux mêmes vérifications avant tout placement chez l'autre parent ou avant le renouvellement de cette mesure.\n« Le juge des enfants informe la personne à qui le mineur est susceptible d'être confié qu'il va être procédé à la vérification de ses antécédents judiciaires et de ceux des personnes de plus de treize ans présentes à son domicile par consultation des fichiers susmentionnés, et à leur versement au dossier d'assistance éducative.\n« À l'issue de ces consultations, le juge des enfants verse au dossier l'extrait du bulletin n° 2 et tout élément apparaissant au fichier judiciaire automatisé des auteurs d'infractions sexuelles ou violentes ou au fichier judiciaire national automatisé des auteurs d'infractions terroristes. Il prend ces éléments en considération pour fonder sa décision. La personne sollicitant d'accueillir un mineur peut demander à avoir accès aux pièces de procédure relatives à sa demande et la concernant.\n« Un décret en Conseil d'État fixe les modalités d'application des alinéas précédents. » ;\n2° Le deuxième alinéa de l'article 375-5 est complété par les dispositions suivantes :\n« Avant de confier l'enfant à un membre de la famille ou à un tiers digne de confiance, le procureur de la République procède aux vérifications prévues aux alinéas 8 et 9 de l'article 375-3 du code civil. Il peut, dans les mêmes conditions et lorsque l'intérêt de l'enfant le justifie, procéder aux mêmes vérifications avant de confier l'enfant à l'autre parent. »\nII.-Le code de procédure pénale est ainsi modifié :\n1° Le 1° de l'article 706-25-9 est complété par les mots : « pour le besoin des procédures pénales dont elles sont saisies, celui des procédures civiles suivies devant le juge des enfants et le juge aux affaires familiales et celui du tribunal judiciaire statuant sur le fondement de l'article 353-1 du code civil pour la prise en considération de l'intérêt supérieur de l'enfant ; »\n2° À l'article 706-53-7 :\na) Le 1° est complété par les mots : « pour le besoin des procédures pénales dont elles sont saisies, celui des procédures civiles suivies devant le juge des enfants et le juge aux affaires familiales et celui du tribunal judiciaire statuant sur le fondement de l'article 353-1 du code civil pour la prise en considération de l'intérêt supérieur de l'enfant ; »\nb) Le 3° est complété un alinéa ainsi rédigé :\n« c) Des activités ou des professions, dont la liste est établie par décret en Conseil d'État, pouvant impliquer un contact physique ou à distance avec des usagers du système de santé en application de l'article L. 1191-1 du code de la santé publique ; »\nc) Après le 3°, il est inséré un 3° bis ainsi rédigé :\n« 3° bis Aux ordres professionnels mentionnés à la quatrième partie du code de la santé publique, pour les procédures de contrôle de l'exercice des activités ou des professions, dont la liste est établie par décret en Conseil d'État, pouvant impliquer un contact physique ou à distance avec des usagers du système de santé en application de l'article L. 1191-1 du code de la santé publique ; »\n3° Le deuxième alinéa de l'article 774 est complété par les mots : « pour le besoin des procédures pénales dont elles sont saisies. » ;\n4° Après le huitième alinéa de l'article 776, il est inséré un alinéa ainsi rédigé :\n« 8° Aux autorités judiciaires pour les besoins des procédures civiles suivies devant le juge des enfants et le juge aux affaires familiales et celui du tribunal judiciaire statuant sur le fondement de l'article 353-1 du code civil pour la prise en considération de l'intérêt supérieur de l'enfant. »\nIII.-Le titre II du livre II du code de l'action sociale et des familles est ainsi modifié :\n1° À l'article L. 221-2-1, la première phrase devient un premier alinéa. Après ce premier alinéa sont insérés quatre alinéas ainsi rédigés : :\n« Il s'assure que le tiers et les personnes majeures vivant à son domicile ne font pas l'objet d'une condamnation pour une infraction visée aux articles 221-1 à 221-5, 222-1 à 222-18, 222-23 à 222-33, 224-1 à 224-5, au second alinéa de l'article 225-12-1 et aux articles 225-12-2 à 225-12-4, 227-1, 227-2 et 227-15 à 227-28 du code pénal.\n« Pour toute autre infraction inscrite au bulletin n° 2, le président du conseil départemental évalue si les conditions d'accueil au regard des besoins fondamentaux de l'enfant sont réunies.\n« Il ne peut être procédé au placement si le tiers à qui il entend confier l'enfant ou si l'une des personnes majeures ou mineures âgées d'au moins treize ans vivant à son domicile sont inscrits au fichier judiciaire automatisé des auteurs d'infractions sexuelles ou violentes.\n« Le contrôle mentionné au présent article est assuré par la délivrance du bulletin n° 2 du casier judiciaire dans les conditions prévues à l'article 776 du code de procédure pénale, et par l'accès aux informations contenues dans le fichier judiciaire national automatisé des auteurs d'infractions sexuelles ou violentes dans les conditions prévues à l'article 706-53-7 du même code. Ce contrôle peut se faire par la délivrance de l'attestation mentionnée au deuxième alinéa du II de l'article L. 133-6 du présent code. »\n2° Après l'article L. 221-3, il est inséré un article L. 221-3-1 ainsi rédigé :\n« Art. L. 221-3-1.-Lorsqu'une autorité centrale sollicite le service de l'aide sociale à l'enfance sur le fondement de l'article 33 de la convention relative à la compétence, la loi applicable, la reconnaissance, l'exécution et la coopération en matière de responsabilité parentale et de mesures de protection des enfants, signée à la Haye le 19 octobre 1996, en vue d'une décision judiciaire de recueil légal, dénommée « kafala », le président du conseil départemental s'assure que le tiers recueillant et les personnes majeures résidant à son domicile ne font pas l'objet d'une condamnation pour une infraction visée aux articles 221-1 à 221-5, 222-1 à 222-18, 222-23 à 222-33, 224-1 à 224-5, au second alinéa de l'article 225-12-1 et aux articles 225-12-2 à 225-12-4, 227-1, 227-2 et 227-15 à 227-28 du code pénal, et que le tiers ou l'une des personnes majeures ou mineures âgées d'au moins treize ans vivant à son domicile ne sont pas inscrits au fichier judiciaire automatisé des auteurs d'infractions sexuelles ou violentes.\n« Pour toute autre infraction inscrite au bulletin n° 2, le président du conseil départemental évalue si les conditions d'accueil au regard des besoins fondamentaux de l'enfant sont réunies.\n« Le contrôle mentionné au présent article est assuré par la délivrance du bulletin n° 2 du casier judiciaire dans les conditions prévues à l'article 776 du code de procédure pénale, et par l'accès aux informations contenues dans le fichier judiciaire national automatisé des auteurs d'infractions sexuelles ou violentes dans les conditions prévues à l'article 706-53-7 du même code. Ce contrôle peut se faire par la délivrance de l'attestation mentionnée au deuxième alinéa du II de l'article L. 133-6 du présent code. » ;\n3° L'article L. 225-2 est complété par les alinéas suivants :\n« L'agrément ne peut être délivré si la personne candidate à l'adoption ou les personnes majeures vivant à son domicile ont fait l'objet d'une condamnation pour une infraction visée aux articles 221-1 à 221-5, 222-1 à 222-18, 222-23 à 222-33, 224-1 à 224-5, au second alinéa de l'article 225-12-1 et aux articles 225-12-2 à 225-12-4, 227-1, 227-2 et 227-15 à 227-28 du code pénal.\n« Pour toute autre infraction inscrite au bulletin n° 2, le président du conseil départemental évalue si les conditions d'accueil au regard des besoins fondamentaux de l'enfant sont réunies et en informe la commission d'agrément.\n« L'agrément ne peut être délivré si la personne candidate à l'adoption et les personnes majeures ou mineures âgées d'au moins treize ans vivant à son domicile sont inscrits au fichier judiciaire automatisé des auteurs d'infractions sexuelles ou violentes.\n« Le contrôle mentionné au présent article est assuré par la délivrance du bulletin n° 2 du casier judiciaire dans les conditions prévues à l'article 776 du code de procédure pénale, et par l'accès aux informations contenues dans le fichier judiciaire national automatisé des auteurs d'infractions sexuelles ou violentes dans les conditions prévues à l'article 706-53-7 du même code. Ce contrôle peut se faire par la délivrance de l'attestation mentionnée au deuxième alinéa du II de l'article L. 133-6 du présent code. » ;\n4° Au premier alinéa de l'article L. 227-10, les mots : «, ainsi que de toute personne qui est sous le coup d'une mesure de suspension ou d'interdiction d'exercer prise en application de l'article L. 212-13 du code du sport » sont supprimés.\nIV.-Le titre III du livre Ier du code de l'action sociale et des familles est ainsi modifié :\n1° L'article L. 135-2 est complété par les dispositions suivantes : « ou d'une interdiction d'exercice prononcée en application du III de l'article L. 133-6-1 ou de l'article L. 133-6-2 » ;\n2° À l'article L. 133-6 :\na) Au premier alinéa du I, après les mots : « y compris bénévole, », les mots : « y exercer une activité » sont remplacés par les mots : « exercer une activité » ;\nb) Le I est complété par deux alinéas ainsi rédigés :\n« Lorsqu'un séjour de vacances dans une famille est organisé dans le cadre des accueils de mineurs mentionnés à l'article L. 227-4, le contrôle des incapacités et des interdictions prononcées en application de l'article L. 227-10 s'applique aux personnes majeures ou mineures âgées d'au moins treize ans vivant au domicile de la personne physique organisant le séjour ou de la famille accueillant le séjour lorsque celui-ci est organisé par une personne morale.\n« Nul ne peut exercer même à titre bénévole une fonction permanente ou occasionnelle dans un accueil de mineurs mentionné à l'article L. 227-4 s'il fait l'objet d'une mesure d'interdiction d'exercer prise en application de l'article L. 212-13 du code du sport. »\nc) Le premier alinéa du II est complété par la phrase suivante :\n« Pour les accueils mentionnés à l'article L. 227-4, pour les établissements et services relevant du 4° du I et les lieux de vie et d'accueil visés au III de l'article L. 312-1 lorsqu'ils sont exclusivement autorisés par le préfet du département, le contrôle des incapacités mentionnées au I est également assuré, dans les mêmes conditions, par l'accès aux informations contenues dans le fichier judiciaire national automatisé des auteurs d'infractions terroristes dans les conditions prévues à l'article 706-25-9 du code de procédure pénale. » ;\nd) Au deuxième alinéa du II, le mot : « deux » est remplacé par le mot : « trois » ;\ne) Le troisième alinéa du II est complété par les mots suivants : « et, le cas échéant, au fichier judiciaire national automatisé des auteurs d'infractions terroristes. » ;\nf) Le dernier alinéa du II est complété par les mots suivants : «, et, le cas échéant, au fichier national automatisé des auteurs d'infractions terroristes. » ;\ng) Les premier et deuxième alinéas du III sont supprimés ;\nh) Au dernier alinéa du III, après les mots : « ou violentes » sont insérés les mots : « et, le cas échéant, au fichier national automatisé des auteurs d'infractions terroristes, » ;\n3° Après l'article L. 133-6, sont insérés deux articles L. 133-6-1 et L. 133-6-2 ainsi rédigés :\n« Art. L. 133-6-1.-I.-Lorsqu'à l'occasion du contrôle des incapacités prévu à l'article L. 133-6 le visant, l'agent public ou le salarié d'un établissement, service ou lieux de vie et d'accueil ou d'un particulier employeur au sens de l'article L. 7221-1 du code du travail ou la personne agréée ne présente pas l'attestation mentionnée au II de cet article avant le terme du délai prévu par le décret en Conseil d'État mentionné au même II, l'employeur ou l'autorité compétente pour délivrer un agrément notifie à l'intéressé, par tout moyen conférant date certaine et sans délai, la suspension, selon le cas, de ses fonctions, de son contrat de travail, de son contrat de mission ou de son agrément.\n« Durant la période de suspension :\n« 1° Le salarié a droit au maintien de sa rémunération ;\n« 2° L'agent public conserve sa rémunération ainsi que le financement des garanties de protection sociale complémentaire prévu à l'article L. 827-1 du code général de la fonction publique ;\n« 3° Pour une personne agréée, les conditions prévues par le présent code pour la suspension de l'agrément s'appliquent.\n« Pendant la période de suspension, l'employeur, le directeur de l'établissement, du service ou du lieu de vie et d'accueil, ou l'autorité compétente pour délivrer un agrément s'assure que, selon le cas, le salarié, l'agent public ou la personne agréée n'est pas frappé par une incapacité prévue à l'article L. 133-6.\n« La suspension prend fin :\n« 1° Lorsqu'il est établi que le salarié, l'agent public ou la personne agréée n'est pas concerné par une incapacité mentionnée à l'article L. 133-6 ;\n« 2° À l'issue des procédures engagées en application du II, lorsque l'incapacité est confirmée ;\n« 3° À la notification de l'arrêté motivé ou à la réception de l'information, mentionnés au III, lorsque l'incapacité n'est pas confirmée et que le salarié, l'agent public ou la personne agréée mentionnés au I fait l'objet d'une mise en examen ou d'une condamnation non définitive mentionnées au fichier judiciaire national automatisé des auteurs d'infractions sexuelles ou violentes ou, lorsque sa consultation est prévue, au fichier judiciaire national automatisé des auteurs d'infractions terroristes.\n« II.-Lorsque l'incapacité est confirmée, il est mis fin à la relation de travail.\n« A.-Lorsque l'incapacité concerne un salarié en contrat à durée indéterminée, l'employeur engage une procédure de licenciement du salarié, l'incapacité constituant la cause réelle et sérieuse du licenciement. Le licenciement est prononcé dans les conditions prévues par les dispositions du code du travail relatives à la rupture du contrat de travail pour motif personnel. Le préavis prévu à l'article L. 1234-1 du code du travail n'est pas exécuté et ne donne pas lieu au versement de l'indemnité compensatrice.\n« Les dispositions de l'article L. 1234-9 du code du travail ne sont pas applicables au licenciement prononcé dans les conditions prévues au premier alinéa.\n« B.-Lorsque l'incapacité concerne un salarié non titulaire d'un contrat à durée indéterminée, sans préjudice des dispositions des articles L. 1243-1 et L. 1251-26 du code du travail, l'employeur met fin au contrat à durée déterminée ou au contrat de mission ou à la lettre de mission et au contrat de mise à disposition avant l'échéance du terme.\n« Par dérogation aux articles L. 1243-4 et L. 1243-8 du code du travail, la rupture du contrat à durée déterminée en raison d'une incapacité résultant des dispositions de l'article L. 133-6 et suivants ne donne lieu à aucune indemnité.\n« Par dérogation à l'article L. 1251-26 du code du travail, lorsque l'entreprise de travail temporaire met fin au contrat de mission en raison d'une incapacité résultant des dispositions des articles L. 133-6 et suivants, l'entreprise de travail temporaire n'est pas tenue de proposer un nouveau contrat de mission au salarié et la rupture du contrat de mission ne donne lieu à aucune indemnité.\n« Lorsque l'entreprise de travail temporaire est dans l'impossibilité de proposer une nouvelle mission au salarié lié par le contrat mentionné au L. 1251-58-1 du code du travail en raison d'une incapacité résultant des dispositions de l'article L. 133-6 et suivants ayant donné lieu à la rupture d'un contrat de mise à disposition, l'employeur peut engager une procédure de licenciement du salarié, l'incapacité constituant la cause réelle et sérieuse du licenciement. Les dispositions de l'article L. 1234-9 du code du travail ne sont pas applicables au licenciement prononcé dans ces conditions.\n« C.-Lorsque l'incapacité concerne un agent public, l'employeur engage une procédure de radiation des cadres si l'agent est fonctionnaire et exerce au sein de son administration, ou de licenciement sans indemnité ni préavis s'il est agent contractuel, ou encore remet le fonctionnaire détaché ou mis à disposition de son administration d'origine. La décision, qui précise le motif ainsi que la dat
